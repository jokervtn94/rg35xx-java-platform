name: P1A G1 Device Exerciser JAR

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g1-clear-copy
    paths:
      - '.github/workflows/p1a-g1-device-exerciser-jar.yml'
      - 'tests/p1a/RG35XXP1AG1DeviceExerciserMIDlet.java'
      - 'scripts/build-p1a-g1-device-exerciser-jar.sh'

permissions:
  contents: read

jobs:
  p1a-g1-device-exerciser-jar:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout G1 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild and gate P1A G1 platform candidate
        run: bash ./scripts/build-p1a-g1-clear-copy.sh

      - name: Build Java 6 P1A G1 platform exerciser JAR
        run: bash ./scripts/build-p1a-g1-device-exerciser-jar.sh

      - name: Verify exerciser-only lock
        run: |
          set -euo pipefail
          ID=out/p1a-g1-device-exerciser-jar/IDENTITY.txt
          grep -q '^AWEIGIT_COMMIT=ca11dfe8ea1cc273d92460f9a83bbf192023fa63$' "$ID"
          grep -q '^SCOPE=clearRect+copyArea$' "$ID"
          grep -q '^COMMERCIAL_GAME_DEPENDENCY=NO$' "$ID"
          grep -q '^JAVA_MAJOR_MAX=50$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          (cd out/p1a-g1-device-exerciser-jar && sha256sum -c SHA256SUMS.txt)
          echo P1A_G1_DEVICE_EXERCISER_CI_SCOPE_LOCK=PASS

      - name: Upload exerciser JAR
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G1-DEVICE-EXERCISER-JAR-${{ github.sha }}
          path: out/p1a-g1-device-exerciser-jar/
          if-no-files-found: error
