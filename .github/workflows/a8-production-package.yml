name: A8 RG35XX Production Package

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a8-consolidation
    paths:
      - '.github/workflows/a8-production-package.yml'
      - 'scripts/build-a8-production-package.sh'
      - 'packaging/a8/**'

permissions:
  contents: read

jobs:
  a8-production-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout A8 and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build accepted A6 native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild accepted A6 ClipTranslate parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Build accepted A7 Java runtime
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Build accepted A7 SDL1_mixer bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'
          sudo chown -R "$(id -u):$(id -g)" out/a7-audio-sdl1

      - name: Stage A8 production package and enforce accepted identities
        run: bash ./scripts/build-a8-production-package.sh

      - name: Verify A8 launcher and package boundary
        run: |
          set -euo pipefail
          ID=out/a8-production/A8-IDENTITY.txt
          L=out/a8-production/RG35XX-AWEIGIT-R1.sh
          P=out/a8-production/RG35XX-AWEIGIT-R1
          PLATFORM_SHA="$(awk -F= '$1=="PLATFORM_JAR_SHA256"{print $2}' "$ID")"
          test -n "$PLATFORM_SHA"
          test "$PLATFORM_SHA" = "$(sha256sum "$P/freej2me-rg35xx.jar" | awk '{print $1}')"
          grep -q "^EXPECTED_PLATFORM=$PLATFORM_SHA$" "$L"
          grep -q '^EXPECTED_AUDIO=4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644$' "$L"
          grep -q '"$APLAY" -q -D hw:0,0 -t raw -f S32_LE -c 2 -r 44100 "$PRIME"' "$L"
          grep -q '^RUNTIME_SEMANTIC_DELTA=NONE$' "$ID"
          grep -q '^PLATFORM_JAR_SEMANTIC_SHA256=7cd3a4a29d4238e0d2464a213db48ba555bdf3c590aa77fe60c68b480bdc4adf$' "$ID"
          grep -q '^JAVA_IDENTITY_GATE=SEMANTIC_ENTRY_CONTENT_SHA256$' "$ID"
          grep -q '^PACKAGED_JAR_RUNTIME_GATE=RAW_SHA256_BOUND_AT_PACKAGE_BUILD$' "$ID"
          grep -q '^NATIVE_IDENTITY_GATE=RAW_SHA256$' "$ID"
          grep -q '^COMMERCIAL_GAME_JARS_BUNDLED=NO$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          echo A8_PACKAGE_SCOPE_LOCK=PASS

      - name: Upload A8 RG35XX package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A8-${{ github.sha }}
          path: out/a8-production/
          if-no-files-found: error
