name: RC1 Pinned Patch Integration Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'scripts/rc1_assemble.sh'
      - 'scripts/rc1_contract_gate.sh'
      - 'scripts/rc1_toolchain_acquire.sh'
      - '.github/workflows/rc1-patch-integration-gate.yml'
  workflow_dispatch:

jobs:
  patch-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RG35XX platform repo
        uses: actions/checkout@v4

      - name: Checkout exact pinned FreeJ2ME source
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Verify gate scripts and exact pin
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/rc1_assemble.sh
          sh -n scripts/rc1_contract_gate.sh
          sh -n scripts/rc1_toolchain_acquire.sh
          grep -q 'PIN_COMMIT="8087b52311da5c1e2fa1c50b0b064c07fd174a36"' scripts/rc1_toolchain_acquire.sh
          grep -q 'PIN_DEFCONFIG_BLOB="58256d3e7afa3f9fa0dbd79b16fd0b21d93b9d7b"' scripts/rc1_toolchain_acquire.sh
          sh scripts/rc1_contract_gate.sh --build-ready
          test "$(git -C upstream rev-parse HEAD)" = "13ec186903087156c145268f8706eecfaf9f1e50"

      - name: Apply authoritative active patches sequentially with dry-run first
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ORDER=$(awk '
            /^PATCH_ORDER="/ { in_order=1; next }
            in_order && /^"$/ { exit }
            in_order && NF { print }
          ' scripts/rc1_assemble.sh)
          test -n "$PATCH_ORDER"
          echo "Authoritative PATCH_ORDER:"
          printf '%s\n' "$PATCH_ORDER"

          normalize_patch_targets() {
            local patch_file="$1"
            while IFS= read -r rel; do
              test -n "$rel" || continue
              test -f "upstream/$rel"
              sed -i 's/\r$//' "upstream/$rel"
            done < <(awk '/^--- a\// { sub(/^--- a\//, ""); print }' "$patch_file")
          }

          for p in $PATCH_ORDER; do
            test -f "patches/$p"
            normalize_patch_targets "patches/$p"
            echo "=== DRY-RUN $p ==="
            patch -d upstream -p1 --forward --dry-run < "patches/$p"
            echo "=== APPLY $p ==="
            patch -d upstream -p1 --forward < "patches/$p"
          done

      - name: Verify no rejected hunks
        shell: bash
        run: |
          set -euo pipefail
          if find upstream -name '*.rej' -print -quit | grep -q .; then
            find upstream -name '*.rej' -print
            exit 1
          fi
          echo 'RC1 PATCH INTEGRATION PASS'
