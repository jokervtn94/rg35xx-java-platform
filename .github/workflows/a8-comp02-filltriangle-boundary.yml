name: A8 COMP-02 FillTriangle Boundary Only

on:
  workflow_dispatch:
  push:
    branches:
      - a8-comp02-filltriangle-boundary-only
    paths:
      - '.github/workflows/a8-comp02-filltriangle-boundary.yml'
      - 'scripts/stage-a8-comp02-filltriangle-boundary.py'
      - 'scripts/build-a8-comp02-filltriangle-boundary.sh'
      - 'scripts/build-a8-comp02-device-package.sh'
      - 'packaging/a8-comp02/RG35XX-A8-COMP02-FILLTRIANGLE.sh'
      - 'tests/a8/RG35XXRawFillTriangleHostGate.java'
      - 'docs/A8-COMP02-FILLTRIANGLE-BOUNDARY-ONLY.md'

permissions:
  contents: read

jobs:
  a8-comp02-filltriangle-boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout candidate from reset-base lineage and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prove candidate branch descends from locked reset base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e7b0860310fd5204e1d1f2d01c992002b8660df2 HEAD
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo A8_COMP02_LOCKED_LINEAGE_GATE=PASS

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact accepted input and PERF-A1 video native owners
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D backing
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild accepted A6 ClipTranslate semantic parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Rebuild accepted A7 Java 6 media semantic parent
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Rebuild exact accepted A7 SDL1_mixer native owner
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'
          sudo chown -R "$(id -u):$(id -g)" out/a7-audio-sdl1

      - name: Build one-owner fillTriangle candidate and host regressions
        run: bash ./scripts/build-a8-comp02-filltriangle-boundary.sh

      - name: Enforce candidate scope and protected native identities
        run: |
          set -euo pipefail
          D=out/a8-comp02-filltriangle-boundary
          I="$D/A8-COMP02-FILLTRIANGLE-IDENTITY.txt"
          grep -q '^STAGE=A8-COMP02-GRAPHICS-FILLTRIANGLE-BOUNDARY-ONLY$' "$I"
          grep -q '^PRODUCTION_PARENT=A8_GOLDEN_ONLY$' "$I"
          grep -q '^AWEIGIT_COMMIT=ca11dfe8ea1cc273d92460f9a83bbf192023fa63$' "$I"
          grep -q '^RESET_BASE=e7b0860310fd5204e1d1f2d01c992002b8660df2$' "$I"
          grep -q '^FAILURE_OWNER=RG35XX_GRAPHICS_BOUNDARY$' "$I"
          grep -q '^PARENT_PLATFORM_SEMANTIC_SHA256=7cd3a4a29d4238e0d2464a213db48ba555bdf3c590aa77fe60c68b480bdc4adf$' "$I"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class$' "$I"
          grep -q '^CHANGED_METHOD=Graphics.fillTriangle_6ARG_RAW_PATH_ONLY$' "$I"
          grep -q '^DIRECTGRAPHICS_FILLPOLYGON=UNCHANGED_FINAL_A8_RECT_ONLY_CONTRACT$' "$I"
          grep -q '^DIRECTGRAPHICS_FILLTRIANGLE_7ARG=BYTECODE_IDENTICAL_TO_PARENT$' "$I"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$I"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$I"
          grep -q '^AUDIO_NATIVE_SHA256=4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644$' "$I"
          grep -q '^A8_COMP02_FILLTRIANGLE_HOST_GATE=PASS$' "$I"
          grep -q '^A6_DRAWRECT_REGRESSION_GATE=PASS$' "$I"
          grep -q '^A6_DRAWLINE_REGRESSION_GATE=PASS$' "$I"
          grep -q '^A6_RECTPOLYGON_REGRESSION_GATE=PASS$' "$I"
          grep -q '^A6_CLIPTRANSLATE_REGRESSION_GATE=PASS$' "$I"
          grep -q '^A6_ADAM7_REGRESSION_GATE=PASS$' "$I"
          grep -q '^GAME_SPECIFIC_RUNTIME_CODE=NO$' "$I"
          grep -q '^BUILD-PASS=YES$' "$I"
          grep -q '^DEVICE-PASS=NO$' "$I"
          grep -q '^TARGET_DEVICE_TEST=PENDING$' "$I"
          grep -q '^VUA_CUOP_BIEN_PHYSICAL_REGRESSION=PENDING$' "$I"
          grep -q '^GOD_OF_WAR_PHYSICAL_REGRESSION=PENDING$' "$I"
          grep -q '^STABLE=NO$' "$I"
          test "$(sha256sum "$D/librg35xx_input.so" | awk '{print $1}')" = 69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d
          test "$(sha256sum "$D/librg35xx_video.so" | awk '{print $1}')" = c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d
          test "$(sha256sum "$D/libaudio.so" | awk '{print $1}')" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
          (cd "$D" && sha256sum -c A8-COMP02-SHA256SUMS.txt)
          echo A8_COMP02_SCOPE_LOCK=PASS

      - name: Build hash-gated physical test package
        run: bash ./scripts/build-a8-comp02-device-package.sh

      - name: Enforce physical package remains experimental
        run: |
          set -euo pipefail
          D=out/a8-comp02-device-package
          I="$D/PACKAGE-IDENTITY.txt"
          grep -q '^STAGE=A8-COMP02-FILLTRIANGLE-PHYSICAL-TEST-PACKAGE$' "$I"
          grep -q '^PRODUCTION_PARENT=A8_GOLDEN_ONLY$' "$I"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$I"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$I"
          grep -q '^AUDIO_NATIVE_SHA256=4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644$' "$I"
          grep -q '^PRIME_PCM_SHA256=8c30691e755abd6791ac75887b56e20f1a56266b2eb0286bfb4007b98f7d7a7e$' "$I"
          grep -q '^TARGET_JAR_BUNDLED=NO$' "$I"
          grep -q '^BUILD-PASS=YES$' "$I"
          grep -q '^DEVICE-PASS=NO$' "$I"
          grep -q '^PHYSICAL-TEST=PENDING$' "$I"
          grep -q '^STABLE=NO$' "$I"
          grep -q '^DEVICE_PASS=NO_PENDING_PHYSICAL_REVIEW' "$D/RG35XX-A8-COMP02-FILLTRIANGLE.sh"
          (cd "$D" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo A8_COMP02_DEVICE_PACKAGE_SCOPE_LOCK=PASS

      - name: Upload experimental candidate for audit
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-A8-COMP02-FILLTRIANGLE-BOUNDARY-${{ github.sha }}
          path: out/a8-comp02-filltriangle-boundary/
          if-no-files-found: error

      - name: Upload original-RG35XX physical test package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-A8-COMP02-FILLTRIANGLE-DEVICE-TEST-${{ github.sha }}
          path: out/a8-comp02-device-package/
          if-no-files-found: error
