name: A6 RG35XX Real Game Fix R3

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a6-real-game-regression
    paths:
      - '.github/workflows/a6-classloader-fix.yml'
      - 'scripts/stage-a6-rg35xx-classloader-race.py'
      - 'scripts/stage-a6-rg35xx-drawregion-null-guard.py'
      - 'scripts/stage-a6-rg35xx-adam7.py'
      - 'scripts/build-a6-classloader-fix.sh'
      - 'scripts/build-a5-core2d-java.sh'
      - 'scripts/stage-a5-rg35xx-core2d-v2.py'
      - 'scripts/build-a4-raw2d-java.sh'
      - 'scripts/build-a3.sh'
      - 'tests/a6/**'
      - 'adapter/**'

permissions:
  contents: read

jobs:
  a6-realgame-r3:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout A6 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Build unchanged RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Apply A6 evidence-driven real-game R3 overlays
        run: bash ./scripts/build-a6-classloader-fix.sh

      - name: Finalize protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Verify A6 R3 scope and protected payload locks
        run: |
          set -euo pipefail
          grep -q '^A6_CLASSLOADER_OVERLAY=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_CLASSLOADER_GAME_SPECIFIC_NAMES=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_DRAWREGION_NULL_GUARD=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_DRAWREGION_GAME_SPECIFIC_NAMES=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_ADAM7_BACKING=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_ADAM7_GAME_SPECIFIC_NAMES=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A6_ADAM7_HOST_GATE=PASS$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^BUILD-PASS=YES$' out/a6-realgame-r3/A6-REALGAME-FIX-R3-IDENTITY.txt
          grep -q '^DEVICE-PASS=NO$' out/a6-realgame-r3/A6-REALGAME-FIX-R3-IDENTITY.txt
          grep -q '^STABLE=NO$' out/a6-realgame-r3/A6-REALGAME-FIX-R3-IDENTITY.txt
          grep -q '^A6_ADAM7_HOST_GATE=PASS$' out/a6-realgame-r3/A6-ADAM7-HOST-GATE.txt
          test "$(sha256sum out/a3/librg35xx_input.so | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum out/a3/librg35xx_video.so | awk '{print $1}')" = '9094819d7c81576b63bd0cde9531404a3fb82b8d5b845dbae152152f2e1a2a7a'
          cp out/a3/BUILD-IDENTITY.txt out/a6-realgame-r3/A6-PLATFORM-BUILD-IDENTITY.txt
          cp out/a3/librg35xx_input.so out/a6-realgame-r3/librg35xx_input.so
          cp out/a3/librg35xx_video.so out/a6-realgame-r3/librg35xx_video.so
          (cd out/a6-realgame-r3 && sha256sum * > A6-ARTIFACT-SHA256SUMS.txt)
          echo A6_REALGAME_R3_SCOPE_LOCK=PASS

      - name: Upload A6 real-game R3 fixed platform
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A6-REALGAME-R3-${{ github.sha }}
          path: out/a6-realgame-r3/
          if-no-files-found: error
