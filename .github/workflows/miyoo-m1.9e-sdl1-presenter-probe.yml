name: Miyoo M1.9E SDL1 Framebuffer Presenter Probe
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_9/**'
      - '.github/workflows/miyoo-m1.9e-sdl1-presenter-probe.yml'
jobs:
  m19e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve locked input boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Verify Golden M1.6 source is unchanged
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 9fbe5793a7c26c580740640ffe042d5703fd2c2f
          git show 9fbe5793a7c26c580740640ffe042d5703fd2c2f:miyoo-m1/m1_6_display_jni.c >/tmp/m1_6_golden.c
          test "$(git hash-object /tmp/m1_6_golden.c)" = 26b97f74b39ce39fb0bc8d1a64ba4aca9c6ab21c
          grep -q 'setenv("SDL_VIDEODRIVER", "fbcon", 1)' /tmp/m1_6_golden.c
          grep -q 'SDL_SetVideoMode_p(640,480,32,SDL_SWSURFACE)' /tmp/m1_6_golden.c
          echo M1_6_GOLDEN_SOURCE_GATE=PASS
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Fetch pinned FreeJ2ME and apply proven A B C D patches
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          test "$(git -C upstream hash-object src/org/recompile/mobile/PlatformFont.java)" = acc9e1c5ee5263662e768f68d406cadbeda167e9
          test "$(git -C upstream hash-object src/org/recompile/mobile/PlatformImage.java)" = 7da4a9325cdf40fe23deee4d88e473f64c1fc0e0
          test "$(git -C upstream hash-object src/org/recompile/mobile/PlatformGraphics.java)" = 43379f61b188bf008e70b86363b9d35b63485ad8
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
          echo M1_9D_PROVEN_PATCH_GATES=PASS
      - name: Build Java and ARM uClibc presenter
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_9/M19LifecycleLauncher.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so
          file libm1_9e_presenter.so | grep -q 'ELF 32-bit LSB shared object, ARM'
          readelf -h libm1_9e_presenter.so | grep -q 'Version5 EABI'
          grep -q 'SDL_VIDEODRIVER' miyoo-m1/m1_9/m1_9e_presenter_jni.c
          ! grep -q 'SDL2' miyoo-m1/m1_9/m1_9e_presenter_jni.c
          echo M1_9E_BUILD_GATE=PASS
      - name: Package device probe
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS
          mkdir -p "$APP"
          cp upstream/build/freej2me_plus.jar "$APP/m1.9-freej2me-platform.jar"
          cp libm1_9e_presenter.so "$APP/libm1_9e_presenter.so"
          if jar tf "$APP/m1.9-freej2me-platform.jar" | grep -Eq '(^|/)Libretro[^/]*\.class$'; then exit 1; fi
          printf 'Manifest-Version: 1.0\n' >/tmp/manifest.mf
          (cd /tmp && jar cfm "$GITHUB_WORKSPACE/$APP/dummy.jar" manifest.mf >/dev/null)
          cat > "$APP/M1.9E-SDL1-PRESENTER-PROBE.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.9E-SDL1-PRESENTER-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm
          GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip
          : >"$OUT"
          echo 'RG35XX MIYOO M1.9E SDL1 FBCON FRAMEBUFFER PRESENTER PROBE' >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          LD_LIBRARY_PATH="$APP${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.9-freej2me-platform.jar" org.recompile.mobile.M19LifecycleLauncher "$APP/dummy.jar" >>"$OUT" 2>&1
          RC=$?
          JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_EXIT_CODE=$RC >>"$OUT"; echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"
          [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ] && echo M1_9_PROTECTED_HASHES=PASS >>"$OUT" || echo M1_9_PROTECTED_HASHES=FAIL >>"$OUT"
          grep -q 'M1_9E_DEVICE_ACCEPTANCE_MARKER=PASS' "$OUT" && [ "$RC" -eq 0 ] && echo M1_9E_EXECUTION_RESULT=PASS >>"$OUT" || echo M1_9E_EXECUTION_RESULT=FAIL >>"$OUT"
          echo VISUAL_EXPECTATION=BLUE_FULLSCREEN_WITH_CENTER_GREEN_RECTANGLE_FOR_5_SECONDS >>"$OUT"
          echo DEVICE_PASS=NO_PENDING_VISUAL_CONFIRMATION >>"$OUT"
          echo FULL_PLATFORM_STABLE=NO >>"$OUT"
          sync; exit "$RC"
          SH
          chmod +x "$APP/M1.9E-SDL1-PRESENTER-PROBE.sh"
          (cd out/garlicos && find Roms -type f -print0 | sort -z | xargs -0 sha256sum) > out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum "$APP/m1.9-freej2me-platform.jar" "$APP/libm1_9e_presenter.so"
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.9e-sdl1-presenter-probe
          path: out/garlicos/
          if-no-files-found: error
