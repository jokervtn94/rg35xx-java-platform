name: RG35XX Miyoo M1.3B.1 Exact Keymap Fix
on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - 'miyoo-m1/m1_3b1_exact_keymap_probe.c'
      - 'miyoo-m1/M1.3B.1-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.3B.1-EXACT-KEYMAP-CALIBRATION-FIX-PREFLIGHT.md'
      - '.github/workflows/miyoo-m1.3b1-exact-keymap-fix.yml'
  workflow_dispatch:
jobs:
  build-exact-keymap-fix-probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Gate rules and M1.3B.1 preflight
        run: |
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.3B.1-EXACT-KEYMAP-CALIBRATION-FIX-PREFLIGHT.md
          grep -q 'MINIMAL_PROPOSED_CHANGE' tasklog/MIYOO-M1.3B.1-EXACT-KEYMAP-CALIBRATION-FIX-PREFLIGHT.md
      - name: Pull pinned ARM uClibc toolchain
        run: docker pull docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      - name: Build probe
        run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e sh -lc 'arm-linux-gcc -Os -s -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft miyoo-m1/m1_3b1_exact_keymap_probe.c -o miyoo-m1/m1_3b1_exact_keymap_probe'
          sha256sum miyoo-m1/m1_3b1_exact_keymap_probe
      - name: ELF and scope gate
        run: |
          file miyoo-m1/m1_3b1_exact_keymap_probe
          readelf -h miyoo-m1/m1_3b1_exact_keymap_probe | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          readelf -l miyoo-m1/m1_3b1_exact_keymap_probe | grep -q '/lib/ld-uClibc.so.0'
          ! grep -R 'SDL_' miyoo-m1/m1_3b1_exact_keymap_probe.c
          sh -n miyoo-m1/M1.3B.1-DEVICE-TEST.sh
      - name: Package
        run: |
          mkdir -p artifact/Roms/APPS
          cp miyoo-m1/m1_3b1_exact_keymap_probe artifact/Roms/APPS/
          cp miyoo-m1/M1.3B.1-DEVICE-TEST.sh artifact/Roms/APPS/
          chmod +x artifact/Roms/APPS/*
          sha256sum artifact/Roms/APPS/* | tee artifact/SHA256SUMS.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.3b1-exact-keymap-fix
          path: artifact/
          if-no-files-found: error
