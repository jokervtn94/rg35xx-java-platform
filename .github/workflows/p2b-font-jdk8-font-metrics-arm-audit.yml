name: P2B Font JDK8 Font Metrics ARM Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-font-metrics-arm-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkFontMetricsContractDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_font_metrics_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_font_metrics.py'

permissions:
  contents: read

jobs:
  p2b-jdk8-font-metrics-arm:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6
      JDK8_FREETYPE_SCALER_BLOB: 4fc45a54a9d1a90522474005e044f5328930df1d
      JDK8_FONTDESIGNMETRICS_BLOB: d843c16cd5f598624567e648a83d7f2d14759ca9
      JDK8_STRIKEMETRICS_BLOB: ca561fb99e8aec8983175941539d1040a726e499

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-font-metrics-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-font-metrics-files.txt | grep -q .; then
            echo 'P2B_FONT_METRICS_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_FONT_METRICS_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc --version | tee out/P2B-FONT-METRICS-ARM-CC-VERSION.txt
          echo 'P2B_FONT_METRICS_ARM_TOOLCHAIN=PASS'

      - name: Pin exact JDK8u504 metric and FreeType source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/freetypeScaler.c)" = "$JDK8_FREETYPE_SCALER_BLOB"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/classes/sun/font/FontDesignMetrics.java)" = "$JDK8_FONTDESIGNMETRICS_BLOB"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/classes/sun/font/StrikeMetrics.java)" = "$JDK8_STRIKEMETRICS_BLOB"
          grep -F 'private static float roundingUpValue = 0.95f;' /tmp/jdk8u/jdk/src/share/classes/sun/font/FontDesignMetrics.java
          grep -F 'return -ascentY;' /tmp/jdk8u/jdk/src/share/classes/sun/font/StrikeMetrics.java
          grep -F 'scalerInfo->face->ascender' /tmp/jdk8u/jdk/src/share/native/sun/font/freetypeScaler.c
          grep -F 'scalerInfo->face->descender' /tmp/jdk8u/jdk/src/share/native/sun/font/freetypeScaler.c
          grep -F 'scalerInfo->face->height' /tmp/jdk8u/jdk/src/share/native/sun/font/freetypeScaler.c
          {
            echo "P2B_JDK8U_TAG=$JDK8U_TAG"
            echo "P2B_JDK8U_COMMIT=$(git -C /tmp/jdk8u rev-parse HEAD)"
            echo "P2B_JDK8_FREETYPE_SCALER_BLOB=$JDK8_FREETYPE_SCALER_BLOB"
            echo "P2B_JDK8_FONTDESIGNMETRICS_BLOB=$JDK8_FONTDESIGNMETRICS_BLOB"
            echo "P2B_JDK8_STRIKEMETRICS_BLOB=$JDK8_STRIKEMETRICS_BLOB"
            echo 'P2B_JDK8_FONT_METRICS_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-JDK8-FONT-METRICS-SOURCE-PROVENANCE.txt

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 /tmp/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p /tmp/miyoomini-freej2me.zip "$ENTRY" > /tmp/p2b-font.ttf
          test "$(sha256sum /tmp/p2b-font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < /tmp/p2b-font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_FONT_METRICS_FONT_IDENTITY=PASS' | tee out/P2B-FONT-METRICS-FONT-IDENTITY.txt

      - name: Generate exact JDK8 FontMetrics reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2b-metrics-classes && mkdir -p /tmp/p2b-metrics-classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d /tmp/p2b-metrics-classes \
            tests/p2b/diagnostic/RG35XXP2BJdkFontMetricsContractDiagnostic.java
          java -Djava.awt.headless=true -cp /tmp/p2b-metrics-classes \
            RG35XXP2BJdkFontMetricsContractDiagnostic /tmp/p2b-font.ttf \
            | tee out/P2B-JDK8-FONT-METRICS.log
          grep -F 'P2B_JDK8_FONT_METRICS_CASES=24' out/P2B-JDK8-FONT-METRICS.log
          grep -F 'P2B_JDK8_FONT_METRICS_RESULT=PASS' out/P2B-JDK8-FONT-METRICS.log

      - name: Cross-build exact vendored FreeType and metric probe
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          OBJ=/tmp/p2b-jdk8-ft-metrics-obj
          LIB=/tmp/libp2b-jdk8-ft-metrics-arm.a
          EXE=/tmp/p2b-jdk8-font-metrics-arm
          rm -rf "$OBJ" "$LIB" "$EXE" && mkdir -p "$OBJ"
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$OBJ/${rel//\//_}.o"
            "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -fPIC -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          "$AR" rcs "$LIB" "$OBJ"/*.o
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_font_metrics_arm.c \
            "$LIB" -lm -o "$EXE"
          file "$EXE" | tee out/P2B-JDK8-FONT-METRICS-ARM-FILE.txt
          echo 'P2B_FONT_METRICS_ARM_BUILD=PASS' | tee out/P2B-JDK8-FONT-METRICS-ARM-BUILD.txt

      - name: Run ARM metric differential
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" /tmp/p2b-jdk8-font-metrics-arm /tmp/p2b-font.ttf \
            | tee out/P2B-JDK8-FONT-METRICS-ARM.log
          grep -F 'P2B_FT_LIBRARY_VERSION=2.14.3' out/P2B-JDK8-FONT-METRICS-ARM.log
          grep -F 'P2B_FT_JDK8_FONT_METRICS_CASES=24' out/P2B-JDK8-FONT-METRICS-ARM.log
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_font_metrics.py \
            out/P2B-JDK8-FONT-METRICS.log out/P2B-JDK8-FONT-METRICS-ARM.log \
            | tee out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_NORMALIZED_EXACT=24' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_HEIGHT_EXACT=24' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_ASCENT_EXACT=24' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_DESCENT_EXACT=24' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_LEADING_EXACT=24' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_MISMATCH_COUNT=0' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
          grep -F 'P2B_FONT_METRICS_DIFF_RESULT=PASS' out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt

      - name: Remove source builds and font before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u /tmp/p2b-jdk8-ft-metrics-obj /tmp/p2b-metrics-classes
          rm -f /tmp/libp2b-jdk8-ft-metrics-arm.a /tmp/p2b-jdk8-font-metrics-arm \
            /tmp/p2b-font.ttf /tmp/miyoomini-freej2me.zip
          if find out -type f | grep -Ei '\.(ttf|otf|a|o|so)$'; then
            echo 'P2B_FONT_METRICS_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_FONT_METRICS_BYTE_LEAK=NO' | tee out/P2B-FONT-METRICS-CLEANUP.txt
          echo 'P2B_RUNTIME_PATCH=FORBIDDEN' | tee out/P2B-FONT-METRICS-STATUS.txt
          echo 'DEVICE_TEST=NOT_REQUESTED' >> out/P2B-FONT-METRICS-STATUS.txt
          echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO' >> out/P2B-FONT-METRICS-STATUS.txt
          echo 'STABLE=NO' >> out/P2B-FONT-METRICS-STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-FONT-METRICS-ARM-${{ github.sha }}
          path: |
            out/P2B-JDK8-FONT-METRICS-SOURCE-PROVENANCE.txt
            out/P2B-FONT-METRICS-FONT-IDENTITY.txt
            out/P2B-JDK8-FONT-METRICS.log
            out/P2B-JDK8-FONT-METRICS-ARM-CC-VERSION.txt
            out/P2B-JDK8-FONT-METRICS-ARM-FILE.txt
            out/P2B-JDK8-FONT-METRICS-ARM-BUILD.txt
            out/P2B-JDK8-FONT-METRICS-ARM.log
            out/P2B-JDK8-FONT-METRICS-DIFFERENTIAL.txt
            out/P2B-FONT-METRICS-CLEANUP.txt
            out/P2B-FONT-METRICS-STATUS.txt
