name: P1A G2 MIDP Shapes Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2-midp-shapes-diagnostic
    paths:
      - '.github/workflows/p1a-g2-midp-shapes-diagnostic.yml'
      - 'scripts/run-p1a-g2-midp-shapes-diagnostic.sh'
      - 'tests/p1a/RG35XXG2MidpShapesDiagnostic.java'

permissions:
  contents: read

jobs:
  p1a-g2-midp-shapes-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout G2 diagnostic branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 reference raster
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Capture G2 canonical JDK8 raster without runtime patch
        run: bash ./scripts/run-p1a-g2-midp-shapes-diagnostic.sh

      - name: Verify diagnostic-only scope
        run: |
          set -euo pipefail
          ID=out/p1a-g2-midp-shapes-diagnostic/IDENTITY.txt
          LOG=out/p1a-g2-midp-shapes-diagnostic/P1A-G2-MIDP-SHAPES-DIAGNOSTIC.txt
          grep -q '^OWNER=RG35XX_GRAPHICS_BOUNDARY$' "$ID"
          grep -q '^G2_METHODS=drawArc,fillArc,drawRoundRect,fillRoundRect,fillTriangle$' "$ID"
          grep -q '^RUNTIME_CHANGE=NO$' "$ID"
          grep -q '^RAW_PRE_G2_CLASSIFICATION=RAW_EXCEPTION_NPE_ALL_G2_METHODS$' "$ID"
          grep -q '^FILLROUNDRECT_CANONICAL_QUIRK=FINAL_FULL_FILLRECT$' "$ID"
          grep -q '^BUILD-PASS=YES_DIAGNOSTIC_ONLY$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^P1A_G2_MIDP_SHAPES_DIAGNOSTIC=PASS$' "$LOG"
          grep -q '^P1A_G2_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_G2_FILLROUNDRECT_EQUALS_FILLRECT=true$' "$LOG"
          echo P1A_G2_DIAGNOSTIC_SCOPE_LOCK=PASS

      - name: Upload G2 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2-MIDP-SHAPES-DIAG-${{ github.sha }}
          path: out/p1a-g2-midp-shapes-diagnostic/
          if-no-files-found: error
