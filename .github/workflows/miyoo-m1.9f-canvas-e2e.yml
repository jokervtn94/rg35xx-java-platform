name: Miyoo M1.9F Canvas Input Render E2E
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.9f-canvas-e2e]
jobs:
  m19f:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve M1.8 input boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install dependencies and toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Fetch pinned FreeJ2ME and apply proven headless raster patches
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
      - name: Build platform input JNI presenter and MIDlet
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19CanvasLifecycleLauncher.java upstream/src/org/recompile/mobile/
          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          $CC -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_8/m1_8_input_jni.c -o libm1_8_input.so
          $CC -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so
          mkdir -p midlet-classes
          /usr/lib/jvm/java-8-openjdk-amd64/bin/javac -source 1.5 -target 1.5 -bootclasspath upstream/build/freej2me_plus.jar -classpath upstream/build/freej2me_plus.jar -d midlet-classes miyoo-m1/m1_9/M19CanvasE2EMIDlet.java
          printf 'Manifest-Version: 1.0\nMIDlet-1: M1.9F,,org.recompile.mobile.M19CanvasE2EMIDlet\nMIDlet-Name: M1.9F\nMIDlet-Vendor: RG35XX\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' >/tmp/m19f.mf
          jar cfm m1.9f-canvas.jar /tmp/m19f.mf -C midlet-classes .
          echo M1_9F_BUILD_GATE=PASS
      - name: Package device test
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS; mkdir -p "$APP"
          cp upstream/build/freej2me_plus.jar "$APP/m1.9-freej2me-platform.jar"
          cp libm1_8_input.so libm1_9e_presenter.so m1.9f-canvas.jar "$APP/"
          cat > "$APP/M1.9F-CANVAS-E2E.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.9F-CANVAS-E2E-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm
          GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip
          : >"$OUT"; echo 'RG35XX MIYOO M1.9F CANVAS INPUT RENDER E2E' >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          echo VISUAL_INSTRUCTION='DPAD_MOVES_GREEN_SQUARE_A_TURNS_IT_RED' >>"$OUT"
          LD_LIBRARY_PATH="$APP${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.9-freej2me-platform.jar" org.recompile.mobile.M19CanvasLifecycleLauncher "$APP/m1.9f-canvas.jar" >>"$OUT" 2>&1
          RC=$?
          JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_EXIT_CODE=$RC >>"$OUT"; echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"
          [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ] && echo M1_9_PROTECTED_HASHES=PASS >>"$OUT" || echo M1_9_PROTECTED_HASHES=FAIL >>"$OUT"
          grep -q 'M1_9F_DEVICE_ACCEPTANCE_MARKER=PASS' "$OUT" && [ "$RC" -eq 0 ] && echo M1_9F_EXECUTION_RESULT=PASS >>"$OUT" || echo M1_9F_EXECUTION_RESULT=FAIL >>"$OUT"
          echo DEVICE_PASS=NO_PENDING_VISUAL_CONFIRMATION >>"$OUT"; echo FULL_PLATFORM_STABLE=NO >>"$OUT"; sync; exit "$RC"
          SH
          chmod +x "$APP/M1.9F-CANVAS-E2E.sh"
          (cd out/garlicos && find Roms -type f -print0 | sort -z | xargs -0 sha256sum) >out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum "$APP"/*
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.9f-canvas-e2e
          path: out/garlicos/
          if-no-files-found: error
