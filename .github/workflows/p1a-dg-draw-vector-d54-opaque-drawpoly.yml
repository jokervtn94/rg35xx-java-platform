name: P1A DG Draw Vector D5.4 Opaque DrawPoly Diagnostic

on:
  push:
    branches:
      - p1a-dg-draw-vector-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGDrawVectorD54OpaqueDrawPolyDiagnostic.java'
      - '.github/workflows/p1a-dg-draw-vector-d54-opaque-drawpoly.yml'
  workflow_dispatch:

jobs:
  p1a-dg-draw-vector-d54:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D4 host-pass ancestry only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c2b1f2b0ca99d42ef9965a24f1eb7678eca428a HEAD
          echo P1A_DG_D54_D4_HOST_PARENT_ANCESTRY=PASS
          echo P1A_DG_D54_RUNTIME_CHANGE=NO

      - name: Compile Java6 opaque DrawPoly diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-dg-d54
          javac -encoding UTF-8 -source 1.6 -target 1.6 \
            -d build/p1a-dg-d54 \
            tests/p1a/RG35XXDGDrawVectorD54OpaqueDrawPolyDiagnostic.java
          echo P1A_DG_D54_JAVA6_GATE=PASS

      - name: Run strict opaque DrawPoly differential
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/p1a-dg-d54 \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD54OpaqueDrawPolyDiagnostic \
            | tee build/p1a-dg-d54/D54-OPAQUE-DRAWPOLY.txt
          LOG=build/p1a-dg-d54/D54-OPAQUE-DRAWPOLY.txt
          grep -q '^P1A_DG_D54_FIXED_CASE_COUNT=20$' "$LOG"
          grep -q '^P1A_DG_D54_FUZZ_CASE_COUNT=160$' "$LOG"
          grep -q '^P1A_DG_D54_COMPARISON_COUNT=180$' "$LOG"
          grep -q '^P1A_DG_D54_RANDOM_SEED=35d5001$' "$LOG"
          grep -q '^P1A_DG_D54_MISMATCH_CASE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D54_MISMATCH_PIXEL_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D54_MODEL=OPENJDK8_GENERALRENDERER_DODRAWPOLY_DODRAWLINE_ADJUSTLINE$' "$LOG"
          grep -q '^P1A_DG_D54_CLIP_MODEL=DEVICE_HALF_OPEN_TO_INCLUSIVE_HI_MINUS_1$' "$LOG"
          grep -q '^P1A_DG_D54_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_DG_D54_OPAQUE_DRAWPOLY_DIAGNOSTIC_GATE=PASS$' "$LOG"

      - name: Capture opaque Java2D owner trace
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -Dsun.java2d.trace=log -cp build/p1a-dg-d54 \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD54OpaqueDrawPolyDiagnostic \
            > build/p1a-dg-d54/D54-TRACE.txt 2>&1
          grep -q 'DrawPolygons::DrawPolygons' build/p1a-dg-d54/D54-TRACE.txt
          echo P1A_DG_D54_TRACE_OWNER=DrawPolygons
          echo P1A_DG_D54_TRACE_GATE=PASS

      - name: Upload D5.4 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-DRAW-VECTOR-D54-${{ github.sha }}
          path: build/p1a-dg-d54/
          if-no-files-found: error
