name: RG35XX R5 MIDI Player Ownership

on:
  workflow_dispatch:
  push:
    branches:
      - module/p3-audio-player-ownership-r5-20261005
    paths:
      - '.github/workflows/rg35xx-r5-audio-owner.yml'
      - 'adapter/native/rg35xx_audio_sdl1_mixer_r5_owner.c'
      - 'scripts/build-rg35xx-r5-audio-owner-native.sh'
      - 'scripts/build-rg35xx-r5-audio-owner.sh'
      - 'scripts/gate-rg35xx-r5-audio-owner.py'
      - 'tests/diagnostics/RG35XXMidiOwnershipDiagnostic.java'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout R5 owner branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends unzip zip python3 curl binutils >/dev/null

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download exact physical-tested R4 parent
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '11325956934'
          EXPECTED_ZIP_SHA: '0e739da19b7f6078e8c9b1b2223cf3fb55a9f95e187830502320a1987282792d'
        run: |
          set -euo pipefail
          rm -rf /tmp/r4-artifact /tmp/r4-wrapper.zip
          mkdir -p /tmp/r4-artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jokervtn94/rg35xx-java-platform/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/r4-wrapper.zip
          unzip -q /tmp/r4-wrapper.zip -d /tmp/r4-artifact
          R4_ZIP="$(find /tmp/r4-artifact -type f -name 'RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R4.zip' -print -quit)"
          test -n "$R4_ZIP"
          test "$(sha256sum "$R4_ZIP"|awk '{print $1}')" = "$EXPECTED_ZIP_SHA"
          echo "R4_DEVICE_ZIP=$R4_ZIP" >> "$GITHUB_ENV"
          echo R5_R4_PARENT_GATE=PASS

      - name: Compile owner-aware ARMv5 SDL1 audio bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini; bash ./scripts/build-rg35xx-r5-audio-owner-native.sh' | tee R5-NATIVE.log
          sudo chown -R "$(id -u):$(id -g)" out/r5-audio-owner-native
          grep -q '^R5_AUDIO_NATIVE_BUILD=PASS$' R5-NATIVE.log
          grep -q '^R5_AUDIO_NATIVE_SCOPE=SDL1_MIXER_PLAYER_MANAGER_OWNERSHIP_ONLY$' R5-NATIVE.log
          echo "R5_AUDIO_SO=$GITHUB_WORKSPACE/out/r5-audio-owner-native/libaudio.so" >> "$GITHUB_ENV"

      - name: Build exact R4 plus R5 owner candidate
        env:
          JAVA8: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-rg35xx-r5-audio-owner.sh
          R4_DEVICE_ZIP="$R4_DEVICE_ZIP" R5_AUDIO_SO="$R5_AUDIO_SO" JAVA8="$JAVA_HOME" \
            bash scripts/build-rg35xx-r5-audio-owner.sh | tee R5-BUILD.log
          grep -q '^R5_AUDIO_OWNER_BUILD=PASS$' R5-BUILD.log
          grep -q '^R5_CANONICAL_JAVA_DELTA=NONE$' R5-BUILD.log
          grep -q '^R5_RUNTIME_SEMANTIC_DELTA=NONE$' R5-BUILD.log
          grep -q '^R5_GAME_SPECIFIC_CODE=NO$' R5-BUILD.log

      - name: Independent final ZIP gate
        run: |
          set -euo pipefail
          ZIP=out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
          python3 scripts/gate-rg35xx-r5-audio-owner.py "$ZIP" | tee R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_INDEPENDENT_GATE=PASS$' R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_PROTECTED_NONAUDIO_HASH_GATE=PASS$' R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_NATIVE_MARKER_GATE=PASS$' R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_JAVA6_DIAGNOSTIC_GATE=PASS$' R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_P6_P7_HASH_REBIND_GATE=PASS$' R5-GATE.log
          grep -q '^DEVICE_PASS=NO$' R5-GATE.log
          grep -q '^STABLE=NO$' R5-GATE.log

      - name: Verify final shell syntax
        run: |
          set -euo pipefail
          ZIP=out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP"
          find "$TMP" -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do sh -n "$f"; done
          echo R5_FINAL_SHELL_GATE=PASS

      - name: Record host identity
        run: |
          set -euo pipefail
          ZIP=out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
          AUDIO=$(sha256sum out/r5-audio-owner-native/libaudio.so|awk '{print $1}')
          {
            echo PROJECT=RG35XX-AWEIGIT-R1
            echo STAGE=R5_NATIVE_MIDI_PLAYER_OWNERSHIP
            echo SOURCE_BRANCH=${GITHUB_REF_NAME}
            echo SOURCE_COMMIT=${GITHUB_SHA}
            echo PARENT_R4_ARTIFACT_ID=11325956934
            echo PARENT_R4_ZIP_SHA256=0e739da19b7f6078e8c9b1b2223cf3fb55a9f95e187830502320a1987282792d
            echo R5_AUDIO_SHA256=$AUDIO
            echo R5_DEVICE_ZIP_SHA256=$(sha256sum "$ZIP"|awk '{print $1}')
            echo CANONICAL_PLATFORMPLAYER=UNCHANGED
            echo CANONICAL_MMAPI=UNCHANGED
            echo RUNTIME_SEMANTIC_DELTA=NONE
            echo NATIVE_AUDIO_DELTA=PLAYER_MANAGER_OWNERSHIP_ONLY
            echo GAME_SPECIFIC_CODE=NO
            echo P6_PHYSICAL_ACCEPTANCE=RETEST_REQUIRED_NATIVE_CHANGED
            echo P7_PHYSICAL_REGRESSION=RETEST_REQUIRED_NATIVE_CHANGED
            echo DEVICE_PASS=NO
            echo STABLE=NO
          } > R5-HOST-IDENTITY.txt
          cat R5-HOST-IDENTITY.txt

      - name: Upload R5 physical candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-R5-AUDIO-OWNER-${{ github.sha }}
          path: |
            out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
            out/r5-audio-owner-native/libaudio.so
            R5-NATIVE.log
            R5-BUILD.log
            R5-GATE.log
            R5-HOST-IDENTITY.txt
          if-no-files-found: error
