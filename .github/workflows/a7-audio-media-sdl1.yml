name: A7 RG35XX Audio Media SDL1

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a7-audio-media
    paths:
      - '.github/workflows/a7-audio-media-sdl1.yml'
      - 'adapter/native/rg35xx_audio_sdl1_mixer.c'
      - 'scripts/stage-a7-rg35xx-audio-loader.py'
      - 'scripts/build-a7-audio-java.sh'
      - 'scripts/build-a7-audio-native.sh'
      - 'scripts/build-a7-audio-test-midlet.sh'
      - 'tests/a7/A7AudioMediaTest.java'

permissions:
  contents: read

jobs:
  a7-audio-media-sdl1:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout A7 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact accepted A6 input and PERF-A1 video natives
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild exact accepted A6 ClipTranslate parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Build A7 Java candidate with adapter-owned lazy audio loader
        run: bash ./scripts/build-a7-audio-java.sh

      - name: Build ARMv5 soft-float SDL1_mixer audio bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'

      - name: Build one Java 6 WAV plus MIDI integration test MIDlet
        run: bash ./scripts/build-a7-audio-test-midlet.sh

      - name: Verify A7 scope and A6 protected identities
        run: |
          set -euo pipefail
          DST=out/a7-audio-sdl1
          ID="$DST/A7-AUDIO-IDENTITY.txt"
          grep -q '^AWEIGIT_COMMIT=ca11dfe8ea1cc273d92460f9a83bbf192023fa63$' "$ID"
          grep -q '^A6_ACCEPTED_PARENT_SEMANTIC_SHA256=53f229dbf14621a2a27a7249cb1355b1a2367bebc51a761959d3bd54985565d6$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$ID"
          grep -q '^A7_AUDIO_JAVA_CHANGED_SCOPE=RG35XXLauncher_CLASS_FAMILY_ONLY$' "$ID"
          grep -q '^A7_AUDIO_CANONICAL_MMAPI=UNCHANGED$' "$ID"
          grep -q '^A7_AUDIO_BACKEND=SDL1_MIXER_DYNAMIC$' "$ID"
          grep -q '^A7_AUDIO_DEVICE_INIT=LAZY$' "$ID"
          grep -q '^A7_AUDIO_FRAME_COUPLING=NO$' "$ID"
          grep -q '^A7_AUDIO_JAVASOUND_FALLBACK=NO$' "$ID"
          grep -q '^A7_AUDIO_NATIVE_ABI=ARMV5TE_SOFT_FLOAT$' "$ID"
          grep -q '^A7_AUDIO_SDL2_CONTAMINATION=NO$' "$ID"
          grep -q '^A7_AUDIO_TEST_JAVA_MAJOR=50$' "$ID"
          grep -q '^A7_AUDIO_TEST_MEDIA=GENERATED_NONCOMMERCIAL$' "$ID"
          grep -q '^A7_AUDIO_TEST_PLAYTONE=EXCLUDED_CANONICAL_NOOP$' "$ID"
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          test "$(sha256sum "$DST/librg35xx_input.so" | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum "$DST/librg35xx_video.so" | awk '{print $1}')" = 'c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d'
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' "$DST/CANONICAL-DIFF-MANIFEST.txt"
          strings "$DST/libaudio.so" | grep -q 'RG35XX_A7_AUDIO_INIT=PASS BACKEND=SDL1_MIXER'
          ! strings "$DST/libaudio.so" | grep -Eq 'libSDL2|MidiSystem|getSequencer|AudioSystem|getClip|/dev/snd/seq'
          test -f "$DST/A7AudioMediaTest.jar"
          (cd "$DST" && sha256sum -c A7-ARTIFACT-SHA256SUMS.txt)
          echo A7_AUDIO_MEDIA_CI_SCOPE_LOCK=PASS

      - name: Upload A7 audio candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A7-AUDIO-SDL1-${{ github.sha }}
          path: out/a7-audio-sdl1/
          if-no-files-found: error
