name: RG35XX Miyoo M1.3B Exact Keymap

on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - 'miyoo-m1/m1_3b_exact_keymap_probe.c'
      - 'miyoo-m1/M1.3B-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.3B-EXACT-KEYMAP-PREFLIGHT.md'
      - '.github/workflows/miyoo-m1.3b-exact-keymap.yml'
  workflow_dispatch:

jobs:
  build-exact-keymap-probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Gate rules and M1.3B preflight
        run: |
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.3B-EXACT-KEYMAP-PREFLIGHT.md
          grep -q 'MINIMAL_PROPOSED_CHANGE' tasklog/MIYOO-M1.3B-EXACT-KEYMAP-PREFLIGHT.md

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          docker pull docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e

      - name: Build M1.3B exact keymap probe
        run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e \
            sh -lc 'arm-linux-gcc -Os -s -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft miyoo-m1/m1_3b_exact_keymap_probe.c -o miyoo-m1/m1_3b_exact_keymap_probe'
          sha256sum miyoo-m1/m1_3b_exact_keymap_probe

      - name: Strict ELF and scope gate
        run: |
          file miyoo-m1/m1_3b_exact_keymap_probe
          readelf -h miyoo-m1/m1_3b_exact_keymap_probe | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          readelf -l miyoo-m1/m1_3b_exact_keymap_probe | grep -q '/lib/ld-uClibc.so.0'
          ! grep -R 'SDL_' miyoo-m1/m1_3b_exact_keymap_probe.c
          ! grep -R 'audio\|font\|jamvm\|freej2me' miyoo-m1/m1_3b_exact_keymap_probe.c
          sh -n miyoo-m1/M1.3B-DEVICE-TEST.sh

      - name: Package flat GarlicOS Apps layout
        run: |
          mkdir -p artifact/Roms/APPS
          cp miyoo-m1/m1_3b_exact_keymap_probe artifact/Roms/APPS/
          cp miyoo-m1/M1.3B-DEVICE-TEST.sh artifact/Roms/APPS/
          chmod +x artifact/Roms/APPS/m1_3b_exact_keymap_probe artifact/Roms/APPS/M1.3B-DEVICE-TEST.sh
          sha256sum artifact/Roms/APPS/* | tee artifact/SHA256SUMS.txt

      - name: Upload M1.3B package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.3b-exact-keymap
          path: artifact/
          if-no-files-found: error
