name: RG35XX R5 MIDI Player Ownership V2
on:
  workflow_dispatch:
  push:
    branches: [module/p3-audio-player-ownership-r5-20261005]
    paths: ['.github/workflows/rg35xx-r5-audio-owner-v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends unzip zip python3 curl binutils >/dev/null
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Download exact R4 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jokervtn94/rg35xx-java-platform/actions/artifacts/11325956934/zip -o /tmp/r4-wrapper.zip
          unzip -q /tmp/r4-wrapper.zip -d /tmp/r4
          R4_ZIP="$(find /tmp/r4 -type f -name 'RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R4.zip' -print -quit)"
          test "$(sha256sum "$R4_ZIP"|awk '{print $1}')" = 0e739da19b7f6078e8c9b1b2223cf3fb55a9f95e187830502320a1987282792d
          echo "R4_DEVICE_ZIP=$R4_ZIP" >> "$GITHUB_ENV"
          echo R5_R4_PARENT_GATE=PASS
      - name: Compile R5 native
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'bash ./scripts/build-rg35xx-r5-audio-owner-native.sh' | tee R5-NATIVE.log
          sudo chown -R "$(id -u):$(id -g)" out
          grep -q '^R5_AUDIO_NATIVE_BUILD=PASS$' R5-NATIVE.log
          echo "R5_AUDIO_SO=$GITHUB_WORKSPACE/out/r5-audio-owner-native/libaudio.so" >> "$GITHUB_ENV"
      - name: Build R5 package
        run: |
          set -euo pipefail
          R4_DEVICE_ZIP="$R4_DEVICE_ZIP" R5_AUDIO_SO="$R5_AUDIO_SO" JAVA8="$JAVA_HOME" bash scripts/build-rg35xx-r5-audio-owner.sh | tee R5-BUILD.log
          grep -q '^R5_AUDIO_OWNER_BUILD=PASS$' R5-BUILD.log
      - name: Independent gate
        run: |
          set -euo pipefail
          ZIP=out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
          python3 scripts/gate-rg35xx-r5-audio-owner.py "$ZIP" | tee R5-GATE.log
          grep -q '^R5_AUDIO_OWNER_INDEPENDENT_GATE=PASS$' R5-GATE.log
          grep -q '^DEVICE_PASS=NO$' R5-GATE.log
          TMP=$(mktemp -d); unzip -q "$ZIP" -d "$TMP"
          find "$TMP" -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do sh -n "$f"; done
          echo R5_FINAL_SHELL_GATE=PASS
      - name: Identity
        run: |
          ZIP=out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
          AUDIO=$(sha256sum out/r5-audio-owner-native/libaudio.so|awk '{print $1}')
          {
            echo PROJECT=RG35XX-AWEIGIT-R1
            echo STAGE=R5_NATIVE_MIDI_PLAYER_OWNERSHIP
            echo SOURCE_COMMIT=${GITHUB_SHA}
            echo PARENT_R4_ARTIFACT_ID=11325956934
            echo PARENT_R4_ZIP_SHA256=0e739da19b7f6078e8c9b1b2223cf3fb55a9f95e187830502320a1987282792d
            echo R5_AUDIO_SHA256=$AUDIO
            echo R5_DEVICE_ZIP_SHA256=$(sha256sum "$ZIP"|awk '{print $1}')
            echo CANONICAL_PLATFORMPLAYER=UNCHANGED
            echo CANONICAL_MMAPI=UNCHANGED
            echo NATIVE_AUDIO_DELTA=PLAYER_MANAGER_OWNERSHIP_ONLY
            echo DEVICE_PASS=NO
            echo STABLE=NO
          } | tee R5-HOST-IDENTITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-R5-AUDIO-OWNER-${{ github.sha }}
          path: |
            out/r5-audio-owner/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip
            out/r5-audio-owner-native/libaudio.so
            R5-NATIVE.log
            R5-BUILD.log
            R5-GATE.log
            R5-HOST-IDENTITY.txt
          if-no-files-found: error
