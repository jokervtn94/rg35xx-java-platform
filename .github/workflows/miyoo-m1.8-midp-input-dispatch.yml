name: Miyoo M1.8 MIDP Input Dispatch

on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_8/**'
      - 'miyoo-m1/m1_7_input_jni.c'
      - '.github/workflows/miyoo-m1.8-midp-input-dispatch.yml'

jobs:
  m1_8_dispatch_gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4

      - name: Verify M1.7 raw input is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum miyoo-m1/m1_7_input_jni.c | awk '{print $1}')" = "34e0e19297a3c7e32520e0684ce7031f361fc8bcbf585093149dc8db7f39d603"

      - name: Verify M1.8 native single-owner semantic bridge
        shell: bash
        run: |
          set -euo pipefail
          F=miyoo-m1/m1_8/m1_8_input_jni.c
          test "$(grep -c 'open(\"/dev/input/js0\"' "$F")" -eq 1
          test "$(grep -c 'Java_org_recompile_mobile_M1Input_rawGetState' "$F")" -eq 1
          grep -q 'O_RDONLY | O_NONBLOCK' "$F"
          ! grep -q 'printf\|fprintf\|syslog' "$F"

      - name: Install JDK 8 and pinned ARM uClibc toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo

      - name: Build ARM uClibc M1.8 JNI bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-m1.8
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc \
            -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -Wall -Wextra -I"$JH" -I"$JH/linux" \
            miyoo-m1/m1_8/m1_8_input_jni.c -o build-m1.8/libm1_8_input.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.8/libm1_8_input.so
          readelf -h build-m1.8/libm1_8_input.so | tee build-m1.8/ELF-HEADER.txt
          readelf -A build-m1.8/libm1_8_input.so | tee build-m1.8/ELF-ATTRIBUTES.txt || true
          readelf -Ws build-m1.8/libm1_8_input.so | tee build-m1.8/ELF-SYMBOLS.txt
          grep -q 'Class:.*ELF32' build-m1.8/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.8/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.8/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.8/ELF-HEADER.txt
          grep -q 'Java_org_recompile_mobile_M1Input_rawGetState' build-m1.8/ELF-SYMBOLS.txt
          sha256sum build-m1.8/libm1_8_input.so | tee build-m1.8/NATIVE-SHA256.txt

      - name: Checkout canonical FreeJ2ME-Plus source pin
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD)" = "13ec186903087156c145268f8706eecfaf9f1e50"
          test "$(git -C upstream rev-parse HEAD^{tree})" = "ad47ab16e9025f0eb3d2067bc3b1897dc71987df"

      - name: Verify canonical owner before patch
        shell: bash
        run: |
          set -euo pipefail
          LR=upstream/src/org/recompile/freej2me/Libretro.java
          grep -q 'MobilePlatform.keyPressed(Mobile.getMobileKey(code))' "$LR"
          grep -q 'MobilePlatform.keyReleased(Mobile.getMobileKey(code))' "$LR"

      - name: Apply fail-closed M1.8 Libretro integration
        shell: bash
        run: |
          set -euo pipefail
          python3 miyoo-m1/m1_8/apply_m1_8_libretro.py upstream/src/org/recompile/freej2me/Libretro.java
          LR=upstream/src/org/recompile/freej2me/Libretro.java
          test "$(grep -c 'm1InputDispatch.poll(System.currentTimeMillis())' "$LR")" -eq 1
          test "$(grep -c 'MobilePlatform.keyPressed(Mobile.getMobileKey(code))' "$LR" || true)" -eq 0
          test "$(grep -c 'MobilePlatform.keyReleased(Mobile.getMobileKey(code))' "$LR" || true)" -eq 0
          grep -q 'Consume this legacy packet without dispatch to prevent double events' "$LR"
          grep -q 'case 4: MobilePlatform.pointerReleased(x, y); break;' "$LR"
          grep -q 'case 5: MobilePlatform.pointerPressed(x, y);  break;' "$LR"
          grep -q 'case 6: MobilePlatform.pointerDragged(x, y);  break;' "$LR"

      - name: Build production-integrated canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/M1Input.java
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/M1InputDispatch.java
          (cd upstream && rm -rf build && ant)
          test -f upstream/build/freej2me_plus-lr.jar
          jar tf upstream/build/freej2me_plus-lr.jar | grep -q 'org/recompile/mobile/M1Input.class'
          jar tf upstream/build/freej2me_plus-lr.jar | grep -q 'org/recompile/mobile/M1InputDispatch.class'

      - name: Static single-dispatch and bounded-repeat gates
        shell: bash
        run: |
          set -euo pipefail
          F=miyoo-m1/m1_8/M1InputDispatch.java
          test "$(grep -c 'M1Input.rawGetState()' "$F")" -eq 1
          test "$(grep -c 'MobilePlatform.keyPressed(key)' "$F")" -eq 1
          test "$(grep -c 'MobilePlatform.keyReleased(key)' "$F")" -eq 1
          test "$(grep -c 'MobilePlatform.keyRepeated(key)' "$F")" -eq 1
          grep -q 'final int key = Mobile.getMobileKey(slot);' "$F"
          ! grep -q 'return Mobile.NOKIA_' "$F"
          grep -q 'REPEAT_DELAY_MS = 400' "$F"
          grep -q 'REPEAT_PERIOD_MS = 100' "$F"

      - name: Package M1.8 ARM production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp upstream/build/freej2me_plus-lr.jar out/freej2me_plus-m1.8-production-integration.jar
          cp build-m1.8/libm1_8_input.so out/
          cp build-m1.8/ELF-HEADER.txt build-m1.8/ELF-ATTRIBUTES.txt build-m1.8/ELF-SYMBOLS.txt out/
          cp upstream/src/org/recompile/freej2me/Libretro.java out/Libretro.m1_8.java
          cp miyoo-m1/m1_8/M1Input.java out/
          cp miyoo-m1/m1_8/M1InputDispatch.java out/
          cp miyoo-m1/m1_8/m1_8_input_jni.c out/
          sha256sum out/* | tee out/SHA256SUMS.txt
          cat > out/STATUS.txt <<'EOF'
          M1.8 MIDP Input Dispatch — ARM production checkpoint
          Upstream pin: 13ec186903087156c145268f8706eecfaf9f1e50
          ARM toolchain: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
          Native flags: -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft
          Native ABI gates: ELF32 ARM Version5 EABI soft-float + JNI symbol.
          Legacy Libretro gameplay key dispatch is consumed without MIDP dispatch.
          M1.8 raw js0 semantic adapter is the only gameplay MIDP dispatch path in patched Libretro.
          Pointer path remains canonical.
          No audio/video/font/transparency changes.
          CI success = BUILD-PASS only. DEVICE-TEST-PENDING until real RG35XX acceptance.
          Installer/rollback remains a separate checkpoint.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.8-arm-production-checkpoint
          path: out/
          if-no-files-found: error
