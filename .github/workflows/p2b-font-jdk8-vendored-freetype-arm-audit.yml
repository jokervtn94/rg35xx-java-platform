name: P2B Font JDK8 Vendored FreeType ARM Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-vendored-freetype-arm-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py'
      - 'docs/P2B-FONT-TEXT-EVIDENCE-SYNTHESIS-v1.md'

permissions:
  contents: read

jobs:
  p2b-jdk8-vendored-freetype-arm:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk8-vendored-ft-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk8-vendored-ft-files.txt | grep -q .; then
            echo 'P2B_JDK8_VENDORED_FT_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_VENDORED_FT_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          echo 'P2B_JDK8_VENDORED_FT_TOOLCHAIN=PASS'

      - name: Pin exact OpenJDK8u504 bundled FreeType source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          grep -F 'Freetype v2.14.3' /tmp/jdk8u/THIRD_PARTY_README
          {
            echo "P2B_JDK8U_TAG=$JDK8U_TAG"
            echo "P2B_JDK8U_COMMIT=$(git -C /tmp/jdk8u rev-parse HEAD)"
            echo "P2B_JDK8U_FT_INCLUDE_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)"
            echo "P2B_JDK8U_FT_SRC_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)"
            echo "P2B_JDK8U_FT_C_FILES=$(find "$FTROOT/src" -type f -name '*.c' | wc -l | tr -d ' ')"
            echo 'P2B_JDK8U_FT_DECLARED_VERSION=2.14.3'
            echo 'P2B_JDK8U_FT_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-JDK8U-VENDORED-FT-PROVENANCE.txt

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_VENDORED_FT_FONT_IDENTITY=PASS'

      - name: Generate exact JDK8 raster reference
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee out/P2B-JDK8-VERSION.txt
          mkdir -p out/classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BJdkRasterFingerprintDiagnostic out/font.ttf \
            | tee out/P2B-JDK8-RASTER-FP.log
          grep -F 'P2B_JDK_RASTER_FP_CASES=144' out/P2B-JDK8-RASTER-FP.log
          grep -F 'P2B_JDK_RASTER_FP_RESULT=PASS' out/P2B-JDK8-RASTER-FP.log

      - name: Rebuild vendored FreeType on host and validate recipe equivalence
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          OBJ=out/jdk8u-ft-host-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$OBJ/${rel//\//_}.o"
            cc -O2 -fPIC -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          ar rcs out/libfreetype-jdk8u504-host.a "$OBJ"/*.o
          cc -O2 -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c \
            out/libfreetype-jdk8u504-host.a -lm \
            -o out/p2b-freetype-jdk8-vendored-host
          out/p2b-freetype-jdk8-vendored-host out/font.ttf \
            | tee out/P2B-JDK8-VENDORED-FT-HOST.log
          grep -F 'P2B_FT_LIBRARY_VERSION=2.14.3' out/P2B-JDK8-VENDORED-FT-HOST.log
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py \
            out/P2B-JDK8-RASTER-FP.log out/P2B-JDK8-VENDORED-FT-HOST.log \
            | tee out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_WIDTH_EXACT=144' out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_BOUNDS_EXACT=144' out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_INK_EXACT=144' out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_FP_EXACT=144' out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_MISMATCH_COUNT=0' out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
          echo 'P2B_JDK8_VENDORED_FT_HOST_RECIPE_EQUIVALENCE=PASS' | tee out/P2B-JDK8-VENDORED-FT-HOST-STATUS.txt

      - name: Cross-build exact vendored FreeType source for Miyoo ARMv5 uClibc
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          OBJ=out/jdk8u-ft-arm-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$OBJ/${rel//\//_}.o"
            "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -fPIC -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          "$AR" rcs out/libfreetype-jdk8u504-arm.a "$OBJ"/*.o
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c \
            out/libfreetype-jdk8u504-arm.a -lm \
            -o out/p2b-freetype-jdk8-vendored-arm
          file out/p2b-freetype-jdk8-vendored-arm | tee out/P2B-JDK8-VENDORED-FT-ARM-FILE.txt
          echo 'P2B_JDK8_VENDORED_FT_ARM_BUILD=PASS'

      - name: Run ARM source-equivalent scaler differential
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" out/p2b-freetype-jdk8-vendored-arm out/font.ttf \
            | tee out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_LIBRARY_VERSION=2.14.3' out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_JDK8_INTERPRETER=35' out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_JDK8_AA=OFF' out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_JDK8_FM=OFF' out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_JDK8_DPI=72' out/P2B-JDK8-VENDORED-FT-ARM.log
          grep -F 'P2B_FT_JDK8_SCALER_CASES=144' out/P2B-JDK8-VENDORED-FT-ARM.log
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py \
            out/P2B-JDK8-RASTER-FP.log out/P2B-JDK8-VENDORED-FT-ARM.log \
            | tee out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_WIDTH_EXACT=144' out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_BOUNDS_EXACT=144' out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_DIFF_RESULT=PASS' out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
          mismatch=$(sed -n 's/^P2B_JDK8_FT_SCALER_MISMATCH_COUNT=//p' out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt)
          if test "$mismatch" = 0; then
            classification=EXACT_FOR_SAMPLED_TABLE
          else
            classification=ARCH_OR_BUILD_RESIDUAL_REQUIRES_CLASSIFICATION
          fi
          {
            echo "P2B_JDK8_VENDORED_FT_ARM_MISMATCH_COUNT=$mismatch"
            echo "P2B_JDK8_VENDORED_FT_ARM_CLASSIFICATION=$classification"
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-VENDORED-FT-ARM-STATUS.txt

      - name: Remove source-build binaries and font before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/font.ttf out/miyoomini-freej2me.zip \
            out/jdk8u-ft-host-obj out/jdk8u-ft-arm-obj \
            out/libfreetype-jdk8u504-host.a out/libfreetype-jdk8u504-arm.a \
            out/p2b-freetype-jdk8-vendored-host out/p2b-freetype-jdk8-vendored-arm \
            /tmp/jdk8u
          if find out -type f | grep -Ei '\.(ttf|otf|a|so)$'; then
            echo 'P2B_JDK8_VENDORED_FT_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_JDK8_VENDORED_FT_BYTE_LEAK=NO' | tee out/P2B-JDK8-VENDORED-FT-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-VENDORED-FT-ARM-${{ github.sha }}
          path: |
            out/P2B-JDK8U-VENDORED-FT-PROVENANCE.txt
            out/P2B-JDK8-VERSION.txt
            out/P2B-JDK8-RASTER-FP.log
            out/P2B-JDK8-VENDORED-FT-HOST.log
            out/P2B-JDK8-VENDORED-FT-HOST-DIFFERENTIAL.txt
            out/P2B-JDK8-VENDORED-FT-HOST-STATUS.txt
            out/P2B-JDK8-VENDORED-FT-ARM-FILE.txt
            out/P2B-JDK8-VENDORED-FT-ARM.log
            out/P2B-JDK8-VENDORED-FT-ARM-DIFFERENTIAL.txt
            out/P2B-JDK8-VENDORED-FT-ARM-STATUS.txt
            out/P2B-JDK8-VENDORED-FT-CLEANUP.txt
          if-no-files-found: warn
