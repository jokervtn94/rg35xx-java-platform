name: Verified Clean B4 Core Build

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-b4-build.yml'
      - 'scripts/b4_verified_core_assemble.sh'
      - 'scripts/b4_apply_early_native_log.py'
      - 'scripts/b3_verified_runtime_gate.sh'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
      - 'docs/checkpoints/B4-NATIVE-CORE.md'
  workflow_dispatch:

jobs:
  b4-core-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      JAMVM_L_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      B3_REFERENCE_JAR_SHA256: d83febe95e08ebd4bb7e03ffb76359d8ea119bcacffdc6ec0c0e285591695529
      B3_RUNTIME_CONTENT_SHA256: 52e809ecf5d23f4c2c0989075270680248299bbc02e7cb8ca665bee002942783
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant build-essential file unzip python3
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Assemble B4 from verified clean foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" B4_ASSEMBLY="$RUNNER_TEMP/b4" sh scripts/b4_verified_core_assemble.sh
          echo "B4=$RUNNER_TEMP/b4" >> "$GITHUB_ENV"
      - name: Build and lock B3 Java runtime content
        run: |
          set -euo pipefail
          cd "$B4" && ant
          B3_ASSEMBLY="$B4" B3_EVIDENCE="$RUNNER_TEMP/b3-evidence" sh "$GITHUB_WORKSPACE/scripts/b3_verified_runtime_gate.sh"
          JAR="$B4/build/freej2me_plus-lr.jar"
          FILE_SHA=$(sha256sum "$JAR" | awk '{print $1}')
          CONTENT_SHA=$(python3 - "$JAR" <<'PY'
          import hashlib, sys, zipfile
          jar=sys.argv[1]
          h=hashlib.sha256()
          with zipfile.ZipFile(jar) as z:
              for name in sorted(z.namelist()):
                  if name.endswith('/'):
                      continue
                  h.update(name.encode('utf-8'))
                  h.update(b'\0')
                  h.update(hashlib.sha256(z.read(name)).digest())
          print(h.hexdigest())
          PY
          )
          echo "B4 runtime file SHA=$FILE_SHA"
          echo "B4 runtime content SHA=$CONTENT_SHA"
          test "$CONTENT_SHA" = "$B3_RUNTIME_CONTENT_SHA256"
          echo "B4_RUNTIME_FILE_SHA256=$FILE_SHA" >> "$GITHUB_ENV"
      - name: Build B4 ARM core
        run: |
          set -euo pipefail
          cd "$B4/src/libretro"
          make clean
          make platform=unix \
            CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            LDFLAGS='-lm -lpthread'
      - name: Strict B4 core gate
        run: |
          set -euo pipefail
          CORE="$B4/src/libretro/freej2me_plus_libretro.so"
          readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          grep -q 'Version5 EABI' /tmp/elf.txt
          grep -q 'soft-float ABI' /tmp/elf.txt
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_present
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_start
          strings "$CORE" | grep -F '/mnt/mmc/CFW/java/bin/jamvm'
          strings "$CORE" | grep -F '/mnt/mmc/freej2me-java-error.log'
          strings "$CORE" | grep -F '/mnt/mmc/freej2me-vc3-early.log'
          for m in 'B4 CORE_INIT' 'B4 RUNTIME_PATH' 'B4 PIPE_CREATE' 'B4 FORK_RESULT' 'B4 CHILD_PRE_EXEC' 'B4 JAVA_READY' 'B4 LOAD_GAME_ENTER' 'B4 GAME_PATH' 'B4 IPC_LOAD_SENT' 'B4 IPC_RUN_SENT' 'B4 CORE_DEINIT'; do
            strings "$CORE" | grep -F "$m"
          done
          ! grep -R -Fq 'RG35XX-PNG-COMPAT' "$B4/src"
          ! grep -R -Fq 'rg35xxStripPngICCP' "$B4/src"
          ! grep -R -Fq 'RG35XX-CV:' "$B4/src"
      - name: Stage B4 checkpoint
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b4-checkpoint"
          mkdir -p "$OUT/BIOS" "$OUT/CFW/retroarch/.retroarch/cores" "$OUT/evidence" "$OUT/b3"
          cp "$B4/build/freej2me_plus-lr.jar" "$OUT/BIOS/freej2me-lr.jar"
          cp "$B4/src/libretro/freej2me_plus_libretro.so" "$OUT/CFW/retroarch/.retroarch/cores/freej2me_plus_libretro.so"
          cp "$B4/src/libretro/freej2me_libretro.c" "$OUT/evidence/freej2me_libretro-B4.c"
          cp "$B4/src/libretro/rg35xx/golden/rg35xx_golden_video.c" "$OUT/evidence/rg35xx_golden_video.c"
          cp -a "$RUNNER_TEMP/b3-evidence/." "$OUT/b3/"
          CORE_SHA=$(sha256sum "$OUT/CFW/retroarch/.retroarch/cores/freej2me_plus_libretro.so" | awk '{print $1}')
          printf '%s\n' \
            'RG35XX VERIFIED CLEAN B4 CORE CHECKPOINT' \
            'STATUS=BUILD-PASS-DEVICE-ACCEPTANCE-PENDING' \
            "FREEJ2ME_PIN=$FREEJ2ME_PIN" \
            "JAMVM_L_REQUIRED_SHA256=$JAMVM_L_SHA256" \
            "GLIBJ_REQUIRED_SHA256=$GLIBJ_SHA256" \
            "B3_REFERENCE_JAR_SHA256=$B3_REFERENCE_JAR_SHA256" \
            "B3_RUNTIME_CONTENT_SHA256=$B3_RUNTIME_CONTENT_SHA256" \
            "B4_RUNTIME_FILE_SHA256=$B4_RUNTIME_FILE_SHA256" \
            "B4_CORE_SHA256=$CORE_SHA" \
            'EARLY_NATIVE_LOG=/mnt/mmc/freej2me-vc3-early.log' \
            'PNG_COMPAT=NOT_ADMITTED' \
            'FONT_REWORK=NOT_ADMITTED' \
            'AUDIO_REWORK=NOT_ADMITTED' > "$OUT/STATUS.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-verified-clean-b4-checkpoint
          path: ${{ runner.temp }}/b4-checkpoint
          include-hidden-files: true
          retention-days: 30
