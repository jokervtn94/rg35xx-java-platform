name: P2A Image Decode Module Gate

on:
  push:
    branches:
      - module/p2a-image-decode-candidate
    paths:
      - '.github/workflows/p2a-image-decode-candidate.yml'
      - '.github/workflows/p2a-image-decode-module-gate.yml'
      - 'docs/RG35XX-PLATFORM-SOURCE-COVERAGE-MATRIX-v1.tsv'
      - 'packaging/p2a/**'
      - 'scripts/build-p2a-image-decode-candidate.sh'
      - 'scripts/build-p2a-image-decode-candidate-v2.sh'
      - 'scripts/build-p2a-image-decode-candidate-v3.sh'
      - 'scripts/build-p2a-image-exerciser.sh'
      - 'scripts/build-p2a-image-physical-package.sh'
      - 'scripts/stage-p2a-image-decode.py'
      - 'tests/p2a/RG35XXP2AImageDecodeDifferentialGate.java'
      - 'tests/p2a/exerciser/RG35XXP2AImageDecodeExerciser.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2a-image-decode-module:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact-parent candidate and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact ancestry and complete P2A module scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=7c0ae595fa05dd3c23157c241cc641e8d43411d5
          git merge-base --is-ancestor "$PARENT" HEAD
          [ "$(git merge-base "$PARENT" HEAD)" = "$PARENT" ]
          changed="$(git diff --name-only "$PARENT"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p2a-image-decode-candidate.yml\n.github/workflows/p2a-image-decode-module-gate.yml\ndocs/RG35XX-PLATFORM-SOURCE-COVERAGE-MATRIX-v1.tsv\npackaging/p2a/COLLECT-RG35XX-P2A-IMAGE-DECODE-EVIDENCE.ps1\npackaging/p2a/INSTALL-RG35XX-P2A-IMAGE-DECODE.ps1\npackaging/p2a/README-FIRST.txt\npackaging/p2a/RG35XX-P2A-IMAGE-DECODE.sh\nscripts/build-p2a-image-decode-candidate-v2.sh\nscripts/build-p2a-image-decode-candidate-v3.sh\nscripts/build-p2a-image-decode-candidate.sh\nscripts/build-p2a-image-exerciser.sh\nscripts/build-p2a-image-physical-package.sh\nscripts/stage-p2a-image-decode.py\ntests/p2a/RG35XXP2AImageDecodeDifferentialGate.java\ntests/p2a/exerciser/RG35XXP2AImageDecodeExerciser.java'
          [ "$changed" = "$expected" ] || { echo "P2A_MODULE_SCOPE_FAIL=$changed" >&2; exit 1; }
          ! git diff --name-only "$PARENT"..HEAD | grep -E '^(adapter/|native/|upstream/)'
          if git log --format=%H "$PARENT"..HEAD | grep -Eq '82d166c2ff2c5832c794c3064274dff67b4a32ae|f83507c7b48f4fdb90199d0c4784c516e4c88ac5'; then
            echo P2A_MODULE_FAIL=audit_branch_became_parent >&2
            exit 1
          fi
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P2A_MODULE_EXACT_PARENT=PASS
          echo P2A_MODULE_OWNER_SCOPE=PASS
          echo P2A_MODULE_AUDIT_BRANCH_PARENT=NO
          echo P2A_MODULE_A9_PARENT=NO

      - name: Gate committed P2A image-decode coverage classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          p='docs/RG35XX-PLATFORM-SOURCE-COVERAGE-MATRIX-v1.tsv'
          with open(p,encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f,delimiter='\t'))
          hit=[r for r in rows if r['AREA']=='Image' and r['CLASS_OR_METHOD']=='resource/InputStream/byte[] decode']
          if len(hit)!=1: raise SystemExit('P2A_COVERAGE_ROW_FAIL count=%d'%len(hit))
          r=hit[0]
          required={'CLASSIFICATION':'RG35XX_RAW_BACKING_HOST_ACCEPTED','NEXT_ACTION':'PROTECT_MODULE_TEST'}
          for k,v in required.items():
              if r[k]!=v: raise SystemExit('P2A_COVERAGE_ROW_FAIL %s=%r'%(k,r[k]))
          for needle in ('P2A','150/150','MODULE DEVICE PENDING'):
              if needle not in r['PHYSICAL_EVIDENCE']: raise SystemExit('P2A_COVERAGE_EVIDENCE_FAIL '+needle)
          if 'PNG' not in r['CURRENT_RG35XX'] or 'JPEG' in r['CURRENT_RG35XX']:
              raise SystemExit('P2A_COVERAGE_DECLARED_FORMAT_FAIL')
          print('P2A_COVERAGE_MATRIX_GATE=PASS')
          PY

      - name: Materialize A4 raw2D baseline once
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain once
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters once
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Rebuild exact protected A7 audio dependency for physical package
        shell: bash
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          set -euo pipefail
          rm -rf out/p2a-protected-audio; mkdir -p out/p2a-protected-audio
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" bash -lc '
            set -euo pipefail
            OUT=/work/out/p2a-protected-audio
            SRC=/work/adapter/native/rg35xx_audio_sdl1_mixer.c
            JNI=/work/upstream/freej2me-miyoomini/cpp/native/include
            CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
            STRIP=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip
            READELF=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-readelf
            "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -Wall -Wextra -I"$JNI" -I"$JNI/linux" "$SRC" -Wl,--as-needed -ldl -o "$OUT/libaudio.so"
            "$STRIP" "$OUT/libaudio.so"
            "$READELF" -h "$OUT/libaudio.so" > "$OUT/libaudio.so.elf.txt"
            "$READELF" -A "$OUT/libaudio.so" > "$OUT/libaudio.so.attr.txt" || true
            "$READELF" -Ws "$OUT/libaudio.so" > "$OUT/libaudio.so.symbols.txt"
            grep -q "Class:.*ELF32" "$OUT/libaudio.so.elf.txt"
            grep -q "Machine:.*ARM" "$OUT/libaudio.so.elf.txt"
            grep -q "Version5 EABI" "$OUT/libaudio.so.elf.txt"
            grep -q "soft-float ABI" "$OUT/libaudio.so.elf.txt"
            for sym in Java_org_recompile_mobile_SdlMixerManager_sdlMixerInit Java_org_recompile_mobile_SdlMixerManager_sdlMixerLoadMidi Java_org_recompile_mobile_SdlMixerManager_sdlMixerLoadWav Java_org_recompile_mobile_SdlMixerManager_sdlMixerPlayMusic Java_org_recompile_mobile_SdlMixerManager_sdlMixerPlayWav Java_org_recompile_mobile_SdlMixerManager_sdlMixerQuit; do grep -q "$sym" "$OUT/libaudio.so.symbols.txt"; done
            strings "$OUT/libaudio.so" | grep -q "/usr/lib/libSDL_mixer-1.2.so.0"
            strings "$OUT/libaudio.so" | grep -q "RG35XX_A7_AUDIO_INIT=PASS"
            ! strings "$OUT/libaudio.so" | grep -Eq "libSDL2|MidiSystem|getSequencer|AudioSystem|getClip|/dev/snd/seq"
            test "$(sha256sum "$OUT/libaudio.so" | awk "{print \$1}")" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
            echo P2A_PROTECTED_AUDIO_INNER_GATE=PASS
          '
          sudo chown -R "$(id -u):$(id -g)" out/p2a-protected-audio
          test "$(sha256sum out/p2a-protected-audio/libaudio.so | awk '{print $1}')" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
          echo P2A_PROTECTED_AUDIO_DEPENDENCY_GATE=PASS

      - name: Apply accepted A5 Core2D overlay once
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild and gate exact P2A host candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2a-image-decode-candidate.sh scripts/build-p2a-image-decode-candidate-v2.sh scripts/build-p2a-image-decode-candidate-v3.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2a-image-decode-candidate-v3.sh | tee /tmp/p2a-module-candidate.log
          grep -q '^P2A_IMAGE_BUILD=PASS$' /tmp/p2a-module-candidate.log
          grep -q '^P2A_IMAGE_HOST_MODULE_GATE=PASS$' /tmp/p2a-module-candidate.log
          ID=out/p2a-image-decode-candidate/P2A-IMAGE-DECODE-IDENTITY.txt
          grep -q '^LEGAL_MATRIX_CASES=150$' "$ID"
          grep -q '^P2A_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^P2A_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^P1A_PROTECTED_REGRESSIONS=PASS$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/rg35xx/RG35XXCore2D.class$' "$ID"
          grep -q '^PROTECTED_HASHES=PASS$' "$ID"
          grep -q '^JAVA6_GATE=PASS$' "$ID"
          grep -q '^HOST_MODULE_GATE=PASS$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          echo P2A_MODULE_CANDIDATE_HOST_GATE=PASS

      - name: Build the one P2A image-decode exerciser JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2a-image-exerciser.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2a-image-exerciser.sh | tee /tmp/p2a-exerciser.log
          grep -q '^P2A_EXERCISER_BUILD=PASS$' /tmp/p2a-exerciser.log
          EID=out/p2a-image-decode-candidate/P2A-IMAGE-EXERCISER-IDENTITY.txt
          grep -q '^PNG_FIXTURE_COUNT=150$' "$EID"
          grep -q '^EXPECTED_DECODE_COUNT=450$' "$EID"
          grep -q '^API_FRONTENDS=BYTE_ARRAY,INPUT_STREAM,RESOURCE_NAME$' "$EID"
          grep -q '^CANONICAL_EXPECTED_SOURCE=PINNED_JDK8_IMAGEIO$' "$EID"
          grep -q '^DIRECT_DECODER_CALL=NO$' "$EID"
          grep -q '^COMMERCIAL_GAME_CONTENT=NO$' "$EID"
          grep -q '^JAVA6_GATE=PASS$' "$EID"
          grep -q '^DEVICE-PASS=NO$' "$EID"
          echo P2A_MODULE_EXERCISER_GATE=PASS

      - name: Write module integration identity before physical-package gate
        shell: bash
        run: |
          set -euo pipefail
          OUT=out/p2a-image-decode-candidate
          CID="$OUT/P2A-IMAGE-DECODE-IDENTITY.txt"; EID="$OUT/P2A-IMAGE-EXERCISER-IDENTITY.txt"
          CAND_SHA="$(sha256sum "$OUT/freej2me-rg35xx.jar" | awk '{print $1}')"
          EX_SHA="$(sha256sum "$OUT/RG35XX-Platform-Exerciser-P2A-Image.jar" | awk '{print $1}')"
          [ "$CAND_SHA" = "$(sed -n 's/^CANDIDATE_PLATFORM_JAR_SHA256=//p' "$CID")" ]
          [ "$EX_SHA" = "$(sed -n 's/^EXERCISER_SHA256=//p' "$EID")" ]
          [ "$(sha256sum "$OUT/librg35xx_input.so" | awk '{print $1}')" = 69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d ]
          [ "$(sha256sum "$OUT/librg35xx_video.so" | awk '{print $1}')" = c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d ]
          [ "$(sha256sum out/p2a-protected-audio/libaudio.so | awk '{print $1}')" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644 ]
          cat > "$OUT/P2A-MODULE-INTEGRATION-IDENTITY.txt" <<EOF_ID
          PROJECT=RG35XX-AWEIGIT-R1
          MODULE=P2A_IMAGE_DECODE
          CANDIDATE_HEAD=$GITHUB_SHA
          EXACT_RUNTIME_PARENT=7c0ae595fa05dd3c23157c241cc641e8d43411d5
          CANONICAL_AWEIGIT=ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          HOST_MODULE_GATE=PASS
          COVERAGE_MATRIX_GATE=PASS
          HOST_DIFFERENTIAL_REGRESSIONS=PASS
          DECLARED_IMAGE_FORMAT=PNG
          PNG_FIXTURE_COUNT=150
          API_FRONTENDS=BYTE_ARRAY,INPUT_STREAM,RESOURCE_NAME
          EXPECTED_DEVICE_DECODES=450
          CANDIDATE_PLATFORM_JAR_SHA256=$CAND_SHA
          EXERCISER_SHA256=$EX_SHA
          INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d
          VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d
          PROTECTED_AUDIO_NATIVE_SHA256=4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
          AUDIO_CHANGE=NO
          JAMVM_GLIBJ_CHANGE=NO
          CANONICAL_GITLINK_MUTATED=NO
          AUDIT_BRANCH_PARENT=NO
          A9_PARENT=NO
          GAME_SPECIFIC_CODE=NO
          SPECULATIVE_OPTIMIZATION=NO
          TRACE_ONLY_FINAL_RESIDUE=NO
          PHYSICAL_TEST_PACKAGE_GATE=PENDING
          PHYSICAL_TEST_REQUIRED=YES_ORIGINAL_RG35XX
          PHYSICAL_ACCEPTANCE_SURFACE=ONE_P2A_IMAGE_DECODE_EXERCISER
          DEVICE-PASS=NO
          STABLE=NO
          EOF_ID
          sed -i 's/^          //' "$OUT/P2A-MODULE-INTEGRATION-IDENTITY.txt"
          echo P2A_MODULE_INTEGRATION_IDENTITY=PASS

      - name: Build one physical module package and lock evidence contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2a-image-physical-package.sh
          bash scripts/build-p2a-image-physical-package.sh | tee /tmp/p2a-physical-package.log
          grep -q '^P2A_A7_AUDIO_LOADER_DEPENDENCY=PROVEN_IN_CANDIDATE$' /tmp/p2a-physical-package.log
          grep -q '^P2A_PHYSICAL_PACKAGE_BUILD=PASS$' /tmp/p2a-physical-package.log
          PID=out/p2a-image-decode-candidate/P2A-PHYSICAL-PACKAGE-IDENTITY.txt
          grep -q '^PHYSICAL_PACKAGE_GATE=PASS$' "$PID"
          grep -q '^DEVICE_PASS=NO$' "$PID"
          grep -q '^STABLE=NO$' "$PID"
          echo P2A_MODULE_PHYSICAL_PACKAGE_GATE=PASS

      - name: Upload P2A module host evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2A-IMAGE-DECODE-MODULE-HOST-${{ github.sha }}
          path: out/p2a-image-decode-candidate/
          if-no-files-found: error

      - name: Upload the one original-RG35XX physical package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2A-IMAGE-DECODE-PHYSICAL-${{ github.sha }}
          path: out/p2a-image-decode-candidate/RG35XX-P2A-IMAGE-DECODE-PHYSICAL-R1.zip
          if-no-files-found: error
