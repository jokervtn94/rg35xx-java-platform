name: P2A Image Decode Candidate

on:
  push:
    branches:
      - module/p2a-image-decode-candidate
    paths:
      - '.github/workflows/p2a-image-decode-candidate.yml'
      - 'scripts/stage-p2a-image-decode.py'
      - 'scripts/build-p2a-image-decode-candidate.sh'
      - 'tests/p2a/RG35XXP2AImageDecodeDifferentialGate.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2a-image-host-module:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact-parent candidate branch and canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact ancestry and owner-scoped repository delta
        shell: bash
        run: |
          set -euo pipefail
          PARENT=7c0ae595fa05dd3c23157c241cc641e8d43411d5
          git merge-base --is-ancestor "$PARENT" HEAD
          [ "$(git merge-base "$PARENT" HEAD)" = "$PARENT" ]
          changed="$(git diff --name-only "$PARENT"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p2a-image-decode-candidate.yml\nscripts/build-p2a-image-decode-candidate.sh\nscripts/stage-p2a-image-decode.py\ntests/p2a/RG35XXP2AImageDecodeDifferentialGate.java'
          [ "$changed" = "$expected" ] || { echo "P2A_IMAGE_BRANCH_SCOPE_FAIL=$changed" >&2; exit 1; }
          ! git diff --name-only "$PARENT"..HEAD | grep -E '^(adapter/|native/|upstream/)'
          if git log --format=%H "$PARENT"..HEAD | grep -Eq '82d166c2ff2c5832c794c3064274dff67b4a32ae|f83507c7b48f4fdb90199d0c4784c516e4c88ac5'; then
            echo P2A_IMAGE_FAIL=audit_branch_became_parent >&2
            exit 1
          fi
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P2A_IMAGE_EXACT_GIT_PARENT=PASS
          echo P2A_IMAGE_AUDIT_BRANCH_PARENT=NO
          echo P2A_IMAGE_REPOSITORY_SCOPE=PASS

      - name: Materialize A4 raw2D baseline once
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain once
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters once
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay once
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build and gate P2A image decode candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2a-image-decode-candidate.sh scripts/stage-p2a-image-decode.py
          JAVA8="$JAVA_HOME" bash scripts/build-p2a-image-decode-candidate.sh | tee /tmp/p2a-image.log
          grep -q '^P2A_IMAGE_BUILD=PASS$' /tmp/p2a-image.log
          grep -q '^P2A_IMAGE_HOST_MODULE_GATE=PASS$' /tmp/p2a-image.log
          ID=out/p2a-image-decode-candidate/P2A-IMAGE-DECODE-IDENTITY.txt
          test -f "$ID"
          grep -q '^WORK_UNIT=P2A-IMAGE-DECODE-CANDIDATE$' "$ID"
          grep -q '^AUDIT_BRANCH_PARENT=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          grep -q '^LEGAL_MATRIX_CASES=150$' "$ID"
          grep -q '^P2A_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^P2A_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^P1A_PROTECTED_REGRESSIONS=PASS$' "$ID"
          grep -q '^CANONICAL_DIFF_VERIFIED=YES$' "$ID"
          grep -q '^OWNER_SCOPE_VERIFIED=YES$' "$ID"
          grep -q '^UNRELATED_CLASS_DIFF=NONE$' "$ID"
          grep -q '^PROTECTED_HASHES=PASS$' "$ID"
          grep -q '^JAVA6_GATE=PASS$' "$ID"
          grep -q '^HOST_MODULE_GATE=PASS$' "$ID"
          grep -q '^PHYSICAL_TEST_REQUIRED=YES$' "$ID"
          grep -q '^PHYSICAL_TEST_LEVEL=MODULE$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^SPECULATIVE_OPTIMIZATION=NO$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P2A_IMAGE_CI_GATE=PASS

      - name: Upload P2A host candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2A-IMAGE-DECODE-CANDIDATE-${{ github.sha }}
          path: out/p2a-image-decode-candidate/
          if-no-files-found: error
