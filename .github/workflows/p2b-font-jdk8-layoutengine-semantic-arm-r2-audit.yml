name: P2B Font JDK8 LayoutEngine ARM Semantic Audit R2

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text-layout-semantic-tmp
    paths:
      - '.github/workflows/p2b-font-jdk8-layoutengine-semantic-arm-r2-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkLayoutEngineSemanticReference.java'
      - 'tests/p2b/diagnostic/p2b_jdk8_layoutengine_semantic_arm.cpp'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_layoutengine_semantics.py'

permissions:
  contents: read

jobs:
  p2b-jdk8-layoutengine-semantic-arm-r2:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8_LAYOUT_TREE: bc6641fecdfb59f3146bb1591e090761a24b4061
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-layout-semantic-r2-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-layout-semantic-r2-files.txt | grep -q .; then
            echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          test -x "$CC"; test -x "$CXX"; test -x "$AR"
          "$CC" --version | head -n 1 | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-CC.txt
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_TOOLCHAIN=PASS'

      - name: Pin exact JDK8u504 LayoutEngine and FreeType sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)" = "$JDK8_LAYOUT_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          grep -F 'Freetype v2.14.3' /tmp/jdk8u/THIRD_PARTY_README
          {
            echo "P2B_JDK8U_COMMIT=$(git -C /tmp/jdk8u rev-parse HEAD)"
            echo "P2B_JDK8_LAYOUT_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)"
            echo "P2B_JDK8U_FT_SRC_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)"
            echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-PROVENANCE.txt

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_FONT_IDENTITY=PASS'

      - name: Generate exact JDK8 ScriptRun and GlyphVector reference
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-JAVA-VERSION.txt
          mkdir -p out/classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BJdkLayoutEngineSemanticReference.java
          java -Djava.awt.headless=true -cp out/classes \
            RG35XXP2BJdkLayoutEngineSemanticReference out/font.ttf out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.tsv \
            | tee out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log
          grep -F 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_CASES=192' out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log
          grep -F 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_RUNS=192' out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log
          grep -F 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_COMBINING_FLAG_RUNS=72' out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log
          grep -F 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_RESULT=PASS' out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log

      - name: Cross-build exact JDK8u504 vendored FreeType on ARMv5 uClibC
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          OBJ=out/jdk8u-ft-layout-semantic-r2-arm-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          count=0
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$OBJ/${rel//\//_}.o"
            "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -fPIC -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
            count=$((count+1))
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          test "$count" = 106
          "$AR" rcs out/libfreetype-jdk8u504-layout-semantic-r2-arm.a "$OBJ"/*.o
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_FREETYPE_ARM_BUILD=PASS'

      - name: Cross-build exact bundled LayoutEngine core and semantic probe
        shell: bash
        run: |
          set -euo pipefail
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          FONT=/tmp/jdk8u/jdk/src/share/native/sun/font
          LAYOUT="$FONT/layout"
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          OBJ=out/jdk8-layoutengine-semantic-r2-arm-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          compiled=0
          excluded=0
          while IFS= read -r src; do
            base=$(basename "$src")
            if test "$base" = SunLayoutEngine.cpp; then excluded=$((excluded+1)); continue; fi
            obj="$OBJ/${base%.cpp}.o"
            "$CXX" -O2 -pipe -std=gnu++98 \
              -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DLE_STANDALONE -DHEADLESS -I"$FONT" -I"$LAYOUT" \
              -c "$src" -o "$obj"
            compiled=$((compiled+1))
          done < <(find "$LAYOUT" -maxdepth 1 -type f -name '*.cpp' -print | sort)
          test "$compiled" = 87
          test "$excluded" = 1
          "$AR" rcs out/libjdk8-layoutengine-semantic-r2-arm.a "$OBJ"/*.o
          "$CXX" -O2 -pipe -std=gnu++98 \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -DLE_STANDALONE -DHEADLESS \
            -I"$FONT" -I"$LAYOUT" -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_jdk8_layoutengine_semantic_arm.cpp \
            -Wl,--whole-archive out/libjdk8-layoutengine-semantic-r2-arm.a -Wl,--no-whole-archive \
            out/libfreetype-jdk8u504-layout-semantic-r2-arm.a -lm \
            -o out/p2b-jdk8-layoutengine-semantic-r2-arm
          file out/p2b-jdk8-layoutengine-semantic-r2-arm | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-ARM-FILE.txt
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_ARM_BUILD=PASS'

      - name: Run ARM LayoutEngine semantic differential
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" out/p2b-jdk8-layoutengine-semantic-r2-arm \
            out/font.ttf out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.tsv out/P2B-ARM-LAYOUTENGINE-R2.tsv \
            | tee out/P2B-ARM-LAYOUTENGINE-R2.log
          grep -F 'P2B_ARM_LAYOUTENGINE_SEMANTIC_CASES=192' out/P2B-ARM-LAYOUTENGINE-R2.log
          grep -F 'P2B_ARM_LAYOUTENGINE_SEMANTIC_RUNS=192' out/P2B-ARM-LAYOUTENGINE-R2.log
          grep -F 'P2B_ARM_LAYOUTENGINE_SEMANTIC_RESULT=PASS' out/P2B-ARM-LAYOUTENGINE-R2.log
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_layoutengine_semantics.py \
            out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.tsv out/P2B-ARM-LAYOUTENGINE-R2.tsv \
            | tee out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
          grep -F 'P2B_LAYOUTENGINE_SEMANTIC_PARSE=PASS' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
          grep -F 'P2B_LAYOUTENGINE_SEMANTIC_CASES=192' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
          grep -F 'P2B_LAYOUTENGINE_SEMANTIC_DIFF_RESULT=PASS' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
          classification=$(sed -n 's/^P2B_LAYOUTENGINE_SEMANTIC_CLASSIFICATION=//p' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt)
          mismatch=$(sed -n 's/^P2B_LAYOUTENGINE_SEMANTIC_MISMATCH_COUNT=//p' out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt)
          {
            echo "P2B_JDK8_LAYOUTENGINE_ARM_R2_CLASSIFICATION=$classification"
            echo "P2B_JDK8_LAYOUTENGINE_ARM_R2_MISMATCH_COUNT=$mismatch"
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-STATUS.txt

      - name: Remove source-build binaries and font before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u out/classes out/jdk8u-ft-layout-semantic-r2-arm-obj out/jdk8-layoutengine-semantic-r2-arm-obj
          rm -f out/font.ttf out/miyoomini-freej2me.zip
          rm -f out/libfreetype-jdk8u504-layout-semantic-r2-arm.a out/libjdk8-layoutengine-semantic-r2-arm.a
          rm -f out/p2b-jdk8-layoutengine-semantic-r2-arm
          if find out -type f | grep -Ei '\.(ttf|otf|a|o|so)$'; then echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_BYTE_LEAK=FAIL'; exit 1; fi
          echo 'P2B_JDK8_LAYOUTENGINE_SEMANTIC_R2_BYTE_LEAK=NO' | tee out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-${{ github.sha }}
          path: |
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-CC.txt
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-PROVENANCE.txt
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-JAVA-VERSION.txt
            out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.log
            out/P2B-JDK8-LAYOUTENGINE-R2-REFERENCE.tsv
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-ARM-FILE.txt
            out/P2B-ARM-LAYOUTENGINE-R2.log
            out/P2B-ARM-LAYOUTENGINE-R2.tsv
            out/P2B-JDK8-ARM-LAYOUTENGINE-R2-DIFFERENTIAL.txt
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-STATUS.txt
            out/P2B-JDK8-LAYOUTENGINE-SEMANTIC-R2-CLEANUP.txt
          if-no-files-found: warn
