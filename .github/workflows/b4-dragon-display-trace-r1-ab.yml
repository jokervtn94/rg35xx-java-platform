name: B4 Dragon Display Trace R1 A-B

on:
  workflow_dispatch:
  push:
    branches: [b4-dragon-display-trace-r1-ab]
    paths:
      - '.github/workflows/b4-dragon-display-trace-r1-ab.yml'
      - 'scripts/b4_apply_nomask_green_tint_fix.py'
      - 'scripts/b4_apply_nomask_hard_bypass.py'
      - 'scripts/b4_apply_hotpath_r2_cleanup.py'
      - 'scripts/b4_apply_dragon_media_trace_r1.py'
      - 'scripts/vc7r22r13e_apply_midlet_event_trace.py'
      - 'scripts/vc7r22r13f_apply_setcurrent_trace.py'
      - 'scripts/vc7r22r13h_apply_service_repaints_trace.py'
      - 'release/b4-dragon-display-trace-r1/**'
      - 'tasklog/B4-DRAGON-DISPLAY-TRACE-R1-AB.md'

jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      B4_CORE_SHA256: 56bb3b972337dd40b342c1881f6599c53eebf66a29f920a1aa2e2839eb29a07c
      OLD_RUNTIME_SHA256: 0c2f8658e7786cd3f97285c94c609623464cb8f04311b359bfd0a95a7109f11e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 unzip >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Assemble exact B4 source foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" B4_ASSEMBLY="$RUNNER_TEMP/b4displaytrace" sh scripts/b4_verified_core_assemble.sh
          echo "B4=$RUNNER_TEMP/b4displaytrace" >> "$GITHUB_ENV"

      - name: Reproduce admitted B4 runtime source
        run: |
          set -euo pipefail
          python3 scripts/b4_apply_nomask_green_tint_fix.py "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/b4_apply_nomask_hard_bypass.py "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/b4_apply_hotpath_r2_cleanup.py "$B4/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          python3 scripts/b4_apply_dragon_media_trace_r1.py             "$B4/src/javax/microedition/media/Manager.java"             "$B4/src/org/recompile/mobile/PlatformPlayer.java"

          grep -Fq 'fastBlit = !Mobile.funLightsEnabled;' "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq 'RG35XX-B4-HOTPATH-R2-CLEAN' "$B4/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          grep -Fq 'RG35XX-B4-MEDIA-TRACE' "$B4/src/org/recompile/mobile/PlatformPlayer.java"
          grep -Fq 'RG35XX-MEDIA-BOOT: eager prepare SKIPPED; lazy media enabled' "$B4/src/org/recompile/mobile/MobilePlatform.java"
          echo B4_CURRENT_SOURCE_REPRODUCTION=PASS

      - name: Apply bounded Display Canvas game-loop trace only
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r13e_apply_midlet_event_trace.py             "$B4/src/org/recompile/freej2me/Libretro.java"             "$B4/src/org/recompile/mobile/MobilePlatform.java"             "$B4/src/javax/microedition/lcdui/Display.java"

          python3 scripts/vc7r22r13f_apply_setcurrent_trace.py             "$B4/src/javax/microedition/lcdui/Display.java"

          python3 scripts/vc7r22r13h_apply_service_repaints_trace.py             "$B4/src/javax/microedition/lcdui/Canvas.java"

          grep -Fq 'RG35XX-R13E-EVENT' "$B4/src/javax/microedition/lcdui/Display.java"
          grep -Fq 'SC_SHOW_BEGIN' "$B4/src/javax/microedition/lcdui/Display.java"
          grep -Fq 'SC_FLUSH_BEGIN' "$B4/src/javax/microedition/lcdui/Display.java"
          grep -Fq 'RG35XX-R13H-LOOP' "$B4/src/javax/microedition/lcdui/Canvas.java"
          grep -Fq 'PAINT_CALLBACK_BEGIN' "$B4/src/javax/microedition/lcdui/Canvas.java"
          grep -Fq 'SERVICE_WAIT_BEGIN' "$B4/src/javax/microedition/lcdui/Canvas.java"

          # Scope gates: trace-only; preserve media/RMS/core behavior.
          grep -Fq 'RG35XX-B4-MEDIA-TRACE' "$B4/src/org/recompile/mobile/PlatformPlayer.java"
          ! grep -R -Fq 'RG35XX-R13J-RMS' "$B4/src"
          ! grep -R -Fq 'RG35XX-VC7R22R1-WORKER-RING' "$B4/src"
          echo B4_DRAGON_DISPLAY_TRACE_R1_SCOPE_GATE=PASS

      - name: Build Java 6-compatible runtime
        run: |
          set -euo pipefail
          cd "$B4"
          ant
          JAR="$B4/build/freej2me_plus-lr.jar"
          test -f "$JAR"

          python3 - "$B4/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for root,_,files in os.walk(sys.argv[1]):
            for name in files:
              if not name.endswith('.class'):
                continue
              n += 1
              p=os.path.join(root,name)
              h=open(p,'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50:
                raise SystemExit('Java major gate failed: '+p)
          print('B4_DRAGON_DISPLAY_TRACE_R1_CLASS_COUNT=%d'%n)
          PY

          echo "NEW_RUNTIME_SHA256=$(sha256sum "$JAR" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Bytecode marker gate
        run: |
          set -euo pipefail
          JAR="$B4/build/freej2me_plus-lr.jar"
          python3 - "$JAR" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              blobs=b'|'.join(
                  z.read(n) for n in z.namelist()
                  if n in (
                    'javax/microedition/lcdui/Display.class',
                    'javax/microedition/lcdui/Canvas.class',
                    'org/recompile/mobile/MobilePlatform.class',
                    'org/recompile/freej2me/Libretro.class'
                  )
                  or n.startswith('javax/microedition/lcdui/Display' + chr(36))
                  or n.startswith('javax/microedition/lcdui/Canvas' + chr(36))
                  or n.startswith('org/recompile/mobile/MobilePlatform' + chr(36))
                  or n.startswith('org/recompile/freej2me/Libretro' + chr(36))
              )
          required=[
              b'RG35XX-R13E-EVENT',
              b'SETCURRENT_REQUEST',
              b'SC_SHOW_BEGIN',
              b'SC_FLUSH_BEGIN',
              b'RG35XX-R13H-LOOP',
              b'REPAINT_REQUEST_BEGIN',
              b'PAINT_CALLBACK_BEGIN',
              b'PAINT_CALLBACK_DONE',
              b'SERVICE_LOCK_BEGIN',
              b'SERVICE_WAIT_BEGIN',
              b'LR_RX_DOWN',
              b'MP_DELIVER_DOWN_BEGIN'
          ]
          for tok in required:
              if tok not in blobs:
                  raise SystemExit('missing display trace bytecode marker '+repr(tok))
          print('B4_DRAGON_DISPLAY_TRACE_R1_BYTECODE_GATE=PASS')
          PY

      - name: Package runtime-only fail-closed installer
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg"
          mkdir -p "$ROOT/payload"
          cp "$B4/build/freej2me_plus-lr.jar" "$ROOT/payload/freej2me-lr.jar"
          cp release/b4-dragon-display-trace-r1/* "$ROOT/"

          sed -i "s/__NEW_RUNTIME_SHA256__/$NEW_RUNTIME_SHA256/g" "$ROOT/INSTALL-B4-DRAGON-DISPLAY-TRACE-R1.ps1"
          ! grep -R -Fq '__NEW_RUNTIME_SHA256__' "$ROOT"

          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/INSTALL-B4-DRAGON-DISPLAY-TRACE-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/RESTORE-B4-DRAGON-DISPLAY-TRACE-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/COLLECT-B4-DRAGON-DISPLAY-TRACE-R1.ps1')) | Out-Null"

          cat > "$ROOT/README-FIRST.txt" <<EOF
          B4-DRAGON-DISPLAY-TRACE-R1-AB

          1. Run INSTALL-B4-DRAGON-DISPLAY-TRACE-R1.cmd
          2. Boot RG35XX
          3. Run ONLY dragon-mania-s40v6
          4. At Gameloft logo, wait 20-30 seconds
          5. Press one normal action key once, wait about 5 seconds
          6. Exit normally if possible
          7. Do NOT launch another Java game
          8. Run COLLECT-B4-DRAGON-DISPLAY-TRACE-R1.cmd
          9. Send B4-DRAGON-DISPLAY-TRACE-R1-EVIDENCE-*.zip

          Screenshot is not a pass criterion.
          This checkpoint changes observability only.
          STABLE=NO.
          EOF

          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=B4-DRAGON-DISPLAY-TRACE-R1-AB
          PRIMARY_VARIABLE=BOUNDED_DISPLAY_CANVAS_GAME_LOOP_OBSERVABILITY_ONLY
          SOURCE_COMMIT=$GITHUB_SHA
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          OLD_RUNTIME_SHA256=$OLD_RUNTIME_SHA256
          NEW_RUNTIME_SHA256=$NEW_RUNTIME_SHA256
          REQUIRED_CORE_SHA256=$B4_CORE_SHA256
          CORE_PACKAGED=NO
          MEDIA_BEHAVIOR_CHANGE=NONE
          RMS_BEHAVIOR_CHANGE=NONE
          DISPLAY_CANVAS_BEHAVIOR_CHANGE=NONE
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TRACE_PENDING
          STABLE=NO
          EOF

          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          echo B4_DRAGON_DISPLAY_TRACE_R1_RUNTIME_SHA256=$NEW_RUNTIME_SHA256
          echo B4_DRAGON_DISPLAY_TRACE_R1_CORE_SHA256=$B4_CORE_SHA256
          echo B4_DRAGON_DISPLAY_TRACE_R1_BUILD_GATE=PASS
          echo DEVICE_PASS=NO_DEVICE_TRACE_PENDING
          echo STABLE=NO

      - uses: actions/upload-artifact@v4
        with:
          name: b4-dragon-display-trace-r1-ab
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
