name: R2C Audio R1 AB

on:
  workflow_dispatch:
  push:
    branches: [rg35xx-clean-consolidated-r2]
    paths:
      - '.github/workflows/r2c-audio-r1-ab.yml'
      - 'tasklog/R2C-AUDIO-R1-AB.md'
      - 'release/r2c-audio-r1-ab/**'
      - 'scripts/rg35xx_clean_consolidated_r2a_assemble.sh'
      - 'scripts/r2_apply_headless_image_normalize.py'
      - 'scripts/r2d_apply_metric_bitmap_font.py'
      - 'scripts/vc7r_reconstruct_font.py'
      - 'scripts/vc7r3_apply_native_audio.py'
      - 'scripts/vc7r3_apply_java_media_events.py'
      - 'scripts/vc7r22r1_apply_worker_ring.py'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      R2C_BASE_SHA256: 0f38d6181201b3c5128b421e8d0ee747b69911c928a728fd9b3207e39e067e34
      FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install dependencies and pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils >/dev/null
          docker pull "$TOOLCHAIN_IMAGE" >/dev/null
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
          echo TOOLCHAIN_GATE=PASS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Assemble exact R2A source foundation
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" R2A_ASSEMBLY="$RUNNER_TEMP/r2c-audio" sh scripts/rg35xx_clean_consolidated_r2a_assemble.sh
          echo "OUT=$RUNNER_TEMP/r2c-audio" >> "$GITHUB_ENV"
          grep -Fq 'RG35XX-R2A-IMAGE-NORMALIZE' "$RUNNER_TEMP/r2c-audio/src/org/recompile/mobile/PlatformImage.java"
          echo R2A_SOURCE_GATE=PASS

      - name: Reproduce exact R2C font source contract
        run: |
          set -euo pipefail
          P="$OUT/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/r2d_apply_metric_bitmap_font.py "$P"
          grep -Fq 'RG35XX-R2D-METRIC-BITMAP-FONT' "$P"
          grep -Fq 'rg35xxR2DDrawMetricText(str, x, y - ascent);' "$P"
          ! grep -Fq 'gc.drawString(str, x, y);' "$P"
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN"|awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK"|awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$OUT/resources/org/recompile/mobile" "$RUNNER_TEMP/font"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$OUT/resources/org/recompile/mobile/rg35xx-font.bin" --manifest "$RUNNER_TEMP/font/manifest.json"
          test "$(stat -c%s "$OUT/resources/org/recompile/mobile/rg35xx-font.bin")" = 727008
          test "$(sha256sum "$OUT/resources/org/recompile/mobile/rg35xx-font.bin"|awk '{print $1}')" = "$FONT_SHA256"
          grep -Fq '"status": "RECONSTRUCTED-NOT-GOLDEN"' "$RUNNER_TEMP/font/manifest.json"
          echo R2C_FONT_CONTRACT_GATE=PASS

      - name: Materialize pinned historical native media implementation
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$OUT/src/org/recompile/mobile" "$OUT/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do cp "history/src/org/recompile/mobile/$f" "$OUT/src/org/recompile/mobile/$f"; done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$OUT/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$OUT/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$OUT/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"
          echo MEDIA_SOURCE_MATERIALIZATION=PASS

      - name: Add R2B audio ownership only
        run: |
          set -euo pipefail
          python3 - "$OUT/src/org/recompile/mobile/PlatformPlayer.java" "$OUT/src/javax/microedition/media/Manager.java" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do patch -d "$OUT" -p1 --batch --forward --fuzz=0 < "history/patches/$p"; done
          python3 scripts/vc7r3_apply_native_audio.py "$OUT/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$OUT/src/org/recompile/freej2me/Libretro.java" "$OUT/src/org/recompile/mobile/PlatformPlayer.java" "$OUT/src/javax/microedition/media/Manager.java"
          python3 scripts/vc7r22r1_apply_worker_ring.py "$OUT/src/libretro/freej2me_libretro.c"
          C="$OUT/src/libretro/freej2me_libretro.c"
          grep -Fq 'RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq 'RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq 'RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          grep -Fq 'RETRO_ENVIRONMENT_SET_AUDIO_CALLBACK' "$C"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          echo AUDIO_DELTA_GATE=PASS

      - name: Wire native audio sources
        run: |
          set -euo pipefail
          cat >> "$OUT/src/libretro/Makefile.common" <<'EOF'

          # R2C-AUDIO-R1-AB: audio-only delta on R2C font baseline.
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Build and gate combined Java runtime
        run: |
          set -euo pipefail
          cd "$OUT"
          ant
          JAR="$OUT/build/freej2me_plus-lr.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -Fx 'org/recompile/mobile/rg35xx-font.bin'
          python3 - "$OUT/build/classes" "$JAR" <<'PY'
          import os,struct,sys,zipfile
          cls,jar=sys.argv[1:]
          bad=[];n=0
          for base,_,files in os.walk(cls):
              for fn in files:
                  if not fn.endswith('.class'): continue
                  n+=1
                  p=os.path.join(base,fn)
                  b=open(p,'rb').read(8)
                  if len(b)!=8 or b[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',b[6:8])[0]!=50:
                      bad.append(p)
          if bad: raise SystemExit('JAVA_MAJOR_FAIL '+repr(bad[:10]))
          with zipfile.ZipFile(jar) as z:
              pg=z.read('org/recompile/mobile/PlatformGraphics.class')
              pp=z.read('org/recompile/mobile/PlatformPlayer.class')
              if b'RG35XX-R2D-FONT: ready bytes=' not in pg: raise SystemExit('R2C font bytecode marker missing')
              if b'rg35xxR2DDrawMetricText' not in pg: raise SystemExit('R2C font method missing')
              if b'RG35XXNativePlayer' not in pp: raise SystemExit('R2B native player route missing')
          print('JAVA_CLASS_COUNT=%d'%n)
          print('JAVA_MAJOR_50_GATE=PASS')
          print('R2C_FONT_BYTECODE_GATE=PASS')
          print('R2B_AUDIO_JAVA_ROUTE_GATE=PASS')
          PY
          echo "NEW_RUNTIME_SHA=$(sha256sum "$JAR"|awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build and gate native core
        run: |
          set -euo pipefail
          cd "$OUT/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          CORE="$OUT/src/libretro/freej2me_plus_libretro.so"
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          grep -q 'Version5 EABI' /tmp/elf.txt
          grep -q 'soft-float ABI' /tmp/elf.txt
          C="$OUT/src/libretro/freej2me_libretro.c"
          grep -Fq 'RETRO_PIXEL_FORMAT_RGB565' "$C"
          grep -Fq 'rg35xx_golden_video_present(' "$C"
          grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          echo "NEW_CORE_SHA=$(sha256sum "$CORE"|awk '{print $1}')" >> "$GITHUB_ENV"
          echo NATIVE_CORE_GATE=PASS

      - name: Validate Windows scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('release/r2c-audio-r1-ab/PRECHECK-R2C-AUDIO-R1-AB.ps1','release/r2c-audio-r1-ab/INSTALL-R2C-AUDIO-R1-AB.ps1','release/r2c-audio-r1-ab/RESTORE-R2C-AUDIO-R1-AB.ps1','release/r2c-audio-r1-ab/COLLECT-R2C-AUDIO-R1-AB.ps1')){
            [scriptblock]::Create((Get-Content -Raw $p))|Out-Null
            Write-Host "PARSE_PASS=$p"
          }
          $o=& 'release/r2c-audio-r1-ab/COLLECT-R2C-AUDIO-R1-AB.ps1' -SelfTest 2>&1
          if(-not (($o|Out-String).Contains('SELFTEST_COUNT=PASS'))){throw 'collector selftest fail'}
          Write-Host WINDOWS_TOOL_GATE=PASS

      - name: Package fail-closed device kit
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg";mkdir -p "$ROOT/payload"
          cp "$OUT/build/freej2me_plus-lr.jar" "$ROOT/payload/freej2me-lr.jar"
          cp "$OUT/src/libretro/freej2me_plus_libretro.so" "$ROOT/payload/freej2me_plus_libretro.so"
          cp release/r2c-audio-r1-ab/* "$ROOT/"
          cp tasklog/R2C-AUDIO-R1-AB.md "$ROOT/"
          sed -i "s/__R2C_AUDIO_R1_RUNTIME_SHA256__/$NEW_RUNTIME_SHA/g" "$ROOT/INSTALL-R2C-AUDIO-R1-AB.ps1"
          sed -i "s/__R2C_AUDIO_R1_CORE_SHA256__/$NEW_CORE_SHA/g" "$ROOT/INSTALL-R2C-AUDIO-R1-AB.ps1"
          ! grep -R -Fq '__R2C_AUDIO_R1_' "$ROOT"
          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=R2C-AUDIO-R1-AB
          PRIMARY_VARIABLE=AUDIO_OWNERSHIP_ONLY
          BASE_RUNTIME_SHA256=$R2C_BASE_SHA256
          RUNTIME_SHA256=$NEW_RUNTIME_SHA
          CORE_SHA256=$NEW_CORE_SHA
          FONT_RESOURCE_SHA256=$FONT_SHA256
          FONT_STATUS=R2C_RECONSTRUCTED_NOT_GOLDEN
          AUDIO_OWNER=DEDICATED_FD_WORKER_RING_ASYNC_CALLBACK
          RING_FRAMES=16384
          PRIME_FRAMES=3072
          WORKER_CHUNK=1470
          RETRO_RUN_AUDIO_PUMP=ABSENT
          TRANSPARENCY_CHANGE=NONE
          VIDEO_CHANGE=NONE
          CANVAS_CHANGE=NONE
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TEST_PENDING
          STABLE=NO
          EOF
          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)
          echo "RUNTIME_SHA256=$NEW_RUNTIME_SHA"
          echo "CORE_SHA256=$NEW_CORE_SHA"
          echo BUILD_PASS=YES

      - uses: actions/upload-artifact@v4
        with:
          name: r2c-audio-r1-ab
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
