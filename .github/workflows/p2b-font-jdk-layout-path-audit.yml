name: P2B Font JDK8 Layout Path Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk-layout-path-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkLayoutPathDiagnostic.java'

permissions:
  contents: read

jobs:
  p2b-jdk-layout-path:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk-layout-files.txt
          if grep -Ev '^(docs/P2B-FONT-TEXT-AUDIT-v1\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk-layout-files.txt | grep -q .; then
            echo 'P2B_JDK_LAYOUT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK_LAYOUT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Materialize exact Miyoo MiSans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK_LAYOUT_FONT_IDENTITY=PASS'

      - name: Run exact JDK8 layout path diagnostic
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes tests/p2b/diagnostic/RG35XXP2BJdkLayoutPathDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BJdkLayoutPathDiagnostic out/font.ttf | tee out/P2B-JDK8-LAYOUT-PATH.log
          grep -F 'P2B_JDK_LAYOUT_PATH_CASES=42' out/P2B-JDK8-LAYOUT-PATH.log
          grep -F 'P2B_JDK_LAYOUT_PATH_RESULT=PASS' out/P2B-JDK8-LAYOUT-PATH.log
          java -version 2>&1 | tee out/JAVA-VERSION.txt

      - name: Record audit-only status
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/font.ttf out/miyoomini-freej2me.zip
          if find out -type f | grep -Ei '\.(ttf|otf)$'; then echo 'P2B_FONT_BYTE_LEAK=FAIL'; exit 1; fi
          {
            echo 'P2B_JDK_LAYOUT_PATH_AUDIT=PASS'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK-LAYOUT-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-JDK-LAYOUT-PATH-${{ github.sha }}
          path: |
            out/P2B-JDK8-LAYOUT-PATH.log
            out/P2B-JDK-LAYOUT-STATUS.txt
            out/JAVA-VERSION.txt
          if-no-files-found: error
