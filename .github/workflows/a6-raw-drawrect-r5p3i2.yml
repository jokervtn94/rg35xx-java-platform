name: A6 RG35XX R5P3I2 Raw DrawRect

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a6-real-game-regression
    paths:
      - '.github/workflows/a6-raw-drawrect-r5p3i2.yml'
      - 'scripts/stage-a6-rg35xx-raw-drawrect-r5p3i2.py'
      - 'scripts/build-a6-raw-drawrect-r5p3i2.sh'
      - 'tests/a6/RG35XXRawDrawRectHostGate.java'
      - 'scripts/stage-a6-rg35xx-input-lifecycle-r5p3i1.py'
      - 'scripts/build-a6-input-lifecycle-r5p3i1-v2.sh'
      - 'scripts/stage-a6-rg35xx-raw-rect-polygon-r5p3.py'
      - 'scripts/build-a6-raw-rect-polygon-r5p3.sh'
      - 'scripts/stage-a6-rg35xx-raw-drawline-r5.py'
      - 'scripts/build-a6-raw-drawline-r5.sh'
      - 'scripts/build-a6-parent-trace-r4t.sh'
      - 'scripts/stage-a6-rg35xx-parent-trace-r4t.py'
      - 'scripts/build-a6-classloader-fix.sh'
      - 'scripts/stage-a6-rg35xx-classloader-race.py'
      - 'scripts/stage-a6-rg35xx-drawregion-null-guard.py'
      - 'scripts/stage-a6-rg35xx-adam7.py'
      - 'scripts/build-a5-core2d-java.sh'
      - 'scripts/stage-a5-rg35xx-core2d-v2.py'
      - 'scripts/build-a4-raw2d-java.sh'
      - 'scripts/build-a3.sh'
      - 'adapter/**'

permissions:
  contents: read

jobs:
  a6-realgame-r5p3i2:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout A6 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Build unchanged RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build R5P3I1 plus raw drawRect fix
        run: bash ./scripts/build-a6-raw-drawrect-r5p3i2.sh

      - name: Finalize protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Verify R5P3I2 scope and protected locks
        run: |
          set -euo pipefail
          ID=out/a6-realgame-r5p3i2/A6-REALGAME-R5P3I2-IDENTITY.txt
          grep -q '^A6_R5P3I1_DEVICE_RESULT=FAIL_HARD_RESET_OPENING_STORY_DRAWRECT_NPE$' "$ID"
          grep -q '^A6_R5P3I2_SCOPE_GATE=PASS$' "$ID"
          grep -q '^A6_R5P3I2_DRAWRECT_BYTECODE_GATE=PASS$' "$ID"
          grep -q '^A6_R5P3I2_RAW_DRAWRECT_HOST_GATE=PASS$' "$ID"
          grep -q '^A6_R5_DRAWLINE_REGRESSION_GATE=PASS$' "$ID"
          grep -q '^A6_R5P3_POLYGON_REGRESSION_GATE=PASS$' "$ID"
          grep -q '^A6_R4_ADAM7_REGRESSION_GATE=PASS$' "$ID"
          grep -q '^A6_R5P3I1_INPUT_LIFECYCLE=PRESERVED$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          test "$(sha256sum out/a3/librg35xx_input.so | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum out/a3/librg35xx_video.so | awk '{print $1}')" = '9094819d7c81576b63bd0cde9531404a3fb82b8d5b845dbae152152f2e1a2a7a'
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a6-realgame-r5p3i2/CANONICAL-DIFF-MANIFEST.txt
          cp out/a3/BUILD-IDENTITY.txt out/a6-realgame-r5p3i2/A6-PLATFORM-BUILD-IDENTITY.txt
          cp out/a3/librg35xx_input.so out/a6-realgame-r5p3i2/librg35xx_input.so
          cp out/a3/librg35xx_video.so out/a6-realgame-r5p3i2/librg35xx_video.so
          (cd out/a6-realgame-r5p3i2 && sha256sum * > A6-ARTIFACT-SHA256SUMS.txt)
          echo A6_R5P3I2_SCOPE_LOCK=PASS

      - name: Upload A6 R5P3I2 platform
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A6-REALGAME-R5P3I2-${{ github.sha }}
          path: out/a6-realgame-r5p3i2/
          if-no-files-found: error
