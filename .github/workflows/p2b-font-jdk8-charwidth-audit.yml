name: P2B Font OpenJDK8 charWidth Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-charwidth-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BCharWidthExhaustiveDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_charwidth_tables.py'

permissions:
  contents: read

jobs:
  p2b-jdk8-charwidth:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk8-cw-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk8-cw-files.txt | grep -q .; then
            echo 'P2B_JDK8_CHARWIDTH_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_CHARWIDTH_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install exact pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          test -f "$SYSROOT/usr/lib/libfreetype.so.6.18.1"
          test "$(sha256sum "$SYSROOT/usr/lib/libfreetype.so.6.18.1" | awk '{print $1}')" = dc4fe5572e1c9dbd913e70584c7c42e9e7ff6e2e573f637009b309bad6295afa
          echo 'P2B_JDK8_CHARWIDTH_TOOLCHAIN=PASS'

      - name: Materialize exact Miyoo font for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_CHARWIDTH_FONT_IDENTITY=PASS'

      - name: Generate JDK8 exhaustive reference
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes tests/p2b/diagnostic/RG35XXP2BCharWidthExhaustiveDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BCharWidthExhaustiveDiagnostic out/font.ttf out/P2B-JDK8-CHARWIDTH.bin \
            | tee out/P2B-JDK8-CHARWIDTH.log
          grep -F 'P2B_JDK_CHARWIDTH_TABLE_CASES=196608' out/P2B-JDK8-CHARWIDTH.log
          grep -F 'P2B_JDK_CHARWIDTH_RESULT=PASS' out/P2B-JDK8-CHARWIDTH.log

      - name: Generate source-matched ARM FreeType table
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$SYSROOT/usr/include/freetype2" tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c \
            "$SYSROOT/usr/lib/libfreetype.so.6.18.1" -lm -o out/p2b-freetype-jdk8-charwidth-arm
          qemu-arm -L "$SYSROOT" out/p2b-freetype-jdk8-charwidth-arm out/font.ttf out/P2B-FT-JDK8-CHARWIDTH.bin \
            | tee out/P2B-FT-JDK8-CHARWIDTH.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_INTERPRETER=35' out/P2B-FT-JDK8-CHARWIDTH.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_TABLE_CASES=196608' out/P2B-FT-JDK8-CHARWIDTH.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_RESULT=PASS' out/P2B-FT-JDK8-CHARWIDTH.log

      - name: Compare exhaustive tables
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_charwidth_tables.py \
            out/P2B-JDK8-CHARWIDTH.bin out/P2B-FT-JDK8-CHARWIDTH.bin \
            | tee out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_DIFF_PARSE=PASS' out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_CASES=196608' out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_DIFF_RESULT=PASS' out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt

      - name: Remove font binaries and diagnostic executable
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/font.ttf out/miyoomini-freej2me.zip out/p2b-freetype-jdk8-charwidth-arm
          rm -f out/P2B-JDK8-CHARWIDTH.bin out/P2B-FT-JDK8-CHARWIDTH.bin
          if find out -type f | grep -Ei '\.(ttf|otf)$'; then echo 'P2B_FONT_BYTE_LEAK=FAIL'; exit 1; fi
          {
            echo 'P2B_FONT_BYTE_LEAK=NO'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-CHARWIDTH-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-JDK8-CHARWIDTH-${{ github.sha }}
          path: |
            out/P2B-JDK8-CHARWIDTH.log
            out/P2B-FT-JDK8-CHARWIDTH.log
            out/P2B-JDK8-CHARWIDTH-DIFFERENTIAL.txt
            out/P2B-JDK8-CHARWIDTH-STATUS.txt
          if-no-files-found: error
