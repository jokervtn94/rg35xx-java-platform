name: A6 RG35XX Real Game R5 Raw DrawLine

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a6-real-game-regression
    paths:
      - '.github/workflows/a6-raw-drawline-r5.yml'
      - 'scripts/stage-a6-rg35xx-raw-drawline-r5.py'
      - 'scripts/build-a6-raw-drawline-r5.sh'
      - 'scripts/build-a6-parent-trace-r4t.sh'
      - 'scripts/stage-a6-rg35xx-parent-trace-r4t.py'
      - 'scripts/build-a6-classloader-fix.sh'
      - 'scripts/stage-a6-rg35xx-classloader-race.py'
      - 'scripts/stage-a6-rg35xx-drawregion-null-guard.py'
      - 'scripts/stage-a6-rg35xx-adam7.py'
      - 'scripts/build-a5-core2d-java.sh'
      - 'scripts/stage-a5-rg35xx-core2d-v2.py'
      - 'scripts/build-a4-raw2d-java.sh'
      - 'scripts/build-a3.sh'
      - 'tests/a6/**'
      - 'adapter/**'

permissions:
  contents: read

jobs:
  a6-realgame-r5:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout A6 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Build unchanged RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build exact R4T parent plus R5 raw drawLine fix
        run: bash ./scripts/build-a6-raw-drawline-r5.sh

      - name: Finalize protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Verify R5 scope and protected locks
        run: |
          set -euo pipefail
          grep -q '^A6_R5_RAW_DRAWLINE=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R5_RAW_DRAWLINE_HOST_GATE=PASS$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R5_KEYPRESS_TRACE=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R5_KEYPRESS_TRACE_SEMANTIC_CHANGE=NO$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R1_CLASSLOADER_FIX=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R2_DRAWREGION_NULL_GUARD=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R4_ADAM7_INLINE=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R4T_PARENT_TRACE=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^BUILD-PASS=YES$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^DEVICE-PASS=NO$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^STABLE=NO$' out/a6-realgame-r5/A6-REALGAME-R5-IDENTITY.txt
          grep -q '^A6_R5_RAW_DRAWLINE_HOST_GATE=PASS$' out/a6-realgame-r5/A6-R5-DRAWLINE-HOST-GATE.txt
          grep -q '^A6_ADAM7_HOST_GATE=PASS$' out/a6-realgame-r5/A6-R5-ADAM7-HOST-GATE.txt
          test "$(sha256sum out/a3/librg35xx_input.so | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum out/a3/librg35xx_video.so | awk '{print $1}')" = '9094819d7c81576b63bd0cde9531404a3fb82b8d5b845dbae152152f2e1a2a7a'
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a6-realgame-r5/CANONICAL-DIFF-MANIFEST.txt
          cp out/a3/BUILD-IDENTITY.txt out/a6-realgame-r5/A6-PLATFORM-BUILD-IDENTITY.txt
          cp out/a3/librg35xx_input.so out/a6-realgame-r5/librg35xx_input.so
          cp out/a3/librg35xx_video.so out/a6-realgame-r5/librg35xx_video.so
          (cd out/a6-realgame-r5 && sha256sum * > A6-ARTIFACT-SHA256SUMS.txt)
          echo A6_R5_SCOPE_LOCK=PASS

      - name: Upload A6 real-game R5 platform
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A6-REALGAME-R5-${{ github.sha }}
          path: out/a6-realgame-r5/
          if-no-files-found: error
