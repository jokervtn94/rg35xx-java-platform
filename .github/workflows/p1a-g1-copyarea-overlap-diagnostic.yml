name: P1A G1 CopyArea Overlap Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g1-clear-copy
    paths:
      - '.github/workflows/p1a-g1-copyarea-overlap-diagnostic.yml'
      - 'scripts/run-p1a-g1-copyarea-overlap-diagnostic.sh'
      - 'tests/p1a/RG35XXCopyAreaOverlapDiagnostic.java'

permissions:
  contents: read

jobs:
  copyarea-overlap-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize accepted Raw2D parent prerequisites
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Characterize canonical copyArea self-overlap
        run: bash ./scripts/run-p1a-g1-copyarea-overlap-diagnostic.sh

      - name: Verify diagnostic-only lock
        run: |
          set -euo pipefail
          ID=out/p1a-copyarea-overlap-diagnostic/IDENTITY.txt
          LOG=out/p1a-copyarea-overlap-diagnostic/P1A-COPYAREA-OVERLAP-DIAGNOSTIC.txt
          grep -q '^MODE=DIAGNOSTIC_ONLY$' "$ID"
          grep -q '^RUNTIME_CHANGE=NO_NEW_CHANGE$' "$ID"
          grep -q '^P1A_COPYAREA_OVERLAP_DIAGNOSTIC=COMPLETE$' "$LOG"
          grep -q '^P1A_COPYAREA_OVERLAP_RUNTIME_CHANGE=NO$' "$LOG"
          echo P1A_COPYAREA_DIAGNOSTIC_SCOPE_LOCK=PASS

      - name: Upload overlap evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G1-COPYAREA-OVERLAP-${{ github.sha }}
          path: out/p1a-copyarea-overlap-diagnostic/
          if-no-files-found: error
