name: A3 Build Gate

on:
  push:
    branches:
      - rg35xx-aweigit-r1-runtime-adapter
  pull_request:
    branches:
      - rg35xx-aweigit-port-r1

permissions:
  contents: read

jobs:
  a3-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production tree and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build pinned Aweigit core plus adapter Java
        run: ./scripts/build-a3.sh java

      - name: Build RG35XX ARMv5 soft-float native adapters with pinned toolchain
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash ./scripts/build-a3.sh native

      - name: Finalize identity and hashes
        run: ./scripts/build-a3.sh finalize

      - name: Upload A3 build evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A3-${{ github.sha }}
          path: out/a3
          if-no-files-found: error
