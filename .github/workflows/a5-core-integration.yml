name: A5 RG35XX Core Integration

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a5-core-integration

permissions:
  contents: read

jobs:
  a5-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout production tree and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prove A3 baseline and materialize A4 DEVICE-PASS raw2D platform
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Build RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Finalize A4 protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Rebuild A4 parent smoke regression package
        run: bash ./scripts/build-a4-smoke.sh

      - name: Verify A4 regression build gate
        run: |
          set -euo pipefail
          grep -q '^BUILD-PASS=YES$' out/a4/A4-BUILD-IDENTITY.txt
          grep -q '^A4_RAW2D_OVERLAY=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^DEVICE-PASS=NO$' out/a4/A4-BUILD-IDENTITY.txt
          echo A4_REGRESSION_BUILD_GATE=PASS

      - name: Apply A5 headless core2D overlay and rebuild platform
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Finalize A5 protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Build A5 parent integration package
        run: bash ./scripts/build-a5-core-integration.sh

      - name: Verify A5 scope lock
        run: |
          set -euo pipefail
          grep -q '^A4_RAW2D_OVERLAY=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A5_CORE2D_OVERLAY=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^A5_CORE2D_OWNER=RG35XX_ADAPTER_STAGED_BACKING_ONLY$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^DEVICE-PASS=NO$' out/a5/A5-BUILD-IDENTITY.txt
          grep -q '^DEVICE_PASS_REVIEW=PENDING$' out/a5/A5-BUILD-IDENTITY.txt
          grep -q '^STABLE=NO$' out/a5/A5-BUILD-IDENTITY.txt
          grep -q '^A5_PARENT_SCOPE=' out/a5/A5-BUILD-IDENTITY.txt
          ! grep -R -E 'freej2me_plus-lr|libretro' tests/a5 packaging/a5 scripts/build-a5-core-integration.sh scripts/build-a5-core2d-java.sh scripts/stage-a5-rg35xx-core2d.py
          echo A5_SCOPE_LOCK=PASS

      - name: Upload A5 RG35XX parent integration package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A5-CORE-${{ github.sha }}
          path: out/a5/
          if-no-files-found: error
