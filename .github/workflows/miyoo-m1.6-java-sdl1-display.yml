name: RG35XX Miyoo M1.6 Java SDL1 Display
on:
  workflow_dispatch:
  push:
    branches: [rg35xx-miyoo-platform-v1]
    paths:
      - '.github/workflows/miyoo-m1.6-java-sdl1-display.yml'
      - 'miyoo-m1/M16DisplayProbe.java'
      - 'miyoo-m1/m1_6_display_jni.c'
      - 'miyoo-m1/M1.6-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.6-JAVA-SDL1-DISPLAY-PREFLIGHT.md'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preflight gate
        run: |
          set -euo pipefail
          grep -Fq 'HISTORY_FOUND = YES' tasklog/MIYOO-M1.6-JAVA-SDL1-DISPLAY-PREFLIGHT.md
          grep -Fq 'CONNECT_M1_5_JAVA_BOOT_PATH_TO_DEVICE_PROVEN_SDL1_FBCON_DISPLAY_ONLY' tasklog/MIYOO-M1.6-JAVA-SDL1-DISPLAY-PREFLIGHT.md
      - name: Install Java8 and materialize pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Build Java5 probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.6/java
          /usr/lib/jvm/java-8-openjdk-amd64/bin/javac -source 5 -target 5 -d build-m1.6/java miyoo-m1/M16DisplayProbe.java
          python3 -c "from pathlib import Path; p=Path('build-m1.6/java/M16DisplayProbe.class'); assert int.from_bytes(p.read_bytes()[6:8],'big')==49; print('JAVA_CLASS_MAJOR=49')"
          /usr/lib/jvm/java-8-openjdk-amd64/bin/jar cf build-m1.6/m1.6-display-probe.jar -C build-m1.6/java .
      - name: Build ARM uClibc JNI bridge
        run: |
          set -euo pipefail
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_6_display_jni.c -Wl,--as-needed -ldl -o build-m1.6/libm1_6_display.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.6/libm1_6_display.so
      - name: ELF and scope gate
        run: |
          set -euo pipefail
          readelf -h build-m1.6/libm1_6_display.so | tee build-m1.6/ELF-HEADER.txt
          readelf -A build-m1.6/libm1_6_display.so | tee build-m1.6/ELF-ATTRIBUTES.txt || true
          grep -q 'Class:.*ELF32' build-m1.6/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.6/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.6/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.6/ELF-HEADER.txt
          strings build-m1.6/libm1_6_display.so | grep -q 'SDL_VIDEODRIVER'
          ! strings build-m1.6/libm1_6_display.so | grep -q 'SDL2'
          sha256sum build-m1.6/libm1_6_display.so build-m1.6/m1.6-display-probe.jar | tee build-m1.6/SHA256.txt
      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.6-java-sdl1-display"
          APP="$OUT/Roms/APPS"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.6/libm1_6_display.so build-m1.6/m1.6-display-probe.jar "$APP/"
          cp miyoo-m1/M1.6-DEVICE-TEST.sh "$APP/"
          chmod +x "$APP/M1.6-DEVICE-TEST.sh"
          cp build-m1.6/ELF-HEADER.txt build-m1.6/ELF-ATTRIBUTES.txt build-m1.6/SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.6-JAVA-SDL1-DISPLAY-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' 'RG35XX MIYOO M1.6 JAVA -> SDL1/FBCON DISPLAY' 'Merge Roms into SD root.' 'Run Apps -> M1.6-DEVICE-TEST.sh.' 'Expected physical LCD: RED -> GREEN -> BLUE -> WHITE, driven from Java through JNI.' 'Result: /mnt/mmc/RG35XX-MIYOO-M1.6-DEVICE-RESULT.txt' 'JamVM log: /mnt/mmc/RG35XX-MIYOO-M1.6-JAMVM.log' 'No installed platform files are replaced.' 'DEVICE_PASS=NO until real-device visual confirmation.' 'STABLE=NO' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"
          echo M1_6_BUILD_PASS=YES
          echo DEVICE_PASS=NO
          echo STABLE=NO
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.6-java-sdl1-display
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
