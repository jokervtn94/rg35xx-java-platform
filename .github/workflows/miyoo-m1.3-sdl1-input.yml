name: RG35XX Miyoo M1.3 SDL1 Input Bootstrap

on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - '.github/workflows/miyoo-m1.3-sdl1-input.yml'
      - 'miyoo-m1/m1_3_sdl1_input_probe.c'
      - 'miyoo-m1/M1.3-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.3-SDL1-INPUT-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  build-sdl1-input-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Gate rules and M1.3 preflight
        run: |
          set -euo pipefail
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.3-SDL1-INPUT-PREFLIGHT.md
          grep -Fq 'HISTORY_FOUND: YES' tasklog/MIYOO-M1.3-SDL1-INPUT-PREFLIGHT.md
          grep -Fq 'Primary variable: SDL 1.2 joystick/input path only.' tasklog/MIYOO-M1.3-SDL1-INPUT-PREFLIGHT.md

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Build M1.3 standalone input probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.3
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc \
            -Os -pipe -fno-strict-aliasing \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -std=gnu99 -Wall -Wextra \
            miyoo-m1/m1_3_sdl1_input_probe.c \
            -Wl,--as-needed -ldl \
            -o build-m1.3/m1_3_sdl1_input_probe
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.3/m1_3_sdl1_input_probe

      - name: Strict ELF and scope gate
        run: |
          set -euo pipefail
          readelf -h build-m1.3/m1_3_sdl1_input_probe | tee build-m1.3/ELF-HEADER.txt
          readelf -A build-m1.3/m1_3_sdl1_input_probe | tee build-m1.3/ELF-ATTRIBUTES.txt || true
          file build-m1.3/m1_3_sdl1_input_probe | tee build-m1.3/FILE.txt
          grep -q 'Class:.*ELF32' build-m1.3/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.3/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.3/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.3/ELF-HEADER.txt
          strings build-m1.3/m1_3_sdl1_input_probe | grep -Fq 'SDL1_JOYSTICK_INPUT_ONLY'
          ! strings build-m1.3/m1_3_sdl1_input_probe | grep -q 'RG35XX-AUDIO-R2'
          ! strings build-m1.3/m1_3_sdl1_input_probe | grep -q 'freej2me_plus_libretro'
          sha256sum build-m1.3/m1_3_sdl1_input_probe | tee build-m1.3/PROBE-SHA256.txt

      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.3-sdl1-input"
          APP="$OUT/Roms/APPS"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.3/m1_3_sdl1_input_probe "$APP/"
          cp miyoo-m1/M1.3-DEVICE-TEST.sh "$APP/"
          chmod +x "$APP/m1_3_sdl1_input_probe" "$APP/M1.3-DEVICE-TEST.sh"
          cp build-m1.3/ELF-HEADER.txt build-m1.3/ELF-ATTRIBUTES.txt build-m1.3/FILE.txt build-m1.3/PROBE-SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.3-SDL1-INPUT-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' \
            'RG35XX MIYOO M1.3 SDL1 INPUT BOOTSTRAP' \
            'Copy the Roms folder to the GarlicOS SD root (merge only).' \
            'Run: Apps -> M1.3-DEVICE-TEST.sh' \
            'Immediately press D-pad, A/B/X/Y, Start/Select and L/R repeatedly for about 15 seconds.' \
            'Do not rely on Menu for this checkpoint because GarlicOS may intercept it.' \
            'Result: /mnt/mmc/RG35XX-MIYOO-M1.3-DEVICE-RESULT.txt' \
            '' \
            'This package does NOT replace the current Java runtime/core/JamVM/glibj.' \
            'BUILD-PASS applies only to this standalone input probe.' \
            'DEVICE-PASS=NO until real-device log is reviewed.' \
            'STABLE=NO' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload M1.3 package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.3-sdl1-input
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
