name: P3 Runtime Service Exerciser

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/p3-runtime-service-exerciser.yml"
      - "scripts/build-p3-runtime-service-exerciser.sh"
      - "scripts/build-p3-runtime-service-physical-package.sh"
      - "scripts/build-p3-rg35xx-audio-platform.sh"
      - "tests/p3/RG35XXP3RuntimeServiceExerciser.java"
      - "adapter/java/org/recompile/rg35xx/RG35XXLauncher.java"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CANONICAL_AWEIGIT: ca11dfe8ea1cc273d92460f9a83bbf192023fa63

    steps:
      - name: Checkout P3 source and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Verify P3 source audit
        run: python3 scripts/audit-p3-runtime-services.py

      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends unzip zip curl python3 >/dev/null

      - name: Download accepted P2C R11 parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
          P2C_ARTIFACT_ID: "11303304815"
        run: |
          set -euo pipefail
          rm -rf /tmp/p2c-artifact /tmp/p2c-package /tmp/p2c-artifact.zip
          mkdir -p /tmp/p2c-artifact /tmp/p2c-package
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jokervtn94/rg35xx-java-platform/actions/artifacts/$P2C_ARTIFACT_ID/zip" \
            -o /tmp/p2c-artifact.zip
          unzip -q /tmp/p2c-artifact.zip -d /tmp/p2c-artifact
          DEVICE_ZIP="$(find /tmp/p2c-artifact -type f -name 'RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R1.zip' -print -quit)"
          test -n "$DEVICE_ZIP"
          unzip -q "$DEVICE_ZIP" -d /tmp/p2c-package
          PAYLOAD="$(find /tmp/p2c-package -type d -path '*/SD/Roms/APPS/RG35XX-P2C-INPUT-FRONTEND' -print -quit)"
          test -n "$PAYLOAD"
          echo "P3_BASE_PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"
          echo "P3_PLATFORM=$PAYLOAD/freej2me-rg35xx.jar" >> "$GITHUB_ENV"
          sha256sum "$PAYLOAD/freej2me-rg35xx.jar"

      - name: Build P3 RG35XX audio-loader platform overlay
        run: |
          set -euo pipefail
          chmod +x scripts/build-p3-rg35xx-audio-platform.sh
          JAVA8="$JAVA_HOME" P3_BASE_PAYLOAD="$P3_BASE_PAYLOAD" \
            bash scripts/build-p3-rg35xx-audio-platform.sh | tee P3-AUDIO-PLATFORM-BUILD.log
          grep -q '^P3_AUDIO_PLATFORM_BUILD=PASS$' P3-AUDIO-PLATFORM-BUILD.log
          test -f out/p3-audio-platform/freej2me-rg35xx.jar
          rm -rf /tmp/p3-base-payload
          mkdir -p /tmp/p3-base-payload
          cp -a "$P3_BASE_PAYLOAD/." /tmp/p3-base-payload/
          cp out/p3-audio-platform/freej2me-rg35xx.jar /tmp/p3-base-payload/freej2me-rg35xx.jar
          echo "P3_BASE_PAYLOAD=/tmp/p3-base-payload" >> "$GITHUB_ENV"
          echo "P3_PLATFORM=/tmp/p3-base-payload/freej2me-rg35xx.jar" >> "$GITHUB_ENV"
          echo "P3_EXPECTED_PLATFORM=$(sha256sum out/p3-audio-platform/freej2me-rg35xx.jar | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build P3 service exerciser JAR
        run: |
          set -euo pipefail
          chmod +x scripts/build-p3-runtime-service-exerciser.sh
          JAVA8="$JAVA_HOME" P3_PLATFORM="$P3_PLATFORM" bash scripts/build-p3-runtime-service-exerciser.sh | tee P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_BUILD=PASS$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_JAVA6_GATE=PASS$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_PUBLIC_MIDP_ONLY=YES$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_PHYSICAL_TEST=NOT_TESTED$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log

      - name: Build P3 physical test package
        run: |
          set -euo pipefail
          chmod +x scripts/build-p3-runtime-service-physical-package.sh
          P3_BASE_PAYLOAD="$P3_BASE_PAYLOAD" P3_EXPECTED_PLATFORM="$P3_EXPECTED_PLATFORM" \
            bash scripts/build-p3-runtime-service-physical-package.sh | tee P3-RUNTIME-SERVICE-PACKAGE-BUILD.log
          grep -q '^P3_PHYSICAL_PACKAGE_BUILD=PASS$' P3-RUNTIME-SERVICE-PACKAGE-BUILD.log
          grep -q '^P3_PHYSICAL_TEST=NOT_TESTED$' P3-RUNTIME-SERVICE-PACKAGE-BUILD.log
          test -f out/p3-runtime-service-physical/RG35XX-P3-RUNTIME-SERVICE-PHYSICAL-R1.zip

      - name: Upload P3 exerciser evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P3-RUNTIME-SERVICE-EXERCISER-${{ github.sha }}
          path: |
            out/p3-runtime-service-exerciser/
            out/p3-audio-platform/
            out/p3-runtime-service-physical/RG35XX-P3-RUNTIME-SERVICE-PHYSICAL-R1.zip
            P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
            P3-RUNTIME-SERVICE-PACKAGE-BUILD.log
            P3-AUDIO-PLATFORM-BUILD.log
          if-no-files-found: error
