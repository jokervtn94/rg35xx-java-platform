name: RG35XX From-Zero NoMask Font GoldenAudio R2 A-B

on:
  push:
    branches: [ rg35xx-from-zero-rebuild-v1 ]
    paths:
      - '.github/workflows/from-zero-nomask-font-goldenaudio-r2-ab.yml'
      - 'scripts/vc7r22r2_apply_golden_tsf.py'
      - 'scripts/vc7r22r1_apply_worker_ring.py'
      - 'scripts/vc7r3_apply_native_audio.py'
      - 'scripts/vc7r3_apply_java_media_events.py'
      - 'scripts/from_zero_apply_nomask_ab.py'
      - 'scripts/from_zero_assemble_v1.sh'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/vc7r_reconstruct_font.py'
      - 'installer/INSTALL-GOLDEN-AUDIO-R2-AB.ps1'
      - 'installer/INSTALL-GOLDEN-AUDIO-R2-AB.cmd'
  workflow_dispatch:

jobs:
  audio-r2-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      JAMVM_L_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      FOUNDATION_CORE_SHA256: fc574021ad34b0466cd7ffe4f2eb58438eb2104c47cc503405d9f8722c02d062
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      RECON_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9

    steps:
      - name: Checkout platform policy
        uses: actions/checkout@v4

      - name: Checkout pristine pinned FreeJ2ME
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Checkout pinned historical media source
        uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install pinned build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils unzip
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Prove source identities
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          test -z "$(git -C upstream status --porcelain)"
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"

      - name: Assemble from-zero graphics foundation
        run: |
          set -euo pipefail
          FZ_UPSTREAM="$GITHUB_WORKSPACE/upstream" FZ_ASSEMBLY="$RUNNER_TEMP/audio-r2" sh scripts/from_zero_assemble_v1.sh | tee "$RUNNER_TEMP/foundation.log"
          echo "R2=$RUNNER_TEMP/audio-r2" >> "$GITHUB_ENV"

      - name: Retain device-proven NoMask and bitmap renderer
        run: |
          set -euo pipefail
          python3 scripts/from_zero_apply_nomask_ab.py "$R2/src/org/recompile/mobile/PlatformGraphics.java" | tee "$RUNNER_TEMP/nomask.log"
          python3 scripts/vc7_apply_golden_font.py "$R2/src/org/recompile/mobile/PlatformGraphics.java" | tee "$RUNNER_TEMP/font-code.log"
          grep -q 'RG35XX-NOMASK-AB' "$R2/src/org/recompile/mobile/PlatformGraphics.java"
          grep -q 'RG35XX-VC7-FONT: Golden Unicode bitmap renderer' "$R2/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Reconstruct known experimental font resource
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/r2-font" "$R2/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/r2-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/r2-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/r2-font/rg35xx-font.bin" | awk '{print $1}')" = "$RECON_FONT_SHA256"
          cp "$RUNNER_TEMP/r2-font/rg35xx-font.bin" "$R2/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Materialize pinned historical native-media implementation
        run: |
          set -euo pipefail
          mkdir -p "$R2/src/org/recompile/mobile" "$R2/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do cp "history/src/org/recompile/mobile/$f" "$R2/src/org/recompile/mobile/$f"; done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$R2/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R2/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R2/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Apply direct RG35XX Java media path
        run: |
          set -euo pipefail
          python3 - "$R2/src/org/recompile/mobile/PlatformPlayer.java" "$R2/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do patch -d "$R2" -p1 --batch --forward --fuzz=0 < "history/patches/$p"; done
          python3 scripts/vc7r3_apply_native_audio.py "$R2/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$R2/src/org/recompile/freej2me/Libretro.java" "$R2/src/org/recompile/mobile/PlatformPlayer.java" "$R2/src/javax/microedition/media/Manager.java"

      - name: Replace frame-coupled pump with async worker-ring R1
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r1_apply_worker_ring.py "$R2/src/libretro/freej2me_libretro.c" | tee "$RUNNER_TEMP/worker-ring.log"

      - name: Restore 14700 Hz mono-x3 TSF staging R2
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r2_apply_golden_tsf.py "$R2/src/libretro/rg35xx/rg35xx_tsf_worker.c" "$R2/src/libretro/freej2me_libretro.c" | tee "$RUNNER_TEMP/tsf-r2.log"

      - name: Wire native media modules
        run: |
          set -euo pipefail
          cat >> "$R2/src/libretro/Makefile.common" <<'EOF'

          # Isolated Audio R2 modules. Accepted video owner remains unchanged.
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Fail-closed source architecture gate
        run: |
          set -euo pipefail
          C="$R2/src/libretro/freej2me_libretro.c"; T="$R2/src/libretro/rg35xx/rg35xx_tsf_worker.c"; P="$R2/src/org/recompile/mobile/PlatformPlayer.java"; M="$R2/src/javax/microedition/media/Manager.java"
          grep -Fq '#define RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq '#define RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          grep -Fq 'RETRO_ENVIRONMENT_SET_AUDIO_CALLBACK' "$C"
          grep -Fq 'worker START ring=16384 target=3072 chunk=1470' "$C"
          grep -Fq 'SoundFont loaded, synth=14700Hz output=44100Hz voices=16 mono-x3 STABLE worker-ring' "$C"
          grep -Fq '#define RG35XX_TSF_RATE 14700u' "$T"
          grep -Fq '#define RG35XX_TSF_OUTPUT_RATE 44100u' "$T"
          grep -Fq '#define RG35XX_TSF_UPSAMPLE_X 3u' "$T"
          grep -Fq 'TSF_MONO' "$T"
          grep -Fq 'RG35XXNativePlayer' "$P"
          grep -Fq 'RG35XXMediaProfile' "$M"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          ! grep -Rq 'RG35XX-MediaWarmup' "$R2/src"
          ! grep -Rq 'RG35XX-CV:' "$R2/src"
          ! grep -Rq 'RG35XX-JAVA-DIAG:' "$R2/src"
          ! grep -Rq 'final int clipLeft = Math.max(x' "$R2/src/org/recompile/mobile/PlatformGraphics.java"
          echo 'AUDIO_R2_SOURCE_GATE=PASS'

      - name: Build Java runtime
        run: |
          set -euo pipefail
          cd "$R2"; ant
          test -f build/freej2me_plus-lr.jar
          unzip -l build/freej2me_plus-lr.jar | grep -q 'org/recompile/mobile/rg35xx-font.bin'
          python3 - "$R2/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for b,_,fs in os.walk(sys.argv[1]):
            for f in fs:
              if not f.endswith('.class'): continue
              n+=1; h=open(os.path.join(b,f),'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50: raise SystemExit('Java major gate failed '+os.path.join(b,f))
          if n < 1000: raise SystemExit('class count too small %d'%n)
          print('AUDIO_R2_CLASS_COUNT=%d'%n)
          PY

      - name: Build ARMv5TE uClibc native core
        run: |
          set -euo pipefail
          cd "$R2/src/libretro"; make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'

      - name: Binary architecture and marker gate
        run: |
          set -euo pipefail
          CORE="$R2/src/libretro/freej2me_plus_libretro.so"
          file "$CORE"; readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt; grep -q 'Machine:.*ARM' /tmp/elf.txt; grep -q 'Version5 EABI' /tmp/elf.txt; grep -q 'soft-float ABI' /tmp/elf.txt
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470'
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: SoundFont loaded, synth=14700Hz output=44100Hz voices=16 mono-x3 STABLE worker-ring'
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: underrun queued=0; re-prime target=3072'
          echo 'AUDIO_R2_BINARY_GATE=PASS'

      - name: PowerShell installer syntax gate
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/installer/INSTALL-GOLDEN-AUDIO-R2-AB.ps1",[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_.Message};exit 1}
          Write-Host 'AUDIO_R2_INSTALLER_PARSE=PASS'

      - name: Package atomic device A-B installer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/golden-audio-r2-ab";mkdir -p "$OUT/payload" "$OUT/installer" "$OUT/evidence"
          cp "$R2/build/freej2me_plus-lr.jar" "$OUT/payload/freej2me-lr.jar"
          cp "$R2/src/libretro/freej2me_plus_libretro.so" "$OUT/payload/freej2me_plus_libretro.so"
          (cd "$OUT/payload" && sha256sum freej2me-lr.jar freej2me_plus_libretro.so > PAYLOAD-SHA256.txt)
          cp installer/INSTALL-GOLDEN-AUDIO-R2-AB.ps1 installer/INSTALL-GOLDEN-AUDIO-R2-AB.cmd "$OUT/installer/"
          cp "$RUNNER_TEMP/foundation.log" "$RUNNER_TEMP/nomask.log" "$RUNNER_TEMP/font-code.log" "$RUNNER_TEMP/worker-ring.log" "$RUNNER_TEMP/tsf-r2.log" "$OUT/evidence/"
          RUNTIME_SHA=$(sha256sum "$OUT/payload/freej2me-lr.jar"|awk '{print $1}');CORE_SHA=$(sha256sum "$OUT/payload/freej2me_plus_libretro.so"|awk '{print $1}')
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=BUILD-PASS_DEVICE-TEST-PENDING
          CHECKPOINT=FROM-ZERO-NOMASK-FONT-GOLDENAUDIO-R2-AB
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          HISTORY_PIN=$HISTORY_PIN
          RUNTIME_SHA256=$RUNTIME_SHA
          CORE_SHA256=$CORE_SHA
          GREEN_TINT_FIX=NOMASK_DEVICE_PROVEN_RETAINED
          FONT_RENDERER=BITMAP_BYPASS
          FONT_RESOURCE=RECONSTRUCTED_EXPERIMENTAL
          AUDIO_OWNERSHIP=ASYNC_CALLBACK_DEDICATED_WORKER_RING
          RING_FRAMES=16384
          MIDI_PRIME=3072
          WORKER_CHUNK=1470
          TSF_SYNTH=14700_MONO
          OUTPUT=44100_MONO_X3
          PCM_PRIME_2940=NOT_YET_SOURCE_RECONSTRUCTED
          RETRO_RUN_AUDIO_PUMP=REMOVED
          DRAWRGB_AB=NOT_INCLUDED
          TRANSPARENCY=NOT_INCLUDED
          VIDEO_CHANGES=NONE_IN_AUDIO_R2
          DEVICE_PASS=NO
          STABLE=NO
          EOF
          sed -i 's/^          //' "$OUT/STATUS.txt"
          cat > "$OUT/README-DEVICE-TEST.txt" <<'EOF'
          RG35XX Golden Audio R2 A/B - DEVICE TEST REQUIRED

          Run on Windows with the SD inserted:
            installer\INSTALL-GOLDEN-AUDIO-R2-AB.cmd H

          Test in this order:
          1. Real Football / Bo Lac: game must load without getSequencer / no Clip failure.
          2. A short playTone/ToneControl case: sound must be audible.
          3. A long MIDI/BGM game: audio must continue without load stall.
          4. PCM/WAV game: observe audio; PCM-specific ~2940 prime is NOT claimed by R2 yet.
          5. Confirm NoMask green-tint fix remains effective.

          Upload after test:
          - freej2me-core*.log
          - freej2me-java-error*.log
          - RG35XX-GOLDEN-AUDIO-R2-AB-INSTALL-RESULT.txt

          R2 is BUILD-PASS only until real RG35XX evidence. It is not STABLE.
          EOF
          sed -i 's/^          //' "$OUT/README-DEVICE-TEST.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum)>"$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-from-zero-nomask-font-goldenaudio-r2-ab
          path: ${{ runner.temp }}/golden-audio-r2-ab
          include-hidden-files: true
          retention-days: 30
