name: P1A G4G5 DirectGraphics IO Diagnostic R2

on:
  push:
    branches:
      - p1a-g4g5-directgraphics-io-diagnostic
    paths:
      - '.github/workflows/p1a-g4g5-directgraphics-io-diagnostic-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-g4g5-directgraphics-io-diagnostic-r2:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout diagnostic branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D6 host ancestry and diagnostic-only R2 scope
        shell: bash
        run: |
          set -euo pipefail
          D6=093aae62d7caca2941258592c72dfc25b1f204a7
          git merge-base --is-ancestor "$D6" HEAD
          if git diff --name-only "$D6"..HEAD | grep -E '^(adapter/|native/|upstream/)' >/dev/null; then
            echo 'P1A_G4G5_R2_FAIL=runtime_or_canonical_source_changed' >&2
            exit 1
          fi
          echo P1A_G4G5_R2_D6_HOST_PARENT=PASS
          echo P1A_G4G5_R2_RUNTIME_CHANGE=NO

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild exact D6 host candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-dg-draw-vector-d6-v2.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-dg-draw-vector-d6-v2.sh >/tmp/p1a-g4g5-r2-d6.log
          grep -q '^P1A_DG_D6_BUILD=PASS$' /tmp/p1a-g4g5-r2-d6.log
          grep -q '^D6_STRICT_DIFFERENTIAL=PASS$' out/p1a-dg-draw-vector-d6/P1A-DG-D6-IDENTITY.txt
          echo P1A_G4G5_R2_D6_REBUILD=PASS

      - name: Compile Java6 diagnostic unchanged from R1
        shell: bash
        run: |
          set -euo pipefail
          CAND=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          OUT=build/p1a-g4g5-directgraphics-io-diagnostic-r2
          rm -rf "$OUT" && mkdir -p "$OUT"
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$CAND" \
            -d "$OUT" tests/p1a/RG35XXG4G5DirectGraphicsIODiagnostic.java
          echo P1A_G4G5_R2_JAVA6_GATE=PASS

      - name: Correct R1 counter artifact and lock exact six real gaps
        shell: bash
        run: |
          set -euo pipefail
          CAND=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          OUT=build/p1a-g4g5-directgraphics-io-diagnostic-r2
          LOG="$OUT/G4G5-DIAGNOSTIC-R2.txt"
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true -cp "$CAND:$OUT" \
            org.recompile.rg35xx.p1a.RG35XXG4G5DirectGraphicsIODiagnostic | tee "$LOG"

          grep -q '^P1A_G4G5_CANONICAL_CHECK_COUNT=25$' "$LOG"
          actual="$(grep -c '^G4G5_RAW_GAP=' "$LOG")"
          [ "$actual" = '6' ]
          grep -q '^G4G5_RAW_GAP=DRAWIMAGE ' "$LOG"
          grep -q '^G4G5_RAW_GAP=DRAWPIXELS_BYTE ' "$LOG"
          grep -q '^G4G5_RAW_GAP=DRAWPIXELS_INT ' "$LOG"
          grep -q '^G4G5_RAW_GAP=DRAWPIXELS_SHORT ' "$LOG"
          grep -q '^G4G5_RAW_GAP=GETPIXELS_INT ' "$LOG"
          grep -q '^G4G5_RAW_GAP=GETPIXELS_SHORT ' "$LOG"
          grep -q '^G4G5_GETPX_BYTE_STUB_RAW=true PRESERVED=true$' "$LOG"
          grep -q '^P1A_G4G5_GETPX_BYTE=CANONICAL_STUB_PRESERVED$' "$LOG"
          grep -q '^P1A_G4G5_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_G4G5_DIAGNOSTIC_GATE=PASS$' "$LOG"

          {
            echo P1A_G4G5_R1_COUNTER_OUTPUT=INVALID_DIAGNOSTIC_ONLY
            echo P1A_G4G5_R1_COUNTER_CAUSE=BYTE_GETPIXELS_PRESERVED_STUB_WAS_INCREMENTED_AS_RAW_GAP
            echo P1A_G4G5_CORRECTED_RAW_GAP_COUNT="$actual"
            echo P1A_G4G5_BYTE_GETPIXELS_GAP=NO_CANONICAL_STUB
            echo P1A_G4G5_RUNTIME_CHANGE=NO
            echo P1A_G4G5_R2_DIAGNOSTIC_GATE=PASS
          } | tee "$OUT/G4G5-R2-CORRECTION.txt"

      - name: Upload corrected diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G4G5-DIRECTGRAPHICS-IO-DIAGNOSTIC-R2-${{ github.sha }}
          path: build/p1a-g4g5-directgraphics-io-diagnostic-r2/
          if-no-files-found: error
