name: RG35XX Miyoo M1.7 Java Raw JS0 Input
on:
  workflow_dispatch:
  push:
    branches: [rg35xx-miyoo-platform-v1]
    paths:
      - '.github/workflows/miyoo-m1.7-java-js0-input.yml'
      - 'miyoo-m1/M17InputProbe.java'
      - 'miyoo-m1/m1_7_input_jni.c'
      - 'miyoo-m1/M1.7-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.7-JAVA-RAW-JS0-INPUT-PREFLIGHT.md'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preflight gate
        run: |
          set -euo pipefail
          grep -Fq 'HISTORY_FOUND = YES' tasklog/MIYOO-M1.7-JAVA-RAW-JS0-INPUT-PREFLIGHT.md
          grep -Fq 'ADD_JAVA_TO_RAW_JS0_INPUT_BRIDGE_USING_EXACT_M1_3C_MAPPING' tasklog/MIYOO-M1.7-JAVA-RAW-JS0-INPUT-PREFLIGHT.md
      - name: Install Java8 and pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Build Java5 input probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.7/java
          /usr/lib/jvm/java-8-openjdk-amd64/bin/javac -source 5 -target 5 -d build-m1.7/java miyoo-m1/M17InputProbe.java
          python3 -c "from pathlib import Path; p=Path('build-m1.7/java/M17InputProbe.class'); assert int.from_bytes(p.read_bytes()[6:8],'big')==49; print('JAVA_CLASS_MAJOR=49')"
          /usr/lib/jvm/java-8-openjdk-amd64/bin/jar cf build-m1.7/m1.7-input-probe.jar -C build-m1.7/java .
      - name: Build ARM uClibc JNI input bridge
        run: |
          set -euo pipefail
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_7_input_jni.c -o build-m1.7/libm1_7_input.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.7/libm1_7_input.so
      - name: ABI mapping and scope gates
        run: |
          set -euo pipefail
          readelf -h build-m1.7/libm1_7_input.so | tee build-m1.7/ELF-HEADER.txt
          readelf -A build-m1.7/libm1_7_input.so | tee build-m1.7/ELF-ATTRIBUTES.txt || true
          grep -q 'Class:.*ELF32' build-m1.7/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.7/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.7/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.7/ELF-HEADER.txt
          grep -Fq '/dev/input/js0' miyoo-m1/m1_7_input_jni.c
          grep -Fq 'e->number==7 && e->value < -16000' miyoo-m1/m1_7_input_jni.c
          grep -Fq 'e->number==6 && e->value > 16000' miyoo-m1/m1_7_input_jni.c
          grep -Fq 'e->number==8' miyoo-m1/m1_7_input_jni.c
          ! grep -Eq 'SDL|audio|mixer|fbcon' miyoo-m1/m1_7_input_jni.c
          sha256sum build-m1.7/libm1_7_input.so build-m1.7/m1.7-input-probe.jar | tee build-m1.7/SHA256.txt
      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.7-java-js0-input"; APP="$OUT/Roms/APPS"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.7/libm1_7_input.so build-m1.7/m1.7-input-probe.jar "$APP/"
          cp miyoo-m1/M1.7-DEVICE-TEST.sh "$APP/"; chmod +x "$APP/M1.7-DEVICE-TEST.sh"
          cp build-m1.7/ELF-HEADER.txt build-m1.7/ELF-ATTRIBUTES.txt build-m1.7/SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.7-JAVA-RAW-JS0-INPUT-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' 'RG35XX MIYOO M1.7 JAVA RAW JS0 INPUT' 'Merge Roms into SD root.' 'Run Apps -> M1.7-DEVICE-TEST.sh.' 'Press in exact order: UP DOWN LEFT RIGHT A B X Y START SELECT L R.' 'Result: /mnt/mmc/RG35XX-MIYOO-M1.7-DEVICE-RESULT.txt' 'JamVM log: /mnt/mmc/RG35XX-MIYOO-M1.7-JAMVM.log' 'DEVICE_PASS=NO until real-device confirmation.' 'STABLE=NO' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"
          echo M1_7_BUILD_PASS=YES; echo DEVICE_PASS=NO; echo STABLE=NO
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.7-java-js0-input
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
