name: P3 Runtime Service Exerciser

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/p3-runtime-service-exerciser.yml"
      - "scripts/build-p3-runtime-service-exerciser.sh"
      - "tests/p3/RG35XXP3RuntimeServiceExerciser.java"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      CANONICAL_AWEIGIT: ca11dfe8ea1cc273d92460f9a83bbf192023fa63
      EXPECTED_AUDIO: 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644

    steps:
      - name: Checkout P3 source and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Verify P3 source audit
        run: python3 scripts/audit-p3-runtime-services.py

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential binutils file unzip zip curl python3 git >/dev/null

      - name: Materialize accepted P2C parent build chain
        run: |
          set -euo pipefail
          bash ./scripts/build-a4-raw2d-java.sh
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"
          docker pull "$TOOLCHAIN_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'
          bash ./scripts/build-a5-core2d-java.sh

      - name: Install pinned ARMv5 toolchain
        run: |
          set -euo pipefail
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc

      - name: Rebuild exact P2C host/module candidate
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2c-input-frontend-candidate.sh scripts/build-p2c-input-frontend-candidate-v2.sh scripts/build-p2b-font-text-candidate.sh scripts/build-p2b-font-text-candidate-v2.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2c-input-frontend-candidate-v2.sh | tee P3-P2C-PARENT-BUILD.log
          grep -q '^P2C_HOST_MODULE_GATE=PASS$' P3-P2C-PARENT-BUILD.log
          grep -q '^P2C_FINAL_OUTPUT_HASH_GATE=PASS$' P3-P2C-PARENT-BUILD.log

      - name: Rebuild protected SDL1 audio native
        run: |
          set -euo pipefail
          rm -rf out/p2c-protected-audio
          mkdir -p out/p2c-protected-audio
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" bash -lc '
            set -euo pipefail
            CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
            STRIP=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip
            "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -Wall -Wextra -I/work/upstream/freej2me-miyoomini/cpp/native/include \
              -I/work/upstream/freej2me-miyoomini/cpp/native/include/linux \
              /work/adapter/native/rg35xx_audio_sdl1_mixer.c -Wl,--as-needed -ldl -o /work/out/p2c-protected-audio/libaudio.so
            "$STRIP" /work/out/p2c-protected-audio/libaudio.so
          '
          sudo chown -R "$(id -u):$(id -g)" out/p2c-protected-audio
          test "$(sha256sum out/p2c-protected-audio/libaudio.so | awk '{print $1}')" = "$EXPECTED_AUDIO"

      - name: Build P3 service exerciser JAR
        run: |
          set -euo pipefail
          chmod +x scripts/build-p3-runtime-service-exerciser.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p3-runtime-service-exerciser.sh | tee P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_BUILD=PASS$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_JAVA6_GATE=PASS$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_EXERCISER_PUBLIC_MIDP_ONLY=YES$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
          grep -q '^P3_PHYSICAL_TEST=NOT_TESTED$' P3-RUNTIME-SERVICE-EXERCISER-BUILD.log

      - name: Upload P3 exerciser evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P3-RUNTIME-SERVICE-EXERCISER-${{ github.sha }}
          path: |
            out/p3-runtime-service-exerciser/
            out/p2c-input-frontend-candidate-r1/P2C-INPUT-FRONTEND-IDENTITY.txt
            P3-RUNTIME-SERVICE-EXERCISER-BUILD.log
            P3-P2C-PARENT-BUILD.log
          if-no-files-found: error
