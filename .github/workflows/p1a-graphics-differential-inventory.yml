name: P1A Graphics Differential Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - platform-source-contract-audit-v1
    paths:
      - '.github/workflows/p1a-graphics-differential-inventory.yml'
      - 'scripts/run-p1a-graphics-differential-inventory.sh'
      - 'tests/p1a/RG35XXGraphicsDifferentialInventory.java'
      - 'docs/P1A-CORE-GRAPHICS-DIFFERENTIAL-HARNESS.md'

permissions:
  contents: read

jobs:
  p1a-differential-inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout audit branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Run P1A differential inventory without runtime patch
        run: bash ./scripts/run-p1a-graphics-differential-inventory.sh

      - name: Verify diagnostic-only lock
        run: |
          set -euo pipefail
          ID=out/p1a-differential-inventory/P1A-DIFFERENTIAL-IDENTITY.txt
          LOG=out/p1a-differential-inventory/P1A-DIFFERENTIAL-INVENTORY.txt
          grep -q '^MODE=DIAGNOSTIC_INVENTORY_ONLY$' "$ID"
          grep -q '^EXACT_A8_GOLDEN_PLATFORM_SHA256=057567d454ac94d4d1d08ad8fc84ef22515c00418d28057aa70e74b4042d336c$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^RUNTIME_CHANGE=NO$' "$ID"
          grep -q '^DEVICE_PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^P1A_DIFFERENTIAL_INVENTORY=PASS$' "$LOG"
          grep -q '^P1A_RUNTIME_CHANGE=NO$' "$LOG"
          echo P1A_DIFFERENTIAL_CI_SCOPE_LOCK=PASS

      - name: Upload diagnostic inventory
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DIFFERENTIAL-INVENTORY-${{ github.sha }}
          path: out/p1a-differential-inventory/
          if-no-files-found: error
