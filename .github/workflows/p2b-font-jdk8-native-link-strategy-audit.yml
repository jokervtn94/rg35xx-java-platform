name: P2B Font JDK8 Native Link Strategy Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-native-link-strategy-audit.yml'

permissions:
  contents: read

jobs:
  p2b-jdk8-native-link-strategy:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8_LAYOUT_TREE: bc6641fecdfb59f3146bb1591e090761a24b4061
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-native-link-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-native-link-files.txt | grep -q .; then
            echo 'P2B_NATIVE_LINK_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_NATIVE_LINK_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-readelf
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ --version | tee out/P2B-NATIVE-LINK-CXX-VERSION.txt
          echo 'P2B_NATIVE_LINK_TOOLCHAIN=PASS'

      - name: Pin exact JDK8u504 source and recipe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)" = "$JDK8_LAYOUT_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          GMK=/tmp/jdk8u/jdk/make/lib/Awt2dLibraries.gmk
          grep -F -- '-DLE_STANDALONE -DHEADLESS' "$GMK"
          {
            echo "P2B_JDK8U_COMMIT=$JDK8U_COMMIT"
            echo "P2B_JDK8_LAYOUT_TREE=$JDK8_LAYOUT_TREE"
            echo "P2B_JDK8U_FT_INCLUDE_TREE=$JDK8U_FT_INCLUDE_TREE"
            echo "P2B_JDK8U_FT_SRC_TREE=$JDK8U_FT_SRC_TREE"
            echo 'P2B_NATIVE_LINK_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-NATIVE-LINK-SOURCE-PROVENANCE.txt

      - name: Build exact FreeType and LayoutEngine PIC archives
        shell: bash
        run: |
          set -euo pipefail
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          FONT=/tmp/jdk8u/jdk/src/share/native/sun/font
          LAYOUT="$FONT/layout"
          FTOBJ=/tmp/p2b-link-ft-obj
          LEOBJ=/tmp/p2b-link-le-obj
          rm -rf "$FTOBJ" "$LEOBJ" && mkdir -p "$FTOBJ" "$LEOBJ"
          ft_count=0
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$FTOBJ/${rel//\//_}.o"
            "$CC" -Os -pipe -fPIC -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
            ft_count=$((ft_count+1))
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          "$AR" rcs /tmp/libp2b-jdk8-freetype-pic.a "$FTOBJ"/*.o

          le_count=0
          le_excluded=0
          while IFS= read -r src; do
            base=$(basename "$src")
            if test "$base" = SunLayoutEngine.cpp; then
              le_excluded=$((le_excluded+1)); continue
            fi
            "$CXX" -Os -pipe -fPIC -std=gnu++98 \
              -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DLE_STANDALONE -DHEADLESS -I"$FONT" -I"$LAYOUT" \
              -c "$src" -o "$LEOBJ/${base%.cpp}.o"
            le_count=$((le_count+1))
          done < <(find "$LAYOUT" -maxdepth 1 -type f -name '*.cpp' -print | sort)
          test "$ft_count" = 106
          test "$le_count" = 87
          test "$le_excluded" = 1
          "$AR" rcs /tmp/libp2b-jdk8-layout-pic.a "$LEOBJ"/*.o
          {
            echo "P2B_NATIVE_LINK_FT_OBJECTS=$ft_count"
            echo "P2B_NATIVE_LINK_LAYOUT_OBJECTS=$le_count"
            echo "P2B_NATIVE_LINK_LAYOUT_JNI_WRAPPER_EXCLUDED=$le_excluded"
            echo 'P2B_NATIVE_LINK_PIC_ARCHIVES=PASS'
          } | tee out/P2B-NATIVE-LINK-PIC-BUILD.txt

      - name: Link self-contained C++ runtime shared object
        shell: bash
        run: |
          set -euo pipefail
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          READELF=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-readelf
          JNI=upstream/freej2me-miyoomini/cpp/native/include
          cat > /tmp/p2b_font_link_bridge.cpp <<'CPP'
          #include <jni.h>
          extern "C" int rg35xx_font_link_probe(void) { return 35; }
          extern "C" JNIEXPORT jint JNICALL
          Java_org_recompile_rg35xx_RG35XXFontText_nativeLinkProbe(JNIEnv *, jclass) {
              return 35;
          }
          CPP
          "$CXX" -Os -pipe -fPIC -std=gnu++98 \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$JNI" -I"$JNI/linux" -c /tmp/p2b_font_link_bridge.cpp -o /tmp/p2b_font_link_bridge.o
          "$CXX" -shared -Wl,--no-undefined \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            /tmp/p2b_font_link_bridge.o \
            -Wl,--whole-archive /tmp/libp2b-jdk8-layout-pic.a /tmp/libp2b-jdk8-freetype-pic.a -Wl,--no-whole-archive \
            -static-libstdc++ -static-libgcc -lm \
            -o /tmp/librg35xx_font_link_probe.so
          file /tmp/librg35xx_font_link_probe.so | tee out/P2B-NATIVE-LINK-ELF-FILE.txt
          "$READELF" -h /tmp/librg35xx_font_link_probe.so | tee out/P2B-NATIVE-LINK-ELF-HEADER.txt
          "$READELF" -d /tmp/librg35xx_font_link_probe.so | tee out/P2B-NATIVE-LINK-DYNAMIC.txt
          if grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)' out/P2B-NATIVE-LINK-DYNAMIC.txt; then
            echo 'P2B_NATIVE_LINK_SELF_CONTAINED_CXX=FAIL'; exit 1
          fi
          grep -q 'Class:.*ELF32' out/P2B-NATIVE-LINK-ELF-HEADER.txt
          grep -q 'Machine:.*ARM' out/P2B-NATIVE-LINK-ELF-HEADER.txt
          grep -q 'Version5 EABI' out/P2B-NATIVE-LINK-ELF-HEADER.txt
          {
            echo 'P2B_NATIVE_LINK_SHARED_OBJECT=PASS'
            echo 'P2B_NATIVE_LINK_STATIC_LIBSTDCXX=PASS'
            echo 'P2B_NATIVE_LINK_STATIC_LIBGCC=PASS'
            echo 'P2B_NATIVE_LINK_SELF_CONTAINED_CXX=PASS'
          } | tee out/P2B-NATIVE-LINK-STATUS.txt

      - name: dlopen shared object under target sysroot
        shell: bash
        run: |
          set -euo pipefail
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          cat > /tmp/p2b_font_dlopen.c <<'C'
          #include <dlfcn.h>
          #include <stdio.h>
          typedef int (*probe_fn)(void);
          int main(void) {
              void *h = dlopen("/tmp/librg35xx_font_link_probe.so", RTLD_NOW);
              if (!h) { fprintf(stderr, "DLOPEN_FAIL=%s\n", dlerror()); return 2; }
              probe_fn p = (probe_fn)dlsym(h, "rg35xx_font_link_probe");
              if (!p) { fprintf(stderr, "DLSYM_FAIL=%s\n", dlerror()); return 3; }
              printf("P2B_NATIVE_LINK_PROBE_VALUE=%d\n", p());
              dlclose(h);
              return 0;
          }
          C
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            /tmp/p2b_font_dlopen.c -ldl -o /tmp/p2b_font_dlopen
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" /tmp/p2b_font_dlopen | tee out/P2B-NATIVE-LINK-DLOPEN.txt
          grep -F 'P2B_NATIVE_LINK_PROBE_VALUE=35' out/P2B-NATIVE-LINK-DLOPEN.txt
          echo 'P2B_NATIVE_LINK_DLOPEN_SYSROOT=PASS' >> out/P2B-NATIVE-LINK-STATUS.txt
          echo 'P2B_RUNTIME_PATCH=FORBIDDEN' >> out/P2B-NATIVE-LINK-STATUS.txt
          echo 'DEVICE_TEST=NOT_REQUESTED' >> out/P2B-NATIVE-LINK-STATUS.txt
          echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO' >> out/P2B-NATIVE-LINK-STATUS.txt
          echo 'STABLE=NO' >> out/P2B-NATIVE-LINK-STATUS.txt

      - name: Remove binaries and source checkout before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u /tmp/p2b-link-ft-obj /tmp/p2b-link-le-obj
          rm -f /tmp/libp2b-jdk8-freetype-pic.a /tmp/libp2b-jdk8-layout-pic.a \
            /tmp/p2b_font_link_bridge.cpp /tmp/p2b_font_link_bridge.o \
            /tmp/librg35xx_font_link_probe.so /tmp/p2b_font_dlopen.c /tmp/p2b_font_dlopen
          if find out -type f | grep -Ei '\.(a|o|so|cpp|c)$'; then
            echo 'P2B_NATIVE_LINK_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_NATIVE_LINK_BYTE_LEAK=NO' | tee out/P2B-NATIVE-LINK-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-NATIVE-LINK-${{ github.sha }}
          path: |
            out/P2B-NATIVE-LINK-CXX-VERSION.txt
            out/P2B-NATIVE-LINK-SOURCE-PROVENANCE.txt
            out/P2B-NATIVE-LINK-PIC-BUILD.txt
            out/P2B-NATIVE-LINK-ELF-FILE.txt
            out/P2B-NATIVE-LINK-ELF-HEADER.txt
            out/P2B-NATIVE-LINK-DYNAMIC.txt
            out/P2B-NATIVE-LINK-STATUS.txt
            out/P2B-NATIVE-LINK-DLOPEN.txt
            out/P2B-NATIVE-LINK-CLEANUP.txt
