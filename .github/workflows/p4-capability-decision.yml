name: P4 Capability Decision Package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/p4-capability-decision.yml"
      - "scripts/build-p4-capability-decision-package.sh"
      - "scripts/build-p4-capability-probe-package.sh"
      - "scripts/build-p4-context-probe-package.sh"
      - "scripts/build-p4-platform-probe-package.sh"
      - "tests/p4/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pull pinned Miyoo uClibc toolchain
        run: docker pull "$TOOLCHAIN"

      - name: Build one P4 module package
        run: |
          set -euo pipefail
          chmod +x scripts/build-p4-capability-decision-package.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TOOLCHAIN" bash -lc \
            'git config --global --add safe.directory /work && P4_ARM_CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc bash scripts/build-p4-capability-decision-package.sh' \
            | tee P4-CAPABILITY-DECISION-BUILD.log

          grep -q '^P4_CAPABILITY_DECISION_BUILD=PASS$' P4-CAPABILITY-DECISION-BUILD.log
          grep -q '^P4_RUNTIME_SEMANTIC_DELTA=NONE$' P4-CAPABILITY-DECISION-BUILD.log
          grep -q '^P4_PHYSICAL_TEST_LEVEL=MODULE$' P4-CAPABILITY-DECISION-BUILD.log

          PKG=out/p4-capability-decision/RG35XX-P4-CAPABILITY-DECISION
          test -f out/p4-capability-decision/RG35XX-P4-CAPABILITY-DECISION.zip
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CAPABILITY-DECISION.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CAPABILITY-PROBE.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CONTEXT-PROBE.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-PLATFORM-PROBE.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CONTEXT-PROBE/p4-egl-gles-context-probe"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-PLATFORM-PROBE/p4-egl-platform-probe"

          grep -q '^RUNTIME_SEMANTIC_DELTA=NONE$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"
          grep -q '^M3G_REENABLED=NO$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"
          grep -q '^MICRO3D_REENABLED=NO$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"
          grep -q '^LWJGL_OPENGL_REENABLED=NO$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"
          grep -q '^DEVICE_PASS=NO$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"
          grep -q '^STABLE=NO$' "$PKG/P4-CAPABILITY-DECISION-IDENTITY.txt"

      - name: Upload P4 capability decision package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P4-CAPABILITY-DECISION-${{ github.sha }}
          path: |
            out/p4-capability-decision/
            P4-CAPABILITY-DECISION-BUILD.log
          if-no-files-found: error
