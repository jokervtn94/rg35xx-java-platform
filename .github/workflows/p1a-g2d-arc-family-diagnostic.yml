name: P1A G2D Arc Family Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2d-arc-family-diagnostic
    paths:
      - '.github/workflows/p1a-g2d-arc-family-diagnostic.yml'
      - 'scripts/build-p1a-g2d-arc-family-diagnostic.sh'
      - 'tests/p1a/RG35XXG2DArcFamilyDiagnostic.java'

permissions:
  contents: read

jobs:
  p1a-g2d-arc-family-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild G2C and characterize G2D arcs
        run: bash ./scripts/build-p1a-g2d-arc-family-diagnostic.sh

      - name: Verify diagnostic-only scope
        run: |
          set -euo pipefail
          ID=out/p1a-g2d-arc-family-diagnostic/P1A-G2D-DIAGNOSTIC-IDENTITY.txt
          LOG=out/p1a-g2d-arc-family-diagnostic/P1A-G2D-ARC-FAMILY-DIAGNOSTIC.txt
          grep -q '^PARENT_G2C_SEMANTIC_SHA256=a177541d3d0f9a8ad5e322afae03994800f73d8b13b5b141f8343490aa3ae2dc$' "$ID"
          grep -q '^TARGET_METHODS=Graphics.drawArc,Graphics.fillArc$' "$ID"
          grep -q '^SIGNATURE_COUNT=37$' "$ID"
          grep -q '^DRAWARC_RAW_GAP=PROVEN_NPE$' "$ID"
          grep -q '^FILLARC_RAW_GAP=PROVEN_NPE$' "$ID"
          grep -q '^RUNTIME_DELTA=NONE$' "$ID"
          grep -q '^HOST-CHARACTERIZATION-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^P1A_G2D_ARC_FAMILY_DIAGNOSTIC=PASS$' "$LOG"
          echo P1A_G2D_DIAGNOSTIC_CI_SCOPE_LOCK=PASS

      - name: Upload G2D diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2D-ARC-DIAGNOSTIC-${{ github.sha }}
          path: out/p1a-g2d-arc-family-diagnostic/
          if-no-files-found: error
