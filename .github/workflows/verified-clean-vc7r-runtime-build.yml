name: Verified Clean VC7R Runtime Build

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r-runtime-build.yml'
      - 'scripts/vc7r_reconstruct_font.py'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/b4_verified_core_assemble.sh'
      - 'scripts/b4_apply_early_native_log.py'
      - 'scripts/b4_apply_video_observability.py'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
  workflow_dispatch:

jobs:
  vc7r-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      VC7R_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
      GOLDEN_FONT_SHA256: 7d835faaed37ae93d2bb783604453ad8d13d994f1c97074182ec040c6a29b99c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - name: Install pinned-class reconstruction dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Verify reconstruction font inputs
        id: fonts
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test -f "$LATIN"
          test -f "$CJK"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          echo "latin=$LATIN" >> "$GITHUB_OUTPUT"
          echo "cjk=$CJK" >> "$GITHUB_OUTPUT"

      - name: Assemble VC6 foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc7r" sh scripts/vc6_png_iccp_assemble.sh
          echo "VC7R=$RUNNER_TEMP/vc7r" >> "$GITHUB_ENV"

      - name: Apply VC7 safe text raster overlay
        run: |
          set -euo pipefail
          python3 scripts/vc7_apply_golden_font.py "$VC7R/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Generate and stage reconstructed Unicode resource
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vc7r-font" "$VC7R/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py \
            --font '${{ steps.fonts.outputs.latin }}' \
            --font '${{ steps.fonts.outputs.cjk }}#0' \
            --out "$RUNNER_TEMP/vc7r-font/rg35xx-font.bin" \
            --manifest "$RUNNER_TEMP/vc7r-font/manifest.json" \
            | tee "$RUNNER_TEMP/vc7r-font/generator.log"
          test "$(stat -c%s "$RUNNER_TEMP/vc7r-font/rg35xx-font.bin")" = '727008'
          test "$(sha256sum "$RUNNER_TEMP/vc7r-font/rg35xx-font.bin" | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          test "$VC7R_FONT_SHA256" != "$GOLDEN_FONT_SHA256"
          cp "$RUNNER_TEMP/vc7r-font/rg35xx-font.bin" "$VC7R/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Compile VC7R Java 6 runtime
        run: |
          set -euo pipefail
          cd "$VC7R"
          ant
          python3 - "$VC7R/build/classes" <<'PY'
          import os, struct, sys
          root=sys.argv[1]
          count=0
          for base, _, files in os.walk(root):
              for name in files:
                  if not name.endswith('.class'): continue
                  count += 1
                  p=os.path.join(base,name)
                  h=open(p,'rb').read(8)
                  if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe':
                      raise SystemExit('bad class header: '+p)
                  major=struct.unpack('>H',h[6:8])[0]
                  if major != 50:
                      raise SystemExit('class major != 50: %s:%d' % (p,major))
          if count == 0: raise SystemExit('no classes')
          print('VC7R_CLASS_COUNT=%d' % count)
          print('VC7R_JAVA_MAJOR=50')
          PY

      - name: Verify runtime resource and text-path contract
        run: |
          set -euo pipefail
          JAR="$VC7R/build/freej2me_plus-lr.jar"
          PG="$VC7R/src/org/recompile/mobile/PlatformGraphics.java"
          jar tf "$JAR" | grep -Fx 'org/recompile/mobile/rg35xx-font.bin'
          rm -rf "$RUNNER_TEMP/jarcheck"
          mkdir -p "$RUNNER_TEMP/jarcheck"
          cd "$RUNNER_TEMP/jarcheck"
          jar xf "$JAR" org/recompile/mobile/rg35xx-font.bin
          test "$(stat -c%s org/recompile/mobile/rg35xx-font.bin)" = '727008'
          test "$(sha256sum org/recompile/mobile/rg35xx-font.bin | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          grep -Fq 'rg35xxDrawSafeText(str, x, y - ascent, anchor);' "$PG"
          ! grep -Fq 'gc.drawString(str, x, y);' "$PG"
          grep -Fq 'RG35XX-PNG-ICCP: stripped ancillary iCCP chunk' "$VC7R/src/org/recompile/mobile/PlatformImage.java"
          ! grep -R -Fq 'RG35XX-MediaWarmup' "$VC7R/src"

      - name: Package VC7R runtime artifact
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r-runtime-artifact"
          mkdir -p "$OUT"
          cp "$VC7R/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr-vc7r.jar"
          cp "$RUNNER_TEMP/vc7r-font/manifest.json" "$OUT/VC7R-FONT-MANIFEST.json"
          cp "$RUNNER_TEMP/vc7r-font/generator.log" "$OUT/VC7R-FONT-GENERATOR.log"
          RUNTIME_SHA=$(sha256sum "$OUT/freej2me-lr-vc7r.jar" | awk '{print $1}')
          printf '%s\n' \
            'RG35XX VERIFIED CLEAN VC7R RECONSTRUCTED RUNTIME' \
            'STATUS=BUILD-PASS-RECONSTRUCTED-NOT-GOLDEN' \
            "FREEJ2ME_PIN=$FREEJ2ME_PIN" \
            "VC7R_RUNTIME_SHA256=$RUNTIME_SHA" \
            "VC7R_FONT_SHA256=$VC7R_FONT_SHA256" \
            'VC7R_FONT_BYTES=727008' \
            'VC7R_FONT_FALLBACK_RECORDS=57' \
            'EXACT_GOLDEN_MATCH=NO' \
            'GOLDEN_BASELINE_STATUS=UNCHANGED-BLOCKED-BY-LOST-BINARY' \
            'DEVICE_TEST=PENDING' > "$OUT/STATUS.txt"
          (cd "$OUT" && sha256sum freej2me-lr-vc7r.jar VC7R-FONT-MANIFEST.json VC7R-FONT-GENERATOR.log STATUS.txt) > "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r-reconstructed-runtime
          path: ${{ runner.temp }}/vc7r-runtime-artifact
          retention-days: 30

      - name: Build status
        run: |
          printf '%s\n' \
            'VC7R_RUNTIME_BUILD=PASS' \
            'VC7R_FONT_STATUS=RECONSTRUCTED-NOT-GOLDEN' \
            "VC7R_FONT_SHA256=$VC7R_FONT_SHA256" \
            'VC7R_DEVICE_TEST=PENDING'
