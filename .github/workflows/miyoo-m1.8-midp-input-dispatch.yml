name: Miyoo M1.8 MIDP Input Dispatch

on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_8/**'
      - 'miyoo-m1/m1_7_input_jni.c'
      - '.github/workflows/miyoo-m1.8-midp-input-dispatch.yml'

jobs:
  m1_8_dispatch_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify M1.7 raw input is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum miyoo-m1/m1_7_input_jni.c | awk '{print $1}')" = "34e0e19297a3c7e32520e0684ce7031f361fc8bcbf585093149dc8db7f39d603"
          grep -q 'Java_M17InputProbe_openInput' miyoo-m1/m1_7_input_jni.c
          grep -q 'Java_M17InputProbe_waitControl' miyoo-m1/m1_7_input_jni.c
          grep -q 'Java_M17InputProbe_closeInput' miyoo-m1/m1_7_input_jni.c

      - name: Verify M1.8 native single-owner semantic bridge
        shell: bash
        run: |
          set -euo pipefail
          F=miyoo-m1/m1_8/m1_8_input_jni.c
          test "$(grep -c 'open(\"/dev/input/js0\"' "$F")" -eq 1
          test "$(grep -c 'Java_org_recompile_mobile_M1Input_rawGetState' "$F")" -eq 1
          grep -q 'O_RDONLY | O_NONBLOCK' "$F"
          grep -q 'e->number == 6' "$F"
          grep -q 'e->number == 7' "$F"
          grep -q 'axis7 < -16000' "$F"
          grep -q 'axis7 >  16000' "$F"
          grep -q 'axis6 < -16000' "$F"
          grep -q 'axis6 >  16000' "$F"
          ! grep -q 'poll(' "$F"
          ! grep -q 'printf\|fprintf\|syslog' "$F"

      - name: Compile native bridge on host JNI ABI
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(command -v javac))))}"
          gcc -std=c99 -Wall -Wextra -Werror -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -c miyoo-m1/m1_8/m1_8_input_jni.c -o /tmp/m1_8_input_jni.o
          nm /tmp/m1_8_input_jni.o | grep -q 'Java_org_recompile_mobile_M1Input_rawGetState'

      - name: Checkout canonical FreeJ2ME-Plus source pin
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD)" = "13ec186903087156c145268f8706eecfaf9f1e50"
          test "$(git -C upstream rev-parse HEAD^{tree})" = "ad47ab16e9025f0eb3d2067bc3b1897dc71987df"

      - name: Verify canonical MIDP event owner contract
        shell: bash
        run: |
          set -euo pipefail
          MP=upstream/src/org/recompile/mobile/MobilePlatform.java
          LR=upstream/src/org/recompile/freej2me/Libretro.java
          grep -q 'public static void keyPressed(final int keycode)' "$MP"
          grep -q 'public static void keyReleased(final int keycode)' "$MP"
          grep -q 'public static void keyRepeated(final int keycode)' "$MP"
          grep -q 'updateKeyState(Mobile.getGameAction(keycode), true)' "$MP"
          grep -q 'updateKeyState(Mobile.getGameAction(keycode), false)' "$MP"
          grep -q 'displayable.keyPressed(keycode)' "$MP"
          grep -q 'displayable.keyReleased(keycode)' "$MP"
          grep -q 'displayable.keyRepeated(keycode)' "$MP"
          grep -q 'MobilePlatform.keyPressed(Mobile.getMobileKey(code))' "$LR"
          grep -q 'MobilePlatform.keyReleased(Mobile.getMobileKey(code))' "$LR"

      - name: Compile adapter against canonical FreeJ2ME-Plus pin
        shell: bash
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/M1Input.java
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/M1InputDispatch.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant
          (cd upstream && rm -rf build && ant)
          test -f upstream/build/freej2me_plus-lr.jar
          jar tf upstream/build/freej2me_plus-lr.jar | grep -q 'org/recompile/mobile/M1Input.class'
          jar tf upstream/build/freej2me_plus-lr.jar | grep -q 'org/recompile/mobile/M1InputDispatch.class'

      - name: Static single-dispatch and bounded-repeat gates
        shell: bash
        run: |
          set -euo pipefail
          F=miyoo-m1/m1_8/M1InputDispatch.java
          test "$(grep -c 'M1Input.rawGetState()' "$F")" -eq 1
          test "$(grep -c 'platform.keyPressed(key)' "$F")" -eq 1
          test "$(grep -c 'platform.keyReleased(key)' "$F")" -eq 1
          test "$(grep -c 'platform.keyRepeated(key)' "$F")" -eq 1
          ! grep -q 'getDisplay().getCurrent()' "$F"
          grep -q 'REPEAT_DELAY_MS = 400' "$F"
          grep -q 'REPEAT_PERIOD_MS = 100' "$F"
          grep -q 'At most one repeat per poll' "$F"

      - name: Package M1.8 canonical-pin checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp upstream/build/freej2me_plus-lr.jar out/freej2me_plus-m1.8-dispatch-gate.jar
          cp miyoo-m1/m1_7_input_jni.c out/
          cp miyoo-m1/m1_8/M1Input.java out/
          cp miyoo-m1/m1_8/M1InputDispatch.java out/
          cp miyoo-m1/m1_8/m1_8_input_jni.c out/
          sha256sum out/* | tee out/SHA256SUMS.txt
          cat > out/STATUS.txt <<'EOF'
          M1.8 MIDP Input Dispatch — canonical source-pin gate
          Upstream: TASEmulators/freej2me-plus
          Pin: 13ec186903087156c145268f8706eecfaf9f1e50
          Tree: ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          CI result: BUILD-PASS only when this workflow succeeds.
          Device status: DEVICE-TEST-PENDING.
          M1.7 raw js0 probe source is preserved byte-for-byte by SHA gate.
          M1.8 native bridge has one persistent nonblocking js0 owner.
          MobilePlatform remains the sole MIDP event owner.
          This artifact is not yet production-integrated into Libretro.java and is not DEVICE-PASS.
          No audio/video/font/transparency changes are included.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.8-midp-input-dispatch
          path: out/
          if-no-files-found: error
