name: Verified Clean VC7R22-R1 Worker-Ring Reconstruction

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r22r1-worker-ring.yml'
      - 'scripts/vc7r22r1_apply_worker_ring.py'
      - 'scripts/vc7r3_apply_native_audio.py'
      - 'scripts/vc7r3_apply_java_media_events.py'
      - 'scripts/vc7r2_apply_proven_dynamic_view.py'
      - 'scripts/vc7r_reconstruct_font.py'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'native/**'
      - 'tasklog/VC7R22-R1-GOLDEN-WORKER-RING-SOURCE-RECONSTRUCTION.md'
  workflow_dispatch:

jobs:
  worker-ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      VC7R_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install pinned build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Assemble accepted VC7R2 video foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc7r22r1" sh scripts/vc6_png_iccp_assemble.sh
          echo "R1=$RUNNER_TEMP/vc7r22r1" >> "$GITHUB_ENV"
          python3 scripts/vc7r2_apply_proven_dynamic_view.py "$RUNNER_TEMP/vc7r22r1/src/org/recompile/freej2me/Libretro.java"
          python3 scripts/vc7_apply_golden_font.py "$RUNNER_TEMP/vc7r22r1/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Reconstruct same verified font resource for build compatibility
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/vc7r22r1-font" "$R1/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/vc7r22r1-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/vc7r22r1-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/vc7r22r1-font/rg35xx-font.bin" | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          cp "$RUNNER_TEMP/vc7r22r1-font/rg35xx-font.bin" "$R1/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Materialize pinned historical media implementation
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$R1/src/org/recompile/mobile" "$R1/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do
            cp "history/src/org/recompile/mobile/$f" "$R1/src/org/recompile/mobile/$f"
          done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do
            cp "history/native/$f" "$R1/src/libretro/rg35xx/$f"
          done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R1/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R1/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Apply Java media facade and VC7R3 native foundation
        run: |
          set -euo pipefail
          python3 - "$R1/src/org/recompile/mobile/PlatformPlayer.java" "$R1/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do
            patch -d "$R1" -p1 --batch --forward --fuzz=0 < "history/patches/$p"
          done
          python3 scripts/vc7r3_apply_native_audio.py "$R1/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$R1/src/org/recompile/freej2me/Libretro.java" "$R1/src/org/recompile/mobile/PlatformPlayer.java" "$R1/src/javax/microedition/media/Manager.java"

      - name: Replace frame-coupled owner with R1 async worker-ring
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r1_apply_worker_ring.py "$R1/src/libretro/freej2me_libretro.c"

      - name: Wire native media modules without touching accepted video owner
        run: |
          set -euo pipefail
          cat >> "$R1/src/libretro/Makefile.common" <<'EOF'

          # VC7R22-R1 media modules. Video remains accepted Golden-style receiver/Smart-Fit.
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Java 6 build compatibility gate
        run: |
          set -euo pipefail
          cd "$R1"
          ant
          python3 - "$R1/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for b,_,fs in os.walk(sys.argv[1]):
            for f in fs:
              if not f.endswith('.class'): continue
              n+=1
              h=open(os.path.join(b,f),'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50:
                raise SystemExit('Java major gate failed: '+os.path.join(b,f))
          print('VC7R22R1_CLASS_COUNT=%d'%n)
          PY

      - name: Build ARMv5TE uClibc core
        run: |
          set -euo pipefail
          cd "$R1/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'

      - name: Fail-closed architecture gate
        run: |
          set -euo pipefail
          C="$R1/src/libretro/freej2me_libretro.c"
          CORE="$R1/src/libretro/freej2me_plus_libretro.so"
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/r1-elf.txt
          grep -q 'Class:.*ELF32' /tmp/r1-elf.txt
          grep -q 'Machine:.*ARM' /tmp/r1-elf.txt
          grep -q 'Version5 EABI' /tmp/r1-elf.txt
          grep -q 'soft-float ABI' /tmp/r1-elf.txt
          grep -Fq 'RETRO_PIXEL_FORMAT_RGB565' "$C"
          grep -Fq 'rg35xx_golden_video_present(' "$C"
          grep -Fq 'RG35XX-VC7R22R1-WORKER-RING' "$C"
          grep -Fq '#define RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq '#define RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          grep -Fq 'RETRO_ENVIRONMENT_SET_AUDIO_CALLBACK' "$C"
          grep -Fq 'RG35XX-AUDIO: async callback registered=%d' "$C"
          grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470' "$C"
          grep -Fq 'RG35XX-AUDIO: underrun queued=0; re-prime target=3072' "$C"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470'
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: async callback registered=%d'
          echo 'VC7R22R1_ARCHITECTURE_GATE=PASS'

      - name: Package experimental core only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r22r1-artifact"
          mkdir -p "$OUT"
          cp "$R1/src/libretro/freej2me_plus_libretro.so" "$OUT/freej2me_plus_libretro-vc7r22r1.so"
          CORE_SHA=$(sha256sum "$OUT/freej2me_plus_libretro-vc7r22r1.so" | awk '{print $1}')
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=CI-BUILD-PASS-DEVICE-TEST-PENDING
          CHECKPOINT=VC7R22-R1-GOLDEN-WORKER-RING-SOURCE-RECONSTRUCTION
          CORE_SHA256=$CORE_SHA
          GOLDEN_HASH_MATCH=NO_CLAIM
          CN_HASH_MATCH=NO_CLAIM
          AUDIO_OWNERSHIP=ASYNC_CALLBACK_WORKER_RING
          RING_FRAMES=16384
          PRIME_FRAMES=3072
          WORKER_CHUNK=1470
          RETRO_RUN_AUDIO_PUMP=REMOVED
          SYNTH_PATH=HISTORICAL_44100_STEREO
          GOLDEN_14700_MONO_X3=DEFERRED_TO_R2
          VC7R21_RUNTIME_REPLACEMENT=NO
          DEVICE_TEST=PENDING
          EOF
          (cd "$OUT" && sha256sum freej2me_plus_libretro-vc7r22r1.so STATUS.txt > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r22r1-worker-ring-core
          path: ${{ runner.temp }}/vc7r22r1-artifact
          retention-days: 30
