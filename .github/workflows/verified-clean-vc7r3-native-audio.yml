name: Verified Clean VC7R3 Native Audio Build

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r3-native-audio.yml'
      - 'scripts/vc7r3_apply_native_audio.py'
      - 'scripts/vc7r3_apply_java_media_events.py'
      - 'scripts/vc7r2_apply_proven_dynamic_view.py'
      - 'scripts/vc7r_reconstruct_font.py'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
      - 'docs/VC7R3-NATIVE-AUDIO-RECOVERY-AUDIT.md'
  workflow_dispatch:

jobs:
  vc7r3-native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      VC7R_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Assemble VC7R2 proven-view Java/video foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc7r3" sh scripts/vc6_png_iccp_assemble.sh
          echo "VC7R3=$RUNNER_TEMP/vc7r3" >> "$GITHUB_ENV"
          python3 scripts/vc7r2_apply_proven_dynamic_view.py "$RUNNER_TEMP/vc7r3/src/org/recompile/freej2me/Libretro.java"
          python3 scripts/vc7_apply_golden_font.py "$RUNNER_TEMP/vc7r3/src/org/recompile/mobile/PlatformGraphics.java"
      - name: Generate same reconstructed VC7R font resource
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/vc7r3-font" "$VC7R3/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/vc7r3-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/vc7r3-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/vc7r3-font/rg35xx-font.bin" | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          cp "$RUNNER_TEMP/vc7r3-font/rg35xx-font.bin" "$VC7R3/resources/org/recompile/mobile/rg35xx-font.bin"
      - name: Materialize pinned historical media implementation only
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$VC7R3/src/org/recompile/mobile" "$VC7R3/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do
            cp "history/src/org/recompile/mobile/$f" "$VC7R3/src/org/recompile/mobile/$f"
          done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do
            cp "history/native/$f" "$VC7R3/src/libretro/rg35xx/$f"
          done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$VC7R3/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$VC7R3/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"
      - name: Apply media facade then current-foundation native/event overlays
        run: |
          set -euo pipefail
          # The pinned FreeJ2ME Java sources use CRLF in some files. Historical
          # executable diffs are LF. Normalize only these disposable assembly
          # patch targets; this is not a semantic source mutation.
          python3 - "$VC7R3/src/org/recompile/mobile/PlatformPlayer.java" "$VC7R3/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name)
              b=p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              p.write_bytes(b)
              print('VC7R3 LINE-ENDINGS=NORMALIZED', name)
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do
            echo "APPLY $p"
            patch -d "$VC7R3" -p1 --batch --forward --fuzz=0 < "history/patches/$p"
          done
          python3 scripts/vc7r3_apply_native_audio.py "$VC7R3/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$VC7R3/src/org/recompile/freej2me/Libretro.java" "$VC7R3/src/org/recompile/mobile/PlatformPlayer.java" "$VC7R3/src/javax/microedition/media/Manager.java"
      - name: Wire native media sources without replacing accepted video owner
        run: |
          set -euo pipefail
          cat >> "$VC7R3/src/libretro/Makefile.common" <<'EOF'

          # VC7R3 target-native media only. Video remains accepted Golden-style receiver/Smart-Fit.
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF
      - name: Java contract and Java 6 build
        run: |
          set -euo pipefail
          grep -Fq 'RG35XX-VC7R2-VIEW:' "$VC7R3/src/org/recompile/freej2me/Libretro.java"
          grep -Fq 'RG35XX-VC7R3-MEDIA-EVENT' "$VC7R3/src/org/recompile/freej2me/Libretro.java"
          grep -Fq 'VC7R3 lazy media bootstrap' "$VC7R3/src/org/recompile/mobile/PlatformPlayer.java"
          grep -Fq 'RG35XX tone transport unavailable' "$VC7R3/src/javax/microedition/media/Manager.java"
          ! grep -Rq 'RG35XX-CV' "$VC7R3/src"
          cd "$VC7R3" && ant
          python3 - "$VC7R3/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for b,_,fs in os.walk(sys.argv[1]):
            for f in fs:
              if not f.endswith('.class'): continue
              n+=1; h=open(os.path.join(b,f),'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50: raise SystemExit('Java major gate failed: '+os.path.join(b,f))
          print('VC7R3_CLASS_COUNT=%d'%n)
          PY
      - name: Build ARM native core
        run: |
          set -euo pipefail
          cd "$VC7R3/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
      - name: Strict VC7R3 architecture gate
        run: |
          set -euo pipefail
          CORE="$VC7R3/src/libretro/freej2me_plus_libretro.so"; JAR="$VC7R3/build/freej2me_plus-lr.jar"; C="$VC7R3/src/libretro/freej2me_libretro.c"
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/vc7r3-elf.txt
          grep -q 'Class:.*ELF32' /tmp/vc7r3-elf.txt
          grep -q 'Machine:.*ARM' /tmp/vc7r3-elf.txt
          grep -q 'Version5 EABI' /tmp/vc7r3-elf.txt
          grep -q 'soft-float ABI' /tmp/vc7r3-elf.txt
          grep -Fq 'RETRO_PIXEL_FORMAT_RGB565' "$C"
          grep -Fq 'rg35xx_golden_video_present(' "$C"
          grep -Fq 'RG35XX-VC7R3-AUDIO-NATIVE' "$C"
          grep -Fq -- '-Dfreej2me.rg35xx.audio.fd=%d' "$C"
          grep -Fq 'AudioBatch(rg35xx_audio_run_buffer,frames);' "$C"
          grep -Fq 'rg35xx_mixer_render' "$C"
          ! grep -Rq 'RG35XX-CV' "$VC7R3/src"
          jar tf "$JAR" | grep -Fx 'org/recompile/mobile/rg35xx-font.bin'
          echo 'VC7R3_ARCHITECTURE_GATE=PASS'
      - name: Package device-test payload
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r3-artifact"; mkdir -p "$OUT"
          cp "$VC7R3/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr-vc7r3.jar"
          cp "$VC7R3/src/libretro/freej2me_plus_libretro.so" "$OUT/freej2me_plus_libretro-vc7r3.so"
          cp "$RUNNER_TEMP/vc7r3-font/manifest.json" "$OUT/VC7R3-FONT-MANIFEST.json"
          J=$(sha256sum "$OUT/freej2me-lr-vc7r3.jar"|awk '{print $1}')
          C=$(sha256sum "$OUT/freej2me_plus_libretro-vc7r3.so"|awk '{print $1}')
          printf '%s\n' 'RG35XX VC7R3 NATIVE AUDIO RECOVERY' 'STATUS=BUILD-PASS-DEVICE-TEST-PENDING' "RUNTIME_SHA256=$J" "CORE_SHA256=$C" 'VC7R2_DYNAMIC_VIEW=PRESERVED' 'RGB565_GOLDEN_STYLE_VIDEO=PRESERVED' 'NATIVE_AUDIO=MIDI_PCM_DEDICATED_FD' 'SOUNDFONT=/mnt/mmc/BIOS/freej2me.sf2' 'FONT_STATUS=RECONSTRUCTED-NOT-GOLDEN' 'DEVICE_TEST=PENDING' > "$OUT/STATUS.txt"
          (cd "$OUT" && sha256sum freej2me-lr-vc7r3.jar freej2me_plus_libretro-vc7r3.so VC7R3-FONT-MANIFEST.json STATUS.txt) > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r3-native-audio-device-test
          path: ${{ runner.temp }}/vc7r3-artifact
          retention-days: 30
