name: P1A Complete Graphics Candidate R3

on:
  push:
    branches:
      - p1a-complete-graphics-candidate
    paths:
      - '.github/workflows/p1a-complete-graphics-candidate-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-complete-graphics-host-r3:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout production branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact D6 production ancestry and single-pass owner scope
        shell: bash
        run: |
          set -euo pipefail
          D6=093aae62d7caca2941258592c72dfc25b1f204a7
          git merge-base --is-ancestor "$D6" HEAD
          [ "$(git merge-base "$D6" HEAD)" = "$D6" ]
          changed="$(git diff --name-only "$D6"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p1a-complete-graphics-candidate-r2.yml\n.github/workflows/p1a-complete-graphics-candidate-r3.yml\n.github/workflows/p1a-complete-graphics-candidate.yml\nscripts/build-p1a-complete-graphics-candidate.sh\nscripts/stage-p1a-complete-graphics-g4g5.py\ntests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java'
          [ "$changed" = "$expected" ] || { echo "P1A_COMPLETE_GRAPHICS_R3_BRANCH_SCOPE_FAIL=$changed" >&2; exit 1; }
          if git log --format=%H "$D6"..HEAD | grep -Eq '09ac133c24242f6dfa266e8fb3d506b1550ee194|c0a958277dbb6b0cf8de42bff2c70083c789566f'; then
            echo P1A_COMPLETE_GRAPHICS_R3_FAIL=diagnostic_branch_became_parent >&2
            exit 1
          fi
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P1A_COMPLETE_GRAPHICS_R3_D6_ANCESTRY=PASS
          echo P1A_COMPLETE_GRAPHICS_R3_DIAGNOSTIC_PARENT=NO
          echo P1A_COMPLETE_GRAPHICS_R3_SINGLE_PASS=YES

      - name: Materialize A4 raw2D baseline once
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain once
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters once
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay once
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build and gate complete graphics candidate in one pass
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-complete-graphics-candidate.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-complete-graphics-candidate.sh | tee /tmp/p1a-complete-graphics-r3.log
          grep -q '^P1A_COMPLETE_GRAPHICS_BUILD=PASS$' /tmp/p1a-complete-graphics-r3.log
          ID=out/p1a-complete-graphics-candidate/P1A-COMPLETE-GRAPHICS-IDENTITY.txt
          test -f "$ID"
          grep -q '^WORK_UNIT=P1A-COMPLETE-GRAPHICS-CANDIDATE$' "$ID"
          grep -q '^G4G5_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^G4G5_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^DIAGNOSTIC_BRANCH_PARENT=NO$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^NATIVE_CHANGE=NO$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^SPECULATIVE_OPTIMIZATION=NO$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P1A_COMPLETE_GRAPHICS_R3_HOST_WORKFLOW_GATE=PASS

      - name: Upload single-pass host candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-COMPLETE-GRAPHICS-CANDIDATE-R3-${{ github.sha }}
          path: out/p1a-complete-graphics-candidate/
          if-no-files-found: error
