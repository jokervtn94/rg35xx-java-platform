name: RG35XX Miyoo M1.8 MIDP Input Dispatch
on:
  workflow_dispatch:
  push:
    branches: [rg35xx-miyoo-platform-v1]
    paths: ['miyoo-m1/M18*','miyoo-m1/m1_8_input_jni.c','miyoo-m1/M1.8-DEVICE-TEST.sh','tasklog/MIYOO-M1.8-MIDP-INPUT-DISPATCH-PREFLIGHT.md','.github/workflows/miyoo-m1.8-midp-input-dispatch.yml']
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Tasklog-first gate
        run: |
          set -euo pipefail
          grep -Fq 'HISTORY_FOUND = YES' tasklog/MIYOO-M1.8-MIDP-INPUT-DISPATCH-PREFLIGHT.md
          grep -Fq 'CONNECT_M1.7_LOCKED_RAW_JS0_SEMANTIC_EVENTS_TO_EXISTING_FREEJ2ME_MOBILEPLATFORM_MIDP_KEY_DISPATCH_ONLY' tasklog/MIYOO-M1.8-MIDP-INPUT-DISPATCH-PREFLIGHT.md
      - name: Install Java8 and pinned toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"; cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1||true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Rebuild pinned Java5 FreeJ2ME slice
        run: |
          set -euo pipefail
          chmod +x miyoo-m1/M1.4A.8-mymethodvisitor-java5-audit.sh
          miyoo-m1/M1.4A.8-mymethodvisitor-java5-audit.sh build-m1.8-slice | tee m1.8-slice.log
          grep -q 'M1_4A_8_RESULT=PASS' m1.8-slice.log
      - name: Compile M1.8 adapter and device probe
        run: |
          set -euo pipefail
          J=/usr/lib/jvm/java-8-openjdk-amd64/bin
          "$J/javac" -source 5 -target 5 -cp build-m1.8-slice/classes -d build-m1.8-slice/classes miyoo-m1/M18SemanticKeyAdapter.java miyoo-m1/M18AdapterContractProbe.java miyoo-m1/M18DeviceDispatchProbe.java
          "$J/java" -cp build-m1.8-slice/classes org.recompile.mobile.M18AdapterContractProbe | tee m1.8-adapter.log
          grep -q 'M1_8_ADAPTER_CONTRACT=PASS' m1.8-adapter.log
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('build-m1.8-slice/classes').rglob('*.class'):
              if int.from_bytes(p.read_bytes()[6:8],'big')!=49: bad.append(str(p))
          assert not bad,bad
          print('CLASS_MAJOR_49_ONLY=YES')
          PY
          "$J/jar" cf m1.8-freej2me-dispatch.jar -C build-m1.8-slice/classes .
      - name: Build ARM uClibc JNI transition bridge
        run: |
          set -euo pipefail
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_8_input_jni.c -o libm1_8_input.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip libm1_8_input.so
          readelf -h libm1_8_input.so | tee ELF-HEADER.txt; readelf -A libm1_8_input.so | tee ELF-ATTRIBUTES.txt || true
          grep -q 'Class:.*ELF32' ELF-HEADER.txt; grep -q 'Machine:.*ARM' ELF-HEADER.txt; grep -q 'Version5 EABI' ELF-HEADER.txt; grep -q 'soft-float ABI' ELF-HEADER.txt
      - name: Scope and ownership gates
        run: |
          set -euo pipefail
          grep -Fq '/dev/input/js0' miyoo-m1/m1_8_input_jni.c
          grep -Fq 'platform.keyPressed(toMidpKey(control))' miyoo-m1/M18SemanticKeyAdapter.java
          grep -Fq 'platform.keyReleased(toMidpKey(control))' miyoo-m1/M18SemanticKeyAdapter.java
          grep -Fq 'platform.keyRepeated(toMidpKey(control))' miyoo-m1/M18SemanticKeyAdapter.java
          ! grep -Eq 'SDL|audio|mixer|fbcon' miyoo-m1/m1_8_input_jni.c
          sha256sum m1.8-freej2me-dispatch.jar libm1_8_input.so | tee M1.8-SHA256.txt
      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.8-midp-input-dispatch"; APP="$OUT/Roms/APPS"; mkdir -p "$APP" "$OUT/evidence"
          cp m1.8-freej2me-dispatch.jar libm1_8_input.so miyoo-m1/M1.8-DEVICE-TEST.sh "$APP/"; chmod +x "$APP/M1.8-DEVICE-TEST.sh"
          cp M1.8-SHA256.txt ELF-HEADER.txt ELF-ATTRIBUTES.txt m1.8-adapter.log "$OUT/evidence/"; cp tasklog/MIYOO-M1.8-MIDP-INPUT-DISPATCH-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' 'M1.8: raw js0 -> semantic adapter -> actual FreeJ2ME MobilePlatform owner.' 'Merge Roms into SD root. Run M1.8-DEVICE-TEST.sh.' 'For each prompted control PRESS then RELEASE.' 'This checkpoint intentionally keeps Canvas callback gate pending; BUILD-PASS is not DEVICE-PASS.' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum)>"$OUT/PACKAGE-SHA256SUMS.txt"; (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"; echo M1_8_BUILD_PASS=YES; echo DEVICE_PASS=NO; echo STABLE=NO
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.8-midp-input-dispatch
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
