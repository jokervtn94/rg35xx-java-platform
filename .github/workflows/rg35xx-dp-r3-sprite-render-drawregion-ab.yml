name: RG35XX DP-R3 Sprite Render drawRegion AB
on:
  workflow_dispatch:
  push:
    branches: [dp-r3-sprite-render-drawregion-ab]
    paths:
      - '.github/workflows/rg35xx-dp-r3-sprite-render-drawregion-ab.yml'
      - 'rebuild-v3/**'
      - 'docs/DP-R3-SPRITE-RENDER-DRAWREGION-AB.md'
jobs:
  sprite-render-ab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant unzip >/dev/null
      - name: Materialize pinned Miyoo ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Build DP-R3 Sprite render A/B
        run: bash rebuild-v3/build_sprite_render_ab.sh
      - name: Publish identity
        run: |
          cat out/dp-r3/BUILD-IDENTITY.txt
          echo '--- SHA256SUMS ---'
          cat out/dp-r3/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-dp-r3-sprite-render-drawregion-ab
          path: out/dp-r3/
          if-no-files-found: error
