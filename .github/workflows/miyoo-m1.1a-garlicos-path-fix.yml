name: RG35XX Miyoo M1.1A GarlicOS Path Fix

on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - '.github/workflows/miyoo-m1.1a-garlicos-path-fix.yml'
      - 'miyoo-m1/m1_1_sdl2_probe.c'
      - 'miyoo-m1/M1.1A-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.1A-GARLICOS-PATH-FIX-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Gate rules and M1.1A preflight
        run: |
          set -euo pipefail
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.1A-GARLICOS-PATH-FIX-PREFLIGHT.md
          grep -Fq 'FAILURE_CLASS: PACKAGING_PATH_MISMATCH' tasklog/MIYOO-M1.1A-GARLICOS-PATH-FIX-PREFLIGHT.md
          grep -Fq 'Primary variable: GarlicOS package/launcher path only.' tasklog/MIYOO-M1.1A-GARLICOS-PATH-FIX-PREFLIGHT.md
          sh -n miyoo-m1/M1.1A-DEVICE-TEST.sh

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Rebuild unchanged M1.1 probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.1a
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc \
            -Os -pipe -fno-strict-aliasing \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -Wall -Wextra \
            miyoo-m1/m1_1_sdl2_probe.c \
            -Wl,--as-needed -ldl \
            -o build-m1.1a/m1_1_sdl2_probe
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.1a/m1_1_sdl2_probe
          sha256sum build-m1.1a/m1_1_sdl2_probe | tee build-m1.1a/PROBE-SHA256.txt
          grep -Fq '568e96e8264244dbd74f72d601bb3cad4487793c789bbc76f5016c8f499b3f77' build-m1.1a/PROBE-SHA256.txt

      - name: Strict unchanged ELF gate
        run: |
          set -euo pipefail
          readelf -h build-m1.1a/m1_1_sdl2_probe | tee build-m1.1a/ELF-HEADER.txt
          grep -q 'Class:.*ELF32' build-m1.1a/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.1a/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.1a/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.1a/ELF-HEADER.txt

      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.1a-garlicos-path-fix"
          APP="$OUT/Roms/APPS"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.1a/m1_1_sdl2_probe "$APP/"
          cp miyoo-m1/M1.1A-DEVICE-TEST.sh "$APP/"
          chmod +x "$APP/m1_1_sdl2_probe" "$APP/M1.1A-DEVICE-TEST.sh"
          cp build-m1.1a/ELF-HEADER.txt build-m1.1a/PROBE-SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.1A-GARLICOS-PATH-FIX-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' \
            'RG35XX MIYOO M1.1A GARLICOS PATH FIX' \
            'Copy the Roms folder to the GarlicOS SD root and merge.' \
            'Files intentionally install directly into Roms/APPS.' \
            'Run: Apps -> M1.1A-DEVICE-TEST.sh' \
            'Result: /mnt/mmc/RG35XX-MIYOO-M1.1A-DEVICE-RESULT.txt' \
            '' \
            'Primary delta: packaging/launcher path only.' \
            'Probe SHA256 is identical to M1.1.' \
            'No existing Java platform file is replaced.' \
            'DEVICE-PASS=NO' \
            'STABLE=NO' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload M1.1A package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.1a-garlicos-path-fix
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
