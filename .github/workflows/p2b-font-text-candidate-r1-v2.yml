name: P2B Font Text Candidate R1 V2

on:
  push:
    branches:
      - module/p2b-font-text-candidate-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2b-font-text-host-module-v2:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ACCEPTED_P2A: 5a8bfdf12d42e49d5d4aa8260601799c904e6441
      CANONICAL_AWEIGIT: ca11dfe8ea1cc273d92460f9a83bbf192023fa63
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout candidate and canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact P2A ancestry and P2B-only repository scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$ACCEPTED_P2A" HEAD)" = "$ACCEPTED_P2A"
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = "$CANONICAL_AWEIGIT"
          git diff --name-only "$ACCEPTED_P2A"..HEAD | LC_ALL=C sort | tee /tmp/p2b-r1-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|adapter/native/rg35xx_font_jdk8\.(c|cc|cpp|h|hpp)|scripts/stage-p2b-font-text\.py|scripts/build-p2b-font-text-candidate(-v2)?\.sh|tests/p2b/RG35XXP2BFontText(Host|Module)Gate\.java|\.github/workflows/p2b-font-text-candidate-r1(-v2)?\.yml)$' /tmp/p2b-r1-files.txt | grep -q .; then
            echo P2B_R1_REPOSITORY_SCOPE=FAIL
            exit 1
          fi
          ! git diff --name-only "$ACCEPTED_P2A"..HEAD | grep -E '^(upstream/|adapter/native/rg35xx_(input|video|audio)|packaging/|scripts/stage-a[0-9]|scripts/build-a[0-9])'
          test -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)"
          echo P2B_R1_EXACT_PARENT=PASS
          echo P2B_R1_REPOSITORY_SCOPE=PASS
          echo A9_PARENT=NO
          echo GAME_SPECIFIC_CODE=NO

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential binutils file unzip curl python3 git >/dev/null

      - name: Materialize protected pre-P2A build chain
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-a4-raw2d-java.sh
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"
          docker pull "$TOOLCHAIN_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'
          bash ./scripts/build-a5-core2d-java.sh
          echo P2B_R1_PROTECTED_PARENT_CHAIN=PASS

      - name: Install exact pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          echo P2B_R1_PINNED_TOOLCHAIN=PASS

      - name: Build and gate P2B Font Text candidate R1 V2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2b-font-text-candidate.sh scripts/build-p2b-font-text-candidate-v2.sh scripts/stage-p2b-font-text.py
          JAVA8="$JAVA_HOME" bash scripts/build-p2b-font-text-candidate-v2.sh | tee /tmp/p2b-r1-v2.log
          for marker in \
            P2B_FONT_TEXT_BUILD=PASS \
            P2B_CANONICAL_DIFF_VERIFIED=PASS \
            P2B_OWNER_SCOPE_VERIFIED=PASS \
            P2B_JAVA6_GATE=PASS \
            P2B_HOST_FONT_METRICS_GATE=PASS \
            P2B_HOST_SIMPLE_RASTER_GATE=PASS \
            P2B_HOST_COMPLEX_LAYOUT_GATE=PASS \
            P1A_GRAPHICS_PARENT_REGRESSION=PASS \
            P2A_IMAGE_PARENT_REGRESSION=PASS \
            P2B_MODULE_GATE=PASS \
            P2B_PHYSICAL_TEST=NOT_TESTED \
            RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO \
            STABLE=NO; do grep -q "^${marker}$" /tmp/p2b-r1-v2.log; done
          ID=out/p2b-font-text-candidate-r1/P2B-FONT-TEXT-IDENTITY.txt
          test -f "$ID"
          grep -q '^EXACT_ACCEPTED_PARENT=5a8bfdf12d42e49d5d4aa8260601799c904e6441$' "$ID"
          grep -q '^P2B_MODULE_GATE=PASS$' "$ID"
          grep -q '^PROTECTED_HASHES=PASS$' "$ID"
          grep -q '^PHYSICAL_TEST_REQUIRED=YES$' "$ID"
          grep -q '^P2B_PHYSICAL_TEST=NOT_TESTED$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          test ! -e out/p2b-font-text-candidate-r1/font.ttf
          test ! -e out/p2b-font-text-candidate-r1/miyoomini-freej2me.zip
          echo P2B_R1_V2_CI_GATE=PASS

      - name: Upload P2B host candidate evidence without font bytes
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-FONT-TEXT-CANDIDATE-R1-V2-${{ github.sha }}
          path: out/p2b-font-text-candidate-r1/
          if-no-files-found: error
