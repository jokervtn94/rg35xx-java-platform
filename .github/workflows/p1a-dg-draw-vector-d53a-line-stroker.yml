name: P1A DG Draw Vector D5.3A Line Stroker Diagnostic

on:
  push:
    branches:
      - p1a-dg-draw-vector-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGDrawVectorD53ALineStrokerDiagnostic.java'
      - '.github/workflows/p1a-dg-draw-vector-d53a-line-stroker.yml'
  workflow_dispatch:

jobs:
  p1a-dg-draw-vector-d53a:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify locked ancestry and diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c2b1f2b0ca99d42ef9965a24f1eb7678eca428a HEAD
          git merge-base --is-ancestor 81c34ebc67b3c0ae5b6cb695145c1bf1ce090654 HEAD
          git merge-base --is-ancestor 628b3971538bba7bbeaace5b4b646cb6906e3a72 HEAD
          echo P1A_DG_D53A_D4_HOST_PARENT_ANCESTRY=PASS
          echo P1A_DG_D53A_D51_STROKESPAN_ANCESTRY=PASS
          echo P1A_DG_D53A_D52_SUBSET_ANCESTRY=PASS
          echo P1A_DG_D53A_RUNTIME_CHANGE=NO

      - name: Compile Java6 independent line stroker diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-dg-d53a
          javac -XDignore.symbol.file -encoding UTF-8 -source 1.6 -target 1.6 \
            -d build/p1a-dg-d53a \
            tests/p1a/RG35XXDGDrawVectorD53ALineStrokerDiagnostic.java
          echo P1A_DG_D53A_JAVA6_GATE=PASS

      - name: Run independent line stroker differential
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/p1a-dg-d53a \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD53ALineStrokerDiagnostic \
            | tee build/p1a-dg-d53a/D53A-LINE-STROKER.txt
          LOG=build/p1a-dg-d53a/D53A-LINE-STROKER.txt
          grep -q '^P1A_DG_D53A_FIXED_CASE_COUNT=20$' "$LOG"
          grep -q '^P1A_DG_D53A_FUZZ_CASE_COUNT=160$' "$LOG"
          grep -q '^P1A_DG_D53A_COMPARISON_COUNT=180$' "$LOG"
          grep -q '^P1A_DG_D53A_RANDOM_SEED=35d5001$' "$LOG"
          grep -q '^P1A_DG_D53A_MASK_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53A_RECT_COUNT_MISMATCH_CASE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53A_INDEPENDENT_WIDENER=LINE_ONLY_CLOSED_MITER_W1_QUARTER_NORMALIZED$' "$LOG"
          grep -q '^P1A_DG_D53A_COMMON_RASTER=HOST_SHAPESPANITERATOR_NONZERO$' "$LOG"
          grep -q '^P1A_DG_D53A_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_DG_D53A_DIAGNOSTIC_GATE=PASS$' "$LOG"

      - name: Upload D5.3A diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-DRAW-VECTOR-D53A-${{ github.sha }}
          path: build/p1a-dg-d53a/
          if-no-files-found: error
