name: P2B Font FreeType Differential Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-freetype-differential-audit.yml'
      - 'tests/p2b/diagnostic/p2b_freetype_arm_diag.c'
      - 'tests/p2b/diagnostic/RG35XXP2BFontBackendDiagnostic.java'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkRasterStatsDiagnostic.java'
      - 'tests/p2b/diagnostic/compare_p2b_jdk_freetype.py'

permissions:
  contents: read

jobs:
  p2b-freetype-differential:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - name: Checkout exact P2A runtime parent plus audit files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up pinned diagnostic JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and repository scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=77a36526e0f6d875c57c7e9a973e0c1a05573721
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-ft-files.txt
          if grep -Ev '^(docs/P2B-FONT-TEXT-AUDIT-v1\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-ft-files.txt | grep -q .; then
            echo 'P2B_FT_AUDIT_SCOPE=FAIL'
            exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'
            exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_FT_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu-user
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          qemu-arm --version | head -n1
          echo 'P2B_QEMU_ARM=PASS'

      - name: Materialize exact pinned MiyooCFW toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc --version | head -n1
          echo 'P2B_TOOLCHAIN_PIN=PASS'

      - name: Lock exact toolchain FreeType identity and dependency chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          FT="$SYSROOT/usr/lib/libfreetype.so.6.18.1"
          test -f "$FT"
          FT_SHA=$(sha256sum "$FT" | awk '{print $1}')
          {
            echo "P2B_FREETYPE_PATH=$FT"
            echo "P2B_FREETYPE_SHA256=$FT_SHA"
            echo '--- LINKS ---'
            ls -la "$SYSROOT/usr/lib"/libfreetype* || true
            echo '--- FILE ---'
            file "$FT"
            echo '--- ELF HEADER ---'
            readelf -h "$FT"
            echo '--- DYNAMIC ---'
            readelf -d "$FT"
          } | tee out/P2B-FREETYPE-IDENTITY.txt
          readelf -d "$FT" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' | sort -u | tee out/P2B-FREETYPE-NEEDED.txt
          readelf -d "$FT" | sed -n 's/.*Library soname: \[\(.*\)\].*/\1/p' | tee out/P2B-FREETYPE-SONAME.txt
          test -s out/P2B-FREETYPE-SONAME.txt
          echo 'P2B_FREETYPE_IDENTITY=PASS'

      - name: Download official Miyoo release and verify exact MiSans asset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          ZIP=out/miyoomini-freej2me.zip
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$ZIP"
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)font\.ttf$' | tee out/P2B-FONT-ENTRIES.txt
          test "$(wc -l < out/P2B-FONT-ENTRIES.txt | tr -d ' ')" = 1
          ENTRY=$(cat out/P2B-FONT-ENTRIES.txt)
          unzip -p "$ZIP" "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          {
            echo "P2B_FONT_ENTRY=$ENTRY"
            echo "P2B_FONT_SHA256=$EXPECTED_FONT_SHA256"
            echo "P2B_FONT_SIZE=$EXPECTED_FONT_SIZE"
            echo 'P2B_FONT_IDENTITY=PASS'
          } | tee out/P2B-FONT-IDENTITY.txt

      - name: Run exact JDK8 Miyoo backend diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/jdk-classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/jdk-classes \
            tests/p2b/diagnostic/RG35XXP2BFontBackendDiagnostic.java \
            tests/p2b/diagnostic/RG35XXP2BJdkRasterStatsDiagnostic.java
          java -Djava.awt.headless=true -cp out/jdk-classes RG35XXP2BFontBackendDiagnostic out/font.ttf | tee out/P2B-JDK8-FONT-BACKEND.log
          java -Djava.awt.headless=true -cp out/jdk-classes RG35XXP2BJdkRasterStatsDiagnostic out/font.ttf | tee out/P2B-JDK8-RASTER-STATS.log
          grep -F 'P2B_FONT_DIAGNOSTIC_RESULT=PASS' out/P2B-JDK8-FONT-BACKEND.log
          grep -F 'P2B_JDK_RASTER_STATS_RESULT=PASS' out/P2B-JDK8-RASTER-STATS.log
          java -version 2>&1 | tee out/JAVA-VERSION.txt
          echo 'P2B_JDK8_REFERENCE=PASS'

      - name: Cross-build exact pinned-toolchain FreeType ARM diagnostic
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          FT="$SYSROOT/usr/lib/libfreetype.so.6.18.1"
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$SYSROOT/usr/include/freetype2" \
            tests/p2b/diagnostic/p2b_freetype_arm_diag.c \
            "$FT" -lm -o out/p2b-freetype-arm-diag
          file out/p2b-freetype-arm-diag | tee out/P2B-FT-ARM-FILE.txt
          readelf -h out/p2b-freetype-arm-diag | tee out/P2B-FT-ARM-ELF.txt
          readelf -l out/p2b-freetype-arm-diag | grep -F 'Requesting program interpreter' | tee out/P2B-FT-ARM-INTERP.txt
          readelf -d out/p2b-freetype-arm-diag | tee out/P2B-FT-ARM-DYNAMIC.txt
          echo 'P2B_FT_ARM_BUILD=PASS'

      - name: Run exact ARM FreeType backend under pinned sysroot
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" out/p2b-freetype-arm-diag out/font.ttf | tee out/P2B-FREETYPE-ARM.log
          grep -F 'P2B_FT_DIAGNOSTIC_BOOT=PASS' out/P2B-FREETYPE-ARM.log
          grep -F 'P2B_FT_DIAGNOSTIC_RESULT=PASS' out/P2B-FREETYPE-ARM.log
          echo 'P2B_FT_ARM_EXECUTION=PASS'

      - name: Classify JDK8 versus exact FreeType differential
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_jdk_freetype.py \
            out/P2B-JDK8-FONT-BACKEND.log \
            out/P2B-JDK8-RASTER-STATS.log \
            out/P2B-FREETYPE-ARM.log | tee out/P2B-FREETYPE-DIFFERENTIAL.txt
          grep -F 'P2B_DIFF_PARSE=PASS' out/P2B-FREETYPE-DIFFERENTIAL.txt
          grep -F 'P2B_DIFF_RESULT=PASS' out/P2B-FREETYPE-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-FREETYPE-DIFFERENTIAL.txt

      - name: Remove font and release bytes before evidence upload
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/font.ttf out/miyoomini-freej2me.zip out/p2b-freetype-arm-diag
          if find out -type f | grep -Ei '\.(ttf|otf)$'; then
            echo 'P2B_FONT_BYTE_LEAK=FAIL'
            exit 1
          fi
          echo 'P2B_FONT_BYTE_LEAK=NO'
          echo 'P2B_RUNTIME_PATCH=FORBIDDEN' | tee out/P2B-DIFFERENTIAL-STATUS.txt
          echo 'DEVICE_TEST=NOT_REQUESTED' | tee -a out/P2B-DIFFERENTIAL-STATUS.txt
          echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO' | tee -a out/P2B-DIFFERENTIAL-STATUS.txt
          echo 'STABLE=NO' | tee -a out/P2B-DIFFERENTIAL-STATUS.txt

      - name: Upload P2B FreeType differential evidence (no font bytes)
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-FREETYPE-DIFFERENTIAL-${{ github.sha }}
          path: |
            out/P2B-FREETYPE-IDENTITY.txt
            out/P2B-FREETYPE-NEEDED.txt
            out/P2B-FREETYPE-SONAME.txt
            out/P2B-FONT-ENTRIES.txt
            out/P2B-FONT-IDENTITY.txt
            out/P2B-JDK8-FONT-BACKEND.log
            out/P2B-JDK8-RASTER-STATS.log
            out/P2B-FREETYPE-ARM.log
            out/P2B-FREETYPE-DIFFERENTIAL.txt
            out/P2B-FT-ARM-FILE.txt
            out/P2B-FT-ARM-ELF.txt
            out/P2B-FT-ARM-INTERP.txt
            out/P2B-FT-ARM-DYNAMIC.txt
            out/JAVA-VERSION.txt
            out/P2B-DIFFERENTIAL-STATUS.txt
          if-no-files-found: error
