name: Verified Clean VC7R22-R1.2 Lock + Transparency Runtime v2

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r22r12-lock-transparency-v2.yml'
      - 'scripts/vc7r22r12_apply_lock_transparency_fix.py'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build accepted VC7R22 runtime foundation
        run: |
          set -euo pipefail
          java -version
          javac -version
          bash scripts/vc7r22_ci.sh
      - name: Apply R1.2 lock/transparency runtime patch
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          I="$OUT/src/org/recompile/mobile/PlatformImage.java"
          F="$OUT/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"

          # Source-format provenance in the historical generated transport is not
          # stable enough to identify the helper declaration by one Java regex.
          # Keep the parser's standalone-call removal, but defer the single inert
          # residual occurrence to the stronger post-build bytecode gate below.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/vc7r22r12_apply_lock_transparency_fix.py')
          s=p.read_text(encoding='utf-8')
          old="""remaining_calls=len(re.findall(r'\\brg35xxVC7R18Diag\\s*\\(',f))
          allowed_decl=1 if helper_decl_re.search(f) else 0
          if remaining_calls!=allowed_decl:
              raise SystemExit('R1.2 helper diagnostic callsites survived: %d (allowed declaration=%d)'%(remaining_calls,allowed_decl))
          if 'System.err.println(\"RG35XX-JAVA-DIAG:' in f:
              raise SystemExit('R1.2 direct JAVA-DIAG println survived')
          if helper_calls_before>allowed_decl and helper_removed<1:
              raise SystemExit('R1.2 expected helper diagnostic call removal did not occur')
          if helper_calls_before and not helper_match:
              raise SystemExit('R1.2 diagnostic helper declaration not found')
          """
          new="""remaining_calls=len(re.findall(r'\\brg35xxVC7R18Diag\\s*\\(',f))
          # Standalone executable callsites were already parsed and removed above.
          # One residual occurrence may be a declaration/comment in generated source;
          # the compiled class is fail-closed below on actual diagnostic bytecode.
          if remaining_calls>1:
              raise SystemExit('R1.2 multiple diagnostic occurrences survived: %d'%remaining_calls)
          if 'System.err.println(\"RG35XX-JAVA-DIAG:' in f:
              raise SystemExit('R1.2 direct JAVA-DIAG println survived')
          if helper_calls_before>remaining_calls and helper_removed<1:
              raise SystemExit('R1.2 expected helper diagnostic call removal did not occur')
          """
          if old not in s:
              raise SystemExit('workflow patch anchor missing in R1.2 patcher')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          python3 scripts/vc7r22r12_apply_lock_transparency_fix.py "$I" "$F"
          grep -Fq 'hasMeaningfulAlpha' "$I"
          grep -Fq 'if(!hasMeaningfulAlpha && !hasTrns)' "$I"
          grep -Fq 'workerSnapshot' "$F"
          grep -Fq 'controlSnapshot' "$F"
          grep -Fq 'snapshotFrame(' "$F"
          grep -Fq 'encodeAndWriteFrame(' "$F"
          grep -Fq 'worker.setDaemon(true)' "$F"
          ! grep -Fq 'sendFrameLocked(' "$F"
      - name: Force rebuild patched classes and Java 6 runtime
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          CL="$OUT/build/classes"

          # Ant incremental javac retained stale R1.1 bytecode in the previous
          # R1.2 artifact. Delete exactly the patched classes first.
          rm -f "$CL/org/recompile/freej2me/RG35XXGoldenFrameTransport.class"
          rm -f "$CL/org/recompile/freej2me/RG35XXGoldenFrameTransport"*.class
          rm -f "$CL/org/recompile/mobile/PlatformImage.class"
          rm -f "$CL/org/recompile/mobile/PlatformImage"*.class

          (cd "$OUT" && ant)

          python3 - "$CL" "$OUT/build/freej2me_plus-lr.jar" <<'PY'
          import hashlib, os, struct, sys, zipfile

          classes=sys.argv[1]
          jar=sys.argv[2]
          n=0
          for b,_,fs in os.walk(classes):
            for f in fs:
              if f.endswith('.class'):
                n+=1
                p=os.path.join(b,f)
                h=open(p,'rb').read(8)
                if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50:
                  raise SystemExit('Java major gate failed: '+p)
          print('VC7R22R12_CLASS_COUNT=%d'%n)

          stale_transport='a3371c57cbce438aed28fd5e43dd78e7a37fb05d8becb9ec6871e1630d90e522'
          stale_image='7adbe223685c4cb5586f9454c2d19adf085997efbe7e1c11c1552e9081d9bcc7'
          with zipfile.ZipFile(jar,'r') as z:
            t=z.read('org/recompile/freej2me/RG35XXGoldenFrameTransport.class')
            i=z.read('org/recompile/mobile/PlatformImage.class')

          th=hashlib.sha256(t).hexdigest()
          ih=hashlib.sha256(i).hexdigest()
          print('R12_TRANSPORT_CLASS_SHA256='+th)
          print('R12_PLATFORMIMAGE_CLASS_SHA256='+ih)
          if th==stale_transport:
            raise SystemExit('FAIL: stale R1.1 FrameTransport bytecode was repackaged')
          if ih==stale_image:
            raise SystemExit('FAIL: stale R1.1 PlatformImage bytecode was repackaged')

          required=(b'workerSnapshot',b'controlSnapshot',b'snapshotFrame',b'encodeAndWriteFrame')
          for tok in required:
            if tok not in t:
              raise SystemExit('FAIL: rebuilt FrameTransport missing bytecode token '+repr(tok))
          forbidden=(b'argbSnapshot',b'sendFrameLocked',b'RG35XX-JAVA-DIAG:')
          for tok in forbidden:
            if tok in t:
              raise SystemExit('FAIL: rebuilt FrameTransport contains stale token '+repr(tok))

          print('R12_BYTECODE_PROVENANCE=PASS')
          print('R12_STALE_FOUNDATION_CLASSES=0')
          PY

          javap -classpath "$OUT/build/freej2me_plus-lr.jar" -private -c \
            org.recompile.freej2me.RG35XXGoldenFrameTransport > "$RUNNER_TEMP/r12-transport.javap"
          python3 - "$RUNNER_TEMP/r12-transport.javap" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          m=re.search(r'iconst_1\s+\d+: invokevirtual\s+#\d+\s+// Method java/lang/Thread\.setDaemon:\(Z\)V',s)
          if not m:
            raise SystemExit('FAIL: bytecode does not prove worker.setDaemon(true)')
          print('R12_DAEMON_BYTECODE=TRUE')
          PY
      - name: Package runtime only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          P="$RUNNER_TEMP/vc7r22r12-out"
          mkdir -p "$P"
          cp "$OUT/build/freej2me_plus-lr.jar" "$P/freej2me-lr-vc7r22r12.jar"
          J=$(sha256sum "$P/freej2me-lr-vc7r22r12.jar" | awk '{print $1}')
          T=$(unzip -p "$P/freej2me-lr-vc7r22r12.jar" org/recompile/freej2me/RG35XXGoldenFrameTransport.class | sha256sum | awk '{print $1}')
          I=$(unzip -p "$P/freej2me-lr-vc7r22r12.jar" org/recompile/mobile/PlatformImage.class | sha256sum | awk '{print $1}')
          cat > "$P/STATUS.txt" <<EOF
          STATUS=BUILD-PASS-DEVICE-TEST-PENDING
          CHECKPOINT=VC7R22-R1.2a
          CORE_AUDIO=UNCHANGED_R1_WORKER_RING
          RUNTIME_SHA256=$J
          TRANSPORT_CLASS_SHA256=$T
          PLATFORMIMAGE_CLASS_SHA256=$I
          BYTECODE_PROVENANCE=PASS
          STALE_R11_CLASSES=0
          FRAME_LOCK_ORDER=FRONTBUFFER_SNAPSHOT_THEN_ENCODE
          FRAME_WORKER_DAEMON=TRUE
          JAVA_DIAG_EXECUTABLE_SURVIVORS=0
          TRANSPARENCY=MEANINGFUL_PIXEL_ALPHA_THEN_TRNS_THEN_LEGACY_PURE_WHITE_BORDER_KEY
          GLOBAL_WHITE_TRANSPARENCY=FORBIDDEN
          DEVICE_TEST=PENDING
          EOF
          (cd "$P" && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r22r12a-runtime
          path: ${{ runner.temp }}/vc7r22r12-out
          retention-days: 90
