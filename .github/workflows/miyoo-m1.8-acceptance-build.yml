name: Miyoo M1.8 Standalone Acceptance Build

on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_8/**'
      - 'miyoo-m1/M1.8-DEVICE-ACCEPTANCE.sh'
      - '.github/workflows/miyoo-m1.8-acceptance-build.yml'

jobs:
  acceptance_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Standalone boundary gate
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install Java8 and pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Fetch pinned FreeJ2ME source
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          cd upstream
          git checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD)" = 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
      - name: Add standalone acceptance sources only
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M18DispatchAcceptance.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M18PhysicalInputAcceptance.java upstream/src/org/recompile/mobile/
          for f in M1Input.java M1InputDispatch.java M18DispatchAcceptance.java M18PhysicalInputAcceptance.java; do ! grep -Eq 'Libretro|retro_' "miyoo-m1/m1_8/$f"; done
          ! grep -Eq 'Libretro|retro_' miyoo-m1/m1_8/m1_8_input_jni.c
      - name: Instrument canonical MobilePlatform acceptance counters
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/org/recompile/mobile/MobilePlatform.java')
          s=p.read_text()
          anchor='\tpublic static void keyPressed(final int keycode)\n\t{\n'
          inject='''\tprivate static int m1AcceptancePressCount = 0;\n\tprivate static int m1AcceptanceReleaseCount = 0;\n\tprivate static int m1AcceptanceRepeatCount = 0;\n\tpublic static void m1AcceptanceReset() { m1AcceptancePressCount=0; m1AcceptanceReleaseCount=0; m1AcceptanceRepeatCount=0; }\n\tpublic static int m1AcceptancePressCount() { return m1AcceptancePressCount; }\n\tpublic static int m1AcceptanceReleaseCount() { return m1AcceptanceReleaseCount; }\n\tpublic static int m1AcceptanceRepeatCount() { return m1AcceptanceRepeatCount; }\n\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,inject+anchor,1)
          s=s.replace(anchor,anchor+'\t\tm1AcceptancePressCount++;\n',1)
          anchor2='\tpublic static void keyReleased(final int keycode)\n\t{\n'; assert s.count(anchor2)==1
          s=s.replace(anchor2,anchor2+'\t\tm1AcceptanceReleaseCount++;\n',1)
          anchor3='\tpublic static void keyRepeated(final int keycode)\n\t{\n'; assert s.count(anchor3)==1
          s=s.replace(anchor3,anchor3+'\t\tm1AcceptanceRepeatCount++;\n',1)
          p.write_text(s)
          PY
      - name: Build full pinned FreeJ2ME Java6 tree plus acceptance harness
        run: |
          set -euo pipefail
          cd upstream
          JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml
          test -f build/classes/org/recompile/mobile/M18DispatchAcceptance.class
          test -f build/classes/org/recompile/mobile/M18PhysicalInputAcceptance.class
          python3 - <<'PY'
          from pathlib import Path
          for n in ('M18DispatchAcceptance','M18PhysicalInputAcceptance'):
              p=Path('build/classes/org/recompile/mobile/'+n+'.class')
              major=int.from_bytes(p.read_bytes()[6:8],'big')
              print(n+'_JAVA_CLASS_MAJOR=%d' % major)
              assert major==50
          PY
          jar cf ../m1.8-midp-acceptance.jar -C build/classes .
          cd ..
          mkdir -p out
          mv m1.8-midp-acceptance.jar out/
      - name: Deterministic adapter acceptance
        run: |
          set -euo pipefail
          java -cp out/m1.8-midp-acceptance.jar org.recompile.mobile.M18DispatchAcceptance | tee out/CI-ACCEPTANCE.txt
          grep -q 'M1_8_MIDP_ACCEPTANCE_MARKER=PASS' out/CI-ACCEPTANCE.txt
          jar tf out/m1.8-midp-acceptance.jar | grep -q 'org/recompile/mobile/M18PhysicalInputAcceptance.class'
      - name: Build ARMv5TE uClibc JNI
        run: |
          set -euo pipefail
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_8/m1_8_input_jni.c -o out/libm1_8_input.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip out/libm1_8_input.so
          readelf -h out/libm1_8_input.so | tee out/ELF-HEADER.txt
          readelf -A out/libm1_8_input.so | tee out/ELF-ATTRIBUTES.txt || true
          grep -q 'Class:.*ELF32' out/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' out/ELF-HEADER.txt
          grep -q 'Version5 EABI' out/ELF-HEADER.txt
          grep -q 'soft-float ABI' out/ELF-HEADER.txt
      - name: Package proven flat GarlicOS APPS layout
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS
          mkdir -p "$APP"
          cp out/m1.8-midp-acceptance.jar "$APP/"
          cp out/libm1_8_input.so "$APP/"
          cp miyoo-m1/M1.8-DEVICE-ACCEPTANCE.sh "$APP/M1.8-DEVICE-ACCEPTANCE.sh"
          chmod +x "$APP/M1.8-DEVICE-ACCEPTANCE.sh"
          cat > "$APP/M1.8-PHYSICAL-INPUT-ACCEPTANCE.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.8-PHYSICAL-RESULT.txt
          LOG=/mnt/mmc/RG35XX-MIYOO-M1.8-PHYSICAL-JAMVM.log
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm
          GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip
          exec >"$OUT" 2>&1
          echo 'RG35XX M1.8 PHYSICAL JS0 ACCEPTANCE'
          echo 'ACTION=FOR_30_SECONDS_PRESS_DPAD_AND_A_THEN_RELEASE_EACH_KEY'
          echo JAMVM_SHA256_BEFORE=$(sha256sum "$JAMVM"|awk '{print $1}')
          echo GLIBJ_SHA256_BEFORE=$(sha256sum "$GLIBJ"|awk '{print $1}')
          export LD_LIBRARY_PATH="$APP:${LD_LIBRARY_PATH-}"
          "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.8-midp-acceptance.jar" org.recompile.mobile.M18PhysicalInputAcceptance >"$LOG" 2>&1
          RC=$?
          echo JAMVM_EXIT_CODE=$RC
          tail -n 120 "$LOG"
          echo JAMVM_SHA256_AFTER=$(sha256sum "$JAMVM"|awk '{print $1}')
          echo GLIBJ_SHA256_AFTER=$(sha256sum "$GLIBJ"|awk '{print $1}')
          if [ "$RC" -eq 0 ] && grep -q 'M1_8_PHYSICAL_ACCEPTANCE_MARKER=PASS' "$LOG"; then echo M1_8_PHYSICAL_EXECUTION_RESULT=PASS; else echo M1_8_PHYSICAL_EXECUTION_RESULT=FAIL; fi
          echo DEVICE_PASS=NO_PENDING_LOG_REVIEW
          echo FULL_PLATFORM_STABLE=NO
          sync
          exit "$RC"
          SH
          chmod +x "$APP/M1.8-PHYSICAL-INPUT-ACCEPTANCE.sh"
          mkdir -p out/garlicos/M1.8-DOCS
          cp miyoo-m1/m1_8/M1_8_DEVICE_ACCEPTANCE.txt out/garlicos/M1.8-DOCS/
          cp miyoo-m1/m1_8/M18_MOBILEPLATFORM_ACCEPTANCE_CONTRACT.txt out/garlicos/M1.8-DOCS/
          (cd out/garlicos && find Roms M1.8-DOCS -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          test -f "$APP/M1.8-PHYSICAL-INPUT-ACCEPTANCE.sh"
          printf '%s\n' 'PACKAGE_LAYOUT=GARLICOS_FLAT_APPS' 'EXTRACT_TARGET=SD_ROOT' 'M1.8_DETERMINISTIC_DEVICE=PASS_EVIDENCE_RECEIVED' 'M1.8_PHYSICAL_DEVICE_TEST_PENDING=YES' 'FULL_PLATFORM_STABLE=NO' > out/garlicos/STATUS.txt
          sha256sum out/m1.8-midp-acceptance.jar out/libm1_8_input.so | tee out/BUILD-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.8-garlicos-physical-input-acceptance
          path: out/garlicos/
          if-no-files-found: error
