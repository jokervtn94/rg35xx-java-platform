name: RC1 Consolidated ARM Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rc1-consolidated-build.yml'
      - 'tasklog/RC1-011W-TASKLOG.md'
      - 'tasklog/RC1-011X-TASKLOG.md'
      - 'tasklog/RC1-011Y-TASKLOG.md'
      - 'scripts/rc1_assemble.sh'
      - 'scripts/rc1_runtime_build_overlay.sh'
      - 'scripts/rc1_compile.sh'
      - 'scripts/rc1_prebuild_gate.sh'
      - 'scripts/rc1_jni_target_preflight.sh'
      - 'patches/**'
      - 'src/**'
      - 'native/**'
      - 'runtime/**'
  workflow_dispatch:

jobs:
  consolidated-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      CLASSPATH_URL: https://ftp.gnu.org/gnu/classpath/classpath-0.99.tar.gz
      CLASSPATH_SHA256: f929297f8ae9b613a1a167e231566861893260651d913ad9b6c11933895fecc8
      DEJAVU_URL: https://sourceforge.net/projects/dejavu/files/dejavu/2.37/dejavu-sans-ttf-2.37.zip/download
      DEJAVU_ARCHIVE_SHA256: 5c6e497a2f36552cb5ffb112c413a6af39c0f3c47653662b90b4fa6499822fd7
      SOUNDFONT_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60
      FONT_RUNTIME_PATH: /mnt/mmc/Java/runtime/DejaVuSans.ttf
      SOUNDFONT_RUNTIME_PATH: /mnt/mmc/Java/runtime/GeneralUser-GS.sf2
    steps:
      - name: Checkout RG35XX platform repo
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant build-essential ca-certificates curl file git make patch tar unzip wget

      - name: Materialize pinned prebuilt uClibc toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo mkdir -p /opt
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Materialize exact external build inputs
        shell: bash
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/rg35xx-external"
          mkdir -p "$ext"

          sh native/vendor_tinysoundfont.sh
          sh native/verify_tinysoundfont_vendor.sh

          git clone https://github.com/TASEmulators/freej2me-plus.git "$ext/freej2me"
          git -C "$ext/freej2me" checkout --detach "$FREEJ2ME_PIN"
          test "$(git -C "$ext/freej2me" rev-parse HEAD)" = "$FREEJ2ME_PIN"

          curl -L --fail --retry 3 "$CLASSPATH_URL" -o "$ext/classpath-0.99.tar.gz"
          echo "$CLASSPATH_SHA256  $ext/classpath-0.99.tar.gz" | sha256sum -c -
          mkdir -p "$ext/classpath-src"
          tar -xzf "$ext/classpath-0.99.tar.gz" -C "$ext/classpath-src" --strip-components=1
          test -f "$ext/classpath-src/gnu/java/awt/peer/headless/HeadlessToolkit.java"

          curl -L --fail --retry 3 "$DEJAVU_URL" -o "$ext/dejavu-sans-ttf-2.37.zip"
          echo "$DEJAVU_ARCHIVE_SHA256  $ext/dejavu-sans-ttf-2.37.zip" | sha256sum -c -
          mkdir -p "$ext/dejavu"
          unzip -q "$ext/dejavu-sans-ttf-2.37.zip" -d "$ext/dejavu"
          font=$(find "$ext/dejavu" -type f -name DejaVuSans.ttf -print -quit)
          test -n "$font"
          cp "$font" "$ext/DejaVuSans.ttf"
          sha256sum "$ext/DejaVuSans.ttf" | tee "$ext/DejaVuSans.ttf.sha256"

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/$SOUNDFONT_COMMIT/GeneralUser-GS.sf2" \
            -o "$ext/GeneralUser-GS.sf2"
          test "$(wc -c < "$ext/GeneralUser-GS.sf2" | tr -d ' ')" = 32319396
          test "$(git hash-object "$ext/GeneralUser-GS.sf2")" = 298b552d2e9d1307e03e5c5c99d2c046aaed9ec3

          echo "EXT_ROOT=$ext" >> "$GITHUB_ENV"
          echo "RG35XX_FONT_SHA256=$(sha256sum "$ext/DejaVuSans.ttf" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Assemble pinned FreeJ2ME and runtime overlays
        shell: bash
        run: |
          set -euo pipefail
          export RG35XX_FREEJ2ME_ROOT="$EXT_ROOT/freej2me"
          export RG35XX_ASSEMBLY_ROOT="$RUNNER_TEMP/rg35xx-assembly"
          export RG35XX_CLASSPATH_ROOT="$EXT_ROOT/classpath-src"
          export RG35XX_FONT_FILE="$EXT_ROOT/DejaVuSans.ttf"
          export RG35XX_FONT_RUNTIME_PATH="$FONT_RUNTIME_PATH"
          export RG35XX_SOUNDFONT_FILE="$EXT_ROOT/GeneralUser-GS.sf2"
          export RG35XX_SOUNDFONT_RUNTIME_PATH="$SOUNDFONT_RUNTIME_PATH"
          export RG35XX_RUNTIME_ASSEMBLY_ROOT="$RUNNER_TEMP/rg35xx-classpath-runtime"

          sh scripts/rc1_assemble.sh
          sh scripts/rc1_runtime_build_overlay.sh

          echo "RG35XX_ASSEMBLY_ROOT=$RG35XX_ASSEMBLY_ROOT" >> "$GITHUB_ENV"
          echo "RG35XX_RUNTIME_ASSEMBLY_ROOT=$RG35XX_RUNTIME_ASSEMBLY_ROOT" >> "$GITHUB_ENV"

      - name: Compile Java and ARMv5TE uClibc core
        shell: bash
        run: |
          set -euo pipefail
          export RG35XX_CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          export RG35XX_CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          export RG35XX_NM=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm
          sh scripts/rc1_compile.sh 2>&1 | tee "$RUNNER_TEMP/rg35xx-compile.log"

      - name: Record build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rg35xx-build-evidence"
          mkdir -p "$out"
          [ -f "$RUNNER_TEMP/rg35xx-compile.log" ] && cp "$RUNNER_TEMP/rg35xx-compile.log" "$out/" || true
          if [ -n "${EXT_ROOT:-}" ] && [ -f "$EXT_ROOT/DejaVuSans.ttf.sha256" ]; then
            cp "$EXT_ROOT/DejaVuSans.ttf.sha256" "$out/"
          fi
          if [ -n "${RG35XX_ASSEMBLY_ROOT:-}" ] && [ -f "$RG35XX_ASSEMBLY_ROOT/rg35xx_runtime_files.list" ]; then
            cp "$RG35XX_ASSEMBLY_ROOT/rg35xx_runtime_files.list" "$out/"
          fi
          if [ -n "${RG35XX_ASSEMBLY_ROOT:-}" ] && [ -s "$RG35XX_ASSEMBLY_ROOT/build/freej2me_plus-lr.jar" ]; then
            cp "$RG35XX_ASSEMBLY_ROOT/build/freej2me_plus-lr.jar" "$out/"
          fi
          if [ -n "${RG35XX_ASSEMBLY_ROOT:-}" ] && [ -s "$RG35XX_ASSEMBLY_ROOT/src/libretro/freej2me_plus_libretro.so" ]; then
            cp "$RG35XX_ASSEMBLY_ROOT/src/libretro/freej2me_plus_libretro.so" "$out/"
          fi

      - name: Upload consolidated build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-rc1-consolidated-build-evidence
          path: ${{ runner.temp }}/rg35xx-build-evidence
          if-no-files-found: warn
          retention-days: 30
