name: AUDIO-01 RG35XX Lifecycle Trace Only

on:
  workflow_dispatch:
  push:
    branches:
      - audio01-lifecycle-trace-only
    paths:
      - '.github/workflows/audio01-lifecycle-trace.yml'
      - 'scripts/stage-audio01-lifecycle-trace.py'
      - 'scripts/build-audio01-lifecycle-trace.sh'
      - 'scripts/build-audio01-device-package.sh'
      - 'docs/AUDIO01-GOW-LIFECYCLE-TRACE.md'

permissions:
  contents: read

jobs:
  audio01-lifecycle-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout trace branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prove lineage and canonical pin
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e373f3b59423aa7aec5deee8563f0b5ff3a191cb HEAD
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          test "$(git hash-object adapter/native/rg35xx_audio_sdl1_mixer.c)" = 6c12bdf12e16e9ddfbdecf0e60e1330dcc4bcacc
          echo AUDIO01_LINEAGE_GATE=PASS

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build accepted input and PERF-A1 video owners
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D backing
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild accepted A6 ClipTranslate parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Rebuild accepted A7 Java media parent
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Rebuild accepted A7 SDL1_mixer parent
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'
          sudo chown -R "$(id -u):$(id -g)" out/a7-audio-sdl1

      - name: Rebuild exact COMP-02 graphics candidate
        run: bash ./scripts/build-a8-comp02-filltriangle-boundary.sh

      - name: Enforce COMP-02 physical parent identities
        run: |
          set -euo pipefail
          D=out/a8-comp02-filltriangle-boundary
          test "$(sha256sum "$D/freej2me-rg35xx.jar" | awk '{print $1}')" = 3c7b22c3227a65897137c210744be1bcc41f075fa0dfa580fdcee7e47734056b
          test "$(sha256sum "$D/librg35xx_input.so" | awk '{print $1}')" = 69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d
          test "$(sha256sum "$D/librg35xx_video.so" | awk '{print $1}')" = c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d
          test "$(sha256sum "$D/libaudio.so" | awk '{print $1}')" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
          echo AUDIO01_COMP02_PARENT_GATE=PASS

      - name: Build trace-only audio adapter
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work && git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-audio01-lifecycle-trace.sh'
          sudo chown -R "$(id -u):$(id -g)" out/audio01-lifecycle-trace build/audio01

      - name: Enforce trace-only scope
        run: |
          set -euo pipefail
          D=out/audio01-lifecycle-trace
          I="$D/AUDIO01-IDENTITY.txt"
          grep -q '^STAGE=AUDIO01-LIFECYCLE-TRACE-ONLY$' "$I"
          grep -q '^FAILURE_OWNER=RG35XX_AUDIO_MEDIA$' "$I"
          grep -q '^PLATFORM_JAR_SHA256=3c7b22c3227a65897137c210744be1bcc41f075fa0dfa580fdcee7e47734056b$' "$I"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$I"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$I"
          grep -q '^AUDIO_PARENT_SHA256=4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644$' "$I"
          grep -q '^PRIME_PCM_SHA256=8c30691e755abd6791ac75887b56e20f1a56266b2eb0286bfb4007b98f7d7a7e$' "$I"
          grep -q '^JAVA_CHANGED=NO$' "$I"
          grep -q '^GRAPHICS_CHANGED=NO$' "$I"
          grep -q '^INPUT_CHANGED=NO$' "$I"
          grep -q '^VIDEO_CHANGED=NO$' "$I"
          grep -q '^AUDIO_PLAYBACK_CONTROL_FLOW_INTENDED_DELTA=NONE_TRACE_ONLY$' "$I"
          grep -q '^DIAGNOSTIC_ONLY=YES$' "$I"
          grep -q '^DEVICE_PASS=NO$' "$I"
          grep -q '^STABLE=NO$' "$I"
          strings "$D/libaudio.so" | grep -q 'RG35XX_AUDIO01_TRACE'
          (cd "$D" && sha256sum -c AUDIO01-SHA256SUMS.txt)
          echo AUDIO01_TRACE_SCOPE_GATE=PASS

      - name: Build GarlicOS device package
        run: bash ./scripts/build-audio01-device-package.sh

      - name: Enforce device package remains diagnostic
        run: |
          set -euo pipefail
          D=out/audio01-device-package
          I="$D/PACKAGE-IDENTITY.txt"
          grep -q '^STAGE=AUDIO01-GOW-LIFECYCLE-TRACE-DEVICE-PACKAGE$' "$I"
          grep -q '^GAME_BUNDLED=NO$' "$I"
          grep -q '^DIAGNOSTIC_ONLY=YES$' "$I"
          grep -q '^DEVICE_PASS=NO$' "$I"
          grep -q '^STABLE=NO$' "$I"
          (cd "$D" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo AUDIO01_DEVICE_PACKAGE_SCOPE_GATE=PASS

      - name: Upload trace audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AUDIO01-LIFECYCLE-TRACE-AUDIT-${{ github.sha }}
          path: out/audio01-lifecycle-trace/
          if-no-files-found: error

      - name: Upload physical diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AUDIO01-GOW-LIFECYCLE-TRACE-DEVICE-${{ github.sha }}
          path: out/audio01-device-package/
          if-no-files-found: error
