name: Verified Clean VC7 Font Source Gate

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7-font-source.yml'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/vc7_golden_font_preflight.sh'
      - 'scripts/vc7_extract_golden_font.py'
      - 'scripts/vc7_font_assemble.sh'
      - 'scripts/installer/vc7_materialize_and_install.ps1'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/b4_verified_core_assemble.sh'
      - 'scripts/b4_apply_early_native_log.py'
      - 'scripts/b4_apply_video_observability.py'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
  workflow_dispatch:

jobs:
  vc7-font-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Assemble VC6 foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc7-source" sh scripts/vc6_png_iccp_assemble.sh
          echo "VC7=$RUNNER_TEMP/vc7-source" >> "$GITHUB_ENV"

      - name: Verify pinned pre-overlay text boundary
        run: |
          set -euo pipefail
          PG="$VC7/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq 'private void drawStringSingleLine(String str, int x, int y, int anchor)' "$PG"
          test "$(grep -Fc 'gc.drawString(str, x, y);' "$PG")" -eq 1
          grep -Fq 'x = AnchorX(x, font.stringWidth(str), anchor);' "$PG"
          grep -Fq 'x = AnchorX(x, dojaFont.stringWidth(str), anchor);' "$PG"

      - name: Apply VC7 Golden text raster overlay
        run: |
          set -euo pipefail
          python3 scripts/vc7_apply_golden_font.py "$VC7/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Compile Java 6 runtime source
        run: |
          set -euo pipefail
          cd "$VC7"
          ant
          python3 - "$VC7/build/classes" <<'PY'
          import os, struct, sys
          root=sys.argv[1]
          count=0
          for base, _, files in os.walk(root):
              for name in files:
                  if not name.endswith('.class'):
                      continue
                  count += 1
                  p=os.path.join(base,name)
                  with open(p,'rb') as fh:
                      head=fh.read(8)
                  if len(head) != 8 or head[:4] != b'\xca\xfe\xba\xbe':
                      raise SystemExit('bad class header: '+p)
                  major=struct.unpack('>H',head[6:8])[0]
                  if major != 50:
                      raise SystemExit('class major != 50: %s:%d' % (p,major))
          if count == 0:
              raise SystemExit('no classes')
          print('VC7 class count=%d major=50' % count)
          PY

      - name: Strict VC7 source scope gate
        run: |
          set -euo pipefail
          PG="$VC7/src/org/recompile/mobile/PlatformGraphics.java"
          PI="$VC7/src/org/recompile/mobile/PlatformImage.java"
          CLASS="$VC7/build/classes/org/recompile/mobile/PlatformGraphics.class"
          JAR="$VC7/build/freej2me_plus-lr.jar"
          grep -Fq 'RG35XX-VC7-FONT: Golden Unicode bitmap renderer' "$PG"
          grep -Fq 'rg35xxEnsureBitmapFont' "$PG"
          grep -Fq 'rg35xxGlyphIndex' "$PG"
          grep -Fq 'rg35xxWideChar' "$PG"
          grep -Fq 'rg35xxBitmapScale' "$PG"
          grep -Fq 'rg35xxBitmapWidth' "$PG"
          grep -Fq 'rg35xxDrawFallbackQuestion' "$PG"
          grep -Fq 'rg35xxDrawBitmapString' "$PG"
          grep -Fq 'rg35xxDrawSafeText' "$PG"
          grep -Fq 'rg35xxDrawSafeText(str, x, y - ascent, anchor);' "$PG"
          ! grep -Fq 'gc.drawString(str, x, y);' "$PG"
          grep -Fq 'RG35XX-PNG-ICCP: stripped ancillary iCCP chunk' "$PI"
          strings "$CLASS" | grep -F 'RG35XX-VC7-FONT: Golden Unicode bitmap renderer'
          strings "$CLASS" | grep -F 'rg35xx-font.bin'
          ! jar tf "$JAR" | grep -Fx 'org/recompile/mobile/rg35xx-font.bin'
          ! grep -R -Fq 'RG35XXMetricUnicodeText' "$VC7/src"
          ! grep -R -Fq 'RG35XXBitmapText' "$VC7/src"
          ! grep -R -Fq 'RG35XX-CV:' "$VC7/src"
          ! grep -R -Fq 'RG35XX-MediaWarmup' "$VC7/src"

      - name: Stage materialization kit
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7-materialization-kit"
          mkdir -p "$OUT"
          cp "$VC7/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr-vc7-template.jar"
          cp scripts/installer/vc7_materialize_and_install.ps1 "$OUT/VC7-MATERIALIZE-AND-INSTALL.ps1"
          TEMPLATE_SHA=$(sha256sum "$OUT/freej2me-lr-vc7-template.jar" | awk '{print $1}')
          printf '%s\n' \
            'RG35XX VERIFIED CLEAN VC7 MATERIALIZATION KIT' \
            'STATUS=SOURCE-GATE-PASS-GOLDEN-RESOURCE-INJECTION-REQUIRED' \
            "FREEJ2ME_PIN=$FREEJ2ME_PIN" \
            "VC7_TEMPLATE_SHA256=$TEMPLATE_SHA" \
            'GOLDEN_RUNTIME_REQUIRED_SHA256=de510e978ee0b601ac25c496197197676f86725662c434316825e00a86b497b8' \
            'GOLDEN_FONT_REQUIRED_SHA256=7d835faaed37ae93d2bb783604453ad8d13d994f1c97074182ec040c6a29b99c' \
            'GOLDEN_FONT_REQUIRED_SIZE=727008' \
            'VC6_CORE_REQUIRED_SHA256=fc574021ad34b0466cd7ffe4f2eb58438eb2104c47cc503405d9f8722c02d062' \
            'JAMVM_L_REQUIRED_SHA256=eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34' \
            'GLIBJ_REQUIRED_SHA256=d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea' \
            'DEVICE_TEST=PENDING' > "$OUT/STATUS.txt"
          (cd "$OUT" && sha256sum freej2me-lr-vc7-template.jar VC7-MATERIALIZE-AND-INSTALL.ps1 STATUS.txt) > "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7-golden-font-materialization-kit
          path: ${{ runner.temp }}/vc7-materialization-kit
          retention-days: 30

      - name: Source-gate status
        run: |
          printf '%s\n' \
            'VC7_SOURCE_GATE=PASS' \
            'JAVA_MAJOR=50' \
            'MATERIALIZATION_KIT=UPLOADED' \
            'GOLDEN_RESOURCE=LOCAL_FAIL_CLOSED_INJECTION' \
            'DEVICE_TEST=PENDING'
