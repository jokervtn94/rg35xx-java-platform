name: A9 RG35XX Core2D Blit Performance Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-a9-core2d-blit-perf
    paths:
      - '.github/workflows/a9-core2d-blit-perf.yml'
      - 'scripts/stage-a9-rg35xx-core2d-blit-nocopy.py'
      - 'scripts/build-a9-core2d-blit-perf.sh'
      - 'tests/a9/RG35XXCore2DBlitNoCopyHostGate.java'
      - 'scripts/stage-a9-rg35xx-filltriangle-raw2d.py'
      - 'scripts/build-a9-filltriangle-raw2d.sh'
      - 'tests/a9/RG35XXRawFillTriangleHostGate.java'

permissions:
  contents: read

jobs:
  a9-core2d-blit-perf:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout candidate and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize accepted A4 baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build accepted A6 native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild accepted A6 ClipTranslate parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Build accepted A7 Java runtime
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Build accepted A7 SDL1_mixer bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'
          sudo chown -R "$(id -u):$(id -g)" out/a7-audio-sdl1

      - name: Build R1 plus no-copy Core2D blit performance candidate
        run: bash ./scripts/build-a9-core2d-blit-perf.sh

      - name: Verify candidate identity summary
        run: |
          set -euo pipefail
          ID=out/a9-core2d-blit-perf/A9-CORE2D-BLIT-IDENTITY.txt
          grep -q '^BASELINE=A9_R1_FUNCTIONAL_FILLTRIANGLE$' "$ID"
          grep -q '^R1_PLATFORM_SHA256=c4a5adff83c89c891531b2693558583a773a8f8297386f4d36a3cb21ee65f201$' "$ID"
          grep -q '^PERF_OWNER_CANDIDATE=A5_CORE2D_TRANSFORM0_BLIT_TEMP_COPY$' "$ID"
          grep -q '^CHANGED_FROM_R1_SCOPE=org/recompile/rg35xx/RG35XXCore2D.class$' "$ID"
          grep -q '^TRANSFORM0_TEMP_COPY=REMOVED$' "$ID"
          grep -q '^SOURCE_OVER_SEMANTICS=UNCHANGED$' "$ID"
          grep -q '^TRANSFORMED_BLIT_PATH=UNCHANGED$' "$ID"
          grep -q '^A9_R1_FILLTRIANGLE=UNCHANGED$' "$ID"
          grep -q '^A9_CORE2D_BLIT_NOCOPY_HOST_GATE=PASS$' "$ID"
          grep -q '^A5_CORE2D_ALPHA_REGRESSION=PASS$' "$ID"
          grep -q '^A9_R1_FILLTRIANGLE_REGRESSION=PASS$' "$ID"
          grep -q '^A6_REGRESSION_GATES=PASS$' "$ID"
          grep -q '^PROTECTED_NATIVE_IDENTITIES=PASS$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          echo A9_CORE2D_BLIT_CI_SCOPE_LOCK=PASS

      - name: Upload A9 Core2D blit candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-A9-CORE2D-BLIT-PERF-${{ github.sha }}
          path: out/a9-core2d-blit-perf/
          if-no-files-found: error
