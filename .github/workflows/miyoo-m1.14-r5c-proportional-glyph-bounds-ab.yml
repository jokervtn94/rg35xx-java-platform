name: Miyoo M1.14 r5C Proportional Glyph Bounds AB
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.14-r5c-proportional-glyph-bounds-ab]
jobs:
  r5c:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve locked boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Apply proven baseline plus r5C primary variable
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
          python3 miyoo-m1/m1_9/patch_mobileplatform_resize_diagnostics.py
          python3 miyoo-m1/m1_10/patch_mobileplatform_headless_flush.py
          python3 miyoo-m1/m1_11/patch_headless_ascii_text.py
          python3 miyoo-m1/m1_12/patch_headless_unicode_bitmap_text.py
          python3 miyoo-m1/m1_13/patch_hybrid_font_layout_v1.py
          python3 miyoo-m1/m1_13/patch_bitmap_raster_column_bound_r2.py
          python3 miyoo-m1/m1_14/patch_headless_font_metrics_v1.py
          python3 miyoo-m1/m1_14/patch_decoupled_size_semantics_r3.py
          python3 miyoo-m1/m1_14/patch_bold_only_r4a.py
          python3 miyoo-m1/m1_14/patch_italic_only_r4b.py
          python3 miyoo-m1/m1_14/patch_underline_only_r4c.py
          python3 miyoo-m1/m1_14/patch_monospace_face_semantics_r5a.py
          python3 miyoo-m1/m1_14/patch_proportional_glyph_bounds_r5c.py
          echo M1_14_R5C_PRIMARY_VARIABLE=PROPORTIONAL_ADVANCE_ONLY
      - name: Build platform and A/B probe
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19CanvasLifecycleLauncher.java upstream/src/org/recompile/mobile/
          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)
          JAVA8=/usr/lib/jvm/java-8-openjdk-amd64; mkdir -p helper-classes midlet-classes
          "$JAVA8/bin/javac" -source 1.5 -target 1.5 -bootclasspath "$JAVA8/jre/lib/rt.jar" -classpath upstream/build/freej2me_plus.jar -d helper-classes miyoo-m1/m1_8/M1Input.java miyoo-m1/m1_8/M1InputDispatch.java miyoo-m1/m1_9/M19InputPump.java miyoo-m1/m1_9/M19SdlPresenter.java miyoo-m1/m1_9/M19CanvasLifecycleLauncher.java
          jar uf upstream/build/freej2me_plus.jar -C helper-classes .
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include; CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          $CC -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so
          "$JAVA8/bin/javac" -source 1.5 -target 1.5 -bootclasspath "$JAVA8/jre/lib/rt.jar" -classpath upstream/build/freej2me_plus.jar -d midlet-classes miyoo-m1/m1_14/M114R5CProportionalGlyphBoundsMIDlet.java
          printf 'Manifest-Version: 1.0\nMIDlet-1: M1.14-r5C,,org.recompile.mobile.M114R5CProportionalGlyphBoundsMIDlet\nMIDlet-Name: M1.14-r5C\nMIDlet-Vendor: RG35XX\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' >/tmp/r5c.mf
          jar cfm m1.14-r5c-proportional-glyph-bounds.jar /tmp/r5c.mf -C midlet-classes .
          echo M1_14_R5C_BUILD_GATE=PASS
      - name: Package r5C checkpoint
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS; mkdir -p "$APP"
          cp upstream/build/freej2me_plus.jar "$APP/m1.14-r5c-freej2me-platform.jar"
          cp libm1_9e_presenter.so m1.14-r5c-proportional-glyph-bounds.jar "$APP/"
          cat > "$APP/M1.14-R5C-PROPORTIONAL-GLYPH-BOUNDS-AB.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.14-R5C-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm; GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip; FONTJAR=/mnt/mmc/BIOS/freej2me-lr.jar
          EXP=20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
          SHOT=/mnt/mmc/RG35XX-MIYOO-M1.14-R5C-SCREENSHOT.bmp; META=/mnt/mmc/RG35XX-MIYOO-M1.14-R5C-LIVE-FRAME.txt
          rm -f "$SHOT" "$META"; : >"$OUT"
          echo 'RG35XX M1.14-r5C PROPORTIONAL GLYPH-BOUNDS AB' >>"$OUT"; echo M1_14_R5C_PRIMARY_VARIABLE=PROPORTIONAL_ADVANCE_ONLY >>"$OUT"; echo M1_14_RESOURCE_CLASSIFICATION=EXPERIMENTAL_NOT_GOLDEN >>"$OUT"
          TMP=/tmp/r5c-font.bin; unzip -p "$FONTJAR" org/recompile/mobile/rg35xx-font.bin >"$TMP" 2>/dev/null || true; FS=$(wc -c <"$TMP"|tr -d ' '); FH=$(sha256sum "$TMP"|awk '{print $1}'); echo M1_14_FONT_SIZE=$FS >>"$OUT"; echo M1_14_FONT_SHA256=$FH >>"$OUT"; [ "$FS" = 727008 ] && [ "$FH" = "$EXP" ] || { echo M1_14_RESOURCE_GATE=FAIL_CLOSED >>"$OUT"; exit 22; }; echo M1_14_RESOURCE_GATE=PASS_EXPERIMENTAL_20C2 >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}'); echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          LD_LIBRARY_PATH="$APP${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.14-r5c-freej2me-platform.jar:$FONTJAR" org.recompile.mobile.M19CanvasLifecycleLauncher "$APP/m1.14-r5c-proportional-glyph-bounds.jar" >>"$OUT" 2>&1
          RC=$?; echo JAMVM_EXIT_CODE=$RC >>"$OUT"; JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}'); echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"; [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ] && echo M1_14_R5C_PROTECTED_HASHES=PASS >>"$OUT" || echo M1_14_R5C_PROTECTED_HASHES=FAIL >>"$OUT"
          if [ -s "$SHOT" ] && [ -s "$META" ]; then echo M1_14_R5C_SCREENSHOT_GATE=PASS >>"$OUT"; echo M1_14_R5C_SCREENSHOT_SHA256=$(sha256sum "$SHOT"|awk '{print $1}') >>"$OUT"; cat "$META" >>"$OUT"; else echo M1_14_R5C_SCREENSHOT_GATE=FAIL >>"$OUT"; fi
          SYS=$(grep 'M1_14_R5C_SYSTEM_ASCII_WIDTH=' "$OUT"|tail -1|cut -d= -f2); MON=$(grep 'M1_14_R5C_MONOSPACE_ASCII_WIDTH=' "$OUT"|tail -1|cut -d= -f2); PI=$(grep 'M1_14_R5C_PROPORTIONAL_CHAR_105=' "$OUT"|tail -1|cut -d= -f2); PW=$(grep 'M1_14_R5C_PROPORTIONAL_CHAR_87=' "$OUT"|tail -1|cut -d= -f2); PC=$(grep 'M1_14_R5C_PROPORTIONAL_CHAR_20013=' "$OUT"|tail -1|cut -d= -f2)
          if [ "$RC" = 0 ] && [ "$SYS" = 56 ] && [ "$MON" = 84 ] && [ -n "$PI" ] && [ -n "$PW" ] && [ "$PI" -lt "$PW" ] && [ "$PC" = 12 ] && grep -q 'M1_14_R5C_NORMAL_EXIT=PASS' "$OUT" && grep -q 'M1_14_R5C_SCREENSHOT_GATE=PASS' "$OUT"; then echo M1_14_R5C_RUNTIME_GATE=PASS >>"$OUT"; else echo M1_14_R5C_RUNTIME_GATE=FAIL >>"$OUT"; fi
          echo DEVICE_PASS=NO_VISUAL_REVIEW_PENDING >>"$OUT"; echo FULL_PLATFORM_STABLE=NO >>"$OUT"; sync
          SH
          chmod +x "$APP/M1.14-R5C-PROPORTIONAL-GLYPH-BOUNDS-AB.sh"
          (cd out/garlicos && find Roms -type f -print0 | sort -z | xargs -0 sha256sum)>out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum "$APP"/*
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.14-r5c-proportional-glyph-bounds-ab
          path: out/garlicos/
          if-no-files-found: error
