name: P2B Font Native Capability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-native-capability-audit.yml'

permissions:
  contents: read

jobs:
  p2b-native-font-capability:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audit-only parent and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=77a36526e0f6d875c57c7e9a973e0c1a05573721
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'
            exit 1
          fi
          echo 'P2B_NATIVE_CAPABILITY_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Materialize exact pinned MiyooCFW toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc --version | head -n1
          echo 'P2B_TOOLCHAIN_PIN=PASS'

      - name: Inventory FreeType and SDL_ttf capability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo 'PROJECT=RG35XX-AWEIGIT-R1'
            echo 'MODULE=P2B_FONT_TEXT'
            echo 'AUDIT_ONLY=YES'
            echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_IMAGE"
            echo '--- FT2BUILD ---'
            find /opt/miyoo -type f -name ft2build.h -print | sort
            echo '--- FREETYPE LIBS ---'
            find /opt/miyoo -type f \( -name 'libfreetype.a' -o -name 'libfreetype.so' -o -name 'libfreetype.so.*' \) -print | sort
            echo '--- SDL_TTF HEADERS/LIBS ---'
            find /opt/miyoo -type f \( -iname 'SDL_ttf.h' -o -name 'libSDL_ttf.a' -o -name 'libSDL_ttf.so' -o -name 'libSDL_ttf.so.*' \) -print | sort
          } | tee out/P2B-NATIVE-FONT-INVENTORY.txt
          FT_HEADER=$(find /opt/miyoo -type f -name ft2build.h -print | head -n1 || true)
          FT_STATIC=$(find /opt/miyoo -type f -name libfreetype.a -print | head -n1 || true)
          FT_SHARED=$(find /opt/miyoo -type f \( -name libfreetype.so -o -name 'libfreetype.so.*' \) -print | head -n1 || true)
          SDL_TTF_STATIC=$(find /opt/miyoo -type f -name libSDL_ttf.a -print | head -n1 || true)
          {
            [ -n "$FT_HEADER" ] && echo 'P2B_FREETYPE_HEADER=YES' || echo 'P2B_FREETYPE_HEADER=NO'
            [ -n "$FT_STATIC" ] && echo 'P2B_FREETYPE_STATIC=YES' || echo 'P2B_FREETYPE_STATIC=NO'
            [ -n "$FT_SHARED" ] && echo 'P2B_FREETYPE_SHARED=YES' || echo 'P2B_FREETYPE_SHARED=NO'
            [ -n "$SDL_TTF_STATIC" ] && echo 'P2B_SDL_TTF_STATIC=YES' || echo 'P2B_SDL_TTF_STATIC=NO'
          } | tee -a out/P2B-NATIVE-FONT-INVENTORY.txt

      - name: Probe self-contained ARMv5TE FreeType shared-library link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > out/p2b_ftprobe.c <<'C'
          #include <stddef.h>
          #include <ft2build.h>
          #include FT_FREETYPE_H
          int p2b_ft_probe(const unsigned char *font, unsigned long len) {
              FT_Library lib = 0;
              FT_Face face = 0;
              int rc = FT_Init_FreeType(&lib);
              if (rc) return 10 + rc;
              rc = FT_New_Memory_Face(lib, font, (FT_Long)len, 0, &face);
              if (!rc) rc = FT_Set_Pixel_Sizes(face, 0, 14);
              if (!rc) rc = FT_Load_Char(face, 'A', FT_LOAD_RENDER);
              if (face) FT_Done_Face(face);
              FT_Done_FreeType(lib);
              return rc;
          }
          C
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          FT_HEADER=$(find /opt/miyoo -type f -name ft2build.h -print | head -n1 || true)
          FT_STATIC=$(find /opt/miyoo -type f -name libfreetype.a -print | head -n1 || true)
          if [ -z "$FT_HEADER" ] || [ -z "$FT_STATIC" ]; then
            echo 'P2B_FREETYPE_STATIC_LINK=NOT_AVAILABLE' | tee out/P2B-FREETYPE-LINK-RESULT.txt
            exit 0
          fi
          INC=$(dirname "$FT_HEADER")
          LIBDIR=$(dirname "$FT_STATIC")
          set +e
          "$CC" -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$INC" out/p2b_ftprobe.c -L"$LIBDIR" \
            -Wl,-Bstatic -lfreetype -Wl,-Bdynamic -lm \
            -o out/libp2b_ftprobe.so >out/P2B-FREETYPE-LINK.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "P2B_FREETYPE_STATIC_LINK=FAIL rc=$RC" | tee out/P2B-FREETYPE-LINK-RESULT.txt
            cat out/P2B-FREETYPE-LINK.log
            exit 0
          fi
          file out/libp2b_ftprobe.so | tee out/P2B-FREETYPE-FILE.txt
          readelf -h out/libp2b_ftprobe.so | tee out/P2B-FREETYPE-ELF.txt
          readelf -d out/libp2b_ftprobe.so | tee out/P2B-FREETYPE-DYNAMIC.txt
          readelf -Ws out/libp2b_ftprobe.so | grep -E 'FT_(Init_FreeType|New_Memory_Face|Set_Pixel_Sizes|Load_Char)' | tee out/P2B-FREETYPE-SYMBOLS.txt || true
          if readelf -d out/libp2b_ftprobe.so | grep -qi 'freetype'; then
            echo 'P2B_FREETYPE_SELF_CONTAINED=NO' | tee out/P2B-FREETYPE-LINK-RESULT.txt
          else
            echo 'P2B_FREETYPE_STATIC_LINK=PASS' | tee out/P2B-FREETYPE-LINK-RESULT.txt
            echo 'P2B_FREETYPE_SELF_CONTAINED=YES' | tee -a out/P2B-FREETYPE-LINK-RESULT.txt
          fi

      - name: Record capability status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'P2B_NATIVE_FONT_CAPABILITY_AUDIT=PASS'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-NATIVE-CAPABILITY-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-NATIVE-FONT-CAPABILITY-${{ github.sha }}
          path: out/
          if-no-files-found: error
