name: RG35XX runtime candidate rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-rg35xx-runtime-candidate.sh'
      - '.github/workflows/rg35xx-runtime-candidate-rebuild.yml'

permissions:
  contents: read

jobs:
  rebuild-runtime-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8 for GNU Classpath bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install pinned Miyoo ARMv5 soft-float toolchain
        env:
          TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++

      - name: Build and ABI-gate isolated runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-rg35xx-runtime-candidate.sh
          JAVA8="$JAVA_HOME" bash scripts/build-rg35xx-runtime-candidate.sh | tee /tmp/rg35xx-runtime-candidate.log
          grep -q '^RUNTIME_CANDIDATE_BUILD=PASS$' /tmp/rg35xx-runtime-candidate.log
          grep -q '^ABI_GATE=PASS$' out/rg35xx-runtime-candidate/RUNTIME-CANDIDATE-IDENTITY.txt
          grep -q '^DEVICE_PASS=NO$' out/rg35xx-runtime-candidate/RUNTIME-CANDIDATE-IDENTITY.txt
          grep -q '^PHYSICAL_TEST=NOT_TESTED$' out/rg35xx-runtime-candidate/RUNTIME-CANDIDATE-IDENTITY.txt

      - name: Upload runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-RUNTIME-CANDIDATE-REBUILD-${{ github.sha }}
          path: |
            out/rg35xx-runtime-candidate/RG35XX-RUNTIME-CANDIDATE-REBUILD.zip
            out/rg35xx-runtime-candidate/RUNTIME-CANDIDATE-IDENTITY.txt
            out/rg35xx-runtime-candidate/jamvm.readelf.txt
            out/rg35xx-runtime-candidate/jamvm.attributes.txt
            /tmp/rg35xx-runtime-candidate.log
          if-no-files-found: error
