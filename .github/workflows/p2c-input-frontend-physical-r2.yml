name: P2C Input Frontend Physical Package R3

on:
  push:
    branches:
      - physical-test/p2c-input-frontend-20261003-r3
      - physical-test/p2c-input-frontend-20261004-r5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2c-input-frontend-physical-r3:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      HOST_MODULE_CHECKPOINT: 7f8b3bdeadd7b1cd2201f1bf62d8c29ecfb54eac
      RUNTIME_CANDIDATE: 0738281012b83d748cfb88ba063d21248a3f9c97
      EXACT_PARENT: aa7f84dac5ff24b5fd30fc6158ca3be0327675a0
      CANONICAL_AWEIGIT: ca11dfe8ea1cc273d92460f9a83bbf192023fa63
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_INPUT: 6eaf5e23a63fa346782f35dff340d625238a89db4e54cce56d34ba5db5a4064c
      EXPECTED_FONT: 29d19de922e9b3b24b93dca2db73886a32fd9e51ef1c9215b820d12324b8c84b
      EXPECTED_VIDEO: c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d
      EXPECTED_AUDIO: 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644

    steps:
      - name: Checkout physical R3 branch and canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify checkpoint ancestry and physical tooling-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$HOST_MODULE_CHECKPOINT" HEAD)" = "$HOST_MODULE_CHECKPOINT"
          test "$(git merge-base "$RUNTIME_CANDIDATE" "$HOST_MODULE_CHECKPOINT")" = "$RUNTIME_CANDIDATE"
          test "$(git merge-base "$EXACT_PARENT" "$RUNTIME_CANDIDATE")" = "$EXACT_PARENT"
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = "$CANONICAL_AWEIGIT"
          changed="$(git diff --name-only "$HOST_MODULE_CHECKPOINT"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p2c-input-frontend-physical-r1.yml\n.github/workflows/p2c-input-frontend-physical-r2.yml\nadapter/java/org/recompile/rg35xx/RG35XXKeyDispatcher.java\nscripts/build-p2c-input-frontend-exerciser.sh\nscripts/build-p2c-input-frontend-physical-package-v2.sh\nscripts/build-p2c-input-frontend-physical-package-v3.sh\nscripts/build-p2c-input-frontend-physical-package.sh\nscripts/p2c-semantic-jar-digest.py\ntests/p2c/exerciser/RG35XXP2CInputFrontendExerciser.java'
          test "$changed" = "$expected" || { echo "P2C_PHYSICAL_R3_SCOPE_FAIL=$changed"; exit 1; }
          ! git diff --name-only "$HOST_MODULE_CHECKPOINT"..HEAD | grep -E '^(upstream/|packaging/|scripts/stage-|scripts/build-a[0-9])'
          test -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)"
          echo P2C_PHYSICAL_R3_EXACT_CHECKPOINT=PASS
          echo P2C_PHYSICAL_R3_RUNTIME_SEMANTIC_DELTA=NONE
          echo P2C_PHYSICAL_R3_REPOSITORY_SCOPE=PASS
          echo GAME_SPECIFIC_CODE=NO
          echo A9_PARENT=NO

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential binutils file unzip zip curl python3 git >/dev/null

      - name: Materialize protected pre-P2B build chain
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-a4-raw2d-java.sh
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"
          docker pull "$TOOLCHAIN_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'
          bash ./scripts/build-a5-core2d-java.sh
          echo P2C_PHYSICAL_R3_PROTECTED_PARENT_CHAIN=PASS

      - name: Install exact pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          echo P2C_PHYSICAL_R3_PINNED_TOOLCHAIN=PASS

      - name: Rebuild and semantic-gate exact P2C host/module candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2c-input-frontend-candidate.sh scripts/build-p2c-input-frontend-candidate-v2.sh scripts/build-p2b-font-text-candidate.sh scripts/build-p2b-font-text-candidate-v2.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2c-input-frontend-candidate-v2.sh | tee /tmp/p2c-physical-r2-host-module.log
          for marker in \
            P2C_CANONICAL_DIFF_VERIFIED=PASS \
            P2C_OWNER_SCOPE_VERIFIED=PASS \
            P2C_JAVA6_GATE=PASS \
            P2C_FRONTEND_HOST_GATE=PASS \
            P2C_NATIVE_14_CONTROL_HOST_GATE=PASS \
            P2C_ARM_INPUT_NATIVE_BUILD=PASS \
            P2C_PARENT_ACCEPTED_CLASS_IDENTITY=PASS \
            P2C_VIDEO_PARENT_IDENTITY=PASS \
            P2C_FONT_PARENT_IDENTITY=PASS \
            P2C_HOST_MODULE_GATE=PASS \
            P2C_LAUNCH_RESOLUTION_CONTRACT_GATE=PASS \
            P2C_FINAL_OUTPUT_HASH_GATE=PASS \
            P2C_PHYSICAL_TEST=NOT_TESTED \
            RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO \
            STABLE=NO; do grep -q "^${marker}$" /tmp/p2c-physical-r2-host-module.log; done
          OUT=out/p2c-input-frontend-candidate-r1
          ID="$OUT/P2C-INPUT-FRONTEND-IDENTITY.txt"
          JAR="$OUT/freej2me-rg35xx.jar"
          RAW="$(sha256sum "$JAR" | awk '{print $1}')"
          SEM="$(python3 scripts/p2c-semantic-jar-digest.py "$JAR")"
          test "${#SEM}" = 64
          echo "EXPECTED_PLATFORM_SEMANTIC=$SEM" >> "$GITHUB_ENV"
          echo "EXPECTED_SEMANTIC=$SEM" >> "$GITHUB_ENV"
          grep -q "^P2C_PLATFORM_JAR_SHA256=$RAW$" "$ID"
          grep -q '^P2C_HOST_MODULE_GATE=PASS$' "$ID"
          grep -q '^P2C_LAUNCH_RESOLUTION_CONTRACT_GATE=PASS$' "$ID"
          grep -q '^P2C_FINAL_OUTPUT_HASH_GATE=PASS$' "$ID"
          test "$(sha256sum "$OUT/librg35xx_input.so" | awk '{print $1}')" = "$EXPECTED_INPUT"
          test "$(sha256sum "$OUT/librg35xx_font.so" | awk '{print $1}')" = "$EXPECTED_FONT"
          test "$(sha256sum "$OUT/librg35xx_video.so" | awk '{print $1}')" = "$EXPECTED_VIDEO"
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          echo "P2C_PHYSICAL_R3_REBUILT_RAW_JAR_SHA256=$RAW"
          echo "P2C_PHYSICAL_R3_SEMANTIC_JAR_SHA256=$SEM"
          echo P2C_PHYSICAL_R3_HOST_MODULE_REBUILD=PASS

      - name: Rebuild exact protected A7 audio dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/p2c-protected-audio
          mkdir -p out/p2c-protected-audio
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" bash -lc '
            set -euo pipefail
            OUT=/work/out/p2c-protected-audio
            SRC=/work/adapter/native/rg35xx_audio_sdl1_mixer.c
            JNI=/work/upstream/freej2me-miyoomini/cpp/native/include
            CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
            STRIP=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip
            "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -Wall -Wextra -I"$JNI" -I"$JNI/linux" "$SRC" -Wl,--as-needed -ldl -o "$OUT/libaudio.so"
            "$STRIP" "$OUT/libaudio.so"
          '
          sudo chown -R "$(id -u):$(id -g)" out/p2c-protected-audio
          test "$(sha256sum out/p2c-protected-audio/libaudio.so | awk '{print $1}')" = "$EXPECTED_AUDIO"
          echo P2C_PHYSICAL_R3_PROTECTED_AUDIO_DEPENDENCY_GATE=PASS

      - name: Build public-MIDP physical exerciser
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2c-input-frontend-exerciser.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2c-input-frontend-exerciser.sh | tee /tmp/p2c-physical-r2-exerciser.log
          grep -q '^P2C_EXERCISER_PLATFORM_SEMANTIC_GATE=PASS$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^P2C_EXERCISER_BUILD=PASS$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^P2C_EXERCISER_JAVA6_GATE=PASS$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^P2C_EXERCISER_PUBLIC_MIDP_ONLY=YES$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^P2C_EXERCISER_DIRECT_BACKEND_CALL=NO$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^RUNTIME_SEMANTIC_DELTA=NONE$' /tmp/p2c-physical-r2-exerciser.log
          grep -q '^LOGICAL_RESOLUTION=176x208$' out/p2c-input-frontend-candidate-r1/P2C-INPUT-FRONTEND-EXERCISER-IDENTITY.txt
          grep -q '^PHASE_COUNT=3$' out/p2c-input-frontend-candidate-r1/P2C-INPUT-FRONTEND-EXERCISER-IDENTITY.txt
          echo P2C_PHYSICAL_R3_EXERCISER_GATE=PASS

      - name: Build one fail-closed P2C physical package with exact package raw hash
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2c-input-frontend-physical-package.sh scripts/build-p2c-input-frontend-physical-package-v2.sh scripts/build-p2c-input-frontend-physical-package-v3.sh
          bash scripts/build-p2c-input-frontend-physical-package-v3.sh | tee /tmp/p2c-physical-r2-package.log
          grep -q '^P2C_PHYSICAL_V3_SEMANTIC_JAR_PATCH=PASS$' /tmp/p2c-physical-r2-package.log
          grep -q '^P2C_PHYSICAL_V2_REDIRECT_PATCH=PASS$' /tmp/p2c-physical-r2-package.log
          grep -q '^P2C_PHYSICAL_V3_SEMANTIC_JAR_GATE=PASS$' /tmp/p2c-physical-r2-package.log
          grep -q '^P2C_PHYSICAL_PACKAGE_BUILD=PASS$' /tmp/p2c-physical-r2-package.log
          OUT=out/p2c-input-frontend-candidate-r1
          ID="$OUT/P2C-PHYSICAL-PACKAGE-IDENTITY.txt"
          grep -q '^HOST_MODULE_GATE=PASS$' "$ID"
          grep -q '^PHYSICAL_PACKAGE_GATE=PASS$' "$ID"
          grep -q '^RUNTIME_SEMANTIC_DELTA=NONE$' "$ID"
          grep -q "^P2C_PLATFORM_JAR_SEMANTIC_SHA256=$EXPECTED_PLATFORM_SEMANTIC$" "$ID"
          RAW="$(sed -n 's/^P2C_PLATFORM_JAR_RAW_SHA256=//p' "$ID")"
          test "${#RAW}" = 64
          test "$RAW" = "$(sha256sum "$OUT/freej2me-rg35xx.jar" | awk '{print $1}')"
          grep -q '^P2C_PHYSICAL_TEST=NOT_TESTED$' "$ID"
          grep -q '^RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO$' "$ID"
          grep -q '^DEVICE_PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          ZIP="$OUT/RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R1.zip"
          test -f "$ZIP"
          test "$(find "$OUT" -maxdepth 1 -type f -name 'RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-*.zip' | wc -l | tr -d ' ')" = 1
          rm -rf /tmp/p2c-r2-zipcheck && mkdir -p /tmp/p2c-r2-zipcheck
          unzip -q "$ZIP" -d /tmp/p2c-r2-zipcheck
          LAUNCH=/tmp/p2c-r2-zipcheck/RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R1/SD/Roms/APPS/RG35XX-P2C-INPUT-FRONTEND.sh
          PAYLOAD=/tmp/p2c-r2-zipcheck/RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R1/SD/Roms/APPS/RG35XX-P2C-INPUT-FRONTEND
          test -f "$LAUNCH"
          test -f "$PAYLOAD/freej2me-rg35xx.jar"
          test "$RAW" = "$(sha256sum "$PAYLOAD/freej2me-rg35xx.jar" | awk '{print $1}')"
          grep -q "^EXPECTED_PLATFORM=$RAW$" "$LAUNCH"
          ! grep -q '__P2C_PLATFORM_RAW_SHA256__\|__P2C_EXERCISER_SHA256__' "$LAUNCH"
          (cd "$PAYLOAD" && sha256sum -c PAYLOAD-SHA256SUMS.txt)
          echo P2C_PHYSICAL_R3_EXACT_PACKAGE_RAW_JAR_GATE=PASS
          echo P2C_PHYSICAL_R3_ONE_PACKAGE_GATE=PASS
          echo P2C_PHYSICAL_TEST=NOT_TESTED
          echo RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO
          echo STABLE=NO

      - name: Upload one P2C physical R3 package and gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R3-${{ github.sha }}
          path: |
            out/p2c-input-frontend-candidate-r1/RG35XX-P2C-INPUT-FRONTEND-PHYSICAL-R1.zip
            out/p2c-input-frontend-candidate-r1/P2C-PHYSICAL-PACKAGE-IDENTITY.txt
            out/p2c-input-frontend-candidate-r1/P2C-INPUT-FRONTEND-IDENTITY.txt
            out/p2c-input-frontend-candidate-r1/P2C-INPUT-FRONTEND-EXERCISER-IDENTITY.txt
            /tmp/p2c-physical-r2-host-module.log
            /tmp/p2c-physical-r2-exerciser.log
            /tmp/p2c-physical-r2-package.log
          if-no-files-found: error
