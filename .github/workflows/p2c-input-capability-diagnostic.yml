name: P2C Original RG35XX Input Capability Diagnostic

on:
  push:
    branches: [ audit/p2c-input-frontend-contract-20261003 ]
    paths:
      - 'docs/P2C-INPUT-FRONTEND-CONTRACT-AUDIT-20261003.md'
      - 'diagnostics/p2c/**'
      - 'scripts/build-p2c-input-capability-diagnostic.sh'
      - '.github/workflows/p2c-input-capability-diagnostic.yml'
  workflow_dispatch:

jobs:
  build-diagnostic:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit-only scope gate
        run: |
          set -eu
          PARENT=aa7f84dac5ff24b5fd30fc6158ca3be0327675a0
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          git diff --name-only "$PARENT"..HEAD | tee /tmp/p2c-files.txt
          if grep -Ev '^(docs/P2C-INPUT-FRONTEND-CONTRACT-AUDIT-20261003\.md|diagnostics/p2c/|scripts/build-p2c-input-capability-diagnostic\.sh|\.github/workflows/p2c-input-capability-diagnostic\.yml)$' /tmp/p2c-files.txt | grep -q .; then
            echo 'P2C_DIAGNOSTIC_SCOPE=FAIL'
            exit 1
          fi
          test -z "$(git diff --name-only "$PARENT"..HEAD -- adapter/java adapter/native packaging runtime src)"
          echo 'P2C_DIAGNOSTIC_SCOPE=PASS'
          echo 'RUNTIME_SEMANTIC_DELTA=NONE'

      - name: Gate exact audit state
        run: |
          set -eu
          grep -q '^RUNTIME_PATCH=FORBIDDEN$' docs/P2C-INPUT-FRONTEND-CONTRACT-AUDIT-20261003.md
          grep -q '^NEXT_LEGAL_ACTION=P2C_ORIGINAL_RG35XX_INPUT_CAPABILITY_DIAGNOSTIC$' docs/P2C-INPUT-FRONTEND-CONTRACT-AUDIT-20261003.md
          grep -q '^P2C_PHYSICAL_TEST=NOT_TESTED$' docs/P2C-INPUT-FRONTEND-CONTRACT-AUDIT-20261003.md
          sh -n diagnostics/p2c/P2C-INPUT-CAPABILITY-DEVICE-TEST.sh
          sh -n scripts/build-p2c-input-capability-diagnostic.sh

      - name: Pull pinned ARMv5TE uClibC toolchain
        run: docker pull docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e

      - name: Build derived 14-control diagnostic probe
        run: |
          set -eu
          docker run --rm -v "$PWD:/src" -w /src \
            docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e \
            sh -lc 'CC=arm-linux-gcc sh scripts/build-p2c-input-capability-diagnostic.sh'

      - name: ELF and diagnostic isolation gate
        run: |
          set -eu
          BIN=build/p2c-input-capability-diagnostic/p2c_input_capability_probe
          GEN=build/p2c-input-capability-diagnostic/p2c_input_capability_probe.c
          file "$BIN"
          readelf -h "$BIN" | tee /tmp/p2c-elf.txt
          grep -q 'Class:.*ELF32' /tmp/p2c-elf.txt
          grep -q 'Machine:.*ARM' /tmp/p2c-elf.txt
          grep -q 'Flags:.*Version5 EABI' /tmp/p2c-elf.txt
          grep -q 'Flags:.*soft-float ABI' /tmp/p2c-elf.txt
          readelf -l "$BIN" | grep -q '/lib/ld-uClibc.so.0'
          grep -Fq '"LONE","LTWO","RONE","RTWO"' "$GEN"
          grep -Fq 'const int steps=14;' "$GEN"
          ! grep -Ei 'JamVM|freej2me|audio|font|transparency' "$GEN"
          sha256sum miyoo-m1/m1_3c_onscreen_keymap_probe.c "$GEN" "$BIN" | tee /tmp/p2c-probe-sha256.txt
          echo 'P2C_DIAGNOSTIC_BUILD=PASS'
          echo 'P2C_PHYSICAL_TEST=NOT_TESTED'

      - name: Package flat GarlicOS Apps diagnostic
        run: |
          set -eu
          mkdir -p artifact/Roms/APPS
          cp build/p2c-input-capability-diagnostic/p2c_input_capability_probe artifact/Roms/APPS/
          cp diagnostics/p2c/P2C-INPUT-CAPABILITY-DEVICE-TEST.sh artifact/Roms/APPS/P2C-INPUT-CAPABILITY-DIAGNOSTIC.sh
          cp diagnostics/p2c/README-INPUT-CAPABILITY.md artifact/README-P2C-INPUT-CAPABILITY.md
          chmod +x artifact/Roms/APPS/p2c_input_capability_probe artifact/Roms/APPS/P2C-INPUT-CAPABILITY-DIAGNOSTIC.sh
          sha256sum artifact/Roms/APPS/* artifact/README-P2C-INPUT-CAPABILITY.md | tee artifact/SHA256SUMS.txt
          tar -C artifact -czf RG35XX-P2C-INPUT-CAPABILITY-DIAGNOSTIC.tar.gz .
          sha256sum RG35XX-P2C-INPUT-CAPABILITY-DIAGNOSTIC.tar.gz
          echo 'P2C_DIAGNOSTIC_PACKAGE_GATE=PASS'
          echo 'RUNTIME_SEMANTIC_DELTA=NONE'
          echo 'P2C_PHYSICAL_TEST=NOT_TESTED'

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2C-INPUT-CAPABILITY-DIAGNOSTIC
          path: |
            artifact/
            RG35XX-P2C-INPUT-CAPABILITY-DIAGNOSTIC.tar.gz
          if-no-files-found: error
