name: P2B Font Text Physical Package R1

on:
  push:
    branches:
      - physical-test/p2b-font-text-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2b-font-text-physical-r1:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ACCEPTED_P2A: 5a8bfdf12d42e49d5d4aa8260601799c904e6441
      RUNTIME_CANDIDATE: 2f18b78e9b0aa1660b7fd2f5904dd697fcef5830
      HOST_MODULE_CHECKPOINT: 121ca5904b7d442161ed4639f30c5fe9f1c5772d
      CANONICAL_AWEIGIT: ca11dfe8ea1cc273d92460f9a83bbf192023fa63
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e

    steps:
      - name: Checkout physical branch and canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify physical branch ancestry and tooling-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$HOST_MODULE_CHECKPOINT" HEAD)" = "$HOST_MODULE_CHECKPOINT"
          test "$(git rev-parse "$HOST_MODULE_CHECKPOINT^")" = "$RUNTIME_CANDIDATE"
          test "$(git merge-base "$ACCEPTED_P2A" "$RUNTIME_CANDIDATE")" = "$ACCEPTED_P2A"
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = "$CANONICAL_AWEIGIT"
          changed="$(git diff --name-only "$HOST_MODULE_CHECKPOINT"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p2b-font-text-physical-r1.yml\nscripts/build-p2b-font-text-exerciser.sh\nscripts/build-p2b-font-text-physical-package.sh\ntests/p2b/exerciser/RG35XXP2BFontTextExerciser.java'
          test "$changed" = "$expected" || { echo "P2B_PHYSICAL_SCOPE_FAIL=$changed"; exit 1; }
          ! git diff --name-only "$HOST_MODULE_CHECKPOINT"..HEAD | grep -E '^(adapter/|upstream/|scripts/stage-|scripts/build-a|packaging/|native/)'
          test -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)"
          echo P2B_PHYSICAL_EXACT_CHECKPOINT=PASS
          echo P2B_PHYSICAL_RUNTIME_SEMANTIC_DELTA=NONE
          echo P2B_PHYSICAL_REPOSITORY_SCOPE=PASS
          echo GAME_SPECIFIC_CODE=NO
          echo A9_PARENT=NO

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential binutils file unzip curl python3 git >/dev/null

      - name: Materialize protected pre-P2A build chain
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-a4-raw2d-java.sh
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"
          docker pull "$TOOLCHAIN_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'
          bash ./scripts/build-a5-core2d-java.sh
          echo P2B_PHYSICAL_PROTECTED_PARENT_CHAIN=PASS

      - name: Install exact pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          echo P2B_PHYSICAL_PINNED_TOOLCHAIN=PASS

      - name: Rebuild and gate exact P2B host/module candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2b-font-text-candidate.sh scripts/build-p2b-font-text-candidate-v2.sh scripts/stage-p2b-font-text.py
          JAVA8="$JAVA_HOME" bash scripts/build-p2b-font-text-candidate-v2.sh | tee /tmp/p2b-physical-host-module.log
          for marker in \
            P2B_FONT_TEXT_BUILD=PASS \
            P2B_CANONICAL_DIFF_VERIFIED=PASS \
            P2B_OWNER_SCOPE_VERIFIED=PASS \
            P2B_JAVA6_GATE=PASS \
            P2B_HOST_FONT_METRICS_GATE=PASS \
            P2B_HOST_SIMPLE_RASTER_GATE=PASS \
            P2B_HOST_COMPLEX_LAYOUT_GATE=PASS \
            P1A_GRAPHICS_PARENT_REGRESSION=PASS \
            P2A_IMAGE_PARENT_REGRESSION=PASS \
            P2B_MODULE_GATE=PASS \
            P2B_PHYSICAL_TEST=NOT_TESTED \
            RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO \
            STABLE=NO; do grep -q "^${marker}$" /tmp/p2b-physical-host-module.log; done
          grep -q '^P2B_MODULE_GATE=PASS$' out/p2b-font-text-candidate-r1/P2B-FONT-TEXT-IDENTITY.txt
          grep -q '^PROTECTED_HASHES=PASS$' out/p2b-font-text-candidate-r1/P2B-FONT-TEXT-IDENTITY.txt
          echo P2B_PHYSICAL_HOST_MODULE_REBUILD=PASS

      - name: Rebuild exact protected A7 audio dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/p2b-protected-audio
          mkdir -p out/p2b-protected-audio
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN_IMAGE" bash -lc '
            set -euo pipefail
            OUT=/work/out/p2b-protected-audio
            SRC=/work/adapter/native/rg35xx_audio_sdl1_mixer.c
            JNI=/work/upstream/freej2me-miyoomini/cpp/native/include
            CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
            STRIP=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip
            READELF=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-readelf
            "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -Wall -Wextra -I"$JNI" -I"$JNI/linux" "$SRC" -Wl,--as-needed -ldl -o "$OUT/libaudio.so"
            "$STRIP" "$OUT/libaudio.so"
            "$READELF" -h "$OUT/libaudio.so" > "$OUT/libaudio.so.elf.txt"
            "$READELF" -Ws "$OUT/libaudio.so" > "$OUT/libaudio.so.symbols.txt"
            grep -q "Class:.*ELF32" "$OUT/libaudio.so.elf.txt"
            grep -q "Machine:.*ARM" "$OUT/libaudio.so.elf.txt"
            grep -q "Version5 EABI" "$OUT/libaudio.so.elf.txt"
            grep -q "soft-float ABI" "$OUT/libaudio.so.elf.txt"
            for sym in Java_org_recompile_mobile_SdlMixerManager_sdlMixerInit Java_org_recompile_mobile_SdlMixerManager_sdlMixerLoadMidi Java_org_recompile_mobile_SdlMixerManager_sdlMixerLoadWav Java_org_recompile_mobile_SdlMixerManager_sdlMixerPlayMusic Java_org_recompile_mobile_SdlMixerManager_sdlMixerPlayWav Java_org_recompile_mobile_SdlMixerManager_sdlMixerQuit; do grep -q "$sym" "$OUT/libaudio.so.symbols.txt"; done
            test "$(sha256sum "$OUT/libaudio.so" | awk "{print \$1}")" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
            echo P2B_PROTECTED_AUDIO_INNER_GATE=PASS
          '
          sudo chown -R "$(id -u):$(id -g)" out/p2b-protected-audio
          test "$(sha256sum out/p2b-protected-audio/libaudio.so | awk '{print $1}')" = 4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644
          echo P2B_PROTECTED_AUDIO_DEPENDENCY_GATE=PASS

      - name: Build independent public-MIDP physical exerciser
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2b-font-text-exerciser.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p2b-font-text-exerciser.sh | tee /tmp/p2b-exerciser.log
          grep -q '^P2B_EXERCISER_BUILD=PASS$' /tmp/p2b-exerciser.log
          grep -q '^P2B_EXERCISER_JDK8_EXPECTED=PASS$' /tmp/p2b-exerciser.log
          grep -q '^P2B_EXERCISER_JAVA6_GATE=PASS$' /tmp/p2b-exerciser.log
          grep -q '^P2B_EXERCISER_PUBLIC_MIDP_ONLY=YES$' /tmp/p2b-exerciser.log
          grep -q '^P2B_EXERCISER_DIRECT_BACKEND_CALL=NO$' /tmp/p2b-exerciser.log
          echo P2B_PHYSICAL_EXERCISER_GATE=PASS

      - name: Build one fail-closed P2B physical package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p2b-font-text-physical-package.sh
          bash scripts/build-p2b-font-text-physical-package.sh | tee /tmp/p2b-physical-package.log
          grep -q '^P2B_PHYSICAL_PACKAGE_BUILD=PASS$' /tmp/p2b-physical-package.log
          ID=out/p2b-font-text-candidate-r1/P2B-PHYSICAL-PACKAGE-IDENTITY.txt
          grep -q '^HOST_MODULE_GATE=PASS$' "$ID"
          grep -q '^PHYSICAL_PACKAGE_GATE=PASS$' "$ID"
          grep -q '^FONT_PROVISIONING_GATE=PASS$' "$ID"
          grep -q '^P2B_PHYSICAL_TEST=NOT_TESTED$' "$ID"
          grep -q '^RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO$' "$ID"
          grep -q '^DEVICE_PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          test -f out/p2b-font-text-candidate-r1/RG35XX-P2B-FONT-TEXT-PHYSICAL-R1.zip
          test "$(find out/p2b-font-text-candidate-r1 -maxdepth 1 -type f -name 'RG35XX-P2B-FONT-TEXT-PHYSICAL-*.zip' | wc -l | tr -d ' ')" = 1
          echo P2B_PHYSICAL_ONE_PACKAGE_GATE=PASS
          echo P2B_PHYSICAL_TEST=NOT_TESTED
          echo RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO
          echo STABLE=NO

      - name: Upload one P2B physical package and gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-FONT-TEXT-PHYSICAL-R1-${{ github.sha }}
          path: |
            out/p2b-font-text-candidate-r1/RG35XX-P2B-FONT-TEXT-PHYSICAL-R1.zip
            out/p2b-font-text-candidate-r1/P2B-PHYSICAL-PACKAGE-IDENTITY.txt
            out/p2b-font-text-candidate-r1/P2B-FONT-TEXT-IDENTITY.txt
            out/p2b-font-text-candidate-r1/P2B-FONT-TEXT-EXERCISER-IDENTITY.txt
            /tmp/p2b-physical-host-module.log
            /tmp/p2b-exerciser.log
            /tmp/p2b-physical-package.log
          if-no-files-found: error
