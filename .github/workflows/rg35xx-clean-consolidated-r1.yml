name: RG35XX Clean Consolidated R1

on:
  workflow_dispatch:
  push:
    branches: [rg35xx-clean-consolidated-r1]
    paths:
      - '.github/workflows/rg35xx-clean-consolidated-r1.yml'
      - 'scripts/rg35xx_clean_consolidated_r1_assemble.sh'
      - 'scripts/b4_apply_nomask_green_tint_fix.py'
      - 'scripts/b4_apply_nomask_hard_bypass.py'
      - 'scripts/b4_apply_hotpath_r2_cleanup.py'
      - 'scripts/b4_apply_canonical_framebuffer_r1.py'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/vc7r2_apply_proven_dynamic_view.py'
      - 'release/rg35xx-clean-consolidated-r1/**'
      - 'tasklog/RG35XX-CLEAN-CONSOLIDATED-R1.md'

jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      JAMVM_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      B4_CORE_SHA256: 56bb3b972337dd40b342c1881f6599c53eebf66a29f920a1aa2e2839eb29a07c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Install build requirements
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 unzip >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact upstream pin
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          echo FREEJ2ME_PIN_GATE=PASS

      - name: Assemble consolidated R1 from clean base
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream"           R1_ASSEMBLY="$RUNNER_TEMP/clean-r1"           sh scripts/rg35xx_clean_consolidated_r1_assemble.sh
          echo "R1=$RUNNER_TEMP/clean-r1" >> "$GITHUB_ENV"

      - name: Production ownership and legacy-class source gate
        run: |
          set -euo pipefail

          # Clean assembly should contain only upstream owners plus the one admitted Golden transport.
          for forbidden in             RG35XXFrameScheduler.java             RG35XXImageCache.java             RG35XXTransformCache.java             RG35XXLifecycle.java             RG35XXBitmapText.java             RG35XXRmsCoordinator.java             RG35XXRmsAtomicFile.java             RG35XXAudioBootstrap.java             RG35XXAudioProtocol.java             RG35XXAudioTransport.java             RG35XXMediaProfile.java             RG35XXMediaRegistry.java             RG35XXNativePlayer.java             RG35XXToneSequenceEncoder.java             RG35XXWavDecoder.java
          do
            if find "$R1/src" -name "$forbidden" -print -quit | grep -q .; then
              echo "Forbidden legacy production owner present: $forbidden" >&2
              exit 1
            fi
          done

          test -f "$R1/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          echo LEGACY_HELPER_SOURCE_GATE=PASS

      - name: Build Java runtime
        run: |
          set -euo pipefail
          cd "$R1"
          ant
          JAR="$R1/build/freej2me_plus-lr.jar"
          test -f "$JAR"

          python3 - "$R1/build/classes" <<'PY'
          import os,struct,sys
          n=0
          bad=[]
          for base,_,files in os.walk(sys.argv[1]):
              for fn in files:
                  if not fn.endswith('.class'):
                      continue
                  n += 1
                  p=os.path.join(base,fn)
                  h=open(p,'rb').read(8)
                  if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe':
                      bad.append((p,'bad magic'))
                      continue
                  major=struct.unpack('>H',h[6:8])[0]
                  if major!=50:
                      bad.append((p,'major=%d'%major))
          if bad:
              raise SystemExit('JAVA_MAJOR_GATE_FAIL '+repr(bad[:20]))
          print('JAVA_CLASS_COUNT=%d'%n)
          print('JAVA_MAJOR_50_GATE=PASS')
          PY

          jar tf "$JAR" > "$RUNNER_TEMP/jar-list.txt"
          for forbidden in             org/recompile/mobile/RG35XXFrameScheduler.class             org/recompile/mobile/RG35XXImageCache.class             org/recompile/mobile/RG35XXTransformCache.class             org/recompile/mobile/RG35XXLifecycle.class             org/recompile/mobile/RG35XXBitmapText.class             org/recompile/mobile/RG35XXRmsCoordinator.class             org/recompile/mobile/RG35XXRmsAtomicFile.class             org/recompile/mobile/RG35XXAudioBootstrap.class             org/recompile/mobile/RG35XXAudioTransport.class             org/recompile/mobile/RG35XXMediaRegistry.class             org/recompile/mobile/RG35XXNativePlayer.class
          do
            ! grep -Fxq "$forbidden" "$RUNNER_TEMP/jar-list.txt"
          done

          grep -Fxq 'org/recompile/freej2me/RG35XXGoldenFrameTransport.class' "$RUNNER_TEMP/jar-list.txt"
          echo LEGACY_HELPER_BYTECODE_GATE=PASS

          echo "NEW_RUNTIME_SHA256=$(sha256sum "$JAR" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Bytecode/source contract audit
        run: |
          set -euo pipefail

          grep -Fq 'RG35XX-PNG-ICCP: stripped ancillary iCCP chunk' "$R1/src/org/recompile/mobile/PlatformImage.java"
          grep -Fq 'fastBlit = !Mobile.funLightsEnabled;' "$R1/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq 'RG35XX-B4-HOTPATH-R2-CLEAN' "$R1/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          grep -Fq 'RG35XX-VC7R2-VIEW:' "$R1/src/org/recompile/freej2me/Libretro.java"
          grep -Fq 'RG35XX-B4-FRAME-BIND stage=' "$R1/src/org/recompile/freej2me/Libretro.java"
          grep -Fq 'RG35XX-MEDIA-BOOT: eager prepare SKIPPED; lazy media enabled' "$R1/src/org/recompile/mobile/MobilePlatform.java"

          ! grep -R -Fq 'RG35XX-MediaWarmup' "$R1/src"
          ! grep -R -Fq 'rg35xx_cv_launch_java' "$R1/src"
          ! grep -Fq 'requestFrame(lcdWidth, lcdHeight, lcdData' "$R1/src/org/recompile/freej2me/Libretro.java"

          echo R1_SOURCE_CONTRACT_GATE=PASS

      - name: Package fail-closed device-test kit
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg"
          mkdir -p "$ROOT/payload"

          cp "$R1/build/freej2me_plus-lr.jar" "$ROOT/payload/freej2me-lr.jar"
          cp release/rg35xx-clean-consolidated-r1/* "$ROOT/"
          cp tasklog/RG35XX-CLEAN-CONSOLIDATED-R1.md "$ROOT/"

          sed -i "s/__NEW_RUNTIME_SHA256__/$NEW_RUNTIME_SHA256/g" "$ROOT/INSTALL-RG35XX-CLEAN-R1.ps1"
          ! grep -R -Fq '__NEW_RUNTIME_SHA256__' "$ROOT"

          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/INSTALL-RG35XX-CLEAN-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/RESTORE-RG35XX-CLEAN-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/COLLECT-RG35XX-CLEAN-R1.ps1')) | Out-Null"
          echo POWERSHELL_PARSE_GATE=PASS

          cat > "$ROOT/COMPONENTS.txt" <<EOF
          BASE=verified-clean-platform-v1
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          JAMVM_REQUIRED_SHA256=$JAMVM_SHA256
          GLIBJ_REQUIRED_SHA256=$GLIBJ_SHA256
          PROTECTED_CORE_REQUIRED_SHA256=$B4_CORE_SHA256
          RUNTIME_SHA256=$NEW_RUNTIME_SHA256

          KEEP=Lazy Media Boot
          KEEP=RG35XXGoldenFrameTransport
          KEEP=Golden native receiver / Smart-Fit
          ADMIT=Video Mask R2 (DEVICE-PASS scoped)
          ADMIT=Hotpath R2 (DEVICE-PASS scoped)
          ADMIT=PNG iCCP compatibility (DEVICE-EXERCISED)
          ADMIT=VC7R2 dynamic logical view (DEVICE-PROVEN scoped)
          ADMIT=canonical framebuffer binding (DEVICE-EVIDENCE)

          NOT_ADMITTED=legacy RG35XX helper graph
          NOT_ADMITTED=experimental bitmap font
          NOT_ADMITTED=source-reconstructed audio
          NOT_ADMITTED=transform/image caches
          NOT_ADMITTED=old broad lifecycle
          NOT_ADMITTED=3D
          EOF

          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=RG35XX-CLEAN-CONSOLIDATED-R1
          SOURCE_COMMIT=$GITHUB_SHA
          BASE_COMMIT=1cfce475cbede7bd995bb436926718ca1565702d
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          NEW_RUNTIME_SHA256=$NEW_RUNTIME_SHA256
          REQUIRED_CORE_SHA256=$B4_CORE_SHA256
          CORE_PACKAGED=NO
          JAVA_MAJOR=50
          VIDEO_MASK_R2=ENABLED
          HOTPATH_R2=ENABLED
          PNG_ICCP=ENABLED
          DYNAMIC_LOGICAL_VIEW=ENABLED
          CANONICAL_FRAMEBUFFER_BINDING=ENABLED
          LEGACY_HELPER_GRAPH=EXCLUDED
          EXPERIMENTAL_FONT=EXCLUDED
          AUDIO_RECONSTRUCTION=EXCLUDED
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TEST_PENDING
          STABLE=NO
          EOF

          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)

          echo "R1_RUNTIME_SHA256=$NEW_RUNTIME_SHA256"
          echo "R1_REQUIRED_CORE_SHA256=$B4_CORE_SHA256"
          echo BUILD_PASS=YES
          echo DEVICE_PASS=NO_DEVICE_TEST_PENDING
          echo STABLE=NO

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-clean-consolidated-r1
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
