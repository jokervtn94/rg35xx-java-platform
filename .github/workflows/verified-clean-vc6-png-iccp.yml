name: Verified Clean VC6 PNG iCCP Build

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc6-png-iccp.yml'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/b4_verified_core_assemble.sh'
      - 'scripts/b4_apply_early_native_log.py'
      - 'scripts/b4_apply_video_observability.py'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
      - 'docs/device-evidence/B6-v1.1-2026-09-09.md'
  workflow_dispatch:

jobs:
  vc6-png-iccp:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      JAMVM_L_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      B4_OBSERVED_CORE_SHA256: fc574021ad34b0466cd7ffe4f2eb58438eb2104c47cc503405d9f8722c02d062
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant build-essential file unzip python3
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Assemble VC6 source
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc6" sh scripts/vc6_png_iccp_assemble.sh
          echo "VC6=$RUNNER_TEMP/vc6" >> "$GITHUB_ENV"
      - name: Build VC6 Java runtime
        run: |
          set -euo pipefail
          cd "$VC6"
          ant
          JAR="$VC6/build/freej2me_plus-lr.jar"
          test -f "$JAR"
          # Java 6 class contract.
          python3 - "$VC6/build/classes" <<'PY'
          import os, struct, sys
          root=sys.argv[1]
          count=0
          for base, _, files in os.walk(root):
              for f in files:
                  if not f.endswith('.class'): continue
                  count += 1
                  p=os.path.join(base,f)
                  with open(p,'rb') as fh:
                      head=fh.read(8)
                  if len(head) != 8 or head[:4] != b'\xca\xfe\xba\xbe':
                      raise SystemExit('bad class header: '+p)
                  major=struct.unpack('>H',head[6:8])[0]
                  if major != 50:
                      raise SystemExit('class major != 50: %s:%d' % (p,major))
          if count == 0: raise SystemExit('no classes')
          print('VC6 class count=%d major=50' % count)
          PY
          jar tf "$JAR" | grep -F 'org/recompile/mobile/PlatformImage.class'
          strings "$VC6/build/classes/org/recompile/mobile/PlatformImage.class" | grep -F 'RG35XX-PNG-ICCP: stripped ancillary iCCP chunk'
          JAR_SHA=$(sha256sum "$JAR" | awk '{print $1}')
          CONTENT_SHA=$(python3 - "$JAR" <<'PY'
          import hashlib, sys, zipfile
          h=hashlib.sha256()
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in sorted(z.namelist()):
                  if name.endswith('/'): continue
                  h.update(name.encode('utf-8')); h.update(b'\0'); h.update(hashlib.sha256(z.read(name)).digest())
          print(h.hexdigest())
          PY
          )
          echo "VC6_RUNTIME_FILE_SHA256=$JAR_SHA" >> "$GITHUB_ENV"
          echo "VC6_RUNTIME_CONTENT_SHA256=$CONTENT_SHA" >> "$GITHUB_ENV"
          echo "VC6 runtime file SHA=$JAR_SHA"
          echo "VC6 runtime content SHA=$CONTENT_SHA"
      - name: Build native core unchanged
        run: |
          set -euo pipefail
          cd "$VC6/src/libretro"
          make clean
          make platform=unix \
            CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            LDFLAGS='-lm -lpthread'
          CORE="$VC6/src/libretro/freej2me_plus_libretro.so"
          CORE_SHA=$(sha256sum "$CORE" | awk '{print $1}')
          echo "VC6 core SHA=$CORE_SHA"
          test "$CORE_SHA" = "$B4_OBSERVED_CORE_SHA256"
      - name: Strict VC6 scope gate
        run: |
          set -euo pipefail
          IMAGE="$VC6/src/org/recompile/mobile/PlatformImage.java"
          grep -Fq 'rg35xxPngIccpCompat' "$IMAGE"
          grep -Fq 'RG35XX-PNG-ICCP: stripped ancillary iCCP chunk' "$IMAGE"
          test "$(grep -Fc 'ImageIO.read(rg35xxPngIccpCompat(stream))' "$IMAGE")" -eq 3
          ! grep -R -Fq 'rg35xxStripPngICCP' "$VC6/src"
          ! grep -R -Fq 'RG35XX-PNG-COMPAT-V2' "$VC6/src"
          ! grep -R -Fq 'RG35XX-CV:' "$VC6/src"
          ! grep -R -Fq 'RG35XX-MediaWarmup' "$VC6/src"
          strings "$VC6/src/libretro/freej2me_plus_libretro.so" | grep -F 'B4 FIRST_FRAME_PUBLISH'
          strings "$VC6/src/libretro/freej2me_plus_libretro.so" | grep -F '/mnt/mmc/freej2me-vc3-early.log'
      - name: Stage VC6 checkpoint
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc6-checkpoint"
          mkdir -p "$OUT/BIOS" "$OUT/CFW/retroarch/.retroarch/cores" "$OUT/evidence"
          cp "$VC6/build/freej2me_plus-lr.jar" "$OUT/BIOS/freej2me-lr.jar"
          cp "$VC6/src/libretro/freej2me_plus_libretro.so" "$OUT/CFW/retroarch/.retroarch/cores/freej2me_plus_libretro.so"
          cp "$VC6/src/org/recompile/mobile/PlatformImage.java" "$OUT/evidence/PlatformImage-VC6.java"
          cp "$VC6/src/libretro/rg35xx/golden/rg35xx_golden_video.c" "$OUT/evidence/rg35xx_golden_video.c"
          printf '%s\n' \
            'RG35XX VERIFIED CLEAN VC6 PNG ICCP CHECKPOINT' \
            'STATUS=BUILD-PASS-DEVICE-ACCEPTANCE-PENDING' \
            "FREEJ2ME_PIN=$FREEJ2ME_PIN" \
            "JAMVM_L_REQUIRED_SHA256=$JAMVM_L_SHA256" \
            "GLIBJ_REQUIRED_SHA256=$GLIBJ_SHA256" \
            "VC6_RUNTIME_FILE_SHA256=$VC6_RUNTIME_FILE_SHA256" \
            "VC6_RUNTIME_CONTENT_SHA256=$VC6_RUNTIME_CONTENT_SHA256" \
            "B4_OBSERVED_CORE_SHA256=$B4_OBSERVED_CORE_SHA256" \
            'GLIBJ_PATCHED=NO' \
            'PNG_ICCP_SOURCE_COMPAT=ADMITTED_FOR_DEVICE_TEST' \
            'FONT_REWORK=NOT_ADMITTED' \
            'AUDIO_REWORK=NOT_ADMITTED' > "$OUT/STATUS.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-verified-clean-vc6-png-iccp
          path: ${{ runner.temp }}/vc6-checkpoint
          include-hidden-files: true
          retention-days: 30
