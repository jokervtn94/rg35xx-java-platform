name: Miyoo M1.14 r4A.1 Capture Fix
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.14-r4a1-capture-fix]
jobs:
  m114r4a1:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve locked M1.8 boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install dependencies and toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Apply unchanged r4A BOLD implementation
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
          python3 miyoo-m1/m1_9/patch_mobileplatform_resize_diagnostics.py
          python3 miyoo-m1/m1_10/patch_mobileplatform_headless_flush.py
          python3 miyoo-m1/m1_11/patch_headless_ascii_text.py
          python3 miyoo-m1/m1_12/patch_headless_unicode_bitmap_text.py
          python3 miyoo-m1/m1_13/patch_hybrid_font_layout_v1.py
          python3 miyoo-m1/m1_13/patch_bitmap_raster_column_bound_r2.py
          python3 miyoo-m1/m1_14/patch_headless_font_metrics_v1.py
          python3 miyoo-m1/m1_14/patch_decoupled_size_semantics_r3.py
          python3 miyoo-m1/m1_14/patch_bold_only_r4a.py
          echo M1_14_R4A1_PRIMARY_VARIABLE=CAPTURE_OBSERVABILITY_ONLY
          echo M1_14_R4A_BOLD_IMPLEMENTATION=UNCHANGED
          echo M1_14_RESOURCE_CLASSIFICATION=EXPERIMENTAL_NOT_GOLDEN
      - name: Build platform and capture-enabled BOLD probe
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19CanvasLifecycleLauncher.java upstream/src/org/recompile/mobile/
          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include; CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          $CC -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so
          mkdir -p midlet-classes; JAVA8=/usr/lib/jvm/java-8-openjdk-amd64
          "$JAVA8/bin/javac" -source 1.5 -target 1.5 -bootclasspath "$JAVA8/jre/lib/rt.jar" -classpath upstream/build/freej2me_plus.jar -d midlet-classes miyoo-m1/m1_14/M114R4ABoldOnlyMIDlet.java
          printf 'Manifest-Version: 1.0\nMIDlet-1: M1.14-r4A.1,,org.recompile.mobile.M114R4ABoldOnlyMIDlet\nMIDlet-Name: M1.14-r4A.1\nMIDlet-Vendor: RG35XX\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' >/tmp/m114r4a1.mf
          jar cfm m1.14-r4a1-bold-capture.jar /tmp/m114r4a1.mf -C midlet-classes .
          echo M1_14_R4A1_BUILD_GATE=PASS
      - name: Package capture checkpoint
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS; mkdir -p "$APP"
          cp upstream/build/freej2me_plus.jar "$APP/m1.14-r4a1-freej2me-platform.jar"
          cp libm1_9e_presenter.so m1.14-r4a1-bold-capture.jar "$APP/"
          cat > "$APP/M1.14-R4A1-BOLD-CAPTURE.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.14-R4A1-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm; GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip; FONTJAR=/mnt/mmc/BIOS/freej2me-lr.jar
          EXP=20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
          SHOT=/mnt/mmc/RG35XX-MIYOO-M1.14-R4A-SCREENSHOT.bmp; META=/mnt/mmc/RG35XX-MIYOO-M1.14-R4A-LIVE-FRAME.txt
          rm -f "$SHOT" "$META" /mnt/mmc/RG35XX-MIYOO-M1.14-R4A-LIVE-FRAME.argb
          : >"$OUT"; echo 'RG35XX M1.14-r4A.1 CAPTURE FIX' >>"$OUT"; echo M1_14_R4A1_PRIMARY_VARIABLE=CAPTURE_OBSERVABILITY_ONLY >>"$OUT"; echo M1_14_R4A_BOLD_IMPLEMENTATION=UNCHANGED >>"$OUT"; echo M1_14_RESOURCE_CLASSIFICATION=EXPERIMENTAL_NOT_GOLDEN >>"$OUT"
          TMP=/tmp/m114r4a1-font.bin; unzip -p "$FONTJAR" org/recompile/mobile/rg35xx-font.bin >"$TMP" 2>/dev/null || true; FS=$(wc -c <"$TMP"|tr -d ' '); FH=$(sha256sum "$TMP"|awk '{print $1}'); echo M1_14_FONT_SIZE=$FS >>"$OUT"; echo M1_14_FONT_SHA256=$FH >>"$OUT"; [ "$FS" = 727008 ] && [ "$FH" = "$EXP" ] || { echo M1_14_RESOURCE_GATE=FAIL_CLOSED >>"$OUT"; exit 22; }; echo M1_14_RESOURCE_GATE=PASS_EXPERIMENTAL_20C2 >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}'); echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          LD_LIBRARY_PATH="$APP${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.14-r4a1-freej2me-platform.jar:$FONTJAR" org.recompile.mobile.M19CanvasLifecycleLauncher "$APP/m1.14-r4a1-bold-capture.jar" >>"$OUT" 2>&1
          RC=$?; echo JAMVM_EXIT_CODE=$RC >>"$OUT"
          JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}'); echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"; [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ] && echo M1_14_R4A1_PROTECTED_HASHES=PASS >>"$OUT" || echo M1_14_R4A1_PROTECTED_HASHES=FAIL >>"$OUT"
          if [ -s "$SHOT" ] && [ -s "$META" ]; then echo M1_14_R4A1_SCREENSHOT=PASS >>"$OUT"; echo M1_14_R4A1_SCREENSHOT_PATH=$SHOT >>"$OUT"; echo M1_14_R4A1_SCREENSHOT_SHA256=$(sha256sum "$SHOT"|awk '{print $1}') >>"$OUT"; cat "$META" >>"$OUT"; else echo M1_14_R4A1_SCREENSHOT=FAIL >>"$OUT"; fi
          grep -q 'M1_14_R4A_BOLD_STYLE=1' "$OUT" && grep -q 'M1_14_R4A_NORMAL_EXIT=PASS' "$OUT" && grep -q 'M1_14_R4A1_SCREENSHOT=PASS' "$OUT" && echo M1_14_R4A1_RUNTIME_GATE=PASS >>"$OUT" || echo M1_14_R4A1_RUNTIME_GATE=FAIL >>"$OUT"
          echo DEVICE_PASS=NO_VISUAL_REVIEW_PENDING >>"$OUT"; echo FULL_PLATFORM_STABLE=NO >>"$OUT"; sync
          SH
          chmod +x "$APP/M1.14-R4A1-BOLD-CAPTURE.sh"
          (cd out/garlicos && find Roms -type f -print0 | sort -z | xargs -0 sha256sum)>out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum "$APP"/*
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.14-r4a1-bold-capture
          path: out/garlicos/
          if-no-files-found: error
