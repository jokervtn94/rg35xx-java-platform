name: RG35XX From-Zero NoMask GoldenFont A-B

on:
  push:
    branches: [ rg35xx-from-zero-rebuild-v1 ]
    paths:
      - '.github/workflows/from-zero-nomask-goldenfont-ab.yml'
      - 'installer/INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.ps1'
      - 'installer/INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.cmd'
      - 'scripts/from_zero_apply_nomask_ab.py'
      - 'scripts/vc7_apply_golden_font.py'
      - 'scripts/from_zero_apply_proven_graphics.py'
      - 'scripts/from_zero_assemble_v1.sh'
      - 'scripts/vc7r2_apply_proven_dynamic_view.py'
      - 'scripts/vc6_apply_png_iccp_compat.py'
      - 'scripts/vc6_png_iccp_assemble.sh'
      - 'scripts/vc0_vc3_assemble.sh'
      - 'scripts/b4_verified_core_assemble.sh'
      - 'scripts/b4_apply_early_native_log.py'
      - 'scripts/b4_apply_video_observability.py'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_rg35xx_media_boot.py'
      - 'scripts/g1_apply_native_overlay.py'
  workflow_dispatch:

jobs:
  runtime-ab:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      FOUNDATION_CORE_SHA256: fc574021ad34b0466cd7ffe4f2eb58438eb2104c47cc503405d9f8722c02d062
      JAMVM_L_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      GOLDEN_FONT_SHA256: 7d835faaed37ae93d2bb783604453ad8d13d994f1c97074182ec040c6a29b99c
    steps:
      - name: Checkout platform policy
        uses: actions/checkout@v4

      - name: Checkout pristine pinned FreeJ2ME
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 unzip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prove pristine upstream identity
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          test -z "$(git -C upstream status --porcelain)"

      - name: Assemble exact Foundation v1 source
        run: |
          set -euo pipefail
          FZ_UPSTREAM="$GITHUB_WORKSPACE/upstream" FZ_ASSEMBLY="$RUNNER_TEMP/from-zero-font" \
            sh scripts/from_zero_assemble_v1.sh | tee "$RUNNER_TEMP/foundation-assembly.log"
          echo "FZ=$RUNNER_TEMP/from-zero-font" >> "$GITHUB_ENV"

      - name: Apply device-proven NoMask green fix
        run: |
          set -euo pipefail
          python3 scripts/from_zero_apply_nomask_ab.py "$FZ/src/org/recompile/mobile/PlatformGraphics.java" | tee "$RUNNER_TEMP/nomask.log"
          grep -q 'RG35XX-NOMASK-AB' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Apply Golden font renderer code only
        run: |
          set -euo pipefail
          python3 scripts/vc7_apply_golden_font.py "$FZ/src/org/recompile/mobile/PlatformGraphics.java" | tee "$RUNNER_TEMP/golden-font-code.log"
          grep -q 'RG35XX-VC7-FONT: Golden Unicode bitmap renderer' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"
          grep -q 'rg35xxDrawSafeText(str, x, y - ascent, anchor);' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"
          ! grep -q 'gc.drawString(str, x, y);' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Scope gate
        run: |
          set -euo pipefail
          ! grep -Rq 'final int clipLeft = Math.max(x' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"
          ! grep -Rq 'RG35XX-CV:' "$FZ/src"
          ! grep -Rq 'RG35XX-MediaWarmup' "$FZ/src"
          ! grep -Rq 'RG35XX-JAVA-DIAG:' "$FZ/src"
          ! grep -Rq 'RG35XXTransformCache' "$FZ/src/org/recompile/mobile/PlatformGraphics.java"
          test ! -f "$FZ/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Build Java 6 code-only runtime
        run: |
          set -euo pipefail
          cd "$FZ"
          ant
          JAR="$FZ/build/freej2me_plus-lr.jar"
          test -f "$JAR"
          ! unzip -l "$JAR" | grep -q 'rg35xx-font.bin'
          python3 - "$FZ/build/classes" <<'PY'
          import os,struct,sys
          root=sys.argv[1]; count=0
          for base,_,files in os.walk(root):
            for name in files:
              if not name.endswith('.class'): continue
              count+=1; p=os.path.join(base,name); h=open(p,'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe': raise SystemExit('bad class '+p)
              if struct.unpack('>H',h[6:8])[0] != 50: raise SystemExit('non-Java6 '+p)
          if count < 1000: raise SystemExit('bad class count %d'%count)
          print('NOMASK_GOLDENFONT_CLASS_COUNT=%d'%count)
          print('NOMASK_GOLDENFONT_JAVA_MAJOR=50')
          PY
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          echo "CODE_RUNTIME_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "CODE_RUNTIME_SHA256=$SHA"

      - name: PowerShell installer syntax gate
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/installer/INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.ps1",[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          Write-Host 'NOMASK_GOLDENFONT_INSTALLER_PARSE=PASS'

      - name: Package code-only local-recovery installer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/from-zero-nomask-goldenfont-ab"
          mkdir -p "$OUT/payload" "$OUT/installer" "$OUT/evidence"
          cp "$FZ/build/freej2me_plus-lr.jar" "$OUT/payload/freej2me-lr-code-only.jar"
          printf '%s\n' "$CODE_RUNTIME_SHA256" > "$OUT/payload/RUNTIME-CODE-SHA256.txt"
          cp installer/INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.ps1 "$OUT/installer/"
          cp installer/INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.cmd "$OUT/installer/"
          cp "$RUNNER_TEMP/foundation-assembly.log" "$OUT/evidence/"
          cp "$RUNNER_TEMP/nomask.log" "$OUT/evidence/"
          cp "$RUNNER_TEMP/golden-font-code.log" "$OUT/evidence/"
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=BUILD-PASS-CODE-ONLY_DEVICE-AB-PENDING
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          CODE_RUNTIME_SHA256=$CODE_RUNTIME_SHA256
          REQUIRED_CORE_SHA256=$FOUNDATION_CORE_SHA256
          REQUIRED_JAMVM_SHA256=$JAMVM_L_SHA256
          REQUIRED_GLIBJ_SHA256=$GLIBJ_SHA256
          REQUIRED_LOCAL_GOLDEN_FONT_SHA256=$GOLDEN_FONT_SHA256
          GREEN_TINT_FIX=NOMASK_RETAINED
          FONT_RENDERER=GOLDEN_BITMAP_CODE
          FONT_BINARY=NOT_DISTRIBUTED_RECOVER_LOCALLY_FROM_SD
          DRAWRGB_AB=REJECTED_NOT_INCLUDED
          AUDIO=UNCHANGED
          TRANSPARENCY=UNCHANGED
          DEVICE_PASS=NO
          EOF
          sed -i 's/^          //' "$OUT/STATUS.txt"
          cat > "$OUT/README-TEST.txt" <<'EOF'
          RG35XX FROM-ZERO NOMASK + GOLDEN FONT A/B

          This package does not distribute the Golden font binary.
          Installer searches JAR backups already on your SD and only accepts the exact
          device-proven embedded resource SHA256. If absent or mismatched, install aborts.

          Run:
            installer\INSTALL-FROM-ZERO-NOMASK-GOLDENFONT-AB.cmd H

          Test order after INSTALL PASS:
          1. KDTT 320x240
          2. Tan Tay Du Ky 3 320x240
          3. NinjaSchool1
          4. Real Football 2015, confirm green tint stays fixed

          Audio remains unchanged and may still fail in Real Football/Asphalt.
          EOF
          sed -i 's/^          //' "$OUT/README-TEST.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-from-zero-nomask-goldenfont-ab-local-recovery-installer
          path: ${{ runner.temp }}/from-zero-nomask-goldenfont-ab
          include-hidden-files: true
          retention-days: 30
