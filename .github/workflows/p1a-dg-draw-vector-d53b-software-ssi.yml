name: P1A DG Draw Vector D5.3B Software SSI Diagnostic

on:
  push:
    branches:
      - p1a-dg-draw-vector-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGDrawVectorD53BSoftwareSSIDiagnostic.java'
      - '.github/workflows/p1a-dg-draw-vector-d53b-software-ssi.yml'
  workflow_dispatch:

jobs:
  p1a-dg-draw-vector-d53b:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify locked ancestry and diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c2b1f2b0ca99d42ef9965a24f1eb7678eca428a HEAD
          git merge-base --is-ancestor 81c34ebc67b3c0ae5b6cb695145c1bf1ce090654 HEAD
          git merge-base --is-ancestor d912e23719c9083fe10d95af65c8ebf3024eb447 HEAD
          echo P1A_DG_D53B_D4_HOST_PARENT_ANCESTRY=PASS
          echo P1A_DG_D53B_D51_STROKESPAN_ANCESTRY=PASS
          echo P1A_DG_D53B_D53A_WIDENER_ANCESTRY=PASS
          echo P1A_DG_D53B_RUNTIME_CHANGE=NO

      - name: Compile Java6 independent SSI diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-dg-d53b
          javac -XDignore.symbol.file -encoding UTF-8 -source 1.6 -target 1.6 \
            -d build/p1a-dg-d53b \
            tests/p1a/RG35XXDGDrawVectorD53BSoftwareSSIDiagnostic.java
          echo P1A_DG_D53B_JAVA6_GATE=PASS

      - name: Run independent float SSI differential
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/p1a-dg-d53b \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD53BSoftwareSSIDiagnostic \
            | tee build/p1a-dg-d53b/D53B-SOFTWARE-SSI.txt
          LOG=build/p1a-dg-d53b/D53B-SOFTWARE-SSI.txt
          grep -q '^P1A_DG_D53B_FIXED_CASE_COUNT=20$' "$LOG"
          grep -q '^P1A_DG_D53B_FUZZ_CASE_COUNT=160$' "$LOG"
          grep -q '^P1A_DG_D53B_COMPARISON_COUNT=180$' "$LOG"
          grep -q '^P1A_DG_D53B_RANDOM_SEED=35d5001$' "$LOG"
          grep -q '^P1A_DG_D53B_MASK_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53B_RECT_COUNT_MISMATCH_CASE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53B_SEQUENCE_MISMATCH_CASE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53B_CLIP_BOUNDARY_MISMATCH_CASE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D53B_HOST_RECT_TOTAL=10429$' "$LOG"
          grep -q '^P1A_DG_D53B_SOFTWARE_RECT_TOTAL=10429$' "$LOG"
          grep -q '^P1A_DG_D53B_HOST_PIXEL_TOTAL=19493$' "$LOG"
          grep -q '^P1A_DG_D53B_SOFTWARE_PIXEL_TOTAL=19493$' "$LOG"
          grep -q '^P1A_DG_D53B_INDEPENDENT_WIDENER=LINE_ONLY_CLOSED_MITER_W1_QUARTER_NORMALIZED$' "$LOG"
          grep -q '^P1A_DG_D53B_INDEPENDENT_RASTER=FLOAT_SSI_NONZERO_ACTIVE_EDGE$' "$LOG"
          grep -q '^P1A_DG_D53B_HOST_SHAPESPANITERATOR_ON_CANDIDATE=NO$' "$LOG"
          grep -q '^P1A_DG_D53B_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_DG_D53B_DIAGNOSTIC_GATE=PASS$' "$LOG"
          echo P1A_DG_D53B_STRICT_GATE=PASS

      - name: Upload D5.3B diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-DRAW-VECTOR-D53B-${{ github.sha }}
          path: build/p1a-dg-d53b/
          if-no-files-found: error
