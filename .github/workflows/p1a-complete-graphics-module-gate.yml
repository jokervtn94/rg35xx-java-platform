name: P1A Complete Graphics Module Gate

on:
  push:
    branches:
      - p1a-complete-graphics-candidate
    paths:
      - 'docs/RG35XX-PLATFORM-SOURCE-COVERAGE-MATRIX-v1.tsv'
      - 'scripts/build-p1a-complete-graphics-candidate.sh'
      - 'scripts/build-p1a-graphics-exerciser.sh'
      - 'scripts/gate-p1a-graphics-coverage.py'
      - 'scripts/stage-p1a-complete-graphics-g4g5.py'
      - 'tests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java'
      - 'tests/p1a/exerciser/RG35XXPlatformExerciserP1A.java'
      - '.github/workflows/p1a-complete-graphics-module-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-complete-graphics-module-host-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Checkout module candidate and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D6 ancestry, convergence scope, and no diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          D6=093aae62d7caca2941258592c72dfc25b1f204a7
          git merge-base --is-ancestor "$D6" HEAD
          [ "$(git merge-base "$D6" HEAD)" = "$D6" ]
          changed="$(git diff --name-only "$D6"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p1a-complete-graphics-candidate-r2.yml\n.github/workflows/p1a-complete-graphics-candidate-r3.yml\n.github/workflows/p1a-complete-graphics-candidate.yml\n.github/workflows/p1a-complete-graphics-module-gate.yml\ndocs/RG35XX-PLATFORM-SOURCE-COVERAGE-MATRIX-v1.tsv\nscripts/build-p1a-complete-graphics-candidate.sh\nscripts/build-p1a-graphics-exerciser.sh\nscripts/gate-p1a-graphics-coverage.py\nscripts/stage-p1a-complete-graphics-g4g5.py\ntests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java\ntests/p1a/exerciser/RG35XXPlatformExerciserP1A.java'
          [ "$changed" = "$expected" ] || { echo "P1A_MODULE_SCOPE_FAIL=$changed" >&2; exit 1; }
          if git log --format=%H "$D6"..HEAD | grep -Eq '09ac133c24242f6dfa266e8fb3d506b1550ee194|c0a958277dbb6b0cf8de42bff2c70083c789566f'; then
            echo P1A_MODULE_FAIL=diagnostic_branch_became_parent >&2
            exit 1
          fi
          if git diff --name-only "$D6"..HEAD | grep -E '^(native/|adapter/java/org/recompile/rg35xx/|upstream/)' >/dev/null; then
            echo P1A_MODULE_FAIL=owner_scope_expanded_into_protected_runtime >&2
            exit 1
          fi
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          echo P1A_MODULE_D6_ANCESTRY=PASS
          echo P1A_MODULE_DIAGNOSTIC_PARENT=NO
          echo P1A_MODULE_A9_PARENT=NO
          echo P1A_MODULE_CONVERGED_BRANCH=PASS

      - name: Gate committed P1A graphics coverage matrix
        run: python3 ./scripts/gate-p1a-graphics-coverage.py "$GITHUB_WORKSPACE"

      - name: Materialize A4 raw2D baseline once
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain once
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters once
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay once
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build complete graphics candidate once and lock host regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-complete-graphics-candidate.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-complete-graphics-candidate.sh | tee /tmp/p1a-module-candidate.log
          grep -q '^P1A_COMPLETE_GRAPHICS_BUILD=PASS$' /tmp/p1a-module-candidate.log
          ID=out/p1a-complete-graphics-candidate/P1A-COMPLETE-GRAPHICS-IDENTITY.txt
          grep -q '^G4G5_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^G4G5_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^D6_DRAW_VECTOR_REGRESSION=PASS$' "$ID"
          grep -q '^D4_FILL_VECTOR_REGRESSION=PASS$' "$ID"
          grep -q '^G2D_ARC_FAMILY_REGRESSION=PASS$' "$ID"
          grep -q '^G2C_DRAWROUNDRECT_REGRESSION=PASS$' "$ID"
          grep -q '^G1_G2A_BEHAVIOR_REGRESSION=PASS$' "$ID"
          grep -q '^G1_ALPHA_REGRESSION=PASS$' "$ID"
          grep -q '^A6_PROTECTED_REGRESSIONS=PASS$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^NATIVE_CHANGE=NO$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^SPECULATIVE_OPTIMIZATION=NO$' "$ID"
          grep -q '^A9_PARENT=NO$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          echo P1A_MODULE_CANDIDATE_HOST_GATE=PASS

      - name: Build the one P1A graphics exerciser JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-graphics-exerciser.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-graphics-exerciser.sh | tee /tmp/p1a-exerciser-build.log
          grep -q '^P1A_EXERCISER_BUILD=PASS$' /tmp/p1a-exerciser-build.log
          EX=out/p1a-complete-graphics-candidate/P1A-EXERCISER-IDENTITY.txt
          grep -q '^ARTIFACT=RG35XX-Platform-Exerciser-P1A.jar$' "$EX"
          grep -q '^JAVA6_GATE=PASS$' "$EX"
          grep -q '^COMMERCIAL_GAME_CONTENT=NO$' "$EX"
          grep -q '^DEVICE-PASS=NO$' "$EX"
          grep -q '^STABLE=NO$' "$EX"
          echo P1A_MODULE_EXERCISER_GATE=PASS

      - name: Write module host identity and physical-test handoff
        shell: bash
        run: |
          set -euo pipefail
          OUT=out/p1a-complete-graphics-candidate
          CID="$OUT/P1A-COMPLETE-GRAPHICS-IDENTITY.txt"
          EID="$OUT/P1A-EXERCISER-IDENTITY.txt"
          CAND_SHA="$(sha256sum "$OUT/freej2me-rg35xx.jar" | awk '{print $1}')"
          EX_SHA="$(sha256sum "$OUT/RG35XX-Platform-Exerciser-P1A.jar" | awk '{print $1}')"
          [ "$CAND_SHA" = "$(sed -n 's/^CANDIDATE_PLATFORM_JAR_SHA256=//p' "$CID")" ]
          [ "$EX_SHA" = "$(sed -n 's/^EXERCISER_SHA256=//p' "$EID")" ]
          [ -z "$(git -C upstream/freej2me-miyoomini status --porcelain --untracked-files=no)" ]
          cat > "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt" <<EOF
          PROJECT=RG35XX-AWEIGIT-R1
          MODULE=P1A_GRAPHICS
          CANDIDATE_HEAD=$GITHUB_SHA
          EXACT_RUNTIME_PARENT=093aae62d7caca2941258592c72dfc25b1f204a7
          CANONICAL_AWEIGIT=ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          HOST_MODULE_GATE=PASS
          COVERAGE_MATRIX_GATE=PASS
          HOST_DIFFERENTIAL_REGRESSIONS=PASS
          EXERCISER_BUILD=PASS
          EXERCISER_ARTIFACT=RG35XX-Platform-Exerciser-P1A.jar
          CANDIDATE_PLATFORM_JAR_SHA256=$CAND_SHA
          EXERCISER_SHA256=$EX_SHA
          INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d
          VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d
          AUDIO_CHANGE=NO
          JAMVM_GLIBJ_CHANGE=NO
          CANONICAL_GITLINK_MUTATED=NO
          DIAGNOSTIC_BRANCH_PARENT=NO
          A9_PARENT=NO
          GAME_SPECIFIC_CODE=NO
          TRACE_ONLY_FINAL_RESIDUE=NO
          PHYSICAL_TEST_ARTIFACT_READY=YES
          PHYSICAL_TEST_REQUIRED=YES_ORIGINAL_RG35XX
          PHYSICAL_ACCEPTANCE_SURFACE=ONE_P1A_GRAPHICS_EXERCISER
          DEVICE-PASS=NO
          STABLE=NO
          NEXT_ACTION=RUN_ONE_P1A_GRAPHICS_EXERCISER_ON_ORIGINAL_RG35XX
          EOF
          sed -i 's/^          //' "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"
          grep -q '^HOST_MODULE_GATE=PASS$' "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"
          grep -q '^PHYSICAL_TEST_ARTIFACT_READY=YES$' "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"
          grep -q '^DEVICE-PASS=NO$' "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"
          grep -q '^STABLE=NO$' "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"
          echo P1A_COMPLETE_GRAPHICS_MODULE_HOST_GATE=PASS
          cat "$OUT/P1A-MODULE-INTEGRATION-IDENTITY.txt"

      - name: Upload module candidate and one physical exerciser
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-GRAPHICS-MODULE-HOST-${{ github.sha }}
          path: out/p1a-complete-graphics-candidate/
          if-no-files-found: error
