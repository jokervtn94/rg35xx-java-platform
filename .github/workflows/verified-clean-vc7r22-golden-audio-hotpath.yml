name: Verified Clean VC7R22 Golden Audio + Hotpath Cleanup

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r22-golden-audio-hotpath.yml'
      - 'scripts/vc7r22_apply_hotpath_cleanup.py'
      - 'scripts/vc7r22_ci.sh'
      - 'tasklog/VC7R22-GOLDEN-AUDIO-RESTORE-HOTPATH-CLEANUP.md'
  workflow_dispatch:

jobs:
  vc7r22-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build VC7R22 cleaned runtime
        run: bash scripts/vc7r22_ci.sh
      - name: Gate artifact policy
        run: |
          set -euo pipefail
          test -f /tmp/vc7r22-out/freej2me-lr-vc7r22.jar
          test -f /tmp/vc7r22-out/CORE-POLICY.txt
          test -f /tmp/vc7r22-out/STATUS.txt
          ! find /tmp/vc7r22-out -maxdepth 1 -type f -name '*.so' | grep -q .
          grep -Fq 'CORE_PACKAGED=NO' /tmp/vc7r22-out/CORE-POLICY.txt
          grep -Fq '9c248b0b4bf4caf225861e1a8616f9585a09609c52aa60e78accaefb17e1cb40' /tmp/vc7r22-out/CORE-POLICY.txt
          grep -Fq '4ba55aeafba28379b8080a52f63cd64321867ac7af868cd3b43cc41a9165ecdf' /tmp/vc7r22-out/CORE-POLICY.txt
          echo 'VC7R22_ARTIFACT_POLICY_GATE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r22-hotpath-clean-runtime
          path: /tmp/vc7r22-out
          if-no-files-found: error
