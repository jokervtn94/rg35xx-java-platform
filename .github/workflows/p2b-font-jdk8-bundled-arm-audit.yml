name: P2B Font JDK8 Bundled FreeType ARM Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-bundled-arm-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py'
      - 'docs/P2B-FONT-TEXT-EVIDENCE-SYNTHESIS-v1.md'

permissions:
  contents: read

jobs:
  jdk8-bundled-freetype-arm:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      OPENJDK8U504_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      EXPECTED_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      EXPECTED_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk8-bundled-arm-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk8-bundled-arm-files.txt | grep -q .; then
            echo 'P2B_JDK8_BUNDLED_ARM_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_BUNDLED_ARM_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Materialize exact OpenJDK8u504 bundled FreeType source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/openjdk8u
          git -C out/openjdk8u init -q
          git -C out/openjdk8u remote add origin https://github.com/openjdk/jdk8u.git
          git -C out/openjdk8u config core.sparseCheckout true
          printf '%s\n' \
            '/jdk/src/share/native/sun/awt/libfreetype/' \
            > out/openjdk8u/.git/info/sparse-checkout
          git -C out/openjdk8u fetch --depth=1 origin "$OPENJDK8U504_COMMIT"
          git -C out/openjdk8u checkout -q FETCH_HEAD
          test "$(git -C out/openjdk8u rev-parse HEAD)" = "$OPENJDK8U504_COMMIT"
          INCLUDE_TREE=$(git -C out/openjdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)
          SRC_TREE=$(git -C out/openjdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)
          test "$INCLUDE_TREE" = "$EXPECTED_FT_INCLUDE_TREE"
          test "$SRC_TREE" = "$EXPECTED_FT_SRC_TREE"
          FTROOT=out/openjdk8u/jdk/src/share/native/sun/awt/libfreetype
          test -f "$FTROOT/include/freetype/freetype.h"
          test -d "$FTROOT/src"
          {
            echo "P2B_OPENJDK8U504_COMMIT=$OPENJDK8U504_COMMIT"
            echo "P2B_OPENJDK8_FT_INCLUDE_TREE=$INCLUDE_TREE"
            echo "P2B_OPENJDK8_FT_SRC_TREE=$SRC_TREE"
            echo "P2B_OPENJDK8_FT_SOURCE_UNITS=$(find "$FTROOT/src" -type f -name '*.c' | wc -l | tr -d ' ')"
            grep -E 'FREETYPE_(MAJOR|MINOR|PATCH)' "$FTROOT/include/freetype/freetype.h" || true
            echo 'P2B_OPENJDK8_FT_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-JDK8-BUNDLED-ARM-SOURCE-PROVENANCE.txt
          find "$FTROOT/src" -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort \
            > out/P2B-JDK8-BUNDLED-ARM-SOURCE-UNITS.txt

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          {
            /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc --version | head -n 1
            echo 'P2B_JDK8_BUNDLED_ARM_TOOLCHAIN=PASS'
          } | tee out/P2B-JDK8-BUNDLED-ARM-TOOLCHAIN.txt

      - name: Cross-build exact OpenJDK bundled FreeType source with JDK-equivalent units and flags
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=out/openjdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          mkdir -p out/ftobj
          : > out/P2B-JDK8-BUNDLED-ARM-COMPILE-COMMANDS.txt
          count=0
          while IFS= read -r rel; do
            src="$FTROOT/src/$rel"
            obj="out/ftobj/${rel//\//__}"
            obj="${obj%.c}.o"
            printf '%q ' "$CC" -O3 -fPIC -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj" \
              >> out/P2B-JDK8-BUNDLED-ARM-COMPILE-COMMANDS.txt
            printf '\n' >> out/P2B-JDK8-BUNDLED-ARM-COMPILE-COMMANDS.txt
            "$CC" -O3 -fPIC -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
            count=$((count+1))
          done < out/P2B-JDK8-BUNDLED-ARM-SOURCE-UNITS.txt
          test "$count" -gt 0
          test "$count" = "$(find out/ftobj -type f -name '*.o' | wc -l | tr -d ' ')"
          "$CC" -shared -Wl,-soname,libfreetype-jdk8u504.so \
            -o out/libfreetype-jdk8u504.so out/ftobj/*.o -lm
          file out/libfreetype-jdk8u504.so | tee out/P2B-JDK8-BUNDLED-ARM-LIB-FILE.txt
          sha256sum out/libfreetype-jdk8u504.so | tee out/P2B-JDK8-BUNDLED-ARM-LIB-SHA256.txt
          {
            echo "P2B_JDK8_BUNDLED_ARM_COMPILED_UNITS=$count"
            echo 'P2B_JDK8_BUNDLED_ARM_CFLAGS=-O3 -fPIC -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -DFT2_BUILD_LIBRARY'
            echo 'P2B_JDK8_BUNDLED_ARM_BUILD=PASS'
          } | tee out/P2B-JDK8-BUNDLED-ARM-BUILD-STATUS.txt

      - name: Materialize exact Miyoo MiSans for diagnostic comparison
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_BUNDLED_ARM_FONT_IDENTITY=PASS'

      - name: Generate exact JDK8 AWT raster reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes \
            RG35XXP2BJdkRasterFingerprintDiagnostic out/font.ttf \
            | tee out/P2B-JDK8-BUNDLED-ARM-JDK-RASTER.log
          grep -F 'P2B_JDK_RASTER_FP_CASES=144' out/P2B-JDK8-BUNDLED-ARM-JDK-RASTER.log
          grep -F 'P2B_JDK_RASTER_FP_RESULT=PASS' out/P2B-JDK8-BUNDLED-ARM-JDK-RASTER.log

      - name: Run source-matched scaler probe against cross-built ARM FreeType
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=out/openjdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          "$CC" -O3 -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c \
            out/libfreetype-jdk8u504.so -lm \
            -Wl,-rpath,'$ORIGIN' \
            -o out/p2b-jdk8-bundled-arm-probe
          file out/p2b-jdk8-bundled-arm-probe | tee out/P2B-JDK8-BUNDLED-ARM-PROBE-FILE.txt
          QEMU_LD_PREFIX="$SYSROOT" LD_LIBRARY_PATH=out \
            qemu-arm -L "$SYSROOT" out/p2b-jdk8-bundled-arm-probe out/font.ttf \
            | tee out/P2B-JDK8-BUNDLED-ARM-PROBE.log
          grep -F 'P2B_FT_LIBRARY_VERSION=2.14.3' out/P2B-JDK8-BUNDLED-ARM-PROBE.log
          grep -F 'P2B_FT_JDK8_INTERPRETER=35' out/P2B-JDK8-BUNDLED-ARM-PROBE.log
          grep -F 'P2B_FT_JDK8_SCALER_CASES=144' out/P2B-JDK8-BUNDLED-ARM-PROBE.log
          grep -F 'P2B_FT_JDK8_SCALER_RESULT=PASS' out/P2B-JDK8-BUNDLED-ARM-PROBE.log

      - name: Require exact sampled raster compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py \
            out/P2B-JDK8-BUNDLED-ARM-JDK-RASTER.log \
            out/P2B-JDK8-BUNDLED-ARM-PROBE.log \
            | tee out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_DIFF_PARSE=PASS' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_WIDTH_EXACT=144' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_BOUNDS_EXACT=144' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_INK_EXACT=144' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_FP_EXACT=144' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_MISMATCH_COUNT=0' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_CLASSIFICATION=EXACT_FOR_SAMPLED_TABLE' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_DIFF_RESULT=PASS' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
          {
            echo 'P2B_JDK8_BUNDLED_ARM_SAMPLED_RASTER=EXACT'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-BUNDLED-ARM-FINAL-STATUS.txt

      - name: Remove source, font, archive, binaries, and objects before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/openjdk8u out/ftobj out/classes
          rm -f out/font.ttf out/miyoomini-freej2me.zip \
            out/libfreetype-jdk8u504.so out/p2b-jdk8-bundled-arm-probe
          if find out -type f | grep -Ei '\.(ttf|otf|so|o|a)$'; then
            echo 'P2B_JDK8_BUNDLED_ARM_BINARY_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_JDK8_BUNDLED_ARM_BINARY_LEAK=NO' \
            | tee out/P2B-JDK8-BUNDLED-ARM-LEAK-STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-BUNDLED-FT-ARM-${{ github.sha }}
          path: |
            out/P2B-JDK8-BUNDLED-ARM-SOURCE-PROVENANCE.txt
            out/P2B-JDK8-BUNDLED-ARM-SOURCE-UNITS.txt
            out/P2B-JDK8-BUNDLED-ARM-TOOLCHAIN.txt
            out/P2B-JDK8-BUNDLED-ARM-COMPILE-COMMANDS.txt
            out/P2B-JDK8-BUNDLED-ARM-LIB-FILE.txt
            out/P2B-JDK8-BUNDLED-ARM-LIB-SHA256.txt
            out/P2B-JDK8-BUNDLED-ARM-BUILD-STATUS.txt
            out/P2B-JDK8-BUNDLED-ARM-JDK-RASTER.log
            out/P2B-JDK8-BUNDLED-ARM-PROBE-FILE.txt
            out/P2B-JDK8-BUNDLED-ARM-PROBE.log
            out/P2B-JDK8-BUNDLED-ARM-DIFFERENTIAL.txt
            out/P2B-JDK8-BUNDLED-ARM-FINAL-STATUS.txt
            out/P2B-JDK8-BUNDLED-ARM-LEAK-STATUS.txt
          if-no-files-found: warn
