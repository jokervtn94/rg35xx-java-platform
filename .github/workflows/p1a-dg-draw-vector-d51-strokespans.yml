name: P1A DG Draw Vector D5.1 StrokeSpans Diagnostic

on:
  push:
    branches:
      - p1a-dg-draw-vector-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGDrawVectorD51StrokeSpanDiagnostic.java'
      - '.github/workflows/p1a-dg-draw-vector-d51-strokespans.yml'
  workflow_dispatch:

jobs:
  p1a-dg-draw-vector-d51:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify locked ancestry and diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c2b1f2b0ca99d42ef9965a24f1eb7678eca428a HEAD
          git merge-base --is-ancestor 198dd533e2007b22bc294243b0f84856474d1083 HEAD
          echo P1A_DG_D51_D4_HOST_PARENT_ANCESTRY=PASS
          echo P1A_DG_D51_D5_DIAGNOSTIC_ANCESTRY=PASS
          echo P1A_DG_D51_RUNTIME_CHANGE=NO

      - name: Compile Java6 internal-owner diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-dg-d51
          javac -XDignore.symbol.file -encoding UTF-8 -source 1.6 -target 1.6 \
            -d build/p1a-dg-d51 \
            tests/p1a/RG35XXDGDrawVectorD51StrokeSpanDiagnostic.java
          echo P1A_DG_D51_JAVA6_GATE=PASS

      - name: Run exact getStrokeSpans differential
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/p1a-dg-d51 \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD51StrokeSpanDiagnostic \
            | tee build/p1a-dg-d51/D51-STROKESPANS.txt
          LOG=build/p1a-dg-d51/D51-STROKESPANS.txt
          grep -q '^P1A_DG_D51_FIXED_CASE_COUNT=20$' "$LOG"
          grep -q '^P1A_DG_D51_FUZZ_CASE_COUNT=160$' "$LOG"
          grep -q '^P1A_DG_D51_ALPHA_LEVEL_COUNT=3$' "$LOG"
          grep -q '^P1A_DG_D51_COMPARISON_COUNT=540$' "$LOG"
          grep -q '^P1A_DG_D51_RANDOM_SEED=35d5001$' "$LOG"
          grep -q '^P1A_DG_D51_STROKE_SPAN_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D51_RENDERING_ENGINE=' "$LOG"
          grep -q '^P1A_DG_D51_ALPHA_OWNER=OPENJDK8_LOOPPIPE_GETSTROKESPANS_RENDERINGENGINE_STROKETO_SHAPESPANITERATOR$' "$LOG"
          grep -q '^P1A_DG_D51_ALPHA_COMPOSITE=G1_EXACT_8BIT_SRCOVER$' "$LOG"
          grep -q '^P1A_DG_D51_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_DG_D51_DIAGNOSTIC_GATE=PASS$' "$LOG"

      - name: Upload D5.1 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-DRAW-VECTOR-D51-${{ github.sha }}
          path: build/p1a-dg-d51/
          if-no-files-found: error
