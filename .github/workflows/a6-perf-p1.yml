name: A6 RG35XX PERF-P1 Native Presenter

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a6-real-game-regression
    paths:
      - '.github/workflows/a6-perf-p1.yml'
      - 'scripts/stage-a6-rg35xx-video-perf-p1.py'
      - 'scripts/build-a6-perf-p1.sh'
      - 'scripts/stage-a6-rg35xx-raw-drawrect-r5p3i2.py'
      - 'scripts/build-a6-raw-drawrect-r5p3i2.sh'
      - 'scripts/stage-a6-rg35xx-input-lifecycle-r5p3i1.py'
      - 'scripts/build-a6-input-lifecycle-r5p3i1-v2.sh'
      - 'scripts/stage-a6-rg35xx-raw-rect-polygon-r5p3.py'
      - 'scripts/build-a6-raw-rect-polygon-r5p3.sh'
      - 'scripts/stage-a6-rg35xx-raw-drawline-r5.py'
      - 'scripts/build-a6-raw-drawline-r5.sh'
      - 'scripts/build-a6-parent-trace-r4t.sh'
      - 'scripts/stage-a6-rg35xx-parent-trace-r4t.py'
      - 'scripts/build-a6-classloader-fix.sh'
      - 'scripts/stage-a6-rg35xx-classloader-race.py'
      - 'scripts/stage-a6-rg35xx-drawregion-null-guard.py'
      - 'scripts/stage-a6-rg35xx-adam7.py'
      - 'scripts/build-a5-core2d-java.sh'
      - 'scripts/stage-a5-rg35xx-core2d-v2.py'
      - 'scripts/build-a4-raw2d-java.sh'
      - 'scripts/build-a3.sh'
      - 'adapter/**'

permissions:
  contents: read

jobs:
  a6-perf-p1:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout A6 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage PERF-P1 cached native presenter
        run: python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"

      - name: Build PERF-P1 RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build entry-exact R5P3I2 Java plus PERF-P1 package
        run: bash ./scripts/build-a6-perf-p1.sh

      - name: Finalize protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Verify PERF-P1 scope and locks
        run: |
          set -euo pipefail
          ID=out/a6-perf-p1/A6-PERF-P1-IDENTITY.txt
          grep -q '^BASE_PLATFORM_SEMANTIC_SHA256=b79cafa98c467436cf0e782b069839e993a7dc7bdb31b9a423b47c0ff293950e$' "$ID"
          grep -q '^BASE_DEVICE_TESTED_SEMANTIC_SHA256=b79cafa98c467436cf0e782b069839e993a7dc7bdb31b9a423b47c0ff293950e$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^A6_PERF_P1_OWNER=RG35XX_NATIVE_PRESENT_SCALER$' "$ID"
          grep -q '^A6_PERF_P1_XY_MAP=CACHED_ON_GEOMETRY_CHANGE$' "$ID"
          grep -q '^A6_PERF_P1_BLACK_CLEAR=GEOMETRY_CHANGE_ONLY$' "$ID"
          grep -q '^A6_PERF_P1_JAVA_PLATFORM=ENTRY_BYTE_EXACT_R5P3I2$' "$ID"
          grep -q '^A6_PERF_P1_JAVA_ENTRY_SEMANTIC_GATE=PASS$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          test "$(sha256sum out/a6-perf-p1/librg35xx_input.so | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum out/a6-perf-p1/librg35xx_video.so | awk '{print $1}')" != '9094819d7c81576b63bd0cde9531404a3fb82b8d5b845dbae152152f2e1a2a7a'
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a6-perf-p1/CANONICAL-DIFF-MANIFEST.txt
          cp out/a3/BUILD-IDENTITY.txt out/a6-perf-p1/A6-PLATFORM-BUILD-IDENTITY.txt
          (cd out/a6-perf-p1 && sha256sum * > A6-ARTIFACT-SHA256SUMS.txt)
          echo A6_PERF_P1_SCOPE_LOCK=PASS

      - name: Upload PERF-P1 platform
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A6-PERF-P1-${{ github.sha }}
          path: out/a6-perf-p1/
          if-no-files-found: error
