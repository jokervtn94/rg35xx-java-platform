name: A8 COMP-02 notifyDestroyed Trace

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-a8-comp02-notifydestroyed-trace
    paths:
      - '.github/workflows/a8-comp02-notifydestroyed-trace.yml'
      - 'scripts/build-a8-comp02-notifydestroyed-trace.sh'

permissions:
  contents: read

jobs:
  a8-comp02-notifydestroyed-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout trace branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize accepted A4 baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage accepted PERF-A1 native presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build accepted A6 native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild accepted A6 ClipTranslate parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Build accepted A7 Java runtime
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Build accepted A7 SDL1_mixer bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && bash ./scripts/build-a7-audio-native.sh'
          sudo chown -R "$(id -u):$(id -g)" out/a7-audio-sdl1

      - name: Build trace-only MIDlet candidate
        run: bash ./scripts/build-a8-comp02-notifydestroyed-trace.sh

      - name: Enforce trace scope and protected native identities
        run: |
          set -euo pipefail
          ID=out/a8-comp02-notifydestroyed-trace/A8-COMP02-TRACE-IDENTITY.txt
          P=out/a8-comp02-notifydestroyed-trace/RG35XX-A8-COMP02-TRACE-R1
          grep -q '^BASELINE=A8$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=javax/microedition/midlet/MIDlet.class$' "$ID"
          grep -q '^TRACE_DELTA=NOTIFYDESTROYED_THREAD_MEMORY_CALLER_STACK_ONLY$' "$ID"
          grep -q '^NOTIFYDESTROYED_SHUTDOWN_ORDER=UNCHANGED$' "$ID"
          grep -q '^SYSTEM_EXIT_BEHAVIOR=UNCHANGED$' "$ID"
          grep -q '^PRODUCTION_BASELINE_CHANGED=NO$' "$ID"
          grep -q '^DEVICE_PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          test "$(sha256sum "$P/librg35xx_input.so" | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum "$P/librg35xx_video.so" | awk '{print $1}')" = 'c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d'
          test "$(sha256sum "$P/libaudio.so" | awk '{print $1}')" = '4522157846c33c150a85c50b4bed6f68351f1c62d54b8cd7805cbb97c5727644'
          test "$(sha256sum "$P/a7-a1p5-rw-silence-prime.s32le" | awk '{print $1}')" = '8c30691e755abd6791ac75887b56e20f1a56266b2eb0286bfb4007b98f7d7a7e'
          echo A8_COMP02_TRACE_SCOPE_LOCK=PASS

      - name: Upload COMP-02 trace package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-A8-COMP02-NOTIFYDESTROYED-TRACE-${{ github.sha }}
          path: out/a8-comp02-notifydestroyed-trace/
          if-no-files-found: error
