name: RG35XX DP-R2 Image Sprite r1.5 AB
on:
  workflow_dispatch:
  push:
    branches: [dp-r2-image-sprite-r15-ab]
    paths:
      - '.github/workflows/rg35xx-dp-r2-image-sprite-r15-ab.yml'
      - 'rebuild-v2/**'
      - 'docs/DP-R2-IMAGE-SPRITE-R15-AB.md'
jobs:
  image-sprite-r15:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant unzip >/dev/null
      - name: Materialize pinned Miyoo ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Build DP-R2 isolated Image Sprite r1.5 checkpoint
        run: bash rebuild-v2/build_image_sprite_r15.sh
      - name: Publish identity
        run: |
          cat out/dp-r2/BUILD-IDENTITY.txt
          echo '--- SHA256SUMS ---'
          cat out/dp-r2/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-dp-r2-image-sprite-r15-ab
          path: out/dp-r2/
          if-no-files-found: error
