name: RG35XX Audio R2.3 Hang Localization A-B
on:
  push:
    branches: [ rg35xx-from-zero-rebuild-v1 ]
    paths:
      - '.github/workflows/audio-r2.3-hang-localization-ab.yml'
      - 'scripts/ci_build_r23_hang_localization.sh'
      - 'scripts/vc7r22r23_apply_hang_localization.py'
      - 'installer/INSTALL-AUDIO-R2.3-HANG-LOCALIZATION-AB.ps1'
      - 'installer/INSTALL-AUDIO-R2.3-HANG-LOCALIZATION-AB.cmd'
      - 'tasklog/R2.3-HANG-LOCALIZATION-AB-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - name: Checkout pinned history
        uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history
      - name: Toolchain and Java
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils unzip
          docker pull docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
          cid=$(docker create docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e true)
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          docker rm -f "$cid"
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Build and gate R2.3
        run: sh -x scripts/ci_build_r23_hang_localization.sh
      - name: Validate installer syntax
        shell: pwsh
        run: |
          $t=$null;$e=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/installer/INSTALL-AUDIO-R2.3-HANG-LOCALIZATION-AB.ps1",[ref]$t,[ref]$e)
          if($e.Count -ne 0){$e | ForEach-Object {Write-Error $_.Message};exit 1}
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-audio-r2.3-hang-localization-ab
          path: ${{ runner.temp }}/audio-r2.3-hang-localization-ab
          include-hidden-files: true
          retention-days: 30
