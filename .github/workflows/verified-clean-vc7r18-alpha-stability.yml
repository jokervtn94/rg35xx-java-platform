name: Verified Clean VC7R18 Alpha Stability
on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r18-alpha-stability.yml'
      - 'scripts/vc7r18_apply_alpha_stability_fix.py'
      - 'scripts/vc7r18_ci.sh'
  workflow_dispatch:
jobs:
  vc7r18-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Build VC7R18
        run: bash scripts/vc7r18_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r18-alpha-stability-runtime
          path: /tmp/vc7r18-out
          if-no-files-found: error
