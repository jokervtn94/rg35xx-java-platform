name: P2B Font JDK8 Complex Width ARM Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - 'tests/p2b/diagnostic/RG35XXP2BJdkWholeStringRasterDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_jdk8_whole_raster_arm.cpp'
      - 'tests/p2b/diagnostic/p2b_jdk8_complex_width_arm.cpp'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_complex_width.py'
      - '.github/workflows/p2b-font-jdk8-complex-width-arm-audit.yml'

permissions:
  contents: read

jobs:
  p2b-jdk8-complex-width-arm:
    runs-on: ubuntu-24.04
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8_LAYOUT_TREE: bc6641fecdfb59f3146bb1591e090761a24b4061
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6
      JDK8_GLYPHLAYOUT_BLOB: bff5f4a94f9e05342f836fd7789f8d755814efcd
      JDK8_SUNLAYOUT_CPP_BLOB: ab65748eec5de20229657e0f270a39e58434910f
      JDK8_TEXTLINE_BLOB: 9efcdc32de2f3f75f73669e7468f9ec8787e8cdf
      JDK8_FDM_BLOB: d843c16cd5f598624567e648a83d7f2d14759ca9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-complex-width-arm-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-complex-width-arm-files.txt | grep -q .; then
            echo 'P2B_COMPLEX_WIDTH_ARM_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_COMPLEX_WIDTH_ARM_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ --version | head -n 1 | tee out/P2B-COMPLEX-WIDTH-ARM-CXX.txt
          echo 'P2B_COMPLEX_WIDTH_ARM_TOOLCHAIN=PASS'

      - name: Pin exact JDK8u504 LayoutEngine, width, and FreeType sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)" = "$JDK8_LAYOUT_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/classes/sun/font/GlyphLayout.java)" = "$JDK8_GLYPHLAYOUT_BLOB"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout/SunLayoutEngine.cpp)" = "$JDK8_SUNLAYOUT_CPP_BLOB"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/classes/java/awt/font/TextLine.java)" = "$JDK8_TEXTLINE_BLOB"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/classes/sun/font/FontDesignMetrics.java)" = "$JDK8_FDM_BLOB"
          grep -F 'Freetype v2.14.3' /tmp/jdk8u/THIRD_PARTY_README
          grep -F 'width = new TextLayout(str, font, frc).getAdvance();' /tmp/jdk8u/jdk/src/share/classes/sun/font/FontDesignMetrics.java
          grep -F 'return (int) (0.5 + width);' /tmp/jdk8u/jdk/src/share/classes/sun/font/FontDesignMetrics.java
          {
            echo "P2B_JDK8_FDM_BLOB=$JDK8_FDM_BLOB"
            echo 'P2B_COMPLEX_WIDTH_ARM_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-COMPLEX-WIDTH-ARM-PROVENANCE.txt

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 /tmp/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p /tmp/miyoomini-freej2me.zip "$ENTRY" > /tmp/p2b-font.ttf
          test "$(sha256sum /tmp/p2b-font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < /tmp/p2b-font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_COMPLEX_WIDTH_ARM_FONT_IDENTITY=PASS' | tee out/P2B-COMPLEX-WIDTH-ARM-FONT-IDENTITY.txt

      - name: Generate exact JDK8 width and layout-plan reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2b-complex-width-classes && mkdir -p /tmp/p2b-complex-width-classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d /tmp/p2b-complex-width-classes \
            tests/p2b/diagnostic/RG35XXP2BJdkWholeStringRasterDiagnostic.java
          java -Djava.awt.headless=true -cp /tmp/p2b-complex-width-classes \
            RG35XXP2BJdkWholeStringRasterDiagnostic /tmp/p2b-font.ttf /tmp/P2B-JDK8-WHOLE-RASTER.tsv \
            | tee out/P2B-COMPLEX-WIDTH-ARM-REFERENCE.log
          grep -F 'P2B_JDK8_WHOLE_RASTER_COMPLEX_CASES=192' out/P2B-COMPLEX-WIDTH-ARM-REFERENCE.log
          grep -F 'P2B_JDK8_WHOLE_RASTER_RTL_CASES=72' out/P2B-COMPLEX-WIDTH-ARM-REFERENCE.log
          grep -F 'P2B_JDK8_WHOLE_RASTER_RESULT=PASS' out/P2B-COMPLEX-WIDTH-ARM-REFERENCE.log

      - name: Cross-build exact vendored FreeType and LayoutEngine
        shell: bash
        run: |
          set -euo pipefail
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          FONT=/tmp/jdk8u/jdk/src/share/native/sun/font
          LAYOUT="$FONT/layout"
          FTOBJ=/tmp/p2b-cw-ft-obj
          LEOBJ=/tmp/p2b-cw-le-obj
          rm -rf "$FTOBJ" "$LEOBJ" && mkdir -p "$FTOBJ" "$LEOBJ"
          ftcount=0
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            "$CC" -Os -pipe -fPIC -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$FTOBJ/${rel//\//_}.o"
            ftcount=$((ftcount+1))
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          test "$ftcount" = 106
          "$AR" rcs /tmp/libp2b-cw-ft.a "$FTOBJ"/*.o

          lecount=0; excluded=0
          while IFS= read -r src; do
            base=$(basename "$src")
            if test "$base" = SunLayoutEngine.cpp; then excluded=$((excluded+1)); continue; fi
            "$CXX" -O2 -pipe -fPIC -std=gnu++98 -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DLE_STANDALONE -DHEADLESS -I"$FONT" -I"$LAYOUT" \
              -c "$src" -o "$LEOBJ/${base%.cpp}.o"
            lecount=$((lecount+1))
          done < <(find "$LAYOUT" -maxdepth 1 -type f -name '*.cpp' -print | sort)
          test "$lecount" = 87
          test "$excluded" = 1
          "$AR" rcs /tmp/libp2b-cw-le.a "$LEOBJ"/*.o

          "$CXX" -O2 -pipe -std=gnu++98 -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -DLE_STANDALONE -DHEADLESS -I"$FONT" -I"$LAYOUT" -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_jdk8_complex_width_arm.cpp \
            -Wl,--whole-archive /tmp/libp2b-cw-le.a -Wl,--no-whole-archive \
            /tmp/libp2b-cw-ft.a -lm -o /tmp/p2b-jdk8-complex-width-arm
          file /tmp/p2b-jdk8-complex-width-arm | tee out/P2B-COMPLEX-WIDTH-ARM-ELF.txt
          {
            echo "P2B_COMPLEX_WIDTH_ARM_FT_OBJECTS=$ftcount"
            echo "P2B_COMPLEX_WIDTH_ARM_LAYOUT_OBJECTS=$lecount"
            echo "P2B_COMPLEX_WIDTH_ARM_LAYOUT_JNI_WRAPPER_EXCLUDED=$excluded"
            echo 'P2B_COMPLEX_WIDTH_ARM_BUILD=PASS'
          } | tee out/P2B-COMPLEX-WIDTH-ARM-BUILD.txt

      - name: Run ARM complex stringWidth differential
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" /tmp/p2b-jdk8-complex-width-arm \
            /tmp/p2b-font.ttf /tmp/P2B-JDK8-WHOLE-RASTER.tsv /tmp/P2B-ARM-COMPLEX-WIDTH.tsv \
            | tee out/P2B-ARM-COMPLEX-WIDTH.log
          grep -F 'P2B_ARM_COMPLEX_WIDTH_CASES=192' out/P2B-ARM-COMPLEX-WIDTH.log
          grep -F 'P2B_ARM_COMPLEX_WIDTH_RTL_CASES=72' out/P2B-ARM-COMPLEX-WIDTH.log
          grep -F 'P2B_ARM_COMPLEX_WIDTH_RESULT=PASS' out/P2B-ARM-COMPLEX-WIDTH.log
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_complex_width.py \
            /tmp/P2B-JDK8-WHOLE-RASTER.tsv /tmp/P2B-ARM-COMPLEX-WIDTH.tsv \
            | tee out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_COMPLEX_WIDTH_CASES=192' out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_COMPLEX_WIDTH_RTL_CASES=72' out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_COMPLEX_WIDTH_WIDTH_EXACT=192' out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_COMPLEX_WIDTH_MISMATCH_COUNT=0' out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_COMPLEX_WIDTH_DIFF_RESULT=PASS' out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
          {
            echo 'P2B_COMPLEX_STRING_WIDTH_ARM_GATE=PASS'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-COMPLEX-WIDTH-ARM-STATUS.txt
          cp /tmp/P2B-ARM-COMPLEX-WIDTH.tsv out/P2B-ARM-COMPLEX-WIDTH.tsv

      - name: Remove source build font and binaries before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u /tmp/p2b-complex-width-classes /tmp/p2b-cw-ft-obj /tmp/p2b-cw-le-obj
          rm -f /tmp/p2b-font.ttf /tmp/miyoomini-freej2me.zip /tmp/libp2b-cw-ft.a /tmp/libp2b-cw-le.a /tmp/p2b-jdk8-complex-width-arm /tmp/P2B-JDK8-WHOLE-RASTER.tsv /tmp/P2B-ARM-COMPLEX-WIDTH.tsv
          if find out -type f | grep -Ei '\.(ttf|otf|class|jar|so|a|o)$'; then
            echo 'P2B_COMPLEX_WIDTH_ARM_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_COMPLEX_WIDTH_ARM_BYTE_LEAK=NO' | tee out/P2B-COMPLEX-WIDTH-ARM-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-COMPLEX-WIDTH-ARM-${{ github.sha }}
          path: |
            out/P2B-COMPLEX-WIDTH-ARM-CXX.txt
            out/P2B-COMPLEX-WIDTH-ARM-PROVENANCE.txt
            out/P2B-COMPLEX-WIDTH-ARM-FONT-IDENTITY.txt
            out/P2B-COMPLEX-WIDTH-ARM-REFERENCE.log
            out/P2B-COMPLEX-WIDTH-ARM-BUILD.txt
            out/P2B-COMPLEX-WIDTH-ARM-ELF.txt
            out/P2B-ARM-COMPLEX-WIDTH.log
            out/P2B-JDK8-ARM-COMPLEX-WIDTH-DIFFERENTIAL.txt
            out/P2B-COMPLEX-WIDTH-ARM-STATUS.txt
            out/P2B-ARM-COMPLEX-WIDTH.tsv
            out/P2B-COMPLEX-WIDTH-ARM-CLEANUP.txt
