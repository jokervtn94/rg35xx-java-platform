name: P1A G2C DrawRoundRect Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2c-drawroundrect-diagnostic
    paths:
      - '.github/workflows/p1a-g2c-drawroundrect-diagnostic.yml'
      - 'tests/p1a/RG35XXG2CDrawRoundRectDiagnostic.java'

permissions:
  contents: read

jobs:
  p1a-g2c-drawroundrect-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild G2B host parent
        run: bash ./scripts/build-p1a-g2b-filltriangle-jdk8-raster.sh

      - name: Characterize canonical drawRoundRect
        run: |
          set -euo pipefail
          JAR=out/p1a-g2b-filltriangle-jdk8-raster/freej2me-rg35xx.jar
          OUT=out/p1a-g2c-drawroundrect-diagnostic
          CLS=build/a3/p1a-g2c-diag-classes
          rm -rf "$OUT" "$CLS"; mkdir -p "$OUT" "$CLS"
          javac -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" -classpath "$JAR" \
            -d "$CLS" tests/p1a/RG35XXG2CDrawRoundRectDiagnostic.java
          java -Djava.awt.headless=true -cp "$JAR:$CLS" \
            org.recompile.rg35xx.p1a.RG35XXG2CDrawRoundRectDiagnostic \
            | tee "$OUT/P1A-G2C-DRAWROUNDRECT-DIAGNOSTIC.txt"
          grep -q '^P1A_G2C_DIAGNOSTIC_FAILURE_COUNT=0$' "$OUT/P1A-G2C-DRAWROUNDRECT-DIAGNOSTIC.txt"
          grep -q '^P1A_G2C_DRAWROUNDRECT_DIAGNOSTIC=PASS$' "$OUT/P1A-G2C-DRAWROUNDRECT-DIAGNOSTIC.txt"
          grep -q '^P1A_G2C_RUNTIME_CHANGE=NO$' "$OUT/P1A-G2C-DRAWROUNDRECT-DIAGNOSTIC.txt"
          cp out/p1a-g2b-filltriangle-jdk8-raster/P1A-G2B-IDENTITY.txt "$OUT/PARENT-G2B-IDENTITY.txt"
          echo P1A_G2C_DIAGNOSTIC=PASS

      - name: Upload G2C diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2C-DRAWROUNDRECT-DIAGNOSTIC-${{ github.sha }}
          path: out/p1a-g2c-drawroundrect-diagnostic/
          if-no-files-found: error
