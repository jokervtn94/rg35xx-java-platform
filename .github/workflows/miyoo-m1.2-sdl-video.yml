name: RG35XX Miyoo M1.2 SDL Video Bootstrap

on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - '.github/workflows/miyoo-m1.2-sdl-video.yml'
      - 'miyoo-m1/m1_2_sdl2_video_probe.c'
      - 'miyoo-m1/M1.2-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  build-video-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Gate rules and M1.2 preflight
        run: |
          set -euo pipefail
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md
          grep -Fq 'HISTORY_FOUND: YES' tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md
          grep -Fq 'Primary variable: standalone SDL2 VIDEO subsystem compatibility only.' tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md
          grep -Fq 'M1.1A_SDL_BASIC_ABI: DEVICE-PASS' tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Build M1.2 standalone video probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.2
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc \
            -Os -pipe -fno-strict-aliasing \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -Wall -Wextra \
            miyoo-m1/m1_2_sdl2_video_probe.c \
            -Wl,--as-needed -ldl \
            -o build-m1.2/m1_2_sdl2_video_probe
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.2/m1_2_sdl2_video_probe

      - name: Strict ELF and scope gate
        run: |
          set -euo pipefail
          readelf -h build-m1.2/m1_2_sdl2_video_probe | tee build-m1.2/ELF-HEADER.txt
          readelf -A build-m1.2/m1_2_sdl2_video_probe | tee build-m1.2/ELF-ATTRIBUTES.txt || true
          file build-m1.2/m1_2_sdl2_video_probe | tee build-m1.2/FILE.txt
          grep -q 'Class:.*ELF32' build-m1.2/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.2/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.2/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.2/ELF-HEADER.txt
          strings build-m1.2/m1_2_sdl2_video_probe | grep -F 'SDL_INIT_VIDEO=PASS'
          strings build-m1.2/m1_2_sdl2_video_probe | grep -F 'VISIBLE_PATTERN_EXPECTED=RED_GREEN_BLUE_WHITE_1S_EACH'
          ! strings build-m1.2/m1_2_sdl2_video_probe | grep -q 'SDL_INIT_AUDIO'
          ! strings build-m1.2/m1_2_sdl2_video_probe | grep -q 'freej2me_plus_libretro'
          sha256sum build-m1.2/m1_2_sdl2_video_probe | tee build-m1.2/PROBE-SHA256.txt

      - name: Package flat GarlicOS Apps layout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.2-sdl-video"
          APP="$OUT/Roms/APPS"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.2/m1_2_sdl2_video_probe "$APP/"
          cp miyoo-m1/M1.2-DEVICE-TEST.sh "$APP/"
          chmod +x "$APP/m1_2_sdl2_video_probe" "$APP/M1.2-DEVICE-TEST.sh"
          cp build-m1.2/ELF-HEADER.txt build-m1.2/ELF-ATTRIBUTES.txt build-m1.2/FILE.txt build-m1.2/PROBE-SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.2-SDL-VIDEO-PREFLIGHT.md "$OUT/evidence/"
          cat > "$OUT/README.txt" <<'EOF'
          RG35XX MIYOO M1.2 SDL VIDEO BOOTSTRAP

          Install: copy/merge the Roms folder into GarlicOS SD root.
          Run: Apps -> M1.2-DEVICE-TEST.sh
          Expected report: /mnt/mmc/RG35XX-MIYOO-M1.2-DEVICE-RESULT.txt

          If the display path works, the LCD should show RED -> GREEN -> BLUE -> WHITE,
          one second each, then return cleanly.

          This checkpoint tests VIDEO only. It does not test input, audio or Java.
          It does not replace the existing FreeJ2ME runtime/core/JamVM/glibj.
          DEVICE-PASS=NO until real-device log + visual confirmation.
          STABLE=NO
          EOF
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload M1.2 package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.2-sdl-video
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
