name: RG35XX Clean R2D Transparency

on:
  workflow_dispatch:
  push:
    branches: [rg35xx-clean-consolidated-r2]
    paths:
      - '.github/workflows/rg35xx-clean-r2d-transparency.yml'
      - 'scripts/rg35xx_clean_consolidated_r2a_assemble.sh'
      - 'scripts/r2_apply_headless_image_normalize.py'
      - 'scripts/r2c_apply_transparency_semantics.py'
      - 'release/rg35xx-r2d-transparency/**'
      - 'tasklog/RG35XX-CLEAN-R2D-TRANSPARENCY.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      R2A_BASE_SHA256: 5c1ac5ab9927fff29012366ac26cd756967858259116c654b529ebb501363913

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - name: Install requirements
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 >/dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Assemble exact R2A foundation
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" R2A_ASSEMBLY="$RUNNER_TEMP/r2d-transparency"             sh scripts/rg35xx_clean_consolidated_r2a_assemble.sh
          echo "OUT=$RUNNER_TEMP/r2d-transparency" >> "$GITHUB_ENV"
          grep -Fq 'RG35XX-R2A-IMAGE-NORMALIZE' "$RUNNER_TEMP/r2d-transparency/src/org/recompile/mobile/PlatformImage.java"
          echo R2A_BASE_GATE=PASS

      - name: Apply transparency-only patch
        run: |
          set -euo pipefail
          I="$OUT/src/org/recompile/mobile/PlatformImage.java"
          P="$OUT/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/r2c_apply_transparency_semantics.py "$I"
          grep -Fq 'RG35XX-R2C-TRANSPARENCY' "$I"
          grep -Fq 'rg35xxR2CCaptureTransparency(raw)' "$I"
          grep -Fq 'rg35xxR2CApplyPngTransparency(pixels)' "$I"
          grep -Fq 'rg35xxR2CApplyLegacyBorderWhiteKey' "$I"
          test "$(grep -Fc 'ImageIO.read(rg35xxPngIccpCompat(stream))' "$I")" -eq 3
          ! grep -Fq 'gc.drawString(str, x, y);' /dev/null
          # Font source must remain upstream/R2A: no R2D font owner.
          ! grep -Fq 'RG35XX-R2D-METRIC-BITMAP-FONT' "$P"
          grep -Fq 'gc.drawString(str, x, y);' "$P"
          echo R2D_TRANSPARENCY_SCOPE_GATE=PASS

      - name: Build Java 6 runtime
        run: |
          set -euo pipefail
          (cd "$OUT" && ant)
          JAR="$OUT/build/freej2me_plus-lr.jar"
          python3 - "$OUT/build/classes" "$JAR" <<'PY'
          import os,struct,sys,zipfile
          bad=[];n=0
          for b,_,fs in os.walk(sys.argv[1]):
              for fn in fs:
                  if not fn.endswith('.class'): continue
                  n+=1;p=os.path.join(b,fn);h=open(p,'rb').read(8)
                  if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50: bad.append(p)
          if bad: raise SystemExit('JAVA_MAJOR_FAIL '+repr(bad[:10]))
          with zipfile.ZipFile(sys.argv[2]) as z:
              pi=z.read('org/recompile/mobile/PlatformImage.class')
              pg=z.read('org/recompile/mobile/PlatformGraphics.class')
              if b'RG35XX-R2C-TRANSPARENCY' not in pi: raise SystemExit('transparency bytecode missing')
              if b'RG35XX-R2D-METRIC-BITMAP-FONT' in pg: raise SystemExit('font change leaked into transparency checkpoint')
          print('JAVA_CLASS_COUNT=%d'%n)
          print('JAVA_MAJOR_50_GATE=PASS')
          print('R2D_TRANSPARENCY_BYTECODE_GATE=PASS')
          PY
          echo "NEW_SHA=$(sha256sum "$JAR"|awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Validate Windows tooling
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'release/rg35xx-r2d-transparency/INSTALL-RG35XX-R2D-TRANSPARENCY.ps1',
            'release/rg35xx-r2d-transparency/RESTORE-RG35XX-R2D-TRANSPARENCY.ps1',
            'release/rg35xx-r2d-transparency/COLLECT-RG35XX-R2D-TRANSPARENCY.ps1'
          )){
            [scriptblock]::Create((Get-Content -Raw $p))|Out-Null
            Write-Host "PARSE_PASS=$p"
          }
          $out=& 'release/rg35xx-r2d-transparency/COLLECT-RG35XX-R2D-TRANSPARENCY.ps1' -SelfTest 2>&1
          if(-not (($out|Out-String).Contains('SELFTEST_COUNT=PASS'))){throw 'collector selftest fail'}
          Write-Host 'WINDOWS_TOOL_GATE=PASS'

      - name: Package fail-closed device kit
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg";mkdir -p "$ROOT/payload"
          cp "$OUT/build/freej2me_plus-lr.jar" "$ROOT/payload/freej2me-lr.jar"
          cp release/rg35xx-r2d-transparency/* "$ROOT/"
          cp tasklog/RG35XX-CLEAN-R2D-TRANSPARENCY.md "$ROOT/"
          sed -i "s/__R2D_TRANSP_RUNTIME_SHA256__/$NEW_SHA/g" "$ROOT/INSTALL-RG35XX-R2D-TRANSPARENCY.ps1"
          ! grep -R -Fq '__R2D_TRANSP_RUNTIME_SHA256__' "$ROOT"
          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=RG35XX-CLEAN-R2D-TRANSPARENCY
          PRIMARY_VARIABLE=IMAGE_TRANSPARENCY_ONLY
          SOURCE_COMMIT=$GITHUB_SHA
          BASE_R2A_SHA256=$R2A_BASE_SHA256
          RUNTIME_SHA256=$NEW_SHA
          NATIVE_CORE_CHANGE=NONE
          FONT_CHANGE=NONE
          AUDIO_CHANGE=NONE
          CANVAS_CHANGE=NONE
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TEST_PENDING
          STABLE=NO
          EOF
          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)
          echo "R2D_TRANSPARENCY_RUNTIME_SHA256=$NEW_SHA"
          echo BUILD_PASS=YES

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-clean-r2d-transparency
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
