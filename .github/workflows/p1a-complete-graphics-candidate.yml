name: P1A Complete Graphics Candidate

on:
  push:
    branches:
      - p1a-complete-graphics-candidate
    paths:
      - 'scripts/stage-p1a-complete-graphics-g4g5.py'
      - 'scripts/build-p1a-complete-graphics-candidate.sh'
      - 'tests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java'
      - '.github/workflows/p1a-complete-graphics-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-complete-graphics-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout production branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify exact D6 production ancestry and owner scope
        shell: bash
        run: |
          set -euo pipefail
          D6=093aae62d7caca2941258592c72dfc25b1f204a7
          git merge-base --is-ancestor "$D6" HEAD
          [ "$(git merge-base "$D6" HEAD)" = "$D6" ]
          changed="$(git diff --name-only "$D6"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p1a-complete-graphics-candidate.yml\nscripts/build-p1a-complete-graphics-candidate.sh\nscripts/stage-p1a-complete-graphics-g4g5.py\ntests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java'
          [ "$changed" = "$expected" ] || { echo "P1A_COMPLETE_GRAPHICS_BRANCH_SCOPE_FAIL=$changed" >&2; exit 1; }
          if git log --format=%P "$D6"..HEAD | grep -q '09ac133c24242f6dfa266e8fb3d506b1550ee194'; then
            echo P1A_COMPLETE_GRAPHICS_FAIL=diagnostic_parent >&2; exit 1
          fi
          echo P1A_COMPLETE_GRAPHICS_D6_ANCESTRY=PASS
          echo P1A_COMPLETE_GRAPHICS_DIAGNOSTIC_PARENT=NO

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Preflight rebuild D6 and stage G4 G5
        shell: bash
        run: |
          set -euo pipefail
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-dg-draw-vector-d6-v2.sh > /tmp/p1a-complete-preflight-d6.log
          grep -q '^P1A_DG_D6_BUILD=PASS$' /tmp/p1a-complete-preflight-d6.log
          python3 scripts/stage-p1a-complete-graphics-g4g5.py build/a3/stage-src | tee /tmp/p1a-complete-preflight-stage.log
          grep -q '^P1A_COMPLETE_G4G5_STAGE=PASS$' /tmp/p1a-complete-preflight-stage.log
          echo P1A_COMPLETE_GRAPHICS_PREFLIGHT_STAGE=PASS

      - name: Preflight compile owner class and strict gate
        shell: bash
        run: |
          set -euo pipefail
          PARENT=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          SRC=build/a3/stage-src/org/recompile/mobile/PlatformGraphics.java
          CLS=build/p1a-complete-preflight-classes
          HOST=build/p1a-complete-preflight-host
          rm -rf "$CLS" "$HOST" && mkdir -p "$CLS" "$HOST"
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$PARENT:upstream/freej2me-miyoomini/lib/jsr305-3.0.2.jar" \
            -d "$CLS" "$SRC"
          list="$(cd "$CLS" && find . -type f -name '*.class' -printf '%P\n' | LC_ALL=C sort)"
          [ "$list" = "org/recompile/mobile/PlatformGraphics.class" ]
          cp "$PARENT" /tmp/p1a-complete-preflight.jar
          "$JAVA_HOME/bin/jar" uf /tmp/p1a-complete-preflight.jar -C "$CLS" org/recompile/mobile/PlatformGraphics.class
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath /tmp/p1a-complete-preflight.jar \
            -d "$HOST" tests/p1a/RG35XXCompleteGraphicsG4G5DifferentialGate.java
          echo P1A_COMPLETE_GRAPHICS_PREFLIGHT_COMPILE=PASS

      - name: Preflight run strict G4 G5 differential only
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/p1a-complete-preflight-g4g5.log
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true \
            -cp /tmp/p1a-complete-preflight.jar:build/p1a-complete-preflight-host \
            org.recompile.rg35xx.p1a.RG35XXCompleteGraphicsG4G5DifferentialGate | tee "$LOG"
          grep -q '^P1A_COMPLETE_G4G5_TOTAL_CASE_COUNT=72$' "$LOG"
          grep -q '^P1A_COMPLETE_G4G5_STRICT_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_COMPLETE_G4G5_DIFFERENTIAL_GATE=PASS$' "$LOG"
          echo P1A_COMPLETE_GRAPHICS_PREFLIGHT_G4G5=PASS

      - name: Build and gate P1A complete graphics candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-complete-graphics-candidate.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-complete-graphics-candidate.sh | tee /tmp/p1a-complete-graphics.log
          grep -q '^P1A_COMPLETE_GRAPHICS_BUILD=PASS$' /tmp/p1a-complete-graphics.log
          ID=out/p1a-complete-graphics-candidate/P1A-COMPLETE-GRAPHICS-IDENTITY.txt
          grep -q '^WORK_UNIT=P1A-COMPLETE-GRAPHICS-CANDIDATE$' "$ID"
          grep -q '^G4G5_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^G4G5_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^DIAGNOSTIC_BRANCH_PARENT=NO$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^NATIVE_CHANGE=NO$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          echo P1A_COMPLETE_GRAPHICS_HOST_WORKFLOW_GATE=PASS

      - name: Upload host candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-COMPLETE-GRAPHICS-CANDIDATE-${{ github.sha }}
          path: out/p1a-complete-graphics-candidate/
          if-no-files-found: error
