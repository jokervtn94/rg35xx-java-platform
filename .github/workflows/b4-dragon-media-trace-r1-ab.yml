name: B4 Dragon Media Trace R1 A-B

on:
  workflow_dispatch:
  push:
    branches: [b4-dragon-media-trace-r1-ab]
    paths:
      - '.github/workflows/b4-dragon-media-trace-r1-ab.yml'
      - 'scripts/b4_apply_nomask_green_tint_fix.py'
      - 'scripts/b4_apply_nomask_hard_bypass.py'
      - 'scripts/b4_apply_hotpath_r2_cleanup.py'
      - 'scripts/b4_apply_dragon_media_trace_r1.py'
      - 'release/b4-dragon-media-trace-r1/**'
      - 'tasklog/B4-DRAGON-MEDIA-TRACE-R1-AB.md'

jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      B4_CORE_SHA256: 56bb3b972337dd40b342c1881f6599c53eebf66a29f920a1aa2e2839eb29a07c
      OLD_RUNTIME_SHA256: 4f1f126c2e02b4fbc3b8985d3afd0cbb239d35e0f97512a4eb85f25fcbacbc9c

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 unzip >/dev/null

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Assemble exact current B4 runtime foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" B4_ASSEMBLY="$RUNNER_TEMP/b4mediatrace" sh scripts/b4_verified_core_assemble.sh
          echo "B4=$RUNNER_TEMP/b4mediatrace" >> "$GITHUB_ENV"

      - name: Reproduce admitted B4 Video Mask R2 and Hotpath R2 source
        run: |
          set -euo pipefail
          python3 scripts/b4_apply_nomask_green_tint_fix.py "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/b4_apply_nomask_hard_bypass.py "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/b4_apply_hotpath_r2_cleanup.py "$B4/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"

          grep -Fq 'fastBlit = !Mobile.funLightsEnabled;' "$B4/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq 'RG35XX-B4-HOTPATH-R2-CLEAN' "$B4/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          echo B4_ADMITTED_RUNTIME_SOURCE_REPRODUCTION=PASS

      - name: Apply bounded media lifecycle trace only
        run: |
          set -euo pipefail
          python3 scripts/b4_apply_dragon_media_trace_r1.py             "$B4/src/javax/microedition/media/Manager.java"             "$B4/src/org/recompile/mobile/PlatformPlayer.java"

          grep -Fq 'RG35XX-B4-MEDIA-TRACE' "$B4/src/javax/microedition/media/Manager.java"
          grep -Fq 'RG35XX-B4-MEDIA-TRACE' "$B4/src/org/recompile/mobile/PlatformPlayer.java"
          grep -Fq 'MIDI_GETSEQUENCER_BEGIN' "$B4/src/org/recompile/mobile/PlatformPlayer.java"
          grep -Fq 'WAV_GETCLIP_BEGIN' "$B4/src/org/recompile/mobile/PlatformPlayer.java"
          grep -Fq 'PLAYER_START_BLOCKED_STATE' "$B4/src/org/recompile/mobile/PlatformPlayer.java"

          # Behavior gates: trace must not introduce native media, eager warmup or RMS changes.
          grep -Fq 'RG35XX-MEDIA-BOOT: eager prepare SKIPPED; lazy media enabled' "$B4/src/org/recompile/mobile/MobilePlatform.java"
          ! grep -R -Fq 'RG35XX-VC7R22R1-WORKER-RING' "$B4/src"
          ! grep -R -Fq 'RG35XX-R13J-RMS' "$B4/src"
          ! grep -R -Fq 'RG35XX-R13I-NET' "$B4/src"
          echo B4_DRAGON_MEDIA_TRACE_R1_SCOPE_GATE=PASS

      - name: Build Java 6-compatible runtime
        run: |
          set -euo pipefail
          cd "$B4"
          ant
          JAR="$B4/build/freej2me_plus-lr.jar"
          test -f "$JAR"

          python3 - "$B4/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for b,_,fs in os.walk(sys.argv[1]):
            for f in fs:
              if not f.endswith('.class'):
                continue
              n += 1
              p=os.path.join(b,f)
              h=open(p,'rb').read(8)
              if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50:
                raise SystemExit('Java major gate failed: '+p)
          print('B4_DRAGON_MEDIA_TRACE_R1_CLASS_COUNT=%d'%n)
          PY

          echo "NEW_RUNTIME_SHA256=$(sha256sum "$JAR" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Bytecode marker gate
        run: |
          set -euo pipefail
          JAR="$B4/build/freej2me_plus-lr.jar"
          python3 - "$JAR" <<'PY'
          import zipfile,sys
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              mgr=z.read('javax/microedition/media/Manager.class')
              pp=z.read('org/recompile/mobile/PlatformPlayer.class')
          for tok in [
              b'RG35XX-B4-MEDIA-TRACE',
              b'MANAGER_CREATE_STREAM_BEGIN',
              b'PLAYER_START_BEGIN',
              b'PLAYER_START_BLOCKED_STATE',
              b'MIDI_GETSEQUENCER_BEGIN',
              b'MIDI_PREFETCH_FAIL',
              b'WAV_GETCLIP_BEGIN',
              b'WAV_PREFETCH_FAIL',
              b'PLAYER_EVENT'
          ]:
              if tok not in mgr and tok not in pp:
                  raise SystemExit('missing bytecode marker '+repr(tok))
          print('B4_DRAGON_MEDIA_TRACE_R1_BYTECODE_GATE=PASS')
          PY

      - name: Package runtime-only fail-closed installer
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg"
          mkdir -p "$ROOT/payload"
          cp "$B4/build/freej2me_plus-lr.jar" "$ROOT/payload/freej2me-lr.jar"
          cp release/b4-dragon-media-trace-r1/* "$ROOT/"
          sed -i "s/__NEW_RUNTIME_SHA256__/$NEW_RUNTIME_SHA256/g" "$ROOT/INSTALL-B4-DRAGON-MEDIA-TRACE-R1.ps1"
          ! grep -R -Fq '__NEW_RUNTIME_SHA256__' "$ROOT"

          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/INSTALL-B4-DRAGON-MEDIA-TRACE-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/RESTORE-B4-DRAGON-MEDIA-TRACE-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/COLLECT-B4-DRAGON-MEDIA-TRACE-R1.ps1')) | Out-Null"

          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=B4-DRAGON-MEDIA-TRACE-R1-AB
          PRIMARY_VARIABLE=BOUNDED_MEDIA_LIFECYCLE_OBSERVABILITY_ONLY
          SOURCE_COMMIT=$GITHUB_SHA
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          OLD_RUNTIME_SHA256=$OLD_RUNTIME_SHA256
          NEW_RUNTIME_SHA256=$NEW_RUNTIME_SHA256
          REQUIRED_CORE_SHA256=$B4_CORE_SHA256
          CORE_PACKAGED=NO
          MEDIA_BEHAVIOR_CHANGE=NONE
          RMS_CHANGE=NONE
          VIDEO_MASK_R2=PRESERVED
          HOTPATH_R2=PRESERVED
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TRACE_PENDING
          STABLE=NO
          EOF

          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          echo B4_DRAGON_MEDIA_TRACE_R1_RUNTIME_SHA256=$NEW_RUNTIME_SHA256
          echo B4_DRAGON_MEDIA_TRACE_R1_CORE_SHA256=$B4_CORE_SHA256
          echo B4_DRAGON_MEDIA_TRACE_R1_BUILD_GATE=PASS
          echo DEVICE_PASS=NO_DEVICE_TRACE_PENDING
          echo STABLE=NO

      - uses: actions/upload-artifact@v4
        with:
          name: b4-dragon-media-trace-r1-ab
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
