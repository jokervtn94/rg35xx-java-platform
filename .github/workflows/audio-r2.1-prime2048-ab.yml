name: RG35XX Audio R2.1 Prime2048 A-B

on:
  push:
    branches: [ rg35xx-from-zero-rebuild-v1 ]
    paths:
      - '.github/workflows/audio-r2.1-prime2048-ab.yml'
      - 'scripts/vc7r22r21_apply_prime2048_ab.py'
      - 'installer/INSTALL-AUDIO-R2.1-PRIME2048-AB.ps1'
      - 'installer/INSTALL-AUDIO-R2.1-PRIME2048-AB.cmd'
      - 'tasklog/R2.1-AUDIO-PRIME-AB-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  audio-r21-prime2048-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      R2_CORE_SHA256: a8e59eca633dfcaa3fc0e8c027fcffaa35f53d1ff5d127b7062edfd962fe7c57
      R2_RUNTIME_SHA256: b71a61ec4a1be0237b0fbdc74834ae1dbe32575272241f53c9de791b2a56f6d2

    steps:
      - name: Checkout platform policy
        uses: actions/checkout@v4

      - name: Read hard rules and tasklog preflight
        run: |
          set -euo pipefail
          test -f tasklog/R2.1-AUDIO-PRIME-AB-PREFLIGHT.md
          grep -Fq 'MINIMAL_PROPOSED_CHANGE' tasklog/R2.1-AUDIO-PRIME-AB-PREFLIGHT.md
          grep -Fq 'DEVICE-PASS: NO' tasklog/R2.1-AUDIO-PRIME-AB-PREFLIGHT.md

      - name: Checkout pristine pinned FreeJ2ME
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Checkout pinned historical media source
        uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 patch file binutils
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Prove source identities
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          test -z "$(git -C upstream status --porcelain)"
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"

      - name: Assemble accepted graphics/native foundation
        run: |
          set -euo pipefail
          FZ_UPSTREAM="$GITHUB_WORKSPACE/upstream" FZ_ASSEMBLY="$RUNNER_TEMP/audio-r21" sh scripts/from_zero_assemble_v1.sh | tee "$RUNNER_TEMP/foundation.log"
          echo "R21=$RUNNER_TEMP/audio-r21" >> "$GITHUB_ENV"

      - name: Materialize pinned historical native media
        run: |
          set -euo pipefail
          mkdir -p "$R21/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$R21/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R21/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R21/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Reconstruct exact R2 native architecture
        run: |
          set -euo pipefail
          C="$R21/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_native_audio.py "$C"
          python3 scripts/vc7r22r1_apply_worker_ring.py "$C" | tee "$RUNNER_TEMP/worker-ring-r1.log"
          python3 scripts/vc7r22r2_apply_golden_tsf.py "$R21/src/libretro/rg35xx/rg35xx_tsf_worker.c" "$C" | tee "$RUNNER_TEMP/tsf-r2.log"
          cat >> "$R21/src/libretro/Makefile.common" <<'EOF'

          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF
          cp "$C" "$RUNNER_TEMP/freej2me_libretro.r2.c"

      - name: Build and hash exact R2 control core
        run: |
          set -euo pipefail
          cd "$R21/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          got=$(sha256sum freej2me_plus_libretro.so | awk '{print $1}')
          echo "R2_CONTROL_CORE_SHA256=$got"
          test "$got" = "$R2_CORE_SHA256"
          cp freej2me_plus_libretro.so "$RUNNER_TEMP/r2-control-core.so"

      - name: Apply only R2.1 prime 3072 to 2048
        run: |
          set -euo pipefail
          C="$R21/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r22r21_apply_prime2048_ab.py "$C" | tee "$RUNNER_TEMP/prime2048.log"
          python3 - "$RUNNER_TEMP/freej2me_libretro.r2.c" "$C" <<'PY'
          import difflib, pathlib, sys
          a=pathlib.Path(sys.argv[1]).read_text().splitlines()
          b=pathlib.Path(sys.argv[2]).read_text().splitlines()
          d=list(difflib.unified_diff(a,b,lineterm=''))
          changed=[x for x in d if x.startswith(('+','-')) and not x.startswith(('+++','---'))]
          allowed=('RG35XX_AUDIO_PRIME_FRAMES','worker START ring=16384 target=','PRIMED queued=%u target=','underrun queued=0; re-prime target=')
          bad=[x for x in changed if not any(k in x for k in allowed)]
          if bad: raise SystemExit('R2.1 unexpected source delta: '+repr(bad[:20]))
          if len(changed) != 8: raise SystemExit('R2.1 expected 4 replacement lines; changed entries='+str(len(changed)))
          print('R2.1 SOURCE_DELTA_GATE=PASS')
          PY

      - name: Source architecture gate
        run: |
          set -euo pipefail
          C="$R21/src/libretro/freej2me_libretro.c"; T="$R21/src/libretro/rg35xx/rg35xx_tsf_worker.c"
          grep -Fq '#define RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq '#define RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 2048u' "$C"
          grep -Fq 'worker START ring=16384 target=2048 chunk=1470' "$C"
          grep -Fq 'underrun queued=0; re-prime target=2048' "$C"
          grep -Fq '#define RG35XX_TSF_RATE 14700u' "$T"
          grep -Fq '#define RG35XX_TSF_OUTPUT_RATE 44100u' "$T"
          grep -Fq '#define RG35XX_TSF_UPSAMPLE_X 3u' "$T"
          grep -Fq 'TSF_MONO' "$T"
          ! grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          echo 'AUDIO_R21_SOURCE_GATE=PASS'

      - name: Build R2.1 ARMv5TE uClibc core
        run: |
          set -euo pipefail
          cd "$R21/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          got=$(sha256sum freej2me_plus_libretro.so | awk '{print $1}')
          test "$got" != "$R2_CORE_SHA256"
          echo "R21_CORE_SHA256=$got" >> "$GITHUB_ENV"

      - name: Binary architecture and marker gate
        run: |
          set -euo pipefail
          CORE="$R21/src/libretro/freej2me_plus_libretro.so"
          file "$CORE"; readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          grep -q 'Version5 EABI' /tmp/elf.txt
          grep -q 'soft-float ABI' /tmp/elf.txt
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=2048 chunk=1470'
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: SoundFont loaded, synth=14700Hz output=44100Hz voices=16 mono-x3 STABLE worker-ring'
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: underrun queued=0; re-prime target=2048'
          ! strings -a "$CORE" | grep -Fq 'target=3072 chunk=1470'
          echo 'AUDIO_R21_BINARY_GATE=PASS'

      - name: PowerShell installer syntax gate
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/installer/INSTALL-AUDIO-R2.1-PRIME2048-AB.ps1",[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_.Message};exit 1}
          Write-Host 'AUDIO_R21_INSTALLER_PARSE=PASS'

      - name: Package core-only device A-B installer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audio-r2.1-prime2048-ab"
          mkdir -p "$OUT/payload" "$OUT/installer" "$OUT/evidence"
          cp "$R21/src/libretro/freej2me_plus_libretro.so" "$OUT/payload/freej2me_plus_libretro.so"
          (cd "$OUT/payload" && sha256sum freej2me_plus_libretro.so > PAYLOAD-SHA256.txt)
          cp installer/INSTALL-AUDIO-R2.1-PRIME2048-AB.ps1 installer/INSTALL-AUDIO-R2.1-PRIME2048-AB.cmd "$OUT/installer/"
          cp tasklog/R2.1-AUDIO-PRIME-AB-PREFLIGHT.md "$OUT/evidence/"
          cp "$RUNNER_TEMP/foundation.log" "$RUNNER_TEMP/worker-ring-r1.log" "$RUNNER_TEMP/tsf-r2.log" "$RUNNER_TEMP/prime2048.log" "$OUT/evidence/"
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=BUILD-PASS_DEVICE-TEST-PENDING
          CHECKPOINT=R2.1-AUDIO-PRIME-AB
          BASELINE_RUNTIME_SHA256=$R2_RUNTIME_SHA256
          BASELINE_CORE_SHA256=$R2_CORE_SHA256
          CORE_SHA256=$R21_CORE_SHA256
          ONLY_PRIMARY_DELTA=MIDI_PRIME_3072_TO_2048
          RING_FRAMES=16384
          MIDI_PRIME=2048
          WORKER_CHUNK=1470
          TSF_SYNTH=14700_MONO
          OUTPUT=44100_MONO_X3
          JAVA_RUNTIME=UNCHANGED_R2
          VIDEO=UNCHANGED_R2
          FONT=UNCHANGED_R2
          NOMASK=UNCHANGED_R2
          TRANSPARENCY=UNCHANGED
          PCM_PRIME_2940=NOT_CHANGED_NOT_CLAIMED
          DEVICE_PASS=NO
          STABLE=NO
          EOF
          sed -i 's/^          //' "$OUT/STATUS.txt"
          cat > "$OUT/README-DEVICE-TEST.txt" <<'EOF'
          R2.1 Audio Prime2048 A/B - DEVICE TEST REQUIRED

          Install with:
            installer\INSTALL-AUDIO-R2.1-PRIME2048-AB.cmd H

          Test order:
          1. Real Football: audio audible, frames continue, no hard hang.
          2. Exit normally: CORE_DEINIT, VIDEO_DEINIT and worker STOP must appear.
          3. Short playTone/ToneControl: confirm no regression from the 3072 CN fix.
          4. Confirm NoMask green tint remains fixed.

          Upload:
          - freej2me-core*.log
          - freej2me-java-error*.log
          - freej2me-vc3-early*.log
          - RG35XX-AUDIO-R2.1-PRIME2048-AB-INSTALL-RESULT.txt
          EOF
          sed -i 's/^          //' "$OUT/README-DEVICE-TEST.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-audio-r2.1-prime2048-ab
          path: ${{ runner.temp }}/audio-r2.1-prime2048-ab
          include-hidden-files: true
          retention-days: 30
