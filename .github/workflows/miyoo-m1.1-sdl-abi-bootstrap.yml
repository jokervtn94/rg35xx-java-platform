name: RG35XX Miyoo M1.1 SDL ABI Bootstrap

on:
  push:
    branches: [ rg35xx-miyoo-platform-v1 ]
    paths:
      - '.github/workflows/miyoo-m1.1-sdl-abi-bootstrap.yml'
      - 'miyoo-m1/m1_1_sdl2_probe.c'
      - 'miyoo-m1/M1.1-DEVICE-TEST.sh'
      - 'tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout M1.1 branch
        uses: actions/checkout@v4

      - name: Gate project rules and preflight
        run: |
          set -euo pipefail
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md
          grep -Fq 'CURRENT_SYMPTOM:' tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md
          grep -Fq 'HISTORY_FOUND: YES' tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md
          grep -Fq 'Primary variable: native standalone SDL2 ABI compatibility only.' tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Build minimal standalone probe
        run: |
          set -euo pipefail
          mkdir -p build-m1.1
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc \
            -Os -pipe -fno-strict-aliasing \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -Wall -Wextra \
            miyoo-m1/m1_1_sdl2_probe.c \
            -Wl,--as-needed -ldl \
            -o build-m1.1/m1_1_sdl2_probe
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip build-m1.1/m1_1_sdl2_probe

      - name: Strict ELF gate
        run: |
          set -euo pipefail
          readelf -h build-m1.1/m1_1_sdl2_probe | tee build-m1.1/ELF-HEADER.txt
          readelf -A build-m1.1/m1_1_sdl2_probe | tee build-m1.1/ELF-ATTRIBUTES.txt || true
          file build-m1.1/m1_1_sdl2_probe | tee build-m1.1/FILE.txt
          grep -q 'Class:.*ELF32' build-m1.1/ELF-HEADER.txt
          grep -q 'Machine:.*ARM' build-m1.1/ELF-HEADER.txt
          grep -q 'Version5 EABI' build-m1.1/ELF-HEADER.txt
          grep -q 'soft-float ABI' build-m1.1/ELF-HEADER.txt
          ! strings build-m1.1/m1_1_sdl2_probe | grep -q 'freej2me_plus_libretro'
          ! strings build-m1.1/m1_1_sdl2_probe | grep -q 'RG35XX-AUDIO-R2'
          sha256sum build-m1.1/m1_1_sdl2_probe | tee build-m1.1/PROBE-SHA256.txt

      - name: Package GarlicOS Apps test
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-miyoo-m1.1-sdl-abi"
          APP="$OUT/Roms/APPS/Miyoo M1.1 SDL ABI"
          mkdir -p "$APP" "$OUT/evidence"
          cp build-m1.1/m1_1_sdl2_probe "$APP/"
          cp miyoo-m1/M1.1-DEVICE-TEST.sh "$APP/"
          chmod +x "$APP/m1_1_sdl2_probe" "$APP/M1.1-DEVICE-TEST.sh"
          cp build-m1.1/ELF-HEADER.txt build-m1.1/ELF-ATTRIBUTES.txt build-m1.1/FILE.txt build-m1.1/PROBE-SHA256.txt "$OUT/evidence/"
          cp tasklog/MIYOO-M1.1-JVM-SDL-ABI-PREFLIGHT.md "$OUT/evidence/"
          printf '%s\n' \
            'RG35XX MIYOO M1.1 SDL ABI BOOTSTRAP' \
            'Copy the Roms folder to the GarlicOS SD root (merge only).' \
            'Run: Apps -> Miyoo M1.1 SDL ABI -> M1.1-DEVICE-TEST.sh' \
            'Result: /mnt/mmc/RG35XX-MIYOO-M1.1-DEVICE-RESULT.txt' \
            '' \
            'This package does NOT replace the current Java runtime/core/JamVM/glibj.' \
            'BUILD-PASS applies only to the native probe build.' \
            'DEVICE-PASS=NO' \
            'STABLE=NO' > "$OUT/README.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload M1.1 device package
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-miyoo-m1.1-sdl-abi-bootstrap
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
