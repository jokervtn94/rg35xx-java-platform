name: RC1 Pinned Patch Integration Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'scripts/rc1_assemble.sh'
      - '.github/workflows/rc1-patch-integration-gate.yml'
  workflow_dispatch:

jobs:
  patch-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RG35XX platform repo
        uses: actions/checkout@v4

      - name: Checkout exact pinned FreeJ2ME source
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Verify pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "13ec186903087156c145268f8706eecfaf9f1e50"

      - name: Apply active patches sequentially with dry-run first
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ORDER=(
            0003-manager-rg35xx-media-profile.patch
            0007-platformgraphics-rg35xx-fast-drawrgb.patch
            0008-platformgraphics-transform-cache.patch
            0010-libretro-platform-lifecycle.patch
            0011-platformimage-rg35xx-cache.patch
            0016-libretro-java-audio-fd-exact.patch
            0017-libretro-media-process-boundary.patch
            0015-libretro-native-media-runtime.patch
            0018-manager-platformplayer-rg35xx-direct-media.patch
            0019-platformplayer-tonecontrol-rg35xx.patch
            0020-pinned-graphics-input-lifecycle-consolidation.patch
          )
          for p in "${PATCH_ORDER[@]}"; do
            echo "=== DRY-RUN $p ==="
            patch -d upstream -p1 --forward --dry-run < "patches/$p"
            echo "=== APPLY $p ==="
            patch -d upstream -p1 --forward < "patches/$p"
          done

      - name: Verify no rejected hunks
        shell: bash
        run: |
          set -euo pipefail
          if find upstream -name '*.rej' -print -quit | grep -q .; then
            find upstream -name '*.rej' -print
            exit 1
          fi
          echo 'RC1 PATCH INTEGRATION PASS'
