name: P1A G4G5 DirectGraphics IO Diagnostic

on:
  push:
    branches:
      - p1a-g4g5-directgraphics-io-diagnostic
    paths:
      - 'tests/p1a/RG35XXG4G5DirectGraphicsIODiagnostic.java'
      - '.github/workflows/p1a-g4g5-directgraphics-io-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-g4g5-directgraphics-io-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout diagnostic branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D6 host parent and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          D6=093aae62d7caca2941258592c72dfc25b1f204a7
          git merge-base --is-ancestor "$D6" HEAD
          changed="$(git diff --name-only "$D6"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p1a-g4g5-directgraphics-io-diagnostic.yml\ntests/p1a/RG35XXG4G5DirectGraphicsIODiagnostic.java'
          [ "$changed" = "$expected" ] || { echo "P1A_G4G5_DIAG_SCOPE_FAIL=$changed" >&2; exit 1; }
          echo P1A_G4G5_D6_HOST_PARENT=PASS
          echo P1A_G4G5_RUNTIME_CHANGE=NO

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild exact D6 host parent candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-dg-draw-vector-d6-v2.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-dg-draw-vector-d6-v2.sh | tee /tmp/p1a-dg-d6-parent.log
          grep -q '^P1A_DG_D6_BUILD=PASS$' /tmp/p1a-dg-d6-parent.log
          grep -q '^D6_STRICT_DIFFERENTIAL=PASS$' out/p1a-dg-draw-vector-d6/P1A-DG-D6-IDENTITY.txt
          echo P1A_G4G5_D6_REBUILD=PASS

      - name: Compile Java6 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          CAND=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          OUT=build/p1a-g4g5-directgraphics-io-diagnostic
          rm -rf "$OUT" && mkdir -p "$OUT"
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$CAND" \
            -d "$OUT" tests/p1a/RG35XXG4G5DirectGraphicsIODiagnostic.java
          echo P1A_G4G5_JAVA6_GATE=PASS

      - name: Run canonical contract and current Raw2D gap probes
        shell: bash
        run: |
          set -euo pipefail
          CAND=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          OUT=build/p1a-g4g5-directgraphics-io-diagnostic
          LOG="$OUT/G4G5-DIAGNOSTIC.txt"
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true -cp "$CAND:$OUT" \
            org.recompile.rg35xx.p1a.RG35XXG4G5DirectGraphicsIODiagnostic | tee "$LOG"
          grep -q '^P1A_G4G5_CANONICAL_CHECK_COUNT=25$' "$LOG"
          [ "$(grep -c '^G4G5_RAW_GAP=' "$LOG")" = "6" ]
          grep -q '^G4G5_GETPX_BYTE_STUB_RAW=true PRESERVED=true$' "$LOG"
          grep -q '^P1A_G4G5_DRAWIMAGE_MANIPULATION_MAP=MIYOO_PLATFORMIMAGE_TRANSFORMIMAGE$' "$LOG"
          grep -q '^P1A_G4G5_DRAWPX_INT_TRANSPARENCY_FLAG=IGNORED_CANONICAL$' "$LOG"
          grep -q '^P1A_G4G5_DRAWPX_SHORT_FALSE_TRANSPARENCY=ALPHA_CLEARED_CANONICAL$' "$LOG"
          grep -q '^P1A_G4G5_BYTE_GRAY_HORIZONTAL_BIT_ORDER=MSB_FIRST$' "$LOG"
          grep -q '^P1A_G4G5_BYTE_GRAY_VERTICAL_BIT_ORDER=LSB_FIRST$' "$LOG"
          grep -q '^P1A_G4G5_GETPX_INT_SCANLENGTH=HONORED$' "$LOG"
          grep -q '^P1A_G4G5_GETPX_SHORT_SCANLENGTH=IGNORED_CANONICAL$' "$LOG"
          grep -q '^P1A_G4G5_GETPX_BYTE=CANONICAL_STUB_PRESERVED$' "$LOG"
          grep -q '^P1A_G4G5_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_G4G5_DIAGNOSTIC_GATE=PASS$' "$LOG"
          echo P1A_G4G5_DIAGNOSTIC_WORKFLOW_GATE=PASS

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G4G5-DIRECTGRAPHICS-IO-DIAGNOSTIC-${{ github.sha }}
          path: build/p1a-g4g5-directgraphics-io-diagnostic/
          if-no-files-found: error
