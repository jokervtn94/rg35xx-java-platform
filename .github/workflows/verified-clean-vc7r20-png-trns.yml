name: Verified Clean VC7R20 PNG tRNS
on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r20-png-trns.yml'
      - 'scripts/vc7r20_apply_png_trns_semantics.py'
      - 'scripts/vc7r20_ci.sh'
      - 'scripts/vc7r19_ci.sh'
      - 'scripts/vc7r19_apply_transparency_stability_fix.py'
  workflow_dispatch:

jobs:
  vc7r20-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: Build VC7R20
        run: bash scripts/vc7r20_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r20-png-trns
          path: /tmp/vc7r20-out
          if-no-files-found: error
