name: A4 RG35XX Smoke Package

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a4-smoke

permissions:
  contents: read

jobs:
  a4-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout production tree and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build A3 baseline then A4 raw-2D Java overlay
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Build A3 RG35XX ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Finalize A3 identity and protected-runtime expectations
        run: ./scripts/build-a3.sh finalize

      - name: Build one-package A4 smoke test
        run: bash ./scripts/build-a4-smoke.sh

      - name: Verify A4 scope lock
        run: |
          set -euo pipefail
          grep -q '^A4_RAW2D_OVERLAY=YES$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a3/CANONICAL-DIFF-MANIFEST.txt
          grep -q '^DEVICE-PASS=NO$' out/a4/A4-BUILD-IDENTITY.txt
          grep -q '^DEVICE_PASS_REVIEW=PENDING$' out/a4/A4-BUILD-IDENTITY.txt
          grep -q '^STABLE=NO$' out/a4/A4-BUILD-IDENTITY.txt
          ! grep -R -E 'DP-R1[0-9]|freej2me_plus-lr|libretro' \
            tests/a4 \
            packaging/a4 \
            scripts/build-a4-smoke.sh \
            scripts/build-a4-raw2d-java.sh \
            scripts/stage-a4-rg35xx-raw2d.py
          echo A4_SCOPE_LOCK=PASS

      - name: Upload A4 RG35XX device package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A4-SMOKE-${{ github.sha }}
          path: out/a4/
          if-no-files-found: error
