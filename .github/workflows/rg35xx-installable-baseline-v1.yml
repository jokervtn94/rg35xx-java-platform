name: RG35XX Java Installable Baseline v1

on:
  workflow_dispatch:
  push:
    branches: [rg35xx-installable-baseline-v1]

jobs:
  build-installable-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      UPSTREAM_COMMIT: 13ec186903087156c145268f8706eecfaf9f1e50
      UPSTREAM_TREE: ad47ab16e9025f0eb3d2067bc3b1897dc71987df
    steps:
      - uses: actions/checkout@v4

      - name: Preserve locked M1.8 boundary and release scope
        run: |
          set -euo pipefail
          sh miyoo-m1/m1_8/verify_standalone_boundary.sh
          test -f miyoo-m1/m1_16/patch_platformimage_copy_headless_r14.py
          test ! -e miyoo-m1/m1_16/patch_platformimage_rgb_headless_r15.py
          echo M1_INSTALLABLE_BASELINE_V1_R15_INCLUDED=NO
          echo M1_INSTALLABLE_BASELINE_V1_SCOPE_GATE=PASS

      - name: Install build dependencies and pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant file >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo

      - name: Fetch pristine pinned FreeJ2ME and apply DEVICE-PASS stack through r1.4
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD^{tree})" = "$UPSTREAM_TREE"

          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
          python3 miyoo-m1/m1_9/patch_mobileplatform_resize_diagnostics.py
          python3 miyoo-m1/m1_10/patch_mobileplatform_headless_flush.py
          python3 miyoo-m1/m1_11/patch_headless_ascii_text.py
          python3 miyoo-m1/m1_12/patch_headless_unicode_bitmap_text.py
          python3 miyoo-m1/m1_13/patch_hybrid_font_layout_v1.py
          python3 miyoo-m1/m1_13/patch_bitmap_raster_column_bound_r2.py
          python3 miyoo-m1/m1_14/patch_headless_font_metrics_v1.py
          python3 miyoo-m1/m1_14/patch_decoupled_size_semantics_r3.py
          python3 miyoo-m1/m1_14/patch_bold_only_r4a.py
          python3 miyoo-m1/m1_14/patch_italic_only_r4b.py
          python3 miyoo-m1/m1_14/patch_underline_only_r4c.py
          python3 miyoo-m1/m1_14/patch_monospace_face_semantics_r5a.py
          python3 miyoo-m1/m1_14/patch_proportional_glyph_bounds_r5c.py
          python3 miyoo-m1/m1_16/patch_platformimage_blank_dimensions_r12.py
          python3 miyoo-m1/m1_16/patch_platformimage_copy_headless_r14.py

          echo M1_INSTALLABLE_BASELINE_V1_UPSTREAM_PIN=PASS
          echo M1_INSTALLABLE_BASELINE_V1_RUNTIME_PATCH_DELTA=NONE_BEYOND_DEVICE_PROVEN_R14_STACK

      - name: Build platform and locked RG35XX native bridges
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/release_v1/M1InstallableBaselineLauncher.java upstream/src/org/recompile/mobile/

          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)

          test -f upstream/build/freej2me_plus.jar
          jar tf upstream/build/freej2me_plus.jar | grep -q '^org/recompile/mobile/M1InstallableBaselineLauncher.class$'
          jar tf upstream/build/freej2me_plus.jar | grep -q '^org/recompile/mobile/M1Input.class$'
          jar tf upstream/build/freej2me_plus.jar | grep -q '^org/recompile/mobile/M19SdlPresenter.class$'

          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_8/m1_8_input_jni.c -o libm1_8_input.so
          "$CC" -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so

          file libm1_8_input.so
          file libm1_9e_presenter.so
          file libm1_8_input.so | grep -q 'ELF 32-bit.*ARM'
          file libm1_9e_presenter.so | grep -q 'ELF 32-bit.*ARM'

          echo M1_INSTALLABLE_BASELINE_V1_PRIMARY_VARIABLE=PACKAGING_INTEGRATION_ONLY
          echo M1_INSTALLABLE_BASELINE_V1_NATIVE_BRIDGES=LOCKED_SOURCE_REBUILD

      - name: Package installer cleanup rollback and evidence tools
        run: |
          set -euo pipefail
          ROOT=out/RG35XX-JAVA-INSTALLABLE-BASELINE-V1
          BASE="$ROOT/payload/Roms/APPS/RG35XX-JAVA-BASELINE"
          mkdir -p "$BASE"

          cp upstream/build/freej2me_plus.jar "$BASE/freej2me-platform.jar"
          cp libm1_8_input.so "$BASE/libm1_8_input.so"
          cp libm1_9e_presenter.so "$BASE/libm1_9e_presenter.so"
          cp miyoo-m1/release_v1/run-java.sh "$BASE/run-java.sh"
          chmod +x "$BASE/run-java.sh"

          cat > "$BASE/BASELINE-INFO.txt" <<EOF
          RG35XX JAVA INSTALLABLE BASELINE V1
          SOURCE_COMMIT=$GITHUB_SHA
          UPSTREAM_COMMIT=$UPSTREAM_COMMIT
          UPSTREAM_TREE=$UPSTREAM_TREE
          RUNTIME_PATCH_LIMIT=M1.16-r1.4
          M1_16_R15_INCLUDED=NO
          JAMVM_REQUIRED_SHA256=eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
          GLIBJ_REQUIRED_SHA256=d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
          FONT_RESOURCE_REQUIRED_SHA256=20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
          FONT_CLASSIFICATION=EXPERIMENTAL_NOT_GOLDEN
          FULL_PLATFORM_STABLE=NO
          DEVICE_PASS=NO_DEVICE_TEST_PENDING
          EOF

          cp miyoo-m1/release_v1/INSTALL-RG35XX-JAVA-BASELINE-V1.ps1 "$ROOT/"
          cp miyoo-m1/release_v1/INSTALL-RG35XX-JAVA-BASELINE-V1.cmd "$ROOT/"
          cp miyoo-m1/release_v1/RESTORE-RG35XX-JAVA-BASELINE-V1.ps1 "$ROOT/"
          cp miyoo-m1/release_v1/RESTORE-RG35XX-JAVA-BASELINE-V1.cmd "$ROOT/"
          cp miyoo-m1/release_v1/COLLECT-RG35XX-JAVA-BASELINE-V1.ps1 "$ROOT/"
          cp miyoo-m1/release_v1/COLLECT-RG35XX-JAVA-BASELINE-V1.cmd "$ROOT/"
          cp docs/checkpoints/RG35XX-INSTALLABLE-BASELINE-V1.md "$ROOT/README-BASELINE-V1.md"

          (
            cd "$ROOT/payload"
            find Roms -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          for f in "$ROOT"/*.ps1; do
            pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$f')) | Out-Null"
          done
          sh -n "$BASE/run-java.sh"

          (
            cd "$ROOT"
            find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > PACKAGE-SHA256SUMS.txt
            sha256sum -c PACKAGE-SHA256SUMS.txt
          )

          echo RUNTIME_SHA256=$(sha256sum "$BASE/freej2me-platform.jar" | awk '{print $1}')
          echo INPUT_BRIDGE_SHA256=$(sha256sum "$BASE/libm1_8_input.so" | awk '{print $1}')
          echo PRESENTER_SHA256=$(sha256sum "$BASE/libm1_9e_presenter.so" | awk '{print $1}')
          echo RUNNER_SHA256=$(sha256sum "$BASE/run-java.sh" | awk '{print $1}')
          echo M1_INSTALLABLE_BASELINE_V1_INSTALLER_PARSE=PASS
          echo M1_INSTALLABLE_BASELINE_V1_R15_INCLUDED=NO
          echo M1_INSTALLABLE_BASELINE_V1_BUILD_GATE=PASS
          echo DEVICE_PASS=NO_DEVICE_TEST_PENDING
          echo FULL_PLATFORM_STABLE=NO

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-java-installable-baseline-v1
          path: out/RG35XX-JAVA-INSTALLABLE-BASELINE-V1/
          if-no-files-found: error
