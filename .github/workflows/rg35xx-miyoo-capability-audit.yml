name: RG35XX Miyoo Capability Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rg35xx-miyoo-capability-audit.yml"
      - "scripts/build-rg35xx-miyoo-capability-audit-package.sh"
      - "scripts/build-p4-capability-decision-package.sh"
      - "scripts/build-p4-capability-probe-package.sh"
      - "scripts/build-p4-context-probe-package.sh"
      - "scripts/build-p4-platform-probe-package.sh"
      - "tests/capability/**"
      - "tests/p4/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pull pinned Miyoo uClibc toolchain
        run: docker pull "$TOOLCHAIN"

      - name: Build full capability audit package
        run: |
          set -euo pipefail
          chmod +x scripts/build-rg35xx-miyoo-capability-audit-package.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TOOLCHAIN" bash -lc \
            'git config --global --add safe.directory /work && RG35XX_AUDIT_ARM_CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc bash scripts/build-rg35xx-miyoo-capability-audit-package.sh' \
            | tee RG35XX-MIYOO-CAPABILITY-AUDIT-BUILD.log

          grep -q '^RG35XX_MIYOO_CAPABILITY_AUDIT_BUILD=PASS$' RG35XX-MIYOO-CAPABILITY-AUDIT-BUILD.log
          grep -q '^RG35XX_MIYOO_CAPABILITY_AUDIT_RUNTIME_SEMANTIC_DELTA=NONE$' RG35XX-MIYOO-CAPABILITY-AUDIT-BUILD.log
          grep -q '^RG35XX_MIYOO_CAPABILITY_AUDIT_RESULT=REVIEW_REQUIRED$' RG35XX-MIYOO-CAPABILITY-AUDIT-BUILD.log

          PKG=out/rg35xx-miyoo-capability-audit/RG35XX-MIYOO-CAPABILITY-AUDIT
          test -f out/rg35xx-miyoo-capability-audit/RG35XX-MIYOO-CAPABILITY-AUDIT.zip
          test -x "$PKG/SD/Roms/APPS/RG35XX-MIYOO-CAPABILITY-AUDIT.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-MIYOO-CAPABILITY-AUDIT/rg35xx-platform-capability-probe"
          test -f "$PKG/SD/Roms/APPS/RG35XX-MIYOO-CAPABILITY-AUDIT/MIYOO-REQUIREMENTS.tsv"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CAPABILITY-DECISION.sh"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CONTEXT-PROBE/rg35xx-p4-context-probe" || \
            test -x "$PKG/SD/Roms/APPS/RG35XX-P4-CONTEXT-PROBE/p4-egl-gles-context-probe"
          test -x "$PKG/SD/Roms/APPS/RG35XX-P4-PLATFORM-PROBE/p4-egl-platform-probe"

          grep -q '^RUNTIME_SEMANTIC_DELTA=NONE$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^DIAGNOSTIC_ONLY=YES$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^REUSES_ACCEPTED_P1_P2_P3_EVIDENCE=YES$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^M3G_REENABLED=NO$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^MICRO3D_REENABLED=NO$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^LWJGL_OPENGL_REENABLED=NO$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^DEVICE_PASS=NO$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"
          grep -q '^STABLE=NO$' "$PKG/RG35XX-MIYOO-CAPABILITY-AUDIT-IDENTITY.txt"

      - name: Upload capability audit package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-MIYOO-CAPABILITY-AUDIT-${{ github.sha }}
          path: |
            out/rg35xx-miyoo-capability-audit/
            RG35XX-MIYOO-CAPABILITY-AUDIT-BUILD.log
          if-no-files-found: error
