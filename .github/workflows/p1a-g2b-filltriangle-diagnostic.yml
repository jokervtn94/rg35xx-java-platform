name: P1A G2B FillTriangle Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2b-filltriangle-diagnostic
    paths:
      - '.github/workflows/p1a-g2b-filltriangle-diagnostic.yml'
      - 'scripts/stage-p1a-g2b-filltriangle-diagnostic.py'
      - 'scripts/build-p1a-g2b-filltriangle-diagnostic.sh'
      - 'tests/p1a/RG35XXG2BFillTriangleDiagnostic.java'
      - 'tests/p1a/RG35XXG2BParentRegressionGate.java'

permissions:
  contents: read

jobs:
  p1a-g2b-filltriangle-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout G2B diagnostic branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build G2B diagnostic candidate and capture differential evidence
        run: bash ./scripts/build-p1a-g2b-filltriangle-diagnostic.sh

      - name: Verify diagnostic-only scope
        run: |
          set -euo pipefail
          ID=out/p1a-g2b-filltriangle-diagnostic/P1A-G2B-DIAGNOSTIC-IDENTITY.txt
          LOG=out/p1a-g2b-filltriangle-diagnostic/P1A-G2B-FILLTRIANGLE-DIAGNOSTIC.txt
          grep -q '^PARENT_G2A_SEMANTIC_SHA256=1e33e7e37b0e0e5d3d0f836f8c29e80e28fb45c961f8fbb05f72af41de76ba51$' "$ID"
          grep -q '^PARENT_G2A_PLATFORMGRAPHICS_CLASS_SHA256=e6e377425eb46461c42f4d16b2da77a6f4b287f5ca12add8a97e6869def434db$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$ID"
          grep -q '^CHANGED_METHODS=Graphics.fillTriangle_6ARG_DIAGNOSTIC_ONLY$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class$' "$ID"
          grep -q '^ALGORITHM=EXACT_DEVICE_PROVEN_COMP02_SCANLINE$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^DIRECTGRAPHICS_FILLTRIANGLE_7ARG=UNCHANGED_SCOPE_SENTINEL_RAW_EXCEPTION$' "$ID"
          grep -q '^ARC_ROUNDRECT_NEIGHBORS=UNCHANGED_SCOPE_SENTINELS$' "$ID"
          grep -q '^G1_G2A_PARENT_REGRESSION=PASS$' "$ID"
          grep -q '^G1_ALPHA_REGRESSION=PASS$' "$ID"
          grep -Eq '^TRIANGLE_DIAGNOSTIC_MISMATCH_COUNT=[0-9]+$' "$ID"
          grep -Eq '^TRIANGLE_CANONICAL_EQUIVALENT=(YES|NO)$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^NO_A9_PARENT=YES$' "$ID"
          grep -q '^JAMVM_GLIBJ=NOT_TOUCHED$' "$ID"
          grep -q '^BUILD-PASS=YES_DIAGNOSTIC_ONLY$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^P1A_G2B_FILLTRIANGLE_DIAGNOSTIC=COMPLETE$' "$LOG"
          grep -q '^P1A_G2B_TRIANGLE_ERROR_COUNT=0$' "$LOG"
          grep -q '^P1A_G2B_SCOPE_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_G2B_SCOPE_CASE=PARENT_FILLROUNDRECT EXPECTED=MATCH ACTUAL=MATCH' "$LOG"
          for c in SENTINEL_DRAWARC SENTINEL_FILLARC SENTINEL_DRAWROUNDRECT SENTINEL_DG_FILLTRIANGLE_7ARG; do
            grep -q "^P1A_G2B_SCOPE_CASE=${c} EXPECTED=RAW_EXCEPTION ACTUAL=RAW_EXCEPTION" "$LOG"
          done
          echo P1A_G2B_DIAGNOSTIC_CI_SCOPE_LOCK=PASS

      - name: Upload G2B diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2B-FILLTRIANGLE-DIAG-${{ github.sha }}
          path: out/p1a-g2b-filltriangle-diagnostic/
          if-no-files-found: error
