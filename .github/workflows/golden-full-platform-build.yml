name: Golden Full Platform Build

on:
  push:
    branches: [ golden-clean-rebuild ]
    paths:
      - '.github/workflows/golden-full-platform-build.yml'
      - 'docs/GOLDEN-FULL-REBUILD-TASKLOG.md'
      - 'src/**'
      - 'native/golden/**'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'scripts/cv_apply_boot_resolution.py'
      - 'scripts/golden_g1_assemble.sh'
  workflow_dispatch:

jobs:
  atomic-golden-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant build-essential file
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Assemble Golden source only
        run: |
          set -euo pipefail
          GOLDEN_UPSTREAM="$GITHUB_WORKSPACE/upstream" GOLDEN_ASSEMBLY="$RUNNER_TEMP/golden" sh scripts/golden_g1_assemble.sh
          echo "GOLDEN=$RUNNER_TEMP/golden" >> "$GITHUB_ENV"
      - name: Build runtime and ARM core
        run: |
          set -euo pipefail
          cd "$GOLDEN" && ant
          cd "$GOLDEN/src/libretro"
          make clean
          make platform=unix \
            CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            LDFLAGS='-lm -lpthread'
      - name: Strict ABI and ownership gate
        run: |
          set -euo pipefail
          CORE="$GOLDEN/src/libretro/freej2me_plus_libretro.so"
          JAR="$GOLDEN/build/freej2me_plus-lr.jar"
          SRC="$GOLDEN/src/libretro/freej2me_libretro.c"
          readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          grep -q 'Version5 EABI' /tmp/elf.txt
          grep -q 'soft-float ABI' /tmp/elf.txt
          javap -verbose "$GOLDEN/build/classes/org/recompile/freej2me/Libretro.class" | grep 'major version: 50'
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_present
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_start
          grep -Fq 'rg35xx_cv_launch_java(info->path)' "$SRC"
          test "$(grep -Fc 'booted = javaOpen(params[0], params);' "$SRC")" -eq 1
          jar tf "$JAR" | grep 'RG35XXGoldenFrameTransport.class'
      - name: Reject known development payload fingerprints
        run: |
          set -euo pipefail
          sha256sum "$GOLDEN/build/freej2me_plus-lr.jar" "$GOLDEN/src/libretro/freej2me_plus_libretro.so" | tee /tmp/current.sha
          ! grep -Eq 'f409396d489cd2b1aca3ce43b3c60dba90aae5a0305f9428629c8e1d88a57e87|cae779a1ac2dfd7cd65e8893b30fee8196c1c6107f693c335701fe34fea4d322|f72cdf779b9813e56a278d4c9351068a0f3b9373b6a6d5cf29e15dcf7ac3d6d0|877ab42c4dcb38e2fbb792852039327b870d4f983ccd18a5a5b73d74cdf5500e' /tmp/current.sha
      - name: Stage atomic device payload
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/atomic"
          mkdir -p "$OUT/BIOS" "$OUT/CFW/retroarch/.retroarch/cores" "$OUT/payload" "$OUT/evidence"
          cp "$GOLDEN/build/freej2me_plus-lr.jar" "$OUT/BIOS/freej2me-lr.jar"
          cp "$GOLDEN/src/libretro/freej2me_plus_libretro.so" "$OUT/CFW/retroarch/.retroarch/cores/"
          # upload-artifact may omit hidden path components; duplicate the core
          # into a non-hidden payload directory and verify both copies match.
          cp "$GOLDEN/src/libretro/freej2me_plus_libretro.so" "$OUT/payload/freej2me_plus_libretro.so"
          cmp "$OUT/CFW/retroarch/.retroarch/cores/freej2me_plus_libretro.so" "$OUT/payload/freej2me_plus_libretro.so"
          cp "$GOLDEN/src/org/recompile/freej2me/Libretro.java" "$OUT/evidence/assembled-Libretro.java"
          cp "$GOLDEN/src/libretro/freej2me_libretro.c" "$OUT/evidence/assembled-freej2me_libretro.c"
          readelf -d "$OUT/payload/freej2me_plus_libretro.so" > "$OUT/evidence/readelf-dynamic.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
          printf '%s\n' 'SOURCE-REBUILD / DEVICE-TEST-PENDING' > "$OUT/STATUS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-golden-full-platform-build
          path: ${{ runner.temp }}/atomic
          include-hidden-files: true
          retention-days: 30
