name: A6 RG35XX PERF-J1 Direct Raw LCD Access

on:
  workflow_dispatch:
  push:
    branches:
      - rg35xx-aweigit-r1-a6-real-game-regression
    paths:
      - '.github/workflows/a6-perf-j1.yml'
      - 'scripts/stage-a6-rg35xx-perf-j1-direct-lcd.py'
      - 'scripts/build-a6-perf-j1.sh'
      - 'scripts/stage-a6-rg35xx-video-perf-p1.py'
      - 'scripts/stage-a6-rg35xx-video-perf-p2.py'
      - 'scripts/stage-a6-rg35xx-video-perf-p3.py'
      - 'scripts/build-a6-raw-drawrect-r5p3i2.sh'
      - 'scripts/build-a6-input-lifecycle-r5p3i1-v2.sh'
      - 'scripts/build-a5-core2d-java.sh'
      - 'scripts/build-a4-raw2d-java.sh'
      - 'adapter/**'

permissions:
  contents: read

jobs:
  a6-perf-j1:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout A6 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage PERF-P1
        run: python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"

      - name: Stage PERF-P2
        run: python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"

      - name: Stage exact device-proven PERF-P3 video
        run: python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"

      - name: Build PERF-P3 ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build PERF-J1 direct raw LCD candidate
        run: bash ./scripts/build-a6-perf-j1.sh

      - name: Finalize protected identity
        run: ./scripts/build-a3.sh finalize

      - name: Verify PERF-J1 locks
        run: |
          set -euo pipefail
          ID=out/a6-perf-j1/A6-PERF-J1-IDENTITY.txt
          grep -q '^BASE_PLATFORM_SEMANTIC_SHA256=b79cafa98c467436cf0e782b069839e993a7dc7bdb31b9a423b47c0ff293950e$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c361433a2c853986318938961fa978d01f085640a3a6e839e2b26656f38ff999$' "$ID"
          grep -q '^A6_PERF_J1_SCOPE_GATE=PASS$' "$ID"
          grep -q '^A6_PERF_J1_DIRECT_ACCESS_BYTECODE_GATE=PASS$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          test "$(sha256sum out/a6-perf-j1/librg35xx_input.so | awk '{print $1}')" = '69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d'
          test "$(sha256sum out/a6-perf-j1/librg35xx_video.so | awk '{print $1}')" = 'c361433a2c853986318938961fa978d01f085640a3a6e839e2b26656f38ff999'
          grep -q 'MobilePlatform.getRG35XXLCDPixels:()\[I' out/a6-perf-j1/A6-PERF-J1-FRAMEPRESENTER-JAVAP.txt
          ! grep -q 'java/lang/reflect/Method.invoke' out/a6-perf-j1/A6-PERF-J1-FRAMEPRESENTER-JAVAP.txt
          grep -q '^CANONICAL_GITLINK_MUTATED=NO$' out/a6-perf-j1/CANONICAL-DIFF-MANIFEST.txt
          cp out/a3/BUILD-IDENTITY.txt out/a6-perf-j1/A6-PLATFORM-BUILD-IDENTITY.txt
          (cd out/a6-perf-j1 && sha256sum * > A6-ARTIFACT-SHA256SUMS.txt)
          echo A6_PERF_J1_SCOPE_LOCK=PASS

      - name: Upload PERF-J1 platform
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-AWEIGIT-R1-A6-PERF-J1-${{ github.sha }}
          path: out/a6-perf-j1/
          if-no-files-found: error
