name: P2B Font OpenJDK8 FreeType Scaler Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-freetype-scaler-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkScalerContextDiagnostic.java'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py'
      - 'docs/P2B-FONT-TEXT-EVIDENCE-SYNTHESIS-v1.md'

permissions:
  contents: read

jobs:
  p2b-jdk8-freetype-scaler:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk8-ft-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk8-ft-files.txt | grep -q .; then
            echo 'P2B_JDK8_FT_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_FT_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Record exact JDK8 reference runtime and host font-library candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          java -version 2>&1 | tee out/P2B-JDK8-VERSION.txt
          find "$JAVA_HOME" \( -name 'libfontmanager.so' -o -name 'libfreetype.so*' \) -print \
            | tee out/P2B-JDK8-HOST-FONT-LIB-CANDIDATES.txt
          FM=$(find "$JAVA_HOME" -name libfontmanager.so -print -quit || true)
          {
            if test -n "$FM" && test -e "$FM"; then
              echo "P2B_JDK8_FONTMANAGER=$FM"
              ldd "$FM" || true
            else
              echo 'P2B_JDK8_FONTMANAGER=UNRESOLVED_IN_JAVA_HOME'
            fi
          } | tee out/P2B-JDK8-FONTMANAGER-LDD.txt
          {
            dpkg-query -W -f='P2B_HOST_FREETYPE_PACKAGE_VERSION=${Version}\n' libfreetype6 2>/dev/null || \
              echo 'P2B_HOST_FREETYPE_PACKAGE_VERSION=UNRESOLVED'
            ldconfig -p 2>/dev/null | grep 'libfreetype\.so' || true
            echo 'P2B_JDK8_HOST_FREETYPE_PROVENANCE=DIAGNOSTIC_ONLY'
          } | tee out/P2B-JDK8-HOST-FREETYPE-PROVENANCE.txt

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -f "$SYSROOT/usr/lib/libfreetype.so.6.18.1"
          sha256sum "$SYSROOT/usr/lib/libfreetype.so.6.18.1" | tee out/P2B-JDK8-FT-LIB-SHA256.txt
          grep -F 'dc4fe5572e1c9dbd913e70584c7c42e9e7ff6e2e573f637009b309bad6295afa' out/P2B-JDK8-FT-LIB-SHA256.txt
          echo 'P2B_JDK8_FT_TOOLCHAIN=PASS'

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_FT_FONT_IDENTITY=PASS'

      - name: Verify exact JDK8 default scaler context and raster reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BJdkScalerContextDiagnostic.java \
            tests/p2b/diagnostic/RG35XXP2BJdkRasterFingerprintDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BJdkScalerContextDiagnostic out/font.ttf \
            | tee out/P2B-JDK8-SCALER-CONTEXT.log
          grep -F 'P2B_JDK_SCALER_CONTEXT_AA=false' out/P2B-JDK8-SCALER-CONTEXT.log
          grep -F 'P2B_JDK_SCALER_CONTEXT_FM=false' out/P2B-JDK8-SCALER-CONTEXT.log
          grep -F 'P2B_JDK_SCALER_CONTEXT_TX=1.0,0.0,0.0,1.0' out/P2B-JDK8-SCALER-CONTEXT.log
          grep -F 'P2B_JDK_SCALER_CONTEXT_RESULT=PASS' out/P2B-JDK8-SCALER-CONTEXT.log
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BJdkRasterFingerprintDiagnostic out/font.ttf \
            | tee out/P2B-JDK8-RASTER-FP.log
          grep -F 'P2B_JDK_RASTER_FP_CASES=144' out/P2B-JDK8-RASTER-FP.log
          grep -F 'P2B_JDK_RASTER_FP_RESULT=PASS' out/P2B-JDK8-RASTER-FP.log

      - name: Build and run ARM probe matching OpenJDK8 FreetypeFontScaler policy
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          FT="$SYSROOT/usr/lib/libfreetype.so.6.18.1"
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$SYSROOT/usr/include/freetype2" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_scaler_arm.c \
            "$FT" -lm -o out/p2b-freetype-jdk8-scaler-arm
          file out/p2b-freetype-jdk8-scaler-arm | tee out/P2B-JDK8-FT-SCALER-FILE.txt
          qemu-arm -L "$SYSROOT" out/p2b-freetype-jdk8-scaler-arm out/font.ttf \
            | tee out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_INTERPRETER=35' out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_AA=OFF' out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_FM=OFF' out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_DPI=72' out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_SCALER_CASES=144' out/P2B-JDK8-FT-SCALER.log
          grep -F 'P2B_FT_JDK8_SCALER_RESULT=PASS' out/P2B-JDK8-FT-SCALER.log

      - name: Classify exact residual JDK8 versus ARM scaler raster differences
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_jdk8_scaler_raster.py \
            out/P2B-JDK8-RASTER-FP.log out/P2B-JDK8-FT-SCALER.log \
            | tee out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_DIFF_PARSE=PASS' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_JDK_CASES=144' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_ARM_CASES=144' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_WIDTH_EXACT=144' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_BOUNDS_EXACT=144' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_MISMATCH_DETAIL=PASS' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_CLASSIFICATION=LAYOUT_PLACEMENT_EXACT_RASTER_RESIDUAL' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_JDK8_FT_SCALER_DIFF_RESULT=PASS' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt

      - name: Remove font and executable before evidence upload
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/font.ttf out/miyoomini-freej2me.zip out/p2b-freetype-jdk8-scaler-arm
          if find out -type f | grep -Ei '\.(ttf|otf)$'; then echo 'P2B_FONT_BYTE_LEAK=FAIL'; exit 1; fi
          {
            echo 'P2B_FONT_BYTE_LEAK=NO'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-FT-SCALER-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-JDK8-FT-SCALER-${{ github.sha }}
          path: |
            out/P2B-JDK8-VERSION.txt
            out/P2B-JDK8-HOST-FONT-LIB-CANDIDATES.txt
            out/P2B-JDK8-FONTMANAGER-LDD.txt
            out/P2B-JDK8-HOST-FREETYPE-PROVENANCE.txt
            out/P2B-JDK8-FT-LIB-SHA256.txt
            out/P2B-JDK8-SCALER-CONTEXT.log
            out/P2B-JDK8-RASTER-FP.log
            out/P2B-JDK8-FT-SCALER.log
            out/P2B-JDK8-FT-SCALER-DIFFERENTIAL.txt
            out/P2B-JDK8-FT-SCALER-FILE.txt
            out/P2B-JDK8-FT-SCALER-STATUS.txt
          if-no-files-found: error
