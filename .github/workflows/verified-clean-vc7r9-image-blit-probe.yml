name: Verified Clean VC7R9 Java Image Blit Probe

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r9-image-blit-probe.yml'
      - 'scripts/vc7r9_apply_image_blit_probe.py'
      - 'scripts/vc7r4_apply_video_color_diag.py'
      - 'patches/0007-platformgraphics-rg35xx-fast-drawrgb.patch'
      - 'patches/0008-platformgraphics-transform-cache.patch'
      - 'tasklog/VC7R9-JAVA-IMAGE-BLIT-PROBE.md'
  workflow_dispatch:

jobs:
  vc7r9-image-blit-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      VC7R_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9
      TRANSFORM_CACHE_SHA256: 98ad54d7f36413d800972708047a955bb055c607
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream
      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Assemble verified-clean VC7R8 foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/vc7r9" sh scripts/vc6_png_iccp_assemble.sh
          echo "VC7R9=$RUNNER_TEMP/vc7r9" >> "$GITHUB_ENV"
          python3 scripts/vc7r2_apply_proven_dynamic_view.py "$RUNNER_TEMP/vc7r9/src/org/recompile/freej2me/Libretro.java"
          python3 scripts/vc7_apply_golden_font.py "$RUNNER_TEMP/vc7r9/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Generate reconstructed font resource
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/vc7r9-font" "$VC7R9/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/vc7r9-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/vc7r9-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/vc7r9-font/rg35xx-font.bin" | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          cp "$RUNNER_TEMP/vc7r9-font/rg35xx-font.bin" "$VC7R9/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Materialize VC7R3 media and VC7R8 transform helper
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$VC7R9/src/org/recompile/mobile" "$VC7R9/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do cp "history/src/org/recompile/mobile/$f" "$VC7R9/src/org/recompile/mobile/$f"; done
          cp history/src/org/recompile/mobile/RG35XXTransformCache.java "$VC7R9/src/org/recompile/mobile/RG35XXTransformCache.java"
          test "$(git -C history hash-object src/org/recompile/mobile/RG35XXTransformCache.java)" = "$TRANSFORM_CACHE_SHA256"
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$VC7R9/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$VC7R9/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$VC7R9/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Apply VC7R3 media overlays
        run: |
          set -euo pipefail
          python3 - "$VC7R9/src/org/recompile/mobile/PlatformPlayer.java" "$VC7R9/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do patch -d "$VC7R9" -p1 --batch --forward --fuzz=0 < "history/patches/$p"; done
          python3 scripts/vc7r3_apply_native_audio.py "$VC7R9/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$VC7R9/src/org/recompile/freej2me/Libretro.java" "$VC7R9/src/org/recompile/mobile/PlatformPlayer.java" "$VC7R9/src/javax/microedition/media/Manager.java"

      - name: Restore VC7R8 graphics and apply VC7R9 probes
        run: |
          set -euo pipefail
          python3 scripts/vc7r4_apply_video_color_diag.py "$VC7R9/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          python3 scripts/vc7r5_apply_java_frame_probe.py "$VC7R9/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          python3 - "$VC7R9/src/org/recompile/mobile/PlatformGraphics.java" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          patch -d "$VC7R9" -p1 --batch --forward --fuzz=0 < patches/0007-platformgraphics-rg35xx-fast-drawrgb.patch
          patch -d "$VC7R9" -p1 --batch --forward --fuzz=0 < patches/0008-platformgraphics-transform-cache.patch
          python3 scripts/vc7r9_apply_image_blit_probe.py "$VC7R9/src/org/recompile/mobile/PlatformGraphics.java"
          python3 - "$VC7R9/src/libretro/freej2me_libretro.c" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          old='/mnt/mmc/freej2me-java-error.log'; new='/mnt/mmc/freej2me-vc7r9-java.log'
          n=s.count(old)
          if n != 1: raise SystemExit('VC7R9 stderr path count=%d' % n)
          p.write_text(s.replace(old,new,1), newline='\n')
          print('VC7R9_JAVA_LOG='+new)
          PY
          G="$VC7R9/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq 'RG35XXTransformCache.get(origSwidth, origSheight, cacheTransform)' "$G"
          grep -Fq 'RG35XX-VC7R9-IMAGE-BLIT' "$G"
          grep -Fq '/mnt/mmc/freej2me-vc7r9-color.log' "$VC7R9/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          ! grep -Fq '/mnt/mmc/freej2me-vc7r4-color.log' "$VC7R9/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          grep -Fq '/mnt/mmc/freej2me-vc7r9-java.log' "$VC7R9/src/libretro/freej2me_libretro.c"
          ! grep -Fq '/mnt/mmc/freej2me-java-error.log' "$VC7R9/src/libretro/freej2me_libretro.c"
          echo 'VC7R9_PROBE_SOURCE_GATE=PASS'

      - name: Wire native media sources
        run: |
          cat >> "$VC7R9/src/libretro/Makefile.common" <<'EOF'
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Java 6 build
        run: |
          set -euo pipefail
          ! grep -Rq 'RG35XX-CV' "$VC7R9/src"
          cd "$VC7R9" && ant
          python3 - "$VC7R9/build/classes" <<'PY'
          import os,struct,sys
          n=0
          for b,_,fs in os.walk(sys.argv[1]):
            for f in fs:
              if f.endswith('.class'):
                n+=1; h=open(os.path.join(b,f),'rb').read(8)
                if len(h)!=8 or h[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',h[6:8])[0]!=50: raise SystemExit('Java major gate failed: '+os.path.join(b,f))
          print('VC7R9_CLASS_COUNT=%d'%n)
          PY

      - name: Build ARM native core
        run: |
          set -euo pipefail
          cd "$VC7R9/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'

      - name: Strict VC7R9 gate
        run: |
          set -euo pipefail
          CORE="$VC7R9/src/libretro/freej2me_plus_libretro.so"; JAR="$VC7R9/build/freej2me_plus-lr.jar"
          readelf -h "$CORE" | tee /tmp/vc7r9-elf.txt
          grep -q 'Class:.*ELF32' /tmp/vc7r9-elf.txt
          grep -q 'Machine:.*ARM' /tmp/vc7r9-elf.txt
          grep -q 'Version5 EABI' /tmp/vc7r9-elf.txt
          grep -q 'soft-float ABI' /tmp/vc7r9-elf.txt
          grep -Fq 'RETRO_PIXEL_FORMAT_RGB565' "$VC7R9/src/libretro/freej2me_libretro.c"
          grep -Fq 'RG35XX-VC7R3-AUDIO-NATIVE' "$VC7R9/src/libretro/freej2me_libretro.c"
          grep -Fq 'RG35XX-VC7R4-COLOR-DIAG' "$VC7R9/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          grep -Fq 'RG35XX-VC7R5-JAVA-COLOR' "$VC7R9/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          grep -Fq 'RG35XX-VC7R9-IMAGE-BLIT' "$VC7R9/src/org/recompile/mobile/PlatformGraphics.java"
          grep -Fq '/mnt/mmc/freej2me-vc7r9-color.log' "$VC7R9/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          grep -Fq '/mnt/mmc/freej2me-vc7r9-java.log' "$VC7R9/src/libretro/freej2me_libretro.c"
          jar tf "$JAR" | grep -Fx 'org/recompile/mobile/RG35XXTransformCache.class'
          jar tf "$JAR" | grep -Fx 'org/recompile/mobile/rg35xx-font.bin'
          strings "$CORE" | grep -Fq '/mnt/mmc/freej2me-vc7r9-color.log'
          strings "$CORE" | grep -Fq '/mnt/mmc/freej2me-vc7r9-java.log'
          if strings "$CORE" | grep -Fq '/mnt/mmc/freej2me-vc7r4-color.log'; then exit 1; fi
          echo 'VC7R9_GATE=PASS'

      - name: Package device-test payload
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r9-artifact"; mkdir -p "$OUT"
          cp "$VC7R9/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr-vc7r9.jar"
          cp "$VC7R9/src/libretro/freej2me_plus_libretro.so" "$OUT/freej2me_plus_libretro-vc7r9.so"
          cp "$RUNNER_TEMP/vc7r9-font/manifest.json" "$OUT/VC7R9-FONT-MANIFEST.json"
          J=$(sha256sum "$OUT/freej2me-lr-vc7r9.jar"|awk '{print $1}'); C=$(sha256sum "$OUT/freej2me_plus_libretro-vc7r9.so"|awk '{print $1}')
          printf '%s\n' 'RG35XX VC7R9 JAVA IMAGE BLIT PROBE' 'STATUS=DIAGNOSTIC-BUILD-PASS-DEVICE-TEST-PENDING' "$J  freej2me-lr-vc7r9.jar" "$C  freej2me_plus_libretro-vc7r9.so" 'DRAWRGB_PATCH=0007_PRESERVED' 'TRANSFORM_PATCH=0008_PRESERVED' 'JAVA_IMAGE_BLIT_PROBE=VC7R9' 'JAVA_LOG=/mnt/mmc/freej2me-vc7r9-java.log' 'COLOR_LOG=/mnt/mmc/freej2me-vc7r9-color.log' 'VC7R5_FRAMEBUFFER_PROBE=PRESERVED' 'VC7R4_NATIVE_REFERENCE_STRIP=PRESERVED' 'VC7R3_NATIVE_AUDIO=PRESERVED' 'VC7R2_DYNAMIC_VIEW=PRESERVED' 'RGB565_TRANSPORT=PRESERVED' 'FONT_STATUS=RECONSTRUCTED-NOT-GOLDEN' 'DEVICE_TEST=PENDING' > "$OUT/STATUS.txt"
          (cd "$OUT" && sha256sum freej2me-lr-vc7r9.jar freej2me_plus_libretro-vc7r9.so VC7R9-FONT-MANIFEST.json STATUS.txt) > "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r9-java-image-blit-probe
          path: ${{ runner.temp }}/vc7r9-artifact
          retention-days: 30
