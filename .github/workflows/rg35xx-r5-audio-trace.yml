name: RG35XX R5 Audio Lifecycle Trace

on:
  workflow_dispatch:
  push:
    branches: [physical-test/rg35xx-r5-audio-owner-r5p1-audio-trace]
    paths:
      - 'adapter/native/rg35xx_audio_sdl1_mixer.c'
      - 'adapter/native/rg35xx_audio_sdl1_mixer_r5_owner.c'
      - 'scripts/build-rg35xx-r5-audio-owner-native.sh'
      - 'scripts/build-rg35xx-r5-audio-trace.sh'
      - 'scripts/gate-rg35xx-r5-audio-trace.py'
      - '.github/workflows/rg35xx-r5-audio-trace.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends unzip zip python3 curl binutils >/dev/null

      - name: Download exact R5 owner candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/r5-artifact /tmp/r5-wrapper.zip
          mkdir -p /tmp/r5-artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jokervtn94/rg35xx-java-platform/actions/artifacts/11334633999/zip" \
            -o /tmp/r5-wrapper.zip
          unzip -q /tmp/r5-wrapper.zip -d /tmp/r5-artifact
          R5_ZIP="$(find /tmp/r5-artifact -type f -name 'RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-OWNER.zip' -print -quit)"
          test -n "$R5_ZIP"
          echo "R5_DEVICE_ZIP=$R5_ZIP" >> "$GITHUB_ENV"
          echo R5_PARENT_ARTIFACT_GATE=PASS

      - name: Compile trace-enabled ARMv5 SDL1 audio bridge
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini; bash ./scripts/build-rg35xx-r5-audio-owner-native.sh' | tee R5-TRACE-NATIVE.log
          sudo chown -R "$(id -u):$(id -g)" out/r5-audio-owner-native
          grep -q '^R5_AUDIO_NATIVE_BUILD=PASS$' R5-TRACE-NATIVE.log
          echo "R5_AUDIO_SO=$GITHUB_WORKSPACE/out/r5-audio-owner-native/libaudio.so" >> "$GITHUB_ENV"

      - name: Build trace package
        run: |
          set -euo pipefail
          R5_DEVICE_ZIP="$R5_DEVICE_ZIP" R5_AUDIO_SO="$R5_AUDIO_SO" \
            bash scripts/build-rg35xx-r5-audio-trace.sh | tee R5-TRACE-BUILD.log
          grep -q '^R5_AUDIO_TRACE_BUILD=PASS$' R5-TRACE-BUILD.log

      - name: Independent gate
        run: |
          set -euo pipefail
          ZIP=out/r5-audio-trace/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-AUDIO-TRACE.zip
          python3 scripts/gate-rg35xx-r5-audio-trace.py "$ZIP" | tee R5-TRACE-GATE.log
          grep -q '^R5_AUDIO_TRACE_INDEPENDENT_GATE=PASS$' R5-TRACE-GATE.log
          grep -q '^DEVICE_PASS=NO$' R5-TRACE-GATE.log

      - name: Verify shell syntax
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q out/r5-audio-trace/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-AUDIO-TRACE.zip -d "$TMP"
          find "$TMP" -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do sh -n "$f"; done
          echo R5_TRACE_FINAL_SHELL_GATE=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-R5-AUDIO-TRACE-${{ github.sha }}
          path: |
            out/r5-audio-trace/RG35XX-MIYOO-FULL-PORT-R1-P7-READY-R5-AUDIO-TRACE.zip
            out/r5-audio-owner-native/libaudio.so
            R5-TRACE-NATIVE.log
            R5-TRACE-BUILD.log
            R5-TRACE-GATE.log
          if-no-files-found: error
