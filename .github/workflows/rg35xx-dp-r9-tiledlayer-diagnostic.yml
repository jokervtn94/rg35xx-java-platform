name: RG35XX DP-R9 TiledLayer Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [dp-r9-tiledlayer-diagnostic]
    paths:
      - '.github/workflows/rg35xx-dp-r9-tiledlayer-diagnostic.yml'
      - 'rebuild-v9/**'
      - 'docs/DP-R9-TILEDLAYER-DIAGNOSTIC.md'
jobs:
  tiledlayer-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant unzip >/dev/null
      - name: Materialize pinned Miyoo ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
      - name: Build DP-R9 diagnostic-only package
        run: bash rebuild-v9/build_tiledlayer_diagnostic.sh
      - name: Publish identity
        run: |
          cat out/dp-r9/BUILD-IDENTITY.txt
          echo '--- SHA256SUMS ---'
          cat out/dp-r9/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-dp-r9-tiledlayer-diagnostic
          path: out/dp-r9/
          if-no-files-found: error
