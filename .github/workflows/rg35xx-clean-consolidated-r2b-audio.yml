name: RG35XX Clean Consolidated R2B Audio Ownership Build

on:
  workflow_dispatch:
  push:
    branches: [rg35xx-clean-consolidated-r2]
    paths:
      - '.github/workflows/rg35xx-clean-consolidated-r2b-audio.yml'
      - 'tasklog/RG35XX-CLEAN-CONSOLIDATED-R2B-AUDIO.md'
      - 'scripts/rg35xx_clean_consolidated_r2a_assemble.sh'
      - 'scripts/r2_apply_headless_image_normalize.py'
      - 'scripts/vc7r3_apply_native_audio.py'
      - 'scripts/vc7r3_apply_java_media_events.py'
      - 'scripts/vc7r22r1_apply_worker_ring.py'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends ant python3 patch file binutils >/dev/null
          docker pull "$TOOLCHAIN_IMAGE" >/dev/null
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi
          echo TOOLCHAIN_GATE=PASS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Assemble exact R2A foundation
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" \
          R2A_ASSEMBLY="$RUNNER_TEMP/r2b" \
            sh scripts/rg35xx_clean_consolidated_r2a_assemble.sh
          echo "R2B=$RUNNER_TEMP/r2b" >> "$GITHUB_ENV"
          grep -Fq 'RG35XX-R2A-IMAGE-NORMALIZE' "$RUNNER_TEMP/r2b/src/org/recompile/mobile/PlatformImage.java"
          echo R2A_FOUNDATION_GATE=PASS

      - name: Materialize pinned historical RG35XX media implementation
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$R2B/src/org/recompile/mobile" "$R2B/src/libretro/rg35xx/vendor/TinySoundFont"

          for f in \
            RG35XXAudioBootstrap.java \
            RG35XXAudioProtocol.java \
            RG35XXAudioTransport.java \
            RG35XXMediaProfile.java \
            RG35XXMediaRegistry.java \
            RG35XXNativePlayer.java \
            RG35XXPlatformProfile.java \
            RG35XXToneSequenceEncoder.java \
            RG35XXWavDecoder.java
          do
            cp "history/src/org/recompile/mobile/$f" "$R2B/src/org/recompile/mobile/$f"
          done

          for f in \
            rg35xx_audio_protocol.h \
            rg35xx_media_cache.h rg35xx_media_cache.c \
            rg35xx_media_events.h \
            rg35xx_media_event_queue.h rg35xx_media_event_queue.c \
            rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c \
            rg35xx_audio_pipe.h rg35xx_audio_pipe.c \
            rg35xx_mixer.h rg35xx_mixer.c \
            rg35xx_midi_backend.h rg35xx_midi_backend.c \
            rg35xx_tsf_worker.h rg35xx_tsf_worker.c \
            rg35xx_tsf_impl.c \
            rg35xx_soundfont_source.h rg35xx_soundfont_source.c \
            rg35xx_media_runtime.h rg35xx_media_runtime.c
          do
            cp "history/native/$f" "$R2B/src/libretro/rg35xx/$f"
          done

          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R2B/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R2B/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"
          echo MEDIA_SOURCE_MATERIALIZATION=PASS

      - name: Apply RG35XX Java media facade
        run: |
          set -euo pipefail
          python3 - "$R2B/src/org/recompile/mobile/PlatformPlayer.java" "$R2B/src/javax/microedition/media/Manager.java" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY

          for p in \
            0003-manager-rg35xx-media-profile.patch \
            0018-manager-platformplayer-rg35xx-direct-media.patch \
            0019-platformplayer-tonecontrol-rg35xx.patch
          do
            patch -d "$R2B" -p1 --batch --forward --fuzz=0 < "history/patches/$p"
          done

          python3 scripts/vc7r3_apply_native_audio.py "$R2B/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py \
            "$R2B/src/org/recompile/freej2me/Libretro.java" \
            "$R2B/src/org/recompile/mobile/PlatformPlayer.java" \
            "$R2B/src/javax/microedition/media/Manager.java"
          echo RG35XX_MEDIA_FACADE=PASS

      - name: Restore independent worker-ring ownership
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r1_apply_worker_ring.py "$R2B/src/libretro/freej2me_libretro.c"

          C="$R2B/src/libretro/freej2me_libretro.c"
          grep -Fq 'RG35XX-VC7R22R1-WORKER-RING' "$C"
          grep -Fq 'RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq 'RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq 'RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          grep -Fq 'RETRO_ENVIRONMENT_SET_AUDIO_CALLBACK' "$C"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          echo WORKER_RING_SOURCE_GATE=PASS

      - name: Wire native media sources
        run: |
          set -euo pipefail
          cat >> "$R2B/src/libretro/Makefile.common" <<'EOF'

          # R2B target-native media only. Current Golden RGB565 video owner remains unchanged.
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Java target-route and Java 6 gates
        run: |
          set -euo pipefail
          P="$R2B/src/org/recompile/mobile/PlatformPlayer.java"
          M="$R2B/src/javax/microedition/media/Manager.java"
          L="$R2B/src/org/recompile/freej2me/Libretro.java"
          I="$R2B/src/org/recompile/mobile/PlatformImage.java"

          grep -Fq 'RG35XXPlatformProfile.isActive()' "$P"
          grep -Fq 'RG35XXAudioBootstrap.initialize(); // VC7R3 lazy media bootstrap' "$P"
          grep -Fq 'RG35XXNativePlayer' "$P"
          grep -Fq 'RG35XX tone transport unavailable' "$M"
          grep -Fq 'RG35XX-VC7R3-MEDIA-EVENT' "$L"
          grep -Fq 'RG35XX-R2A-IMAGE-NORMALIZE' "$I"
          grep -Fq 'RG35XX-MEDIA-BOOT: eager prepare SKIPPED; lazy media enabled' "$R2B/src/org/recompile/mobile/MobilePlatform.java"

          cd "$R2B"
          ant

          python3 - "$R2B/build/classes" <<'PY'
          import os,struct,sys
          n=0; bad=[]
          for base,_,files in os.walk(sys.argv[1]):
              for fn in files:
                  if not fn.endswith('.class'): continue
                  n+=1
                  p=os.path.join(base,fn)
                  b=open(p,'rb').read(8)
                  if len(b)!=8 or b[:4]!=b'\xca\xfe\xba\xbe':
                      bad.append((p,'magic')); continue
                  major=struct.unpack('>H',b[6:8])[0]
                  if major!=50: bad.append((p,major))
          if bad: raise SystemExit('JAVA6_GATE_FAIL '+repr(bad[:20]))
          print('R2B_JAVA_CLASS_COUNT=%d'%n)
          print('R2B_JAVA_MAJOR_50=PASS')
          PY

      - name: Build experimental ARMv5TE native core
        run: |
          set -euo pipefail
          cd "$R2B/src/libretro"
          make clean
          make platform=unix \
            CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            LDFLAGS='-lm -lpthread'

      - name: Strict native architecture gate
        run: |
          set -euo pipefail
          CORE="$R2B/src/libretro/freej2me_plus_libretro.so"
          C="$R2B/src/libretro/freej2me_libretro.c"
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/r2b-elf.txt
          grep -q 'Class:.*ELF32' /tmp/r2b-elf.txt
          grep -q 'Machine:.*ARM' /tmp/r2b-elf.txt
          grep -q 'Version5 EABI' /tmp/r2b-elf.txt
          grep -q 'soft-float ABI' /tmp/r2b-elf.txt

          grep -Fq 'RETRO_PIXEL_FORMAT_RGB565' "$C"
          grep -Fq 'rg35xx_golden_video_present(' "$C"
          grep -Fq -- '-Dfreej2me.rg35xx.audio.fd=%d' "$C"
          grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470' "$C"
          grep -Fq 'RG35XX-AUDIO: async callback registered=%d' "$C"
          ! grep -Fq 'rg35xx_pump_media_audio();' "$C"
          ! grep -Fq 'AudioBatch(rg35xx_audio_run_buffer,frames)' "$C"
          echo R2B_NATIVE_ARCH_GATE=PASS

      - name: Package build-only evidence
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r2b-artifact"
          mkdir -p "$OUT"
          cp "$R2B/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr-r2b.jar"
          cp "$R2B/src/libretro/freej2me_plus_libretro.so" "$OUT/freej2me_plus_libretro-r2b.so"
          cp tasklog/RG35XX-CLEAN-CONSOLIDATED-R2B-AUDIO.md "$OUT/"

          J=$(sha256sum "$OUT/freej2me-lr-r2b.jar"|awk '{print $1}')
          C=$(sha256sum "$OUT/freej2me_plus_libretro-r2b.so"|awk '{print $1}')

          cat > "$OUT/STATUS.txt" <<EOF
          CHECKPOINT=RG35XX-CLEAN-CONSOLIDATED-R2B-AUDIO
          STATUS=BUILD-ONLY_DEVICE-INSTALL-BLOCKED
          SOURCE_COMMIT=$GITHUB_SHA
          BASE=R2A
          RUNTIME_SHA256=$J
          CORE_SHA256=$C
          AUDIO_OWNER=DEDICATED_FD_WORKER_RING_ASYNC_CALLBACK
          RING_FRAMES=16384
          PRIME_FRAMES=3072
          WORKER_CHUNK=1470
          SYNTH_SOURCE_PATH=44100_STEREO_RECONSTRUCTION_NOT_GOLDEN
          SOUNDFONT=/mnt/mmc/BIOS/freej2me.sf2
          R2A_IMAGE_NORMALIZE=PRESERVED
          GOLDEN_RGB565_VIDEO=PRESERVED
          RETRO_RUN_AUDIO_PUMP=ABSENT
          DEVICE_INSTALL=BLOCKED
          DEVICE_PASS=NO
          STABLE=NO
          EOF

          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          echo "R2B_RUNTIME_SHA256=$J"
          echo "R2B_CORE_SHA256=$C"
          echo R2B_BUILD_ONLY=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-clean-consolidated-r2b-audio-build-only
          path: ${{ runner.temp }}/r2b-artifact/
          if-no-files-found: error
