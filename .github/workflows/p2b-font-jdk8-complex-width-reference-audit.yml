name: P2B Font JDK8 Complex Width Reference Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - 'tests/p2b/diagnostic/RG35XXP2BJdkComplexWidthDiagnostic.java'
      - '.github/workflows/p2b-font-jdk8-complex-width-reference-audit.yml'

permissions:
  contents: read

jobs:
  p2b-jdk8-complex-width-reference:
    runs-on: ubuntu-24.04
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-complex-width-reference-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-complex-width-reference-files.txt | grep -q .; then
            echo 'P2B_COMPLEX_WIDTH_REFERENCE_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_COMPLEX_WIDTH_REFERENCE_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 /tmp/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p /tmp/miyoomini-freej2me.zip "$ENTRY" > /tmp/p2b-font.ttf
          test "$(sha256sum /tmp/p2b-font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < /tmp/p2b-font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_COMPLEX_WIDTH_REFERENCE_FONT_IDENTITY=PASS' | tee out/P2B-COMPLEX-WIDTH-REFERENCE-FONT-IDENTITY.txt

      - name: Run exact JDK8 complex width decomposition
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2b-complex-width-classes && mkdir -p /tmp/p2b-complex-width-classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d /tmp/p2b-complex-width-classes \
            tests/p2b/diagnostic/RG35XXP2BJdkComplexWidthDiagnostic.java
          java -Djava.awt.headless=true -cp /tmp/p2b-complex-width-classes \
            RG35XXP2BJdkComplexWidthDiagnostic /tmp/p2b-font.ttf \
            | tee out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
          grep -F 'P2B_JDK8_COMPLEX_WIDTH_CASES=192' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
          grep -F 'P2B_JDK8_COMPLEX_WIDTH_ROUNDING_EXACT_CASES=192' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
          grep -F 'P2B_JDK8_COMPLEX_WIDTH_RESULT=PASS' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
          {
            grep '^P2B_JDK8_COMPLEX_WIDTH_CASES=' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
            grep '^P2B_JDK8_COMPLEX_WIDTH_PADDED_CASES=' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
            grep '^P2B_JDK8_COMPLEX_WIDTH_COMPONENT_ADV_EXACT_CASES=' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
            grep '^P2B_JDK8_COMPLEX_WIDTH_ROUNDING_EXACT_CASES=' out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'STABLE=NO'
          } | tee out/P2B-COMPLEX-WIDTH-REFERENCE-STATUS.txt

      - name: Remove font and classes before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2b-complex-width-classes
          rm -f /tmp/p2b-font.ttf /tmp/miyoomini-freej2me.zip
          if find out -type f | grep -Ei '\.(ttf|otf|class|jar|so|a|o)$'; then
            echo 'P2B_COMPLEX_WIDTH_REFERENCE_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_COMPLEX_WIDTH_REFERENCE_BYTE_LEAK=NO' | tee out/P2B-COMPLEX-WIDTH-REFERENCE-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-COMPLEX-WIDTH-REFERENCE-${{ github.sha }}
          path: |
            out/P2B-COMPLEX-WIDTH-REFERENCE-FONT-IDENTITY.txt
            out/P2B-JDK8-COMPLEX-WIDTH-REFERENCE.log
            out/P2B-COMPLEX-WIDTH-REFERENCE-STATUS.txt
            out/P2B-COMPLEX-WIDTH-REFERENCE-CLEANUP.txt
