name: Golden G1 ARM Build

on:
  push:
    branches: [ golden-clean-rebuild ]
    paths:
      - '.github/workflows/golden-g1-arm-build.yml'
      - 'src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java'
      - 'native/golden/**'
      - 'scripts/g1_apply_java_transport.py'
      - 'scripts/g1_apply_native_overlay.py'
      - 'scripts/golden_g1_assemble.sh'
  workflow_dispatch:

jobs:
  g1-arm-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
    steps:
      - name: Checkout clean rebuild branch
        uses: actions/checkout@v4

      - name: Checkout exact pinned FreeJ2ME source
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant build-essential file
          docker version

      - name: Select Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize pinned ARM uClibc toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo mkdir -p /opt
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Assemble clean G1 source
        run: |
          GOLDEN_UPSTREAM="$GITHUB_WORKSPACE/upstream" \
          GOLDEN_ASSEMBLY="$RUNNER_TEMP/golden-g1" \
          sh scripts/golden_g1_assemble.sh
          echo "G1=$RUNNER_TEMP/golden-g1" >> "$GITHUB_ENV"

      - name: Compile Java 6 runtime
        working-directory: ${{ runner.temp }}/golden-g1
        run: ant

      - name: Compile ARMv5TE uClibc core
        working-directory: ${{ runner.temp }}/golden-g1/src/libretro
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make platform=unix \
            CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' \
            LDFLAGS='-lm -lpthread'

      - name: Verify device ABI and G1 ownership
        working-directory: ${{ runner.temp }}/golden-g1
        shell: bash
        run: |
          set -euo pipefail
          CORE=src/libretro/freej2me_plus_libretro.so
          JAR=build/freej2me_plus-lr.jar
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/g1-elf.txt
          grep -q 'Class:.*ELF32' /tmp/g1-elf.txt
          grep -q 'Machine:.*ARM' /tmp/g1-elf.txt
          grep -q 'Version5 EABI' /tmp/g1-elf.txt
          grep -q 'soft-float ABI' /tmp/g1-elf.txt
          # link.T intentionally hides implementation helpers from the exported
          # libretro ABI, so inspect the complete symbol table rather than -D.
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_present
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_start
          javap -verbose build/classes/org/recompile/freej2me/Libretro.class | grep 'major version: 50'
          jar tf "$JAR" | grep 'RG35XXGoldenFrameTransport.class'

      - name: Record device build evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/g1-device-evidence"
          mkdir -p "$OUT"
          cp "$G1/build/freej2me_plus-lr.jar" "$OUT/freej2me-lr.jar"
          cp "$G1/src/libretro/freej2me_plus_libretro.so" "$OUT/"
          cp "$G1/src/org/recompile/freej2me/Libretro.java" "$OUT/assembled-Libretro.java"
          cp "$G1/src/libretro/freej2me_libretro.c" "$OUT/assembled-freej2me_libretro.c"
          cp "$G1/src/libretro/rg35xx/golden/rg35xx_golden_video.c" "$OUT/"
          readelf -d "$OUT/freej2me_plus_libretro.so" > "$OUT/readelf-dynamic.txt"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"

      - name: Upload G1 ARM evidence
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-golden-g1-arm-build
          path: ${{ runner.temp }}/g1-device-evidence
          retention-days: 30
