name: P4 EGL Platform Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/p4-platform-probe.yml"
      - "scripts/build-p4-platform-probe-package.sh"
      - "tests/p4/rg35xx_egl_platform_probe.c"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Pull pinned Miyoo uClibc toolchain
        run: docker pull "$TOOLCHAIN"
      - name: Build P4.2 platform probe package
        run: |
          set -euo pipefail
          chmod +x scripts/build-p4-platform-probe-package.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TOOLCHAIN" bash -lc \
            'git config --global --add safe.directory /work && P4_ARM_CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc bash scripts/build-p4-platform-probe-package.sh' | tee P4-PLATFORM-PROBE-BUILD.log
          grep -q '^P4_PLATFORM_PROBE_BUILD=PASS$' P4-PLATFORM-PROBE-BUILD.log
          test -f out/p4-platform-probe/RG35XX-P4-PLATFORM-PROBE.zip
          test -x out/p4-platform-probe/RG35XX-P4-PLATFORM-PROBE/SD/Roms/APPS/RG35XX-P4-PLATFORM-PROBE/p4-egl-platform-probe
      - name: Upload P4.2 platform probe package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P4-PLATFORM-PROBE-${{ github.sha }}
          path: |
            out/p4-platform-probe/
            P4-PLATFORM-PROBE-BUILD.log
          if-no-files-found: error
