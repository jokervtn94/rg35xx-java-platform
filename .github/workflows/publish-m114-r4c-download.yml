name: Publish M1.14 r4C Direct Download
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.14-r4c-underline-only-ab]
    paths: [.github/workflows/publish-m114-r4c-download.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miyoo-m1.14-r4c-underline-only-ab
      - name: Download verified r4C.1 BUILD-PASS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jokervtn94/rg35xx-java-platform/actions/artifacts/10477272462/zip \
            -o /tmp/r4c.zip
          echo '615e8bfbf7b848bbc579c0576476e33781b9d8db7d63e0d7cb183dbaa8e0a7cf  /tmp/r4c.zip' | sha256sum -c -
          rm -rf downloads/M1.14-r4C-UNDERLINE-ONLY-AB
          mkdir -p downloads/M1.14-r4C-UNDERLINE-ONLY-AB
          unzip -q /tmp/r4c.zip -d downloads/M1.14-r4C-UNDERLINE-ONLY-AB
          sha256sum downloads/M1.14-r4C-UNDERLINE-ONLY-AB/Roms/APPS/*
      - name: Publish complete files into repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f downloads/M1.14-r4C-UNDERLINE-ONLY-AB/Roms/APPS/M1.14-R4C-UNDERLINE-ONLY-AB.sh \
                     downloads/M1.14-r4C-UNDERLINE-ONLY-AB/Roms/APPS/libm1_9e_presenter.so \
                     downloads/M1.14-r4C-UNDERLINE-ONLY-AB/Roms/APPS/m1.14-r4c-freej2me-platform.jar \
                     downloads/M1.14-r4C-UNDERLINE-ONLY-AB/Roms/APPS/m1.14-r4c-underline-only.jar \
                     downloads/M1.14-r4C-UNDERLINE-ONLY-AB/SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Publish complete M1.14-r4C.1 BUILD-PASS package [skip ci]'
          git push origin HEAD:miyoo-m1.14-r4c-underline-only-ab
