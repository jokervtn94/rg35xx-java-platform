name: P2B Font HarfBuzz Complex Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-harfbuzz-complex-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BJdkComplexTableDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_harfbuzz_complex_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_jdk_harfbuzz_complex.py'

permissions:
  contents: read

jobs:
  p2b-harfbuzz-complex:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-hbc-files.txt
          if grep -Ev '^(docs/P2B-FONT-TEXT-AUDIT-v1\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-hbc-files.txt | grep -q .; then
            echo 'P2B_HB_COMPLEX_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_HB_COMPLEX_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          ROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -f "$ROOT/usr/lib/libfreetype.so.6.18.1"
          test -f "$ROOT/usr/lib/libharfbuzz.so.0.30302.0"
          echo 'P2B_HB_COMPLEX_TOOLCHAIN=PASS'

      - name: Materialize exact Miyoo MiSans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_HB_COMPLEX_FONT_IDENTITY=PASS'

      - name: Generate exact JDK8 complex-trigger table
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BJdkComplexTableDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes RG35XXP2BJdkComplexTableDiagnostic \
            out/font.ttf out/P2B-JDK8-COMPLEX-TRIGGERS.txt out/P2B-JDK8-COMPLEX-TABLE.tsv \
            | tee out/P2B-JDK8-COMPLEX-TABLE.log
          grep -F 'P2B_JDK_COMPLEX_TABLE_BOOT=PASS' out/P2B-JDK8-COMPLEX-TABLE.log
          grep -F 'P2B_JDK_COMPLEX_TABLE_RESULT=PASS' out/P2B-JDK8-COMPLEX-TABLE.log
          TRIGGERS=$(wc -l < out/P2B-JDK8-COMPLEX-TRIGGERS.txt | tr -d ' ')
          ROWS=$(( $(wc -l < out/P2B-JDK8-COMPLEX-TABLE.tsv) - 1 ))
          test "$TRIGGERS" -gt 0
          test "$ROWS" -eq $((TRIGGERS * 3))
          grep -F "P2B_JDK_COMPLEX_TRIGGER_UNITS=$TRIGGERS" out/P2B-JDK8-COMPLEX-TABLE.log
          grep -F "P2B_JDK_COMPLEX_TABLE_CASES=$ROWS" out/P2B-JDK8-COMPLEX-TABLE.log
          echo "P2B_JDK_COMPLEX_TRIGGER_ROWS=$TRIGGERS"
          echo "P2B_JDK_COMPLEX_REFERENCE_ROWS=$ROWS"

      - name: Build exact ARM HarfBuzz complex diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          "$CC" -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$ROOT/usr/include/freetype2" -I"$ROOT/usr/include/harfbuzz" \
            tests/p2b/diagnostic/p2b_harfbuzz_complex_arm.c \
            "$ROOT/usr/lib/libharfbuzz.so.0.30302.0" "$ROOT/usr/lib/libfreetype.so.6.18.1" -lm \
            -o out/p2b-harfbuzz-complex-arm
          file out/p2b-harfbuzz-complex-arm | tee out/P2B-HB-COMPLEX-FILE.txt
          readelf -d out/p2b-harfbuzz-complex-arm | grep -E 'NEEDED|SONAME' | tee out/P2B-HB-COMPLEX-DYNAMIC.txt || true
          echo 'P2B_HB_COMPLEX_ARM_BUILD=PASS'

      - name: Run exact ARM HarfBuzz exhaustive trigger set
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$ROOT" out/p2b-harfbuzz-complex-arm \
            out/font.ttf out/P2B-JDK8-COMPLEX-TRIGGERS.txt out/P2B-HARFBUZZ-COMPLEX-TABLE.tsv \
            | tee out/P2B-HARFBUZZ-COMPLEX.log
          grep -F 'P2B_HB_COMPLEX_BOOT=PASS' out/P2B-HARFBUZZ-COMPLEX.log
          grep -F 'P2B_HB_COMPLEX_RESULT=PASS' out/P2B-HARFBUZZ-COMPLEX.log
          TRIGGERS=$(wc -l < out/P2B-JDK8-COMPLEX-TRIGGERS.txt | tr -d ' ')
          ROWS=$(( $(wc -l < out/P2B-HARFBUZZ-COMPLEX-TABLE.tsv) - 1 ))
          test "$ROWS" -eq $((TRIGGERS * 3))
          grep -F "P2B_HB_COMPLEX_TRIGGER_UNITS=$TRIGGERS" out/P2B-HARFBUZZ-COMPLEX.log
          grep -F "P2B_HB_COMPLEX_CASES=$ROWS" out/P2B-HARFBUZZ-COMPLEX.log

      - name: Compare JDK8 and ARM HarfBuzz complex semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_jdk_harfbuzz_complex.py \
            out/P2B-JDK8-COMPLEX-TABLE.tsv out/P2B-HARFBUZZ-COMPLEX-TABLE.tsv \
            | tee out/P2B-HARFBUZZ-COMPLEX-DIFFERENTIAL.txt
          grep -F 'P2B_HB_COMPLEX_DIFF_PARSE=PASS' out/P2B-HARFBUZZ-COMPLEX-DIFFERENTIAL.txt
          grep -F 'P2B_HB_COMPLEX_DIFF_RESULT=PASS' out/P2B-HARFBUZZ-COMPLEX-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-HARFBUZZ-COMPLEX-DIFFERENTIAL.txt

      - name: Remove font and executable before evidence upload
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/font.ttf out/miyoomini-freej2me.zip out/p2b-harfbuzz-complex-arm
          if find out -type f | grep -Ei '\.(ttf|otf)$'; then echo 'P2B_FONT_BYTE_LEAK=FAIL'; exit 1; fi
          {
            echo 'P2B_FONT_BYTE_LEAK=NO'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-HARFBUZZ-COMPLEX-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-HARFBUZZ-COMPLEX-${{ github.sha }}
          path: |
            out/P2B-JDK8-COMPLEX-TABLE.log
            out/P2B-JDK8-COMPLEX-TRIGGERS.txt
            out/P2B-JDK8-COMPLEX-TABLE.tsv
            out/P2B-HARFBUZZ-COMPLEX.log
            out/P2B-HARFBUZZ-COMPLEX-TABLE.tsv
            out/P2B-HARFBUZZ-COMPLEX-DIFFERENTIAL.txt
            out/P2B-HB-COMPLEX-FILE.txt
            out/P2B-HB-COMPLEX-DYNAMIC.txt
            out/P2B-HARFBUZZ-COMPLEX-STATUS.txt
          if-no-files-found: error
