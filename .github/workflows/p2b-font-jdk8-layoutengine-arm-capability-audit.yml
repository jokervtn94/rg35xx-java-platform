name: P2B Font JDK8 LayoutEngine ARM Capability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-layoutengine-arm-capability-audit.yml'
      - 'docs/P2B-FONT-TEXT-EVIDENCE-SYNTHESIS-v1.md'

permissions:
  contents: read

jobs:
  p2b-jdk8-layoutengine-arm-capability:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8_LAYOUT_TREE: bc6641fecdfb59f3146bb1591e090761a24b4061
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-layoutengine-cap-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-layoutengine-cap-files.txt | grep -q .; then
            echo 'P2B_JDK8_LAYOUTENGINE_ARM_CAP_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_LAYOUTENGINE_ARM_CAP_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install exact pinned Miyoo ARMv5 uClibC toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ --version | tee out/P2B-JDK8-LAYOUTENGINE-ARM-CXX-VERSION.txt
          echo 'P2B_JDK8_LAYOUTENGINE_ARM_TOOLCHAIN=PASS'

      - name: Pin exact JDK8u504 LayoutEngine source and build recipe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)" = "$JDK8_LAYOUT_TREE"
          GMK=/tmp/jdk8u/jdk/make/lib/Awt2dLibraries.gmk
          grep -F -- '-DLE_STANDALONE -DHEADLESS' "$GMK"
          grep -F '$(JDK_TOPDIR)/src/share/native/sun/font/layout' "$GMK"
          grep -F 'LIBRARY := fontmanager' "$GMK"
          LAYOUT=/tmp/jdk8u/jdk/src/share/native/sun/font/layout
          {
            echo "P2B_JDK8U_TAG=$JDK8U_TAG"
            echo "P2B_JDK8U_COMMIT=$(git -C /tmp/jdk8u rev-parse HEAD)"
            echo "P2B_JDK8_LAYOUT_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/font/layout)"
            echo "P2B_JDK8_LAYOUT_CPP_COUNT=$(find "$LAYOUT" -maxdepth 1 -type f -name '*.cpp' | wc -l | tr -d ' ')"
            echo "P2B_JDK8_LAYOUT_HEADER_COUNT=$(find "$LAYOUT" -maxdepth 1 -type f \( -name '*.h' -o -name '*.hpp' \) | wc -l | tr -d ' ')"
            echo 'P2B_JDK8_LAYOUT_BUILD_RECIPE=PASS'
            echo 'P2B_JDK8_LAYOUT_COMPILE_DEFINES=LE_STANDALONE,HEADLESS'
          } | tee out/P2B-JDK8-LAYOUTENGINE-SOURCE-PROVENANCE.txt

      - name: Cross-compile exact bundled LayoutEngine core on ARMv5 uClibC
        shell: bash
        run: |
          set -euo pipefail
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          FONT=/tmp/jdk8u/jdk/src/share/native/sun/font
          LAYOUT="$FONT/layout"
          OBJ=out/jdk8-layoutengine-arm-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          compiled=0
          excluded=0
          while IFS= read -r src; do
            base=$(basename "$src")
            if test "$base" = SunLayoutEngine.cpp; then
              echo "P2B_JDK8_LAYOUT_EXCLUDE=$base JNI_WRAPPER=YES"
              excluded=$((excluded+1))
              continue
            fi
            obj="$OBJ/${base%.cpp}.o"
            echo "P2B_JDK8_LAYOUT_COMPILE=$base"
            "$CXX" -O2 -pipe -std=gnu++98 \
              -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -DLE_STANDALONE -DHEADLESS \
              -I"$FONT" -I"$LAYOUT" \
              -c "$src" -o "$obj"
            compiled=$((compiled+1))
          done < <(find "$LAYOUT" -maxdepth 1 -type f -name '*.cpp' -print | sort)
          test "$compiled" -gt 0
          test "$excluded" = 1
          "$AR" rcs out/libjdk8-layoutengine-core-arm.a "$OBJ"/*.o
          {
            echo "P2B_JDK8_LAYOUTENGINE_ARM_CPP_COMPILED=$compiled"
            echo "P2B_JDK8_LAYOUTENGINE_ARM_CPP_EXCLUDED_JNI=$excluded"
            echo 'P2B_JDK8_LAYOUTENGINE_ARM_COMPILE=PASS'
          } | tee out/P2B-JDK8-LAYOUTENGINE-ARM-COMPILE-STATUS.txt

      - name: Force-link all core objects to expose external dependencies
        shell: bash
        run: |
          set -euo pipefail
          CXX=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
          cat > out/layoutengine_link_probe.cpp <<'EOF'
          int main() { return 0; }
          EOF
          "$CXX" -O2 -pipe -std=gnu++98 \
            -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            out/layoutengine_link_probe.cpp \
            -Wl,--whole-archive out/libjdk8-layoutengine-core-arm.a -Wl,--no-whole-archive \
            -lm -o out/p2b-jdk8-layoutengine-core-arm-link-probe \
            2> out/P2B-JDK8-LAYOUTENGINE-ARM-LINK-STDERR.txt
          file out/p2b-jdk8-layoutengine-core-arm-link-probe | tee out/P2B-JDK8-LAYOUTENGINE-ARM-LINK-FILE.txt
          {
            echo 'P2B_JDK8_LAYOUTENGINE_ARM_FORCE_LINK=PASS'
            echo 'P2B_JDK8_LAYOUTENGINE_EXTERNAL_DEPENDENCY_CLASS=STANDARD_CXX_LIBC_LIBM_ONLY'
            echo 'P2B_JDK8_LAYOUTENGINE_JNI_WRAPPER=EXCLUDED_FROM_CORE_GATE'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-LAYOUTENGINE-ARM-CAPABILITY-STATUS.txt

      - name: Remove source archive objects and executables before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u out/jdk8-layoutengine-arm-obj
          rm -f out/libjdk8-layoutengine-core-arm.a \
            out/layoutengine_link_probe.cpp \
            out/p2b-jdk8-layoutengine-core-arm-link-probe
          if find out -type f | grep -Ei '\.(a|o|so|cpp)$'; then
            echo 'P2B_JDK8_LAYOUTENGINE_ARM_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_JDK8_LAYOUTENGINE_ARM_BYTE_LEAK=NO' | tee out/P2B-JDK8-LAYOUTENGINE-ARM-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-LAYOUTENGINE-ARM-CAP-${{ github.sha }}
          path: |
            out/P2B-JDK8-LAYOUTENGINE-ARM-CXX-VERSION.txt
            out/P2B-JDK8-LAYOUTENGINE-SOURCE-PROVENANCE.txt
            out/P2B-JDK8-LAYOUTENGINE-ARM-COMPILE-STATUS.txt
            out/P2B-JDK8-LAYOUTENGINE-ARM-LINK-STDERR.txt
            out/P2B-JDK8-LAYOUTENGINE-ARM-LINK-FILE.txt
            out/P2B-JDK8-LAYOUTENGINE-ARM-CAPABILITY-STATUS.txt
            out/P2B-JDK8-LAYOUTENGINE-ARM-CLEANUP.txt
          if-no-files-found: warn
