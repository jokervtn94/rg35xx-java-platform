name: Miyoo M1.12 Unicode Font E2E
on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.12-unicode-font-e2e]
jobs:
  m112:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve locked M1.8 input boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install dependencies and toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null && sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo; sudo docker cp "$cid:/opt/miyoo" /opt/miyoo; sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Fetch pinned FreeJ2ME and apply locked M1.11 baseline
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          git -C upstream checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git -C upstream rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_probe.py
          python3 miyoo-m1/m1_9/patch_headless_platformgraphics_fillrect.py
          python3 miyoo-m1/m1_9/patch_mobileplatform_resize_diagnostics.py
          python3 miyoo-m1/m1_10/patch_mobileplatform_headless_flush.py
          python3 miyoo-m1/m1_11/patch_headless_ascii_text.py
      - name: Build locked platform boundary and Unicode diagnostic MIDlet
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19SdlPresenter.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19CanvasLifecycleLauncher.java upstream/src/org/recompile/mobile/
          (cd upstream && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml)
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          $CC -shared -fPIC -Os -pipe -fno-strict-aliasing -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_9/m1_9e_presenter_jni.c -Wl,--as-needed -ldl -o libm1_9e_presenter.so
          mkdir -p midlet-classes
          JAVA8=/usr/lib/jvm/java-8-openjdk-amd64
          "$JAVA8/bin/javac" -source 1.5 -target 1.5 -bootclasspath "$JAVA8/jre/lib/rt.jar" -classpath upstream/build/freej2me_plus.jar -d midlet-classes miyoo-m1/m1_12/M112UnicodeFontMIDlet.java
          printf 'Manifest-Version: 1.0\nMIDlet-1: M1.12,,org.recompile.mobile.M112UnicodeFontMIDlet\nMIDlet-Name: M1.12\nMIDlet-Vendor: RG35XX\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' >/tmp/m112.mf
          jar cfm m1.12-unicode-font.jar /tmp/m112.mf -C midlet-classes .
          echo M1_12_BUILD_GATE=PASS
      - name: Package RG35XX device test with bounded screenshot evidence
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS; mkdir -p "$APP"
          cp upstream/build/freej2me_plus.jar "$APP/m1.12-freej2me-platform.jar"
          cp libm1_9e_presenter.so m1.12-unicode-font.jar "$APP/"
          cat > "$APP/M1.12-CAPTURE-SCREENSHOT.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.ppm
          META=/mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.txt
          FB=/dev/fb0
          : >"$META"
          echo M1_12_SCREENSHOT_METHOD=FB0_RGB565_PPM >>"$META"
          if [ ! -r "$FB" ]; then echo M1_12_SCREENSHOT_CAPTURE=FAIL_FB0_NOT_READABLE >>"$META"; exit 1; fi
          W=$(fbset -fb "$FB" 2>/dev/null | sed -n 's/.*geometry \([0-9][0-9]*\) \([0-9][0-9]*\).*/\1/p' | head -n1)
          H=$(fbset -fb "$FB" 2>/dev/null | sed -n 's/.*geometry \([0-9][0-9]*\) \([0-9][0-9]*\).*/\2/p' | head -n1)
          [ -n "$W" ] || W=640; [ -n "$H" ] || H=480
          TMP=/tmp/m112-fb.raw
          dd if="$FB" of="$TMP" bs=2 count=$((W*H)) 2>/dev/null || { echo M1_12_SCREENSHOT_CAPTURE=FAIL_READ >>"$META"; rm -f "$TMP"; exit 1; }
          python_bin=""
          for p in python3 python; do command -v "$p" >/dev/null 2>&1 && { python_bin=$p; break; }; done
          if [ -z "$python_bin" ]; then
            cp "$TMP" /mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.rgb565
            echo M1_12_SCREENSHOT_CAPTURE=RAW_RGB565_ONLY >>"$META"
            echo M1_12_SCREENSHOT_WIDTH=$W >>"$META"; echo M1_12_SCREENSHOT_HEIGHT=$H >>"$META"
            sha256sum /mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.rgb565 | awk '{print "M1_12_SCREENSHOT_SHA256=" $1}' >>"$META"
            rm -f "$TMP"; sync; exit 0
          fi
          "$python_bin" - "$TMP" "$OUT" "$W" "$H" <<'PY'
          import sys,struct
          src,out,w,h=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4])
          raw=open(src,'rb').read(w*h*2)
          if len(raw)!=w*h*2: raise SystemExit(2)
          f=open(out,'wb'); f.write(('P6\n%d %d\n255\n'%(w,h)).encode('ascii'))
          row=bytearray(w*3)
          for y in range(h):
              off=y*w*2
              for x in range(w):
                  v=raw[off+x*2] | (raw[off+x*2+1]<<8)
                  r=(v>>11)&31; g=(v>>5)&63; b=v&31
                  j=x*3; row[j]=(r<<3)|(r>>2); row[j+1]=(g<<2)|(g>>4); row[j+2]=(b<<3)|(b>>2)
              f.write(row)
          f.close()
          PY
          RC=$?; rm -f "$TMP"
          if [ "$RC" -ne 0 ]; then echo M1_12_SCREENSHOT_CAPTURE=FAIL_CONVERT >>"$META"; exit "$RC"; fi
          echo M1_12_SCREENSHOT_CAPTURE=PASS >>"$META"
          echo M1_12_SCREENSHOT_WIDTH=$W >>"$META"; echo M1_12_SCREENSHOT_HEIGHT=$H >>"$META"
          sha256sum "$OUT" | awk '{print "M1_12_SCREENSHOT_SHA256=" $1}' >>"$META"
          sync
          SH
          chmod +x "$APP/M1.12-CAPTURE-SCREENSHOT.sh"
          cat > "$APP/M1.12-UNICODE-FONT-E2E.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.12-UNICODE-FONT-E2E-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm
          GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip
          : >"$OUT"; echo 'RG35XX MIYOO M1.12 UNICODE FONT E2E' >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          echo VISUAL_INSTRUCTION='BLUE_BACKGROUND_ASCII_PLUS_VIETNAMESE_UNICODE' >>"$OUT"
          echo SCREENSHOT_INSTRUCTION='WHILE_BLUE_TEST_SCREEN_IS_VISIBLE_RUN_M1.12-CAPTURE-SCREENSHOT.sh_FROM_SECOND_TERMINAL_OR_AFTER_3_SECONDS_IF_LAUNCHER_SUPPORTS_BACKGROUND' >>"$OUT"
          LD_LIBRARY_PATH="$APP${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.12-freej2me-platform.jar" org.recompile.mobile.M19CanvasLifecycleLauncher "$APP/m1.12-unicode-font.jar" >>"$OUT" 2>&1
          RC=$?
          JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_EXIT_CODE=$RC >>"$OUT"; echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"
          [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ] && echo M1_12_PROTECTED_HASHES=PASS >>"$OUT" || echo M1_12_PROTECTED_HASHES=FAIL >>"$OUT"
          grep -q 'M1_12_DEVICE_ACCEPTANCE_MARKER=PASS' "$OUT" && [ "$RC" -eq 0 ] && echo M1_12_EXECUTION_RESULT=PASS >>"$OUT" || echo M1_12_EXECUTION_RESULT=FAIL >>"$OUT"
          if [ -f /mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.txt ]; then cat /mnt/mmc/RG35XX-MIYOO-M1.12-SCREENSHOT.txt >>"$OUT"; else echo M1_12_SCREENSHOT_CAPTURE=NOT_RUN >>"$OUT"; fi
          echo DEVICE_PASS=NO_DIAGNOSTIC_ONLY >>"$OUT"; echo FULL_PLATFORM_STABLE=NO >>"$OUT"; sync; exit "$RC"
          SH
          chmod +x "$APP/M1.12-UNICODE-FONT-E2E.sh"
          (cd out/garlicos && find Roms -type f -print0 | sort -z | xargs -0 sha256sum) >out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum "$APP"/*
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.12-unicode-font-e2e
          path: out/garlicos/
          if-no-files-found: error
