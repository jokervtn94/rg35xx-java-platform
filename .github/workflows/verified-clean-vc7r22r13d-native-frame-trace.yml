name: Verified Clean VC7R22-R1.3D Native Frame Trace Core

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r22r13d-native-frame-trace.yml'
      - 'scripts/vc7r22r13d_apply_native_frame_trace.py'
      - 'scripts/vc7r22r1_apply_worker_ring.py'
  workflow_dispatch:

jobs:
  native-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      VC7R_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install pinned build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Assemble accepted video foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" VC6_ASSEMBLY="$RUNNER_TEMP/r13d" sh scripts/vc6_png_iccp_assemble.sh
          echo "R1=$RUNNER_TEMP/r13d" >> "$GITHUB_ENV"
          python3 scripts/vc7r2_apply_proven_dynamic_view.py "$RUNNER_TEMP/r13d/src/org/recompile/freej2me/Libretro.java"
          python3 scripts/vc7_apply_golden_font.py "$RUNNER_TEMP/r13d/src/org/recompile/mobile/PlatformGraphics.java"

      - name: Reconstruct verified font resource
        run: |
          set -euo pipefail
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/r13d-font" "$R1/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/r13d-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/r13d-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/r13d-font/rg35xx-font.bin" | awk '{print $1}')" = "$VC7R_FONT_SHA256"
          cp "$RUNNER_TEMP/r13d-font/rg35xx-font.bin" "$R1/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Materialize pinned media implementation
        run: |
          set -euo pipefail
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"
          mkdir -p "$R1/src/org/recompile/mobile" "$R1/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do cp "history/src/org/recompile/mobile/$f" "$R1/src/org/recompile/mobile/$f"; done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$R1/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R1/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R1/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Apply media facade and R1 worker-ring audio
        run: |
          set -euo pipefail
          python3 - "$R1/src/org/recompile/mobile/PlatformPlayer.java" "$R1/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do patch -d "$R1" -p1 --batch --forward --fuzz=0 < "history/patches/$p"; done
          python3 scripts/vc7r3_apply_native_audio.py "$R1/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$R1/src/org/recompile/freej2me/Libretro.java" "$R1/src/org/recompile/mobile/PlatformPlayer.java" "$R1/src/javax/microedition/media/Manager.java"
          python3 scripts/vc7r22r1_apply_worker_ring.py "$R1/src/libretro/freej2me_libretro.c"

      - name: Apply R1.3D native sparse video trace
        run: |
          set -euo pipefail
          V="$R1/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          python3 scripts/vc7r22r13d_apply_native_frame_trace.py "$V"
          for t in 'R13D NATIVE READ_HEADER_DONE' 'R13D NATIVE READ_PAYLOAD_BEGIN' 'R13D NATIVE READ_PAYLOAD_DONE' 'R13D NATIVE PUBLISH_DONE' 'R13D NATIVE PRESENT_BEGIN' 'R13D NATIVE PRESENT_DONE'; do grep -Fq "$t" "$V"; done

      - name: Wire media modules
        run: |
          set -euo pipefail
          cat >> "$R1/src/libretro/Makefile.common" <<'EOF'

          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Build Java compatibility gate
        run: |
          set -euo pipefail
          (cd "$R1" && ant)

      - name: Build ARMv5TE diagnostic core
        run: |
          set -euo pipefail
          cd "$R1/src/libretro"
          make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'

      - name: Fail-closed architecture and trace gates
        run: |
          set -euo pipefail
          C="$R1/src/libretro/freej2me_libretro.c"
          V="$R1/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          CORE="$R1/src/libretro/freej2me_plus_libretro.so"
          file "$CORE"
          readelf -h "$CORE" | tee /tmp/r13d-elf.txt
          grep -q 'Class:.*ELF32' /tmp/r13d-elf.txt
          grep -q 'Machine:.*ARM' /tmp/r13d-elf.txt
          grep -q 'Version5 EABI' /tmp/r13d-elf.txt
          grep -Fq '#define RG35XX_AUDIO_RING_FRAMES 16384u' "$C"
          grep -Fq '#define RG35XX_AUDIO_WORKER_CHUNK 1470u' "$C"
          grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 3072u' "$C"
          grep -Fq 'RETRO_ENVIRONMENT_SET_AUDIO_CALLBACK' "$C"
          ! grep -Fq '#define RG35XX_AUDIO_FRAMES_PER_RUN 735u' "$C"
          strings -a "$CORE" | grep -Fq 'RG35XX-AUDIO: worker START ring=16384 target=3072 chunk=1470'
          for t in 'R13D NATIVE READ_HEADER_DONE' 'R13D NATIVE READ_PAYLOAD_BEGIN' 'R13D NATIVE READ_PAYLOAD_DONE' 'R13D NATIVE PUBLISH_DONE' 'R13D NATIVE PRESENT_BEGIN' 'R13D NATIVE PRESENT_DONE'; do strings -a "$CORE" | grep -Fq "$t"; done
          echo 'VC7R22R13D_ARCHITECTURE_TRACE_GATE=PASS'

      - name: Package diagnostic core only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r13d-out"
          mkdir -p "$OUT"
          cp "$R1/src/libretro/freej2me_plus_libretro.so" "$OUT/freej2me_plus_libretro-vc7r22r13d.so"
          H=$(sha256sum "$OUT/freej2me_plus_libretro-vc7r22r13d.so" | awk '{print $1}')
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=BUILD-PASS-DEVICE-TRACE-PENDING
          CHECKPOINT=VC7R22-R1.3D-NATIVE-FRAME-PIPE-TRACE
          CORE_SHA256=$H
          CORE_ROLE=DIAGNOSTIC_ONLY_NOT_STABLE_BASELINE
          AUDIO_ARCHITECTURE=R1_ASYNC_CALLBACK_WORKER_RING_UNCHANGED
          RING_FRAMES=16384
          PRIME_FRAMES=3072
          WORKER_CHUNK=1470
          TRACE_POLICY=FIRST_8_THEN_EVERY_120
          TRACE_STAGES=READ_HEADER_DONE,READ_PAYLOAD_BEGIN,READ_PAYLOAD_DONE,PUBLISH_DONE,PRESENT_BEGIN,PRESENT_DONE
          EXPECTED_RUNTIME=R1.3C_SHA256_9466c65ef8b112a4955e4a52d09629c47d8718ac790614005fc4668053942a63
          DEVICE_TRACE=PENDING
          EOF
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r22r13d-native-frame-trace-core
          path: ${{ runner.temp }}/r13d-out
          retention-days: 90
