name: P2B Font JDK8 Vendored FreeType ARM CharWidth Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-jdk8-vendored-charwidth-arm-audit.yml'
      - 'tests/p2b/diagnostic/RG35XXP2BCharWidthExhaustiveDiagnostic.java'
      - 'tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c'
      - 'tests/p2b/diagnostic/compare_p2b_charwidth_tables.py'
      - 'docs/P2B-FONT-TEXT-EVIDENCE-SYNTHESIS-v1.md'

permissions:
  contents: read

jobs:
  p2b-jdk8-vendored-charwidth-arm:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      EXPECTED_FONT_SHA256: 1a5f4112daaa9473747c6834041646cc9b2c338cb40ab5dbb2f0161f8968ca10
      EXPECTED_FONT_SIZE: '8092724'
      JDK8U_TAG: jdk8u504-b01
      JDK8U_COMMIT: 4efe36434f44bafb854e602ccbbe1b5696fce1a2
      JDK8U_FT_INCLUDE_TREE: 43f2e4398cfd927acac29ce3515e23a195349eb7
      JDK8U_FT_SRC_TREE: 8690dd39ef9f4da5bae000d757fe6dfa2d2102a6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-jdk8-vendored-cw-files.txt
          if grep -Ev '^(docs/P2B-[^/]+\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-jdk8-vendored-cw-files.txt | grep -q .; then
            echo 'P2B_JDK8_VENDORED_CHARWIDTH_AUDIT_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_JDK8_VENDORED_CHARWIDTH_AUDIT_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Install qemu and exact pinned Miyoo toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          echo 'P2B_JDK8_VENDORED_CHARWIDTH_TOOLCHAIN=PASS'

      - name: Pin exact OpenJDK8u504 bundled FreeType source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u
          git clone --filter=blob:none --no-checkout https://github.com/adoptium/jdk8u.git /tmp/jdk8u
          git -C /tmp/jdk8u fetch --depth 1 origin tag "$JDK8U_TAG"
          git -C /tmp/jdk8u checkout --detach "$JDK8U_TAG"
          test "$(git -C /tmp/jdk8u rev-parse HEAD)" = "$JDK8U_COMMIT"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)" = "$JDK8U_FT_INCLUDE_TREE"
          test "$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)" = "$JDK8U_FT_SRC_TREE"
          grep -F 'Freetype v2.14.3' /tmp/jdk8u/THIRD_PARTY_README
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          {
            echo "P2B_JDK8U_TAG=$JDK8U_TAG"
            echo "P2B_JDK8U_COMMIT=$(git -C /tmp/jdk8u rev-parse HEAD)"
            echo "P2B_JDK8U_FT_INCLUDE_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/include)"
            echo "P2B_JDK8U_FT_SRC_TREE=$(git -C /tmp/jdk8u rev-parse HEAD:jdk/src/share/native/sun/awt/libfreetype/src)"
            echo "P2B_JDK8U_FT_C_FILES=$(find "$FTROOT/src" -type f -name '*.c' | wc -l | tr -d ' ')"
            echo 'P2B_JDK8U_FT_DECLARED_VERSION=2.14.3'
            echo 'P2B_JDK8U_FT_SOURCE_PROVENANCE=PASS'
          } | tee out/P2B-JDK8U-VENDORED-CHARWIDTH-PROVENANCE.txt

      - name: Verify exact OpenJDK8 CMap control rule against diagnostic rule
        shell: bash
        run: |
          set -euo pipefail
          CMAP=/tmp/jdk8u/jdk/src/share/classes/sun/font/CMap.java
          grep -F 'case 0x0009:' "$CMAP"
          grep -F 'case 0x000a:' "$CMAP"
          grep -F 'case 0x000d:' "$CMAP"
          grep -F '(charCode <= 0x200f)' "$CMAP"
          grep -F '(charCode >= 0x2028 && charCode <= 0x202e)' "$CMAP"
          grep -F '(charCode >= 0x206a && charCode <= 0x206f)' "$CMAP"
          grep -F 'noSurrogates && charCode >= 0xFFFF' "$CMAP"
          grep -F 'cp==0x09UL || cp==0x0aUL || cp==0x0dUL' tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c
          grep -F 'cp <= 0x200fUL' tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c
          grep -F 'cp >= 0x2028UL && cp <= 0x202eUL' tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c
          grep -F 'cp >= 0x206aUL && cp <= 0x206fUL' tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c
          grep -F 'if(cp==0xffffUL)' tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c
          echo 'P2B_JDK8_CMAP_CONTROL_RULE_SOURCE_MATCH=PASS' | tee out/P2B-JDK8-CMAP-CONTROL-RULE-STATUS.txt

      - name: Materialize exact Miyoo MiSans for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes
          URL='https://github.com/aweigit/freej2me-miyoomini/releases/download/2.0/miyoomini-freej2me.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o out/miyoomini-freej2me.zip
          ENTRY=$(unzip -Z1 out/miyoomini-freej2me.zip | grep -Ei '(^|/)font\.ttf$')
          test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
          unzip -p out/miyoomini-freej2me.zip "$ENTRY" > out/font.ttf
          test "$(sha256sum out/font.ttf | awk '{print $1}')" = "$EXPECTED_FONT_SHA256"
          test "$(wc -c < out/font.ttf | tr -d ' ')" = "$EXPECTED_FONT_SIZE"
          echo 'P2B_JDK8_VENDORED_CHARWIDTH_FONT_IDENTITY=PASS'

      - name: Generate JDK8 exhaustive charWidth and canDisplay reference
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee out/P2B-JDK8-VERSION.txt
          javac -encoding UTF-8 -source 1.6 -target 1.6 -d out/classes \
            tests/p2b/diagnostic/RG35XXP2BCharWidthExhaustiveDiagnostic.java
          java -Djava.awt.headless=true -cp out/classes \
            RG35XXP2BCharWidthExhaustiveDiagnostic out/font.ttf out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.bin \
            | tee out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.log
          grep -F 'P2B_JDK_CHARWIDTH_TABLE_CASES=196608' out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.log
          grep -F 'P2B_JDK_CHARWIDTH_RESULT=PASS' out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.log

      - name: Cross-build exact JDK8u504 vendored FreeType for Miyoo ARMv5 uClibC
        shell: bash
        run: |
          set -euo pipefail
          FTROOT=/tmp/jdk8u/jdk/src/share/native/sun/awt/libfreetype
          CC=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          AR=/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-ar
          OBJ=out/jdk8u-ft-charwidth-arm-obj
          rm -rf "$OBJ" && mkdir -p "$OBJ"
          count=0
          while IFS= read -r src; do
            rel=${src#"$FTROOT/src/"}
            obj="$OBJ/${rel//\//_}.o"
            "$CC" -O3 -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
              -fPIC -DFT2_BUILD_LIBRARY -I"$FTROOT/include" -c "$src" -o "$obj"
            count=$((count+1))
          done < <(find "$FTROOT/src" -type f -name '*.c' -print | sort)
          test "$count" = 106
          "$AR" rcs out/libfreetype-jdk8u504-charwidth-arm.a "$OBJ"/*.o
          "$CC" -O3 -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft \
            -I"$FTROOT/include" \
            tests/p2b/diagnostic/p2b_freetype_jdk8_charwidth_arm.c \
            out/libfreetype-jdk8u504-charwidth-arm.a -lm \
            -o out/p2b-freetype-jdk8-vendored-charwidth-arm
          file out/p2b-freetype-jdk8-vendored-charwidth-arm | tee out/P2B-JDK8-VENDORED-CHARWIDTH-ARM-FILE.txt
          echo 'P2B_JDK8_VENDORED_CHARWIDTH_ARM_BUILD=PASS'

      - name: Generate ARM exhaustive source-matched charWidth and canDisplay table
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          qemu-arm -L "$SYSROOT" \
            out/p2b-freetype-jdk8-vendored-charwidth-arm \
            out/font.ttf out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.bin \
            | tee out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_INTERPRETER=35' out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_TABLE_CASES=196608' out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.log
          grep -F 'P2B_FT_JDK8_CHARWIDTH_RESULT=PASS' out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.log

      - name: Compare all 196608 BMP code-unit cases
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/p2b/diagnostic/compare_p2b_charwidth_tables.py \
            out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.bin \
            out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.bin \
            | tee out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_DIFF_PARSE=PASS' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_CASES=196608' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_CHARWIDTH_DIFF_RESULT=PASS' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
          grep -F 'P2B_RUNTIME_PATCH=FORBIDDEN' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
          width_mismatch=$(sed -n 's/^P2B_CHARWIDTH_WIDTH_MISMATCH_COUNT=//p' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt)
          display_mismatch=$(sed -n 's/^P2B_CHARWIDTH_DISPLAY_MISMATCH_COUNT=//p' out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt)
          if test "$width_mismatch" = 0 && test "$display_mismatch" = 0; then
            cls=EXACT_ALL_BMP_CODE_UNITS
          else
            cls=RESIDUAL_REQUIRES_SOURCE_CLASSIFICATION
          fi
          {
            echo "P2B_JDK8_VENDORED_CHARWIDTH_WIDTH_MISMATCH_COUNT=$width_mismatch"
            echo "P2B_JDK8_VENDORED_CHARWIDTH_DISPLAY_MISMATCH_COUNT=$display_mismatch"
            echo "P2B_JDK8_VENDORED_CHARWIDTH_CLASSIFICATION=$cls"
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-JDK8-VENDORED-CHARWIDTH-STATUS.txt

      - name: Remove font source binaries tables and objects before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jdk8u out/classes out/jdk8u-ft-charwidth-arm-obj
          rm -f out/font.ttf out/miyoomini-freej2me.zip \
            out/libfreetype-jdk8u504-charwidth-arm.a \
            out/p2b-freetype-jdk8-vendored-charwidth-arm \
            out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.bin \
            out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.bin
          if find out -type f | grep -Ei '\.(ttf|otf|a|so|bin)$'; then
            echo 'P2B_JDK8_VENDORED_CHARWIDTH_BYTE_LEAK=FAIL'; exit 1
          fi
          echo 'P2B_JDK8_VENDORED_CHARWIDTH_BYTE_LEAK=NO' | tee out/P2B-JDK8-VENDORED-CHARWIDTH-CLEANUP.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RG35XX-P2B-JDK8-VENDORED-CHARWIDTH-${{ github.sha }}
          path: |
            out/P2B-JDK8U-VENDORED-CHARWIDTH-PROVENANCE.txt
            out/P2B-JDK8-CMAP-CONTROL-RULE-STATUS.txt
            out/P2B-JDK8-VERSION.txt
            out/P2B-JDK8-VENDORED-CHARWIDTH-JDK.log
            out/P2B-JDK8-VENDORED-CHARWIDTH-ARM-FILE.txt
            out/P2B-JDK8-VENDORED-CHARWIDTH-ARM.log
            out/P2B-JDK8-VENDORED-CHARWIDTH-DIFFERENTIAL.txt
            out/P2B-JDK8-VENDORED-CHARWIDTH-STATUS.txt
            out/P2B-JDK8-VENDORED-CHARWIDTH-CLEANUP.txt
          if-no-files-found: warn
