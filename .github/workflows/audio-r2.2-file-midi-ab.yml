name: RG35XX Audio R2.2 File MIDI A-B

on:
  push:
    branches: [ rg35xx-from-zero-rebuild-v1 ]
    paths:
      - '.github/workflows/audio-r2.2-file-midi-ab.yml'
      - 'scripts/vc7r22r22_apply_filebacked_midi.py'
      - 'scripts/vc7r22r21_apply_prime2048_ab.py'
      - 'installer/INSTALL-AUDIO-R2.2-FILE-MIDI-AB.ps1'
      - 'installer/INSTALL-AUDIO-R2.2-FILE-MIDI-AB.cmd'
      - 'tasklog/R2.2-MEDIA-FILE-TRANSPORT-AB-PREFLIGHT.md'
  workflow_dispatch:

jobs:
  audio-r22-file-midi-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      HISTORY_PIN: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      R2_CORE_SHA256: a8e59eca633dfcaa3fc0e8c027fcffaa35f53d1ff5d127b7062edfd962fe7c57
      R21_CORE_SHA256: 3a843fe06c73958dc383e1689806c440e17b86605af9718d99bbf0763d570a7d
      R2_RUNTIME_SHA256: b71a61ec4a1be0237b0fbdc74834ae1dbe32575272241f53c9de791b2a56f6d2
      LATIN_SHA256: ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280
      CJK_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      RECON_FONT_SHA256: 20c2e59d063282d4b6a0d612dea3cba2c0b5bd7fafe85a05729951bd38902db9

    steps:
      - name: Checkout platform policy
        uses: actions/checkout@v4

      - name: Read hard rules and R2.2 preflight
        run: |
          set -euo pipefail
          test -f project-rules/RG35XX_PROJECT_RULES.json
          test -f tasklog/R2.2-MEDIA-FILE-TRANSPORT-AB-PREFLIGHT.md
          grep -Fq 'MINIMAL_PROPOSED_CHANGE' tasklog/R2.2-MEDIA-FILE-TRANSPORT-AB-PREFLIGHT.md
          grep -Fq 'DEVICE-PASS: NO' tasklog/R2.2-MEDIA-FILE-TRANSPORT-AB-PREFLIGHT.md

      - name: Checkout pristine pinned FreeJ2ME
        uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Checkout pinned historical media source
        uses: actions/checkout@v4
        with:
          ref: d79180df9ae8621f2ddcf00f4f0648e4a43dc374
          path: history

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant python3 python3-pil python3-fonttools fonts-dejavu-core fonts-noto-cjk patch file binutils unzip
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}

      - name: Prove source identities
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$FREEJ2ME_PIN"
          test -z "$(git -C upstream status --porcelain)"
          test "$(git -C history rev-parse HEAD)" = "$HISTORY_PIN"

      - name: Assemble exact R2 source base
        run: |
          set -euo pipefail
          FZ_UPSTREAM="$GITHUB_WORKSPACE/upstream" FZ_ASSEMBLY="$RUNNER_TEMP/audio-r22" sh scripts/from_zero_assemble_v1.sh
          echo "R22=$RUNNER_TEMP/audio-r22" >> "$GITHUB_ENV"
          python3 scripts/from_zero_apply_nomask_ab.py "$RUNNER_TEMP/audio-r22/src/org/recompile/mobile/PlatformGraphics.java"
          python3 scripts/vc7_apply_golden_font.py "$RUNNER_TEMP/audio-r22/src/org/recompile/mobile/PlatformGraphics.java"
          LATIN='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          CJK="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n1)"
          test "$(sha256sum "$LATIN" | awk '{print $1}')" = "$LATIN_SHA256"
          test "$(sha256sum "$CJK" | awk '{print $1}')" = "$CJK_SHA256"
          mkdir -p "$RUNNER_TEMP/r22-font" "$RUNNER_TEMP/audio-r22/resources/org/recompile/mobile"
          python3 scripts/vc7r_reconstruct_font.py --font "$LATIN" --font "$CJK#0" --out "$RUNNER_TEMP/r22-font/rg35xx-font.bin" --manifest "$RUNNER_TEMP/r22-font/manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/r22-font/rg35xx-font.bin" | awk '{print $1}')" = "$RECON_FONT_SHA256"
          cp "$RUNNER_TEMP/r22-font/rg35xx-font.bin" "$RUNNER_TEMP/audio-r22/resources/org/recompile/mobile/rg35xx-font.bin"

      - name: Materialize R2 historical media source
        run: |
          set -euo pipefail
          mkdir -p "$R22/src/org/recompile/mobile" "$R22/src/libretro/rg35xx/vendor/TinySoundFont"
          for f in RG35XXAudioBootstrap.java RG35XXAudioProtocol.java RG35XXAudioTransport.java RG35XXMediaProfile.java RG35XXMediaRegistry.java RG35XXNativePlayer.java RG35XXPlatformProfile.java RG35XXToneSequenceEncoder.java RG35XXWavDecoder.java; do cp "history/src/org/recompile/mobile/$f" "$R22/src/org/recompile/mobile/$f"; done
          for f in rg35xx_audio_protocol.h rg35xx_media_cache.h rg35xx_media_cache.c rg35xx_media_events.h rg35xx_media_event_queue.h rg35xx_media_event_queue.c rg35xx_audio_dispatch.h rg35xx_audio_dispatch.c rg35xx_audio_pipe.h rg35xx_audio_pipe.c rg35xx_mixer.h rg35xx_mixer.c rg35xx_midi_backend.h rg35xx_midi_backend.c rg35xx_tsf_worker.h rg35xx_tsf_worker.c rg35xx_tsf_impl.c rg35xx_soundfont_source.h rg35xx_soundfont_source.c rg35xx_media_runtime.h rg35xx_media_runtime.c; do cp "history/native/$f" "$R22/src/libretro/rg35xx/$f"; done
          sh history/native/vendor_tinysoundfont.sh
          cp history/native/vendor/TinySoundFont/tml.h "$R22/src/libretro/rg35xx/vendor/TinySoundFont/tml.h"
          cp history/native/vendor/TinySoundFont/tsf.h "$R22/src/libretro/rg35xx/vendor/TinySoundFont/tsf.h"

      - name: Apply R2 direct media and worker-ring
        run: |
          set -euo pipefail
          python3 - "$R22/src/org/recompile/mobile/PlatformPlayer.java" "$R22/src/javax/microedition/media/Manager.java" <<'PY'
          import pathlib,sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          for p in 0003-manager-rg35xx-media-profile.patch 0018-manager-platformplayer-rg35xx-direct-media.patch 0019-platformplayer-tonecontrol-rg35xx.patch; do patch -d "$R22" -p1 --batch --forward --fuzz=0 < "history/patches/$p"; done
          python3 scripts/vc7r3_apply_native_audio.py "$R22/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r3_apply_java_media_events.py "$R22/src/org/recompile/freej2me/Libretro.java" "$R22/src/org/recompile/mobile/PlatformPlayer.java" "$R22/src/javax/microedition/media/Manager.java"
          python3 scripts/vc7r22r1_apply_worker_ring.py "$R22/src/libretro/freej2me_libretro.c"
          python3 scripts/vc7r22r2_apply_golden_tsf.py "$R22/src/libretro/rg35xx/rg35xx_tsf_worker.c" "$R22/src/libretro/freej2me_libretro.c"
          cat >> "$R22/src/libretro/Makefile.common" <<'EOF'
          SOURCES_C += rg35xx/rg35xx_media_cache.c
          SOURCES_C += rg35xx/rg35xx_media_event_queue.c
          SOURCES_C += rg35xx/rg35xx_audio_dispatch.c
          SOURCES_C += rg35xx/rg35xx_audio_pipe.c
          SOURCES_C += rg35xx/rg35xx_mixer.c
          SOURCES_C += rg35xx/rg35xx_midi_backend.c
          SOURCES_C += rg35xx/rg35xx_tsf_worker.c
          SOURCES_C += rg35xx/rg35xx_tsf_impl.c
          SOURCES_C += rg35xx/rg35xx_soundfont_source.c
          SOURCES_C += rg35xx/rg35xx_media_runtime.c
          INCLUDES += -Irg35xx -Irg35xx/vendor/TinySoundFont
          CFLAGS += -DRG35XX_SOUNDFONT_PATH='"/mnt/mmc/BIOS/freej2me.sf2"'
          EOF

      - name: Prove exact R2 control core
        run: |
          set -euo pipefail
          cd "$R22/src/libretro"; make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          got=$(sha256sum freej2me_plus_libretro.so|awk '{print $1}'); echo "R2_CONTROL_CORE=$got"; test "$got" = "$R2_CORE_SHA256"

      - name: Apply only R2.2 file-backed MIDI transport
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r22_apply_filebacked_midi.py \
            "$R22/src/org/recompile/mobile/RG35XXNativePlayer.java" \
            "$R22/src/org/recompile/mobile/RG35XXAudioTransport.java" \
            "$R22/src/org/recompile/mobile/RG35XXAudioProtocol.java" \
            "$R22/src/libretro/rg35xx/rg35xx_audio_protocol.h" \
            "$R22/src/libretro/rg35xx/rg35xx_audio_dispatch.c"

      - name: R2.2 source scope gate
        run: |
          set -euo pipefail
          grep -Fq 'OP_REGISTER_MIDI_FILE = 11' "$R22/src/org/recompile/mobile/RG35XXAudioProtocol.java"
          grep -Fq 'registerMidiFile' "$R22/src/org/recompile/mobile/RG35XXAudioTransport.java"
          grep -Fq '/mnt/mmc/CFW/java/cache/freej2me-media' "$R22/src/org/recompile/mobile/RG35XXNativePlayer.java"
          grep -Fq 'RG35XX_AUDIO_REGISTER_MIDI_FILE = 11' "$R22/src/libretro/rg35xx/rg35xx_audio_protocol.h"
          grep -Fq 'rg35xx_audio_register_midi_file' "$R22/src/libretro/rg35xx/rg35xx_audio_dispatch.c"
          grep -Fq '#define RG35XX_AUDIO_RING_FRAMES 16384u' "$R22/src/libretro/freej2me_libretro.c"
          grep -Fq '#define RG35XX_AUDIO_PRIME_FRAMES 3072u' "$R22/src/libretro/freej2me_libretro.c"
          grep -Fq '#define RG35XX_AUDIO_WORKER_CHUNK 1470u' "$R22/src/libretro/freej2me_libretro.c"
          grep -Fq '#define RG35XX_TSF_RATE 14700u' "$R22/src/libretro/rg35xx/rg35xx_tsf_worker.c"
          ! grep -Rq 'RG35XX-MediaWarmup' "$R22/src"
          echo R22_SOURCE_GATE=PASS

      - name: Build R2.2 Java runtime
        run: |
          set -euo pipefail
          cd "$R22"; ant
          test -f build/freej2me_plus-lr.jar
          echo "R22_RUNTIME_SHA256=$(sha256sum build/freej2me_plus-lr.jar|awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build R2.2 prime3072 core
        run: |
          set -euo pipefail
          cd "$R22/src/libretro"; make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          cp freej2me_plus_libretro.so "$RUNNER_TEMP/r22-prime3072.so"
          echo "R22_CORE3072_SHA256=$(sha256sum freej2me_plus_libretro.so|awk '{print $1}')" >> "$GITHUB_ENV"
          strings -a freej2me_plus_libretro.so | grep -Fq 'target=3072 chunk=1470'
          strings -a freej2me_plus_libretro.so | grep -Fq 'RG35XX-AUDIO-R2.2: native MIDI file registered bytes='

      - name: Build matched R2.2 prime2048 core
        run: |
          set -euo pipefail
          python3 scripts/vc7r22r21_apply_prime2048_ab.py "$R22/src/libretro/freej2me_libretro.c"
          cd "$R22/src/libretro"; make clean
          make platform=unix CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft' LDFLAGS='-lm -lpthread'
          cp freej2me_plus_libretro.so "$RUNNER_TEMP/r22-prime2048.so"
          echo "R22_CORE2048_SHA256=$(sha256sum freej2me_plus_libretro.so|awk '{print $1}')" >> "$GITHUB_ENV"
          strings -a freej2me_plus_libretro.so | grep -Fq 'target=2048 chunk=1470'
          strings -a freej2me_plus_libretro.so | grep -Fq 'RG35XX-AUDIO-R2.2: native MIDI file registered bytes='

      - name: PowerShell installer syntax gate
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/installer/INSTALL-AUDIO-R2.2-FILE-MIDI-AB.ps1",[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_.Message};exit 1}

      - name: Package R2.2 adaptive A-B installer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audio-r2.2-file-midi-ab"; mkdir -p "$OUT/payload" "$OUT/installer" "$OUT/evidence"
          cp "$R22/build/freej2me_plus-lr.jar" "$OUT/payload/freej2me-lr.jar"
          cp "$RUNNER_TEMP/r22-prime3072.so" "$OUT/payload/freej2me_plus_libretro-prime3072.so"
          cp "$RUNNER_TEMP/r22-prime2048.so" "$OUT/payload/freej2me_plus_libretro-prime2048.so"
          (cd "$OUT/payload" && sha256sum freej2me-lr.jar freej2me_plus_libretro-prime3072.so freej2me_plus_libretro-prime2048.so > PAYLOAD-SHA256.txt)
          cp installer/INSTALL-AUDIO-R2.2-FILE-MIDI-AB.ps1 installer/INSTALL-AUDIO-R2.2-FILE-MIDI-AB.cmd "$OUT/installer/"
          cp tasklog/R2.2-MEDIA-FILE-TRANSPORT-AB-PREFLIGHT.md "$OUT/evidence/"
          cat > "$OUT/STATUS.txt" <<EOF
          STATUS=BUILD-PASS_DEVICE-TEST-PENDING
          CHECKPOINT=R2.2-MEDIA-FILE-TRANSPORT-AB
          PRIMARY_DELTA=MIDI_BLOB_PIPE_TO_FILE_PATH_COMMAND
          RUNTIME_SHA256=$R22_RUNTIME_SHA256
          CORE_PRIME3072_SHA256=$R22_CORE3072_SHA256
          CORE_PRIME2048_SHA256=$R22_CORE2048_SHA256
          BASELINE_RUNTIME_SHA256=$R2_RUNTIME_SHA256
          BASELINE_CORE_3072_SHA256=$R2_CORE_SHA256
          BASELINE_CORE_2048_SHA256=$R21_CORE_SHA256
          RING=16384
          WORKER_CHUNK=1470
          TSF=14700_TO_44100_MONO_X3
          TONE=UNCHANGED_INLINE
          PCM=UNCHANGED_INLINE
          VIDEO=UNCHANGED
          DEVICE_PASS=NO
          STABLE=NO
          EOF
          sed -i 's/^          //' "$OUT/STATUS.txt"
          (cd "$OUT" && find . -type f ! -name PACKAGE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT/PACKAGE-SHA256SUMS.txt"
          (cd "$OUT" && sha256sum -c PACKAGE-SHA256SUMS.txt)
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-audio-r2.2-file-midi-ab
          path: ${{ env.OUT }}
          include-hidden-files: true
          retention-days: 30
