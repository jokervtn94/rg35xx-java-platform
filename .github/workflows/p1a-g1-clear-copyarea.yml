name: P1A G1 clearRect copyArea

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-core-graphics-coverage
    paths:
      - '.github/workflows/p1a-g1-clear-copyarea.yml'
      - 'scripts/stage-p1a-g1-clear-copyarea.py'
      - 'scripts/build-p1a-g1-clear-copyarea.sh'
      - 'scripts/build-p1a-g1-device-package.sh'
      - 'tests/p1a/RG35XXG1ClearCopyDifferentialGate.java'
      - 'tests/p1a/RG35XXP1AG1Vectors.java'
      - 'tests/p1a/RG35XXP1AG1CanonicalVectorGenerator.java'
      - 'tests/p1a/RG35XXP1AG1DeviceMIDlet.java'
      - 'docs/P1A-G1-CLEAR-COPYAREA-SCOPE.md'

permissions:
  contents: read

jobs:
  p1a-g1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout P1A branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 Raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter source
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build protected ARMv5 soft-float native input/video
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Reconstruct accepted A6 graphics parent
        run: bash ./scripts/build-a6-corpus3-cliptranslate-fix.sh

      - name: Reconstruct A7 Java media compatibility parent
        run: bash ./scripts/build-a7-audio-java-a1p1.sh

      - name: Reconstruct exact protected SDL1_mixer native
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'bash ./scripts/build-a7-audio-native.sh'

      - name: Build P1A G1 candidate and run differential gates
        run: bash ./scripts/build-p1a-g1-clear-copyarea.sh

      - name: Verify scope lock
        run: |
          set -euo pipefail
          ID=out/p1a-g1-clear-copyarea/P1A-G1-IDENTITY.txt
          grep -q '^PARENT_SEMANTIC_SHA256=7cd3a4a29d4238e0d2464a213db48ba555bdf3c590aa77fe60c68b480bdc4adf$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class,org/recompile/rg35xx/RG35XXCore2D.class$' "$ID"
          grep -q '^CHANGED_METHODS=PlatformGraphics.clearRect,PlatformGraphics.copyArea,RG35XXCore2D.copyAreaAliased$' "$ID"
          grep -q '^CORE2D_DELTA=copyAreaAliased_ONLY$' "$ID"
          grep -q '^COPYAREA_ALIAS_ORDER=TOP_TO_BOTTOM_LEFT_TO_RIGHT$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          echo P1A_G1_CI_SCOPE_LOCK=PASS

      - name: Build synthetic GarlicOS platform exerciser
        run: bash ./scripts/build-p1a-g1-device-package.sh

      - name: Verify device package stays synthetic and pending physical review
        run: |
          set -euo pipefail
          ID=out/p1a-g1-device-package/P1A-G1-DEVICE-PACKAGE-IDENTITY.txt
          grep -q '^PACKAGE_TYPE=SYNTHETIC_PLATFORM_EXERCISER$' "$ID"
          grep -q '^GAME_CONTENT=NONE$' "$ID"
          grep -q '^AUDIO_PRIME=NOT_USED_GRAPHICS_SCOPE_ONLY$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          test -f out/p1a-g1-device-package/SD/Roms/APPS/P1A-G1-PLATFORM-TEST.sh
          test -f out/p1a-g1-device-package/SD/Roms/APPS/RG35XX-P1A-G1/p1a-g1-platform-test.jar
          echo P1A_G1_DEVICE_PACKAGE_SCOPE_LOCK=PASS

      - name: Upload build audit
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G1-AUDIT-${{ github.sha }}
          path: out/p1a-g1-clear-copyarea/
          if-no-files-found: error

      - name: Upload physical platform-test package
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G1-DEVICE-TEST-${{ github.sha }}
          path: out/p1a-g1-device-package/
          if-no-files-found: error
