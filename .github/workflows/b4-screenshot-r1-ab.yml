name: B4 Screenshot R1 A-B

on:
  workflow_dispatch:
  push:
    branches: [b4-screenshot-r1-ab]
    paths:
      - '.github/workflows/b4-screenshot-r1-ab.yml'
      - 'scripts/b4_apply_screenshot_r1_doublebuffer.py'
      - 'release/b4-screenshot-r1/**'
      - 'tasklog/B4-SCREENSHOT-R1-AB.md'

jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      FREEJ2ME_PIN: 13ec186903087156c145268f8706eecfaf9f1e50
      JAMVM_L_SHA256: eea1b97cebfaca67b69ed365e966d80cdac22d8ff245c7a556137cfb2898ea34
      GLIBJ_SHA256: d7abe888d2980329434c30f18c0eec124be1f02284bf9ed28e88d7242a1f2bea
      CURRENT_RUNTIME_SHA256: 4f1f126c2e02b4fbc3b8985d3afd0cbb239d35e0f97512a4eb85f25fcbacbc9c
      OLD_CORE_SHA256: 56bb3b972337dd40b342c1881f6599c53eebf66a29f920a1aa2e2839eb29a07c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TASEmulators/freej2me-plus
          ref: 13ec186903087156c145268f8706eecfaf9f1e50
          path: upstream

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends build-essential file python3 >/dev/null

      - name: Materialize pinned ARM uClibc toolchain
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test "$(/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = arm-miyoo-linux-uclibcgnueabi

      - name: Assemble exact B4 native foundation
        run: |
          set -euo pipefail
          VC_UPSTREAM="$GITHUB_WORKSPACE/upstream" B4_ASSEMBLY="$RUNNER_TEMP/b4shotr1" sh scripts/b4_verified_core_assemble.sh
          echo "B4=$RUNNER_TEMP/b4shotr1" >> "$GITHUB_ENV"

      - name: Apply one-variable screenshot buffer-lifetime fix
        run: |
          set -euo pipefail
          V="$B4/src/libretro/rg35xx/golden/rg35xx_golden_video.c"
          python3 scripts/b4_apply_screenshot_r1_doublebuffer.py "$V"

          grep -Fq 'RG35XX-B4-SCREENSHOT-R1-DOUBLEBUF' "$V"
          grep -Fq 'uint16_t canvas_a[RG35XX_GOLDEN_MAX_PIXELS];' "$V"
          grep -Fq 'uint16_t canvas_b[RG35XX_GOLDEN_MAX_PIXELS];' "$V"
          grep -Fq 'g.present_canvas = g.canvas_a;' "$V"
          grep -Fq 'g.build_canvas = g.canvas_b;' "$V"
          grep -Fq 'blit_nearest(&g.snapshot, g.build_canvas);' "$V"
          grep -Fq 'video_cb(g.present_canvas, g.output_width, g.output_height,' "$V"

          ! grep -Fq 'uint16_t canvas[RG35XX_GOLDEN_MAX_PIXELS];' "$V"
          ! grep -Fq 'video_cb(g.canvas,' "$V"

          for keep in             'read_header_resync'             'decode_wire_rgb565'             'publish_back'             'fit_geometry'             'B4 FIRST_FRAME_HEADER'             'B4 FIRST_FRAME_PUBLISH'             'B4 FIRST_PRESENT'             'B4 VIDEO_DEINIT'
          do
            grep -Fq "$keep" "$V"
          done

          ! grep -R -Fq 'RG35XX-PNG-COMPAT' "$B4/src"
          ! grep -R -Fq 'rg35xxStripPngICCP' "$B4/src"
          ! grep -R -Fq 'RG35XX-CV:' "$B4/src"
          echo B4_SCREENSHOT_R1_SCOPE_GATE=PASS

      - name: Build ARM core
        run: |
          set -euo pipefail
          cd "$B4/src/libretro"
          make clean
          make platform=unix             CC='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft'             CXX='/opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++ -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft'             LDFLAGS='-lm -lpthread'
          CORE="$B4/src/libretro/freej2me_plus_libretro.so"
          test -f "$CORE"
          echo "NEW_CORE_SHA256=$(sha256sum "$CORE" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Strict core gate
        run: |
          set -euo pipefail
          CORE="$B4/src/libretro/freej2me_plus_libretro.so"
          readelf -h "$CORE" | tee /tmp/elf.txt
          grep -q 'Class:.*ELF32' /tmp/elf.txt
          grep -q 'Machine:.*ARM' /tmp/elf.txt
          grep -q 'Version5 EABI' /tmp/elf.txt
          grep -q 'soft-float ABI' /tmp/elf.txt

          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_present
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm "$CORE" | grep rg35xx_golden_video_start
          strings "$CORE" | grep -F '/mnt/mmc/CFW/java/bin/jamvm'
          strings "$CORE" | grep -F '/mnt/mmc/freej2me-java-error.log'
          strings "$CORE" | grep -F '/mnt/mmc/freej2me-vc3-early.log'
          strings "$CORE" | grep -F 'B4 FIRST_PRESENT'

          echo B4_SCREENSHOT_R1_CORE_GATE=PASS

      - name: Package core-only fail-closed installer
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg"
          mkdir -p "$ROOT/payload"
          cp "$B4/src/libretro/freej2me_plus_libretro.so" "$ROOT/payload/freej2me_plus_libretro.so"
          cp release/b4-screenshot-r1/* "$ROOT/"

          sed -i "s/__NEW_CORE_SHA256__/$NEW_CORE_SHA256/g" "$ROOT/INSTALL-B4-SCREENSHOT-R1.ps1"
          ! grep -R -Fq '__NEW_CORE_SHA256__' "$ROOT"

          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/INSTALL-B4-SCREENSHOT-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/RESTORE-B4-SCREENSHOT-R1.ps1')) | Out-Null"
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '$ROOT/COLLECT-B4-SCREENSHOT-R1.ps1')) | Out-Null"

          test ! -f "$ROOT/payload/freej2me-lr.jar"

          cat > "$ROOT/STATUS.txt" <<EOF
          CHECKPOINT=B4-SCREENSHOT-R1-AB
          PRIMARY_VARIABLE=NATIVE_PRESENTATION_CANVAS_LIFETIME_ONLY
          SOURCE_COMMIT=$GITHUB_SHA
          FREEJ2ME_PIN=$FREEJ2ME_PIN
          REQUIRED_RUNTIME_SHA256=$CURRENT_RUNTIME_SHA256
          OLD_CORE_SHA256=$OLD_CORE_SHA256
          NEW_CORE_SHA256=$NEW_CORE_SHA256
          JAMVM_L_SHA256=$JAMVM_L_SHA256
          GLIBJ_SHA256=$GLIBJ_SHA256
          PRESENTATION=DOUBLE_BUFFERED
          JAVA_RUNTIME_PACKAGED=NO
          FRAME_PROTOCOL=UNCHANGED
          SMART_FIT=UNCHANGED
          AUDIO_CHANGE=NONE
          FONT_CHANGE=NONE
          BUILD_PASS=YES
          DEVICE_PASS=NO_DEVICE_TEST_PENDING
          STABLE=NO
          EOF

          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          echo B4_SCREENSHOT_R1_CORE_SHA256=$NEW_CORE_SHA256
          echo B4_SCREENSHOT_R1_BUILD_GATE=PASS
          echo DEVICE_PASS=NO_DEVICE_TEST_PENDING
          echo STABLE=NO

      - uses: actions/upload-artifact@v4
        with:
          name: b4-screenshot-r1-ab
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
