name: Miyoo M1.9 Canvas Integration Acceptance Build

on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_9/**'
      - '.github/workflows/miyoo-m1.9-canvas-acceptance-build.yml'

jobs:
  m19_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
      - name: Preserve M1.8 boundary
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Install Java8 and pinned ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y openjdk-8-jdk-headless ant >/dev/null
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true); trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
      - name: Fetch pinned FreeJ2ME source
        run: |
          set -euo pipefail
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          cd upstream
          git checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD)" = 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
      - name: Apply M1.9A headless PlatformFont patch
        run: |
          set -euo pipefail
          test "$(git -C upstream hash-object src/org/recompile/mobile/PlatformFont.java)" = acc9e1c5ee5263662e768f68d406cadbeda167e9
          python3 miyoo-m1/m1_9/patch_headless_platformfont.py
          grep -q 'rg35xx.headless.font' upstream/src/org/recompile/mobile/PlatformFont.java
          grep -q 'if (metrics == null)' upstream/src/org/recompile/mobile/PlatformFont.java
          echo M1_9A_HEADLESS_PLATFORMFONT_GATE=PASS
      - name: Apply M1.9B headless PlatformImage allocation probe
        run: |
          set -euo pipefail
          test "$(git -C upstream hash-object src/org/recompile/mobile/PlatformImage.java)" = 7da4a9325cdf40fe23deee4d88e473f64c1fc0e0
          python3 miyoo-m1/m1_9/patch_headless_platformimage_probe.py
          grep -q 'rg35xx.headless.image.probe' upstream/src/org/recompile/mobile/PlatformImage.java
          grep -q 'dataBuffer = new int\[Width \* Height\]' upstream/src/org/recompile/mobile/PlatformImage.java
          echo M1_9B_HEADLESS_PLATFORMIMAGE_PROBE_GATE=PASS
      - name: Add locked M1.8 input and M1.9 lifecycle Canvas sources
        run: |
          set -euo pipefail
          cp miyoo-m1/m1_8/M1Input.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19InputPump.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19CanvasAcceptanceMIDlet.java upstream/src/org/recompile/mobile/
          cp miyoo-m1/m1_9/M19LifecycleLauncher.java upstream/src/org/recompile/mobile/
          for f in miyoo-m1/m1_9/*.java; do ! grep -Eq 'Libretro|retro_' "$f"; done
      - name: Build pinned FreeJ2ME plus M1.9 lifecycle
        run: |
          set -euo pipefail
          cd upstream
          JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 ant -noinput -buildfile build.xml
          for n in M19InputPump M19CanvasAcceptanceMIDlet M19LifecycleLauncher; do test -f build/classes/org/recompile/mobile/$n.class; done
          python3 - <<'PY'
          from pathlib import Path
          for n in ('M19InputPump','M19CanvasAcceptanceMIDlet','M19LifecycleLauncher'):
              p=Path('build/classes/org/recompile/mobile/'+n+'.class')
              major=int.from_bytes(p.read_bytes()[6:8],'big')
              print(n+'_JAVA_CLASS_MAJOR=%d' % major)
              assert major==50
          PY
          cd ..
          mkdir -p out/midlet-stage/META-INF
          cp upstream/build/freej2me_plus.jar out/m1.9-freej2me-platform.jar
          jar tf out/m1.9-freej2me-platform.jar | grep -q 'org/recompile/mobile/M19LifecycleLauncher.class'
          jar tf out/m1.9-freej2me-platform.jar | grep -q 'org/recompile/mobile/M19CanvasAcceptanceMIDlet.class'
          if jar tf out/m1.9-freej2me-platform.jar | grep -Eq '(^|/)Libretro[^/]*\.class$'; then echo 'M1_9_STANDALONE_JAR=FAIL_LIBRETRO'; exit 1; fi
          echo M1_9_STANDALONE_JAR=PASS
          mkdir -p out/midlet-stage/org/recompile/mobile
          cp upstream/build/classes/org/recompile/mobile/M19CanvasAcceptanceMIDlet*.class out/midlet-stage/org/recompile/mobile/
          cp upstream/build/classes/org/recompile/mobile/M19InputPump.class out/midlet-stage/org/recompile/mobile/
          cat > out/midlet-manifest.mf <<'MF'
          Manifest-Version: 1.0
          MIDlet-Name: RG35XX M1.9 Canvas Acceptance
          MIDlet-Vendor: RG35XX Java Platform
          MIDlet-Version: 1.0
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          MIDlet-1: RG35XX M1.9 Canvas Acceptance,,org.recompile.mobile.M19CanvasAcceptanceMIDlet
          MF
          jar cfm out/m1.9-canvas-midlet.jar out/midlet-manifest.mf -C out/midlet-stage org
          python3 - <<'PY'
          import zipfile
          expected='MIDlet-1: RG35XX M1.9 Canvas Acceptance,,org.recompile.mobile.M19CanvasAcceptanceMIDlet'
          with zipfile.ZipFile('out/m1.9-canvas-midlet.jar') as z:
              raw=z.read('META-INF/MANIFEST.MF').decode('utf-8').replace('\r\n ','').replace('\n ','')
          assert expected in raw, raw
          print('M1_9_MIDLET_MANIFEST=PASS')
          PY
      - name: Build ARMv5TE uClibc JNI unchanged from M1.8
        run: |
          set -euo pipefail
          JH=/usr/lib/jvm/java-8-openjdk-amd64/include
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -Wall -Wextra -I"$JH" -I"$JH/linux" miyoo-m1/m1_8/m1_8_input_jni.c -o out/libm1_8_input.so
          /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-strip out/libm1_8_input.so
          test "$(sha256sum out/libm1_8_input.so | awk '{print $1}')" = 02d2e4f5dec767ea63ef4fae067a942fd7026a7c68a7e422e0fe9680462a568c
          readelf -h out/libm1_8_input.so | grep -q 'Version5 EABI'
      - name: Package M1.9B GarlicOS allocation acceptance
        run: |
          set -euo pipefail
          APP=out/garlicos/Roms/APPS
          mkdir -p "$APP" out/garlicos/M1.9-DOCS
          cp out/m1.9-freej2me-platform.jar "$APP/"
          cp out/m1.9-canvas-midlet.jar "$APP/"
          cp out/libm1_8_input.so "$APP/"
          cp miyoo-m1/m1_9/M1_9_CANVAS_INTEGRATION_CONTRACT.txt out/garlicos/M1.9-DOCS/
          cat > "$APP/M1.9-CANVAS-ACCEPTANCE.sh" <<'SH'
          #!/bin/sh
          OUT=/mnt/mmc/RG35XX-MIYOO-M1.9-CANVAS-RESULT.txt
          APP="$(CDPATH= cd -- "$(dirname -- "$0")" 2>/dev/null && pwd)"
          JAMVM=/mnt/mmc/CFW/java/bin/jamvm
          GLIBJ=/mnt/mmc/CFW/java/share/classpath/glibj.zip
          : >"$OUT"
          echo 'RG35XX MIYOO M1.9B HEADLESS PLATFORMIMAGE ALLOCATION ACCEPTANCE' >>"$OUT"
          echo 'ACTION=VERIFY_TWO_640X480_INT_BUFFERS_WITHOUT_AWT_GTK' >>"$OUT"
          echo M1_9_SHELL_BEFORE_JAMVM=YES >>"$OUT"
          JB=$(sha256sum "$JAMVM"|awk '{print $1}'); GB=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_SHA256_BEFORE=$JB >>"$OUT"; echo GLIBJ_SHA256_BEFORE=$GB >>"$OUT"
          export LD_LIBRARY_PATH="$APP:${LD_LIBRARY_PATH-}"
          "$JAMVM" -Xmx64m -cp "$GLIBJ:$APP/m1.9-freej2me-platform.jar" org.recompile.mobile.M19LifecycleLauncher "$APP/m1.9-canvas-midlet.jar" >>"$OUT" 2>&1
          RC=$?
          echo M1_9_SHELL_AFTER_JAMVM=YES >>"$OUT"
          JA=$(sha256sum "$JAMVM"|awk '{print $1}'); GA=$(sha256sum "$GLIBJ"|awk '{print $1}')
          echo JAMVM_EXIT_CODE=$RC >>"$OUT"
          echo JAMVM_SHA256_AFTER=$JA >>"$OUT"; echo GLIBJ_SHA256_AFTER=$GA >>"$OUT"
          if [ "$JB" = "$JA" ] && [ "$GB" = "$GA" ]; then echo M1_9_PROTECTED_HASHES=PASS >>"$OUT"; else echo M1_9_PROTECTED_HASHES=FAIL >>"$OUT"; fi
          if [ "$RC" -eq 0 ] && grep -q 'M1_9B_ALLOCATION_ACCEPTANCE_MARKER=PASS' "$OUT" && grep -q 'M1_9_FRONT_BUFFER_LENGTH=307200' "$OUT" && grep -q 'M1_9_BACK_BUFFER_LENGTH=307200' "$OUT"; then echo M1_9B_EXECUTION_RESULT=PASS >>"$OUT"; else echo M1_9B_EXECUTION_RESULT=FAIL >>"$OUT"; fi
          echo DEVICE_PASS=NO_ALLOCATION_PROBE_ONLY >>"$OUT"
          echo FULL_PLATFORM_STABLE=NO >>"$OUT"
          sync
          exit "$RC"
          SH
          chmod +x "$APP/M1.9-CANVAS-ACCEPTANCE.sh"
          printf '%s\n' 'PACKAGE_LAYOUT=GARLICOS_FLAT_APPS' 'EXTRACT_TARGET=SD_ROOT' 'M1.8_INPUT=DEVICE-PASS_LOCKED' 'M1.9A_HEADLESS_PLATFORMFONT=DEVICE-EVIDENCE_PASS' 'M1.9B_HEADLESS_PLATFORMIMAGE=ALLOCATION_PROBE' 'M1.9B_DEVICE_TEST_PENDING=YES' 'FULL_PLATFORM_STABLE=NO' > out/garlicos/STATUS.txt
          (cd out/garlicos && find Roms M1.9-DOCS -type f -print0 | sort -z | xargs -0 sha256sum) > out/garlicos/SHA256SUMS.txt
          (cd out/garlicos && sha256sum -c SHA256SUMS.txt)
          sha256sum out/m1.9-freej2me-platform.jar out/m1.9-canvas-midlet.jar out/libm1_8_input.so | tee out/BUILD-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.9b-platformimage-allocation
          path: out/garlicos/
          if-no-files-found: error
