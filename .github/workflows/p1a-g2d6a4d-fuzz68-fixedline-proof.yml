name: P1A G2D6A4D FUZZ68 Fixed-Line Proof

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2d-arc-family-jdk8-raster
    paths:
      - '.github/workflows/p1a-g2d6a4d-fuzz68-fixedline-proof.yml'
      - 'scripts/stage-p1a-g2d6a4d-fuzz68-fixedline-trace.py'
      - 'scripts/analyze-p1a-g2d6a4d-fuzz68-fixedlines.py'
      - 'tests/p1a/RG35XXG2D6A4DFuzz68RawTrace.java'

permissions:
  contents: read

jobs:
  fuzz68-fixedline-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build G2C parent and materialize diagnostic G2D source
        run: |
          set -euo pipefail
          bash ./scripts/build-p1a-g2c-drawroundrect-jdk8-raster-v2.sh
          STAGE="$GITHUB_WORKSPACE/build/a3/stage-src"
          python3 ./scripts/stage-p1a-g2d-arc-family-jdk8-raster.py "$STAGE"
          python3 ./scripts/stage-p1a-g2d6a-generalrenderer-lineclip.py "$STAGE"
          python3 ./scripts/stage-p1a-g2d6a4d-fuzz68-fixedline-trace.py "$STAGE"

      - name: Compile diagnostic-only candidate and FUZZ68 probe
        run: |
          set -euo pipefail
          PARENT=out/p1a-g2c-drawroundrect-jdk8-raster/freej2me-rg35xx.jar
          STAGE=build/a3/stage-src
          OUT=out/p1a-g2d6a4d
          PGCLS=build/p1a-g2d6a4d-pg
          HOST=build/p1a-g2d6a4d-host
          rm -rf "$OUT" "$PGCLS" "$HOST"
          mkdir -p "$OUT" "$PGCLS" "$HOST"
          javac -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$PARENT:upstream/freej2me-miyoomini/lib/jsr305-3.0.2.jar" \
            -d "$PGCLS" "$STAGE/org/recompile/mobile/PlatformGraphics.java"
          CANDIDATE="$OUT/freej2me-rg35xx-diagnostic.jar"
          cp "$PARENT" "$CANDIDATE"
          jar uf "$CANDIDATE" -C "$PGCLS" org/recompile/mobile/PlatformGraphics.class
          javac -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$CANDIDATE" -d "$HOST" \
            tests/p1a/RG35XXG2D6A4DFuzz68RawTrace.java
          cp "$STAGE/org/recompile/mobile/PlatformGraphics.java" "$OUT/DIAGNOSTIC-PlatformGraphics.java.txt"

      - name: Capture Raw fixed-line list and prove native preclip
        run: |
          set -euo pipefail
          OUT=out/p1a-g2d6a4d
          CANDIDATE="$OUT/freej2me-rg35xx-diagnostic.jar"
          HOST=build/p1a-g2d6a4d-host
          java -Djava.awt.headless=true -cp "$CANDIDATE:$HOST" \
            org.recompile.rg35xx.p1a.RG35XXG2D6A4DFuzz68RawTrace \
            | tee "$OUT/FUZZ68-FIXEDLINE-TRACE.txt"
          grep -q '^G2D6A4D_RAW_TRACE=PASS$' "$OUT/FUZZ68-FIXEDLINE-TRACE.txt"
          python3 scripts/analyze-p1a-g2d6a4d-fuzz68-fixedlines.py \
            "$OUT/FUZZ68-FIXEDLINE-TRACE.txt" \
            | tee "$OUT/FUZZ68-NATIVE-PRECLIP-PROOF.txt"
          grep -q '^G2D6A4D_CURRENT_SIM_REPRODUCES_RAW=PASS$' "$OUT/FUZZ68-NATIVE-PRECLIP-PROOF.txt"
          grep -q '^G2D6A4D_NATIVE_PRECLIP_REPRODUCES_AWT=PASS$' "$OUT/FUZZ68-NATIVE-PRECLIP-PROOF.txt"
          grep -q '^G2D6A4D_FIRST_DIVERGENCE_PROOF=NATIVE_PROCESSPATH_PROCESS_LINE_PRECLIP$' "$OUT/FUZZ68-NATIVE-PRECLIP-PROOF.txt"

      - name: Upload G2D6A4D diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2D6A4D-FUZZ68-FIXEDLINE-${{ github.sha }}
          path: out/p1a-g2d6a4d/
          if-no-files-found: error
