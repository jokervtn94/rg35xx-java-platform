name: RC1 Pinned Prebuilt Toolchain Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rc1-toolchain-build.yml'
      - 'tasklog/RC1-011U-TASKLOG.md'
  workflow_dispatch:

jobs:
  probe-sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      TOOLCHAIN_DIGEST: sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
      TARGET_TRIPLE: arm-miyoo-linux-uclibcgnueabi
      TARGET_FLAGS: -marm -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft
    steps:
      - name: Checkout RG35XX platform repo
        uses: actions/checkout@v4

      - name: Pull exact pinned uClibc toolchain image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          docker image inspect "$TOOLCHAIN_IMAGE" >/dev/null
          docker image inspect "$TOOLCHAIN_IMAGE" --format '{{json .RepoDigests}}'

      - name: Verify compiler contract and ARMv5TE soft-float probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rg35xx-toolchain-probe"
          cat > "$RUNNER_TEMP/rg35xx-toolchain-probe/probe.c" <<'EOF'
          int main(void) { return 0; }
          EOF

          docker run --rm \
            -v "$RUNNER_TEMP/rg35xx-toolchain-probe:/probe" \
            "$TOOLCHAIN_IMAGE" \
            bash -lc '
              set -euo pipefail
              test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
              test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-g++
              test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-nm
              test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-readelf
              test "$(arm-miyoo-linux-uclibcgnueabi-gcc -dumpmachine)" = "arm-miyoo-linux-uclibcgnueabi"
              test "$(arm-miyoo-linux-uclibcgnueabi-g++ -dumpmachine)" = "arm-miyoo-linux-uclibcgnueabi"
              arm-miyoo-linux-uclibcgnueabi-gcc -marm -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft /probe/probe.c -o /probe/probe.elf
              arm-miyoo-linux-uclibcgnueabi-readelf -h /probe/probe.elf | tee /probe/readelf.txt
              grep -Eq "Machine:[[:space:]]+ARM" /probe/readelf.txt
              arm-miyoo-linux-uclibcgnueabi-gcc --version | head -n 1 > /probe/gcc-version.txt
              arm-miyoo-linux-uclibcgnueabi-g++ --version | head -n 1 > /probe/gxx-version.txt
            '

          grep -Eq 'Machine:[[:space:]]+ARM' "$RUNNER_TEMP/rg35xx-toolchain-probe/readelf.txt"

      - name: Record pinned toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rg35xx-toolchain-probe/rg35xx_prebuilt_toolchain_manifest.txt"
          {
            echo "provider=MiyooCFW/toolchain-shared-uclibc"
            echo "image=$TOOLCHAIN_IMAGE"
            echo "digest=$TOOLCHAIN_DIGEST"
            echo "target_triple=$TARGET_TRIPLE"
            echo "target_flags=$TARGET_FLAGS"
            printf 'gcc='; cat "$RUNNER_TEMP/rg35xx-toolchain-probe/gcc-version.txt"
            printf 'gxx='; cat "$RUNNER_TEMP/rg35xx-toolchain-probe/gxx-version.txt"
            echo "probe_sha256=$(sha256sum "$RUNNER_TEMP/rg35xx-toolchain-probe/probe.elf" | awk '{print $1}')"
          } | tee "$OUT"

      - name: Upload toolchain probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: rg35xx-prebuilt-uclibc-toolchain-probe
          path: |
            ${{ runner.temp }}/rg35xx-toolchain-probe/rg35xx_prebuilt_toolchain_manifest.txt
            ${{ runner.temp }}/rg35xx-toolchain-probe/readelf.txt
            ${{ runner.temp }}/rg35xx-toolchain-probe/probe.elf
          if-no-files-found: error
          retention-days: 30
