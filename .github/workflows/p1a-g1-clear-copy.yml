name: P1A G1 Clear Copy

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g1-clear-copy
    paths:
      - '.github/workflows/p1a-g1-clear-copy.yml'
      - 'scripts/stage-p1a-g1-clear-copy.py'
      - 'scripts/build-p1a-g1-clear-copy.sh'
      - 'tests/p1a/RG35XXGraphicsG1DifferentialGate.java'
      - 'tests/p1a/RG35XXCopyAreaAlphaDifferentialGate.java'

permissions:
  contents: read

jobs:
  p1a-g1-clear-copy:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout G1 branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 for Java 6 bytecode output
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 DEVICE-PASS raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected ARMv5 soft-float native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 headless Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build P1A G1 candidate and all differential gates
        run: bash ./scripts/build-p1a-g1-clear-copy.sh

      - name: Verify owner and scope lock
        run: |
          set -euo pipefail
          ID=out/p1a-g1-clear-copy/P1A-G1-IDENTITY.txt
          LOG=out/p1a-g1-clear-copy/P1A-G1-DIFFERENTIAL-GATE.txt
          ALOG=out/p1a-g1-clear-copy/P1A-G1-ALPHA-DIFFERENTIAL-GATE.txt
          grep -q '^PARENT_A8_SEMANTIC_SHA256=7cd3a4a29d4238e0d2464a213db48ba555bdf3c590aa77fe60c68b480bdc4adf$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$ID"
          grep -q '^FAILURE_OWNER=RG35XX_GRAPHICS_BOUNDARY$' "$ID"
          grep -q '^CHANGED_METHODS=clearRect,copyArea$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^P1A_G1_COPYAREA_OVERLAP=JDK8_LIVE_RASTER_TOP_TO_BOTTOM_LEFT_TO_RIGHT$' "$ID"
          grep -q '^P1A_G1_COPYAREA_ALPHA=JDK8_MUL8_DIV8_SRCOVER$' "$ID"
          grep -q '^P1A_G1_ALPHA_DIFFERENTIAL_GATE=PASS$' "$ID"
          grep -q '^HOST-DIFFERENTIAL-PASS=YES$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^NO_A9_PARENT=YES$' "$ID"
          grep -q '^JAMVM_GLIBJ=NOT_TOUCHED$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^P1A_G1_DIFFERENTIAL_GATE=PASS$' "$LOG"
          grep -q '^P1A_G1_COPYAREA_OVERLAP=JDK8_LIVE_RASTER_TOP_TO_BOTTOM_LEFT_TO_RIGHT$' "$LOG"
          grep -q '^P1A_G1_CASE=SENTINEL_DRAWARC EXPECTED=RAW_EXCEPTION ACTUAL=RAW_EXCEPTION' "$LOG"
          grep -q '^P1A_G1_CASE=SENTINEL_FILLTRIANGLE EXPECTED=RAW_EXCEPTION ACTUAL=RAW_EXCEPTION' "$LOG"
          grep -q '^P1A_G1_CASE=SENTINEL_GENERIC_FILLPOLYGON EXPECTED=MISMATCH ACTUAL=MISMATCH' "$LOG"
          grep -q '^P1A_G1_ALPHA_BASELINE_MATCH=true ' "$ALOG"
          grep -q '^P1A_G1_COPYAREA_ALPHA_DIFFERENTIAL_GATE=PASS$' "$ALOG"
          echo P1A_G1_CI_SCOPE_LOCK=PASS

      - name: Upload P1A G1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G1-CLEAR-COPY-${{ github.sha }}
          path: out/p1a-g1-clear-copy/
          if-no-files-found: error
