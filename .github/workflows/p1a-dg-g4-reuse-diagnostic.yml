name: P1A DG G4 A5 Reuse Diagnostic

on:
  push:
    branches:
      - p1a-dg-g4-reuse-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGG4ReuseDiagnostic.java'
      - '.github/workflows/p1a-dg-g4-reuse-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1a-dg-g4-reuse:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout diagnostic branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D6 host parent ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 093aae62d7caca2941258592c72dfc25b1f204a7 HEAD
          echo P1A_G4_REUSE_D6_HOST_PARENT=PASS
          echo P1A_G4_REUSE_RUNTIME_CHANGE=NO

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Reconstruct exact D6 host candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-p1a-dg-draw-vector-d6-v2.sh
          JAVA8="$JAVA_HOME" bash scripts/build-p1a-dg-draw-vector-d6-v2.sh | tee /tmp/p1a-g4-d6-parent.log
          grep -q '^P1A_DG_D6_BUILD=PASS$' /tmp/p1a-g4-d6-parent.log
          ID=out/p1a-dg-draw-vector-d6/P1A-DG-D6-IDENTITY.txt
          grep -q '^D6_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^D6_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          echo P1A_G4_REUSE_D6_RECONSTRUCTION=PASS

      - name: Compile Java6 G4 reuse diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-g4-reuse
          JAR=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath "$JAR" \
            -d build/p1a-g4-reuse \
            tests/p1a/RG35XXDGG4ReuseDiagnostic.java
          echo P1A_G4_REUSE_JAVA6_GATE=PASS

      - name: Run strict AWT vs protected-A5 reuse diagnostic
        shell: bash
        run: |
          set -euo pipefail
          JAR=out/p1a-dg-draw-vector-d6/freej2me-rg35xx.jar
          java -Djava.awt.headless=true -cp "$JAR:build/p1a-g4-reuse" \
            org.recompile.rg35xx.p1a.RG35XXDGG4ReuseDiagnostic \
            | tee build/p1a-g4-reuse/G4-A5-REUSE.txt
          LOG=build/p1a-g4-reuse/G4-A5-REUSE.txt
          grep -q '^P1A_G4_REUSE_DRAWIMAGE_CASES=32$' "$LOG"
          grep -q '^P1A_G4_REUSE_INT_CASES=96$' "$LOG"
          grep -q '^P1A_G4_REUSE_SHORT_CASES=120$' "$LOG"
          grep -q '^P1A_G4_REUSE_BYTE_CASES=64$' "$LOG"
          grep -q '^P1A_G4_REUSE_TOTAL_CASES=312$' "$LOG"
          grep -q '^P1A_G4_REUSE_RANDOM_SEED=35a4001$' "$LOG"
          grep -q '^P1A_G4_REUSE_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_G4_REUSE_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_G4_A5_REUSE_DIAGNOSTIC=PASS$' "$LOG"

      - name: Upload G4 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G4-A5-REUSE-${{ github.sha }}
          path: build/p1a-g4-reuse/
          if-no-files-found: error
