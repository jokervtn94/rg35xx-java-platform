name: Miyoo M1.8 Standalone Acceptance Build

on:
  workflow_dispatch:
  push:
    branches: [miyoo-m1.8-midp-input-dispatch]
    paths:
      - 'miyoo-m1/m1_8/**'
      - 'miyoo-m1/M1.8-DEVICE-ACCEPTANCE.sh'
      - '.github/workflows/miyoo-m1.8-acceptance-build.yml'

jobs:
  acceptance_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Standalone boundary gate
        run: sh miyoo-m1/m1_8/verify_standalone_boundary.sh
      - name: Fetch pinned FreeJ2ME source
        run: |
          git clone -q https://github.com/TASEmulators/freej2me-plus.git upstream
          cd upstream
          git checkout -q 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD)" = 13ec186903087156c145268f8706eecfaf9f1e50
          test "$(git rev-parse HEAD^{tree})" = ad47ab16e9025f0eb3d2067bc3b1897dc71987df
      - name: Build Java acceptance jar without Libretro integration
        run: |
          set -eux
          mkdir -p work/src/org/recompile/mobile work/classes out
          cp upstream/src/org/recompile/mobile/Mobile.java work/src/org/recompile/mobile/
          cp upstream/src/org/recompile/mobile/MobilePlatform.java work/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1Input.java work/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M1InputDispatch.java work/src/org/recompile/mobile/
          cp miyoo-m1/m1_8/M18DispatchAcceptance.java work/src/org/recompile/mobile/
          ! grep -R -n 'Libretro\|retro_' work/src
          javac -source 7 -target 7 -d work/classes $(find work/src -name '*.java')
          jar cf out/m1.8-midp-acceptance.jar -C work/classes .
          javap -verbose -classpath out/m1.8-midp-acceptance.jar org.recompile.mobile.M18DispatchAcceptance | grep 'major version: 51'
      - name: Build ARMv5TE uClibc JNI
        run: |
          docker run --rm -v "$PWD:/work" -w /work docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e sh -lc '
            set -eux
            CC=$(find /opt /usr -type f -name "arm-miyoo-linux-uclibcgnueabi-gcc" 2>/dev/null | head -n1)
            test -n "$CC"
            "$CC" -shared -fPIC -Os -pipe -march=armv5te -mtune=arm926ej-s -mfloat-abi=soft -o out/libm1_8_input.so miyoo-m1/m1_8/m1_8_input_jni.c
          '
          file out/libm1_8_input.so | tee out/ELF.txt
          grep -q 'ELF 32-bit.*ARM' out/ELF.txt
      - name: Package device acceptance checkpoint
        run: |
          set -eux
          mkdir -p out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE
          cp out/m1.8-midp-acceptance.jar out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/
          cp out/libm1_8_input.so out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/
          cp miyoo-m1/M1.8-DEVICE-ACCEPTANCE.sh out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/launch.sh
          cp miyoo-m1/m1_8/M1_8_DEVICE_ACCEPTANCE.txt out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/
          cp miyoo-m1/m1_8/M1_8_MOBILEPLATFORM_ACCEPTANCE_CONTRACT.txt out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/
          chmod +x out/device/Roms/APPS/M1.8-MIDP-ACCEPTANCE/launch.sh
          (cd out/device && find . -type f -exec sha256sum {} \; | sort) > out/device/SHA256SUMS.txt
          printf '%s\n' 'M1.8_ACCEPTANCE_BUILD=PASS' 'DEVICE_PASS=NO' 'DEVICE_TEST_PENDING=YES' 'FULL_PLATFORM_STABLE=NO' > out/STATUS.txt
          sha256sum out/m1.8-midp-acceptance.jar out/libm1_8_input.so | tee out/BUILD-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miyoo-m1.8-standalone-device-acceptance
          path: out/
          if-no-files-found: error
