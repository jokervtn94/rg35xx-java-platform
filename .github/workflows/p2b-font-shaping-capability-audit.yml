name: P2B Font Shaping Capability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/p2b-font-text
    paths:
      - '.github/workflows/p2b-font-shaping-capability-audit.yml'

permissions:
  contents: read

jobs:
  p2b-shaping-capability:
    runs-on: ubuntu-latest
    env:
      BASE: 77a36526e0f6d875c57c7e9a973e0c1a05573721
      TOOLCHAIN_IMAGE: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify audit-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"...HEAD | tee /tmp/p2b-shaping-cap-files.txt
          if grep -Ev '^(docs/P2B-FONT-TEXT-AUDIT-v1\.md|tests/p2b/diagnostic/[^/]+|\.github/workflows/p2b-font-[^/]+-audit\.yml)$' /tmp/p2b-shaping-cap-files.txt | grep -q .; then
            echo 'P2B_SHAPING_CAP_SCOPE=FAIL'; exit 1
          fi
          if git diff --name-only "$BASE"...HEAD | grep -E '^(adapter/|native/|upstream/|packaging/|scripts/stage-|scripts/build-)'; then
            echo 'P2B_RUNTIME_DELTA=FAIL'; exit 1
          fi
          test "$(git -C upstream/freej2me-miyoomini rev-parse HEAD)" = ca11dfe8ea1cc273d92460f9a83bbf192023fa63
          echo 'P2B_SHAPING_CAP_SCOPE=PASS'
          echo 'P2B_RUNTIME_DELTA=NONE'

      - name: Materialize exact pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN_IMAGE"
          cid=$(docker create "$TOOLCHAIN_IMAGE" true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /opt/miyoo
          sudo docker cp "$cid:/opt/miyoo" /opt/miyoo
          sudo chown -R "$(id -u):$(id -g)" /opt/miyoo
          test -x /opt/miyoo/bin/arm-miyoo-linux-uclibcgnueabi-gcc
          echo 'P2B_TOOLCHAIN_PIN=PASS'

      - name: Inventory HarfBuzz FriBidi and text-layout dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          {
            echo 'PROJECT=RG35XX-AWEIGIT-R1'
            echo 'MODULE=P2B_FONT_TEXT'
            echo 'AUDIT_ONLY=YES'
            echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_IMAGE"
            echo '--- HARFBUZZ ---'
            find "$ROOT" -type f \( -iname 'hb.h' -o -iname 'hb-ft.h' -o -name 'libharfbuzz.so' -o -name 'libharfbuzz.so.*' -o -name 'libharfbuzz.a' \) -print | sort
            echo '--- FRIBIDI ---'
            find "$ROOT" -type f \( -iname 'fribidi.h' -o -name 'libfribidi.so' -o -name 'libfribidi.so.*' -o -name 'libfribidi.a' \) -print | sort
            echo '--- RAQM ---'
            find "$ROOT" -type f \( -iname 'raqm.h' -o -name 'libraqm.so' -o -name 'libraqm.so.*' -o -name 'libraqm.a' \) -print | sort
            echo '--- ICU LAYOUT CANDIDATES ---'
            find "$ROOT/usr/lib" -maxdepth 1 -type f \( -name 'libicu*.so*' -o -name 'libicu*.a' \) -print 2>/dev/null | sort || true
          } | tee out/P2B-SHAPING-CAPABILITY-INVENTORY.txt

          HB_HEADER=$(find "$ROOT" -type f -iname hb.h -print | head -n1 || true)
          HB_FT_HEADER=$(find "$ROOT" -type f -iname hb-ft.h -print | head -n1 || true)
          HB_SHARED=$(find "$ROOT" -type f \( -name libharfbuzz.so -o -name 'libharfbuzz.so.*' \) -print | head -n1 || true)
          HB_STATIC=$(find "$ROOT" -type f -name libharfbuzz.a -print | head -n1 || true)
          FB_HEADER=$(find "$ROOT" -type f -iname fribidi.h -print | head -n1 || true)
          FB_SHARED=$(find "$ROOT" -type f \( -name libfribidi.so -o -name 'libfribidi.so.*' \) -print | head -n1 || true)
          FB_STATIC=$(find "$ROOT" -type f -name libfribidi.a -print | head -n1 || true)
          RQ_HEADER=$(find "$ROOT" -type f -iname raqm.h -print | head -n1 || true)
          RQ_SHARED=$(find "$ROOT" -type f \( -name libraqm.so -o -name 'libraqm.so.*' \) -print | head -n1 || true)
          {
            [ -n "$HB_HEADER" ] && echo 'P2B_HARFBUZZ_HEADER=YES' || echo 'P2B_HARFBUZZ_HEADER=NO'
            [ -n "$HB_FT_HEADER" ] && echo 'P2B_HARFBUZZ_FT_HEADER=YES' || echo 'P2B_HARFBUZZ_FT_HEADER=NO'
            [ -n "$HB_SHARED" ] && echo 'P2B_HARFBUZZ_SHARED=YES' || echo 'P2B_HARFBUZZ_SHARED=NO'
            [ -n "$HB_STATIC" ] && echo 'P2B_HARFBUZZ_STATIC=YES' || echo 'P2B_HARFBUZZ_STATIC=NO'
            [ -n "$FB_HEADER" ] && echo 'P2B_FRIBIDI_HEADER=YES' || echo 'P2B_FRIBIDI_HEADER=NO'
            [ -n "$FB_SHARED" ] && echo 'P2B_FRIBIDI_SHARED=YES' || echo 'P2B_FRIBIDI_SHARED=NO'
            [ -n "$FB_STATIC" ] && echo 'P2B_FRIBIDI_STATIC=YES' || echo 'P2B_FRIBIDI_STATIC=NO'
            [ -n "$RQ_HEADER" ] && echo 'P2B_RAQM_HEADER=YES' || echo 'P2B_RAQM_HEADER=NO'
            [ -n "$RQ_SHARED" ] && echo 'P2B_RAQM_SHARED=YES' || echo 'P2B_RAQM_SHARED=NO'
          } | tee -a out/P2B-SHAPING-CAPABILITY-INVENTORY.txt

      - name: Record exact identities and dependency chains when present
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/miyoo/arm-miyoo-linux-uclibcgnueabi/sysroot
          : > out/P2B-SHAPING-LIB-IDENTITIES.txt
          for pattern in 'libharfbuzz.so.*' 'libfribidi.so.*' 'libraqm.so.*'; do
            LIB=$(find "$ROOT" -type f -name "$pattern" -print | sort | head -n1 || true)
            if [ -n "$LIB" ]; then
              echo "PATH=$LIB" >> out/P2B-SHAPING-LIB-IDENTITIES.txt
              sha256sum "$LIB" >> out/P2B-SHAPING-LIB-IDENTITIES.txt
              file "$LIB" >> out/P2B-SHAPING-LIB-IDENTITIES.txt
              readelf -d "$LIB" | grep -E 'NEEDED|SONAME' >> out/P2B-SHAPING-LIB-IDENTITIES.txt || true
              echo '---' >> out/P2B-SHAPING-LIB-IDENTITIES.txt
            fi
          done
          cat out/P2B-SHAPING-LIB-IDENTITIES.txt
          echo 'P2B_SHAPING_LIB_IDENTITY_AUDIT=PASS'

      - name: Final audit-only status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'P2B_SHAPING_CAPABILITY_AUDIT=PASS'
            echo 'P2B_RUNTIME_PATCH=FORBIDDEN'
            echo 'DEVICE_TEST=NOT_REQUESTED'
            echo 'RG35XX_PLATFORM_BASELINE_DEVICE_PASS=NO'
            echo 'STABLE=NO'
          } | tee out/P2B-SHAPING-CAPABILITY-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2B-SHAPING-CAPABILITY-${{ github.sha }}
          path: |
            out/P2B-SHAPING-CAPABILITY-INVENTORY.txt
            out/P2B-SHAPING-LIB-IDENTITIES.txt
            out/P2B-SHAPING-CAPABILITY-STATUS.txt
          if-no-files-found: error
