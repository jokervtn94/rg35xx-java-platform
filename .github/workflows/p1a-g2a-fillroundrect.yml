name: P1A G2A FillRoundRect

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2a-fillroundrect
    paths:
      - '.github/workflows/p1a-g2a-fillroundrect.yml'
      - 'scripts/stage-p1a-g2a-fillroundrect.py'
      - 'scripts/build-p1a-g2a-fillroundrect.sh'
      - 'tests/p1a/RG35XXG2AFillRoundRectDifferentialGate.java'

permissions:
  contents: read

jobs:
  p1a-g2a-fillroundrect:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout G2A branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build and gate G2A fillRoundRect
        run: bash ./scripts/build-p1a-g2a-fillroundrect.sh

      - name: Verify exact G2A scope
        run: |
          set -euo pipefail
          ID=out/p1a-g2a-fillroundrect/P1A-G2A-IDENTITY.txt
          LOG=out/p1a-g2a-fillroundrect/P1A-G2A-DIFFERENTIAL-GATE.txt
          grep -q '^PARENT_G1_SEMANTIC_SHA256=86cdf216cf08a93747e38ed90a81b29cff84139dcfd013fcf9f5aead5e9ca527$' "$ID"
          grep -q '^PARENT_G1_PLATFORMGRAPHICS_CLASS_SHA256=c92cc05b31e4ce56eed8f7afae5abee6a62eba9a731ba39b232d3a8b895004b0$' "$ID"
          grep -q '^INPUT_NATIVE_SHA256=69a8aeb3940bfbc234f3a562a7ae4bcaea10b50f8a8f2c38ad229a5430930f6d$' "$ID"
          grep -q '^VIDEO_NATIVE_SHA256=c6687c0a43b24b425af0727c928afb5414da811ecbcbbe3538928470abe8bd0d$' "$ID"
          grep -q '^CHANGED_METHODS=fillRoundRect$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class$' "$ID"
          grep -q '^RAW_IMPLEMENTATION=EXISTING_ACCEPTED_FILLRECT$' "$ID"
          grep -q '^CANONICAL_QUIRK=FINAL_FULL_FILLRECT$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^G1_REGRESSION=PASS$' "$ID"
          grep -q '^G1_ALPHA_REGRESSION=PASS$' "$ID"
          grep -q '^G2A_DIFFERENTIAL_GATE=PASS$' "$ID"
          grep -q '^NEIGHBOR_G2_METHODS=UNCHANGED_RAW_EXCEPTION$' "$ID"
          grep -q '^NO_A9_PARENT=YES$' "$ID"
          grep -q '^JAMVM_GLIBJ=NOT_TOUCHED$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^STABLE=NO$' "$ID"
          grep -q '^P1A_G2A_FILLROUNDRECT_DIFFERENTIAL_GATE=PASS$' "$LOG"
          grep -q '^P1A_G2A_QUIRK=AWT_QUIRK FILLROUNDRECT_EQUALS_FILLRECT=true$' "$LOG"
          grep -q '^P1A_G2A_QUIRK=RAW_QUIRK FILLROUNDRECT_EQUALS_FILLRECT=true$' "$LOG"
          for c in SENTINEL_DRAWROUNDRECT SENTINEL_DRAWARC SENTINEL_FILLARC SENTINEL_FILLTRIANGLE; do
            grep -q "^P1A_G2A_CASE=${c} EXPECTED=RAW_EXCEPTION ACTUAL=RAW_EXCEPTION" "$LOG"
          done
          echo P1A_G2A_CI_SCOPE_LOCK=PASS

      - name: Upload G2A candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2A-FILLROUNDRECT-${{ github.sha }}
          path: out/p1a-g2a-fillroundrect/
          if-no-files-found: error
