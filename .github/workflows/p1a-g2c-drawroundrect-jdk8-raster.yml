name: P1A G2C DrawRoundRect JDK8 Raster

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-g2c-drawroundrect-jdk8-raster
    paths:
      - '.github/workflows/p1a-g2c-drawroundrect-jdk8-raster.yml'
      - 'scripts/stage-p1a-g2c-drawroundrect-jdk8-raster.py'
      - 'scripts/build-p1a-g2c-drawroundrect-jdk8-raster-v2.sh'
      - 'tests/p1a/RG35XXG2CDrawRoundRectDifferentialGate.java'
      - 'tests/p1a/RG35XXG2BFillTriangleDifferentialGate.java'
      - 'tests/p1a/RG35XXG2BParentRegressionGate.java'

permissions:
  contents: read

jobs:
  p1a-g2c-jdk8-raster:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Materialize A4 raw2D baseline
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build exact protected native adapters
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Build and strictly gate G2C drawRoundRect raster
        run: bash ./scripts/build-p1a-g2c-drawroundrect-jdk8-raster-v2.sh

      - name: Verify G2C scope and module-host status
        run: |
          set -euo pipefail
          ID=out/p1a-g2c-drawroundrect-jdk8-raster/P1A-G2C-IDENTITY.txt
          LOG=out/p1a-g2c-drawroundrect-jdk8-raster/P1A-G2C-DRAWROUNDRECT-DIFFERENTIAL.txt
          grep -q '^PARENT_G2B_SEMANTIC_SHA256=d6cc9aa636b3435de07bff4552d4feb5ad7cada41c63ef66719fec8f192cdb77$' "$ID"
          grep -q '^PARENT_G2B_PLATFORMGRAPHICS_CLASS_SHA256=a6004238f7c36455f498d024a171159cb69a7fd95647aa5cabcf966e4e625cec$' "$ID"
          grep -q '^CHANGED_METHODS=Graphics.drawRoundRect$' "$ID"
          grep -q '^CHANGED_JAR_ENTRIES=org/recompile/mobile/PlatformGraphics.class$' "$ID"
          grep -q '^RASTER=OPENJDK8_ROUNDRECTITERATOR_PROCESSPATH_DRAW_SUBSET$' "$ID"
          grep -q '^CORE2D_CHANGE=NO$' "$ID"
          grep -q '^G2C_STRICT_DIFFERENTIAL=PASS$' "$ID"
          grep -q '^G2C_CANONICAL_EQUIVALENT=YES$' "$ID"
          grep -q '^G2B_21_CASE_REGRESSION=PASS$' "$ID"
          grep -q '^G1_G2A_BEHAVIOR_REGRESSION=PASS$' "$ID"
          grep -q '^G1_ALPHA_REGRESSION=PASS$' "$ID"
          grep -q '^A6_PROTECTED_REGRESSIONS=PASS$' "$ID"
          grep -q '^STALE_G1_FUTURE_METHOD_SENTINELS=NOT_USED$' "$ID"
          grep -q '^GAME_SPECIFIC_CODE=NO$' "$ID"
          grep -q '^NO_A9_PARENT=YES$' "$ID"
          grep -q '^BUILD-PASS=YES$' "$ID"
          grep -q '^HOST-DIFFERENTIAL-PASS=YES$' "$ID"
          grep -q '^DEVICE-PASS=NO$' "$ID"
          grep -q '^DEVICE-TEST-PENDING=NO_MODULE_INTEGRATION_PENDING$' "$ID"
          grep -q '^P1A_G2C_STRICT_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_G2C_DRAWROUNDRECT_DIFFERENTIAL_GATE=PASS$' "$LOG"
          echo P1A_G2C_CI_SCOPE_LOCK=PASS

      - name: Upload G2C host candidate
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-G2C-DRAWROUNDRECT-JDK8-${{ github.sha }}
          path: out/p1a-g2c-drawroundrect-jdk8-raster/
          if-no-files-found: error
