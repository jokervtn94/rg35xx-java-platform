name: Verified Clean VC7R22-R1.3J RMS Dependency Trace Runtime

on:
  push:
    branches: [ verified-clean-platform-v1 ]
    paths:
      - '.github/workflows/verified-clean-vc7r22r13j-rms-dependency-trace.yml'
      - 'scripts/vc7r22r13j_apply_rms_trace.py'
      - 'scripts/vc7r22r13i_apply_network_dependency_trace.py'
      - 'scripts/vc7r22r13h_apply_service_repaints_trace.py'
      - 'scripts/vc7r22r13g_apply_input_consumption_trace.py'
      - 'scripts/vc7r22r13f_apply_setcurrent_trace.py'
      - 'scripts/vc7r22r13e_apply_midlet_event_trace.py'
      - 'scripts/vc7r22r13c_apply_sparse_frame_trace.py'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build accepted VC7R22 runtime foundation
        run: |
          set -euo pipefail
          bash scripts/vc7r22_ci.sh

      - name: Apply proven R1.2a source patch
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          I="$OUT/src/org/recompile/mobile/PlatformImage.java"
          F="$OUT/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"
          cp scripts/vc7r22r12_apply_lock_transparency_fix.py "$RUNNER_TEMP/r12.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'r12.py'
          s=p.read_text(encoding='utf-8')
          a=s.index("remaining_calls=len(re.findall")
          b=s.index("if orig_i==i or orig_f==f",a)
          replacement="""remaining_calls=len(re.findall(r'\\brg35xxVC7R18Diag\\s*\\(',f))\nif remaining_calls>1:\n    raise SystemExit('R1.2 multiple diagnostic occurrences survived: %d'%remaining_calls)\nif 'System.err.println(\"RG35XX-JAVA-DIAG:' in f:\n    raise SystemExit('R1.2 direct JAVA-DIAG println survived')\nif helper_calls_before>remaining_calls and helper_removed<1:\n    raise SystemExit('R1.2 expected helper diagnostic call removal did not occur')\n"""
          p.write_text(s[:a]+replacement+s[b:],encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/r12.py" "$I" "$F"

      - name: Apply R1.3C sparse frame trace foundation
        run: |
          OUT="$RUNNER_TEMP/vc7r18"
          python3 scripts/vc7r22r13c_apply_sparse_frame_trace.py "$OUT/src/org/recompile/freej2me/RG35XXGoldenFrameTransport.java"

      - name: Apply R1.3E/F/G/H/I diagnostic foundations
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          python3 scripts/vc7r22r13e_apply_midlet_event_trace.py \
            "$OUT/src/org/recompile/freej2me/Libretro.java" \
            "$OUT/src/org/recompile/mobile/MobilePlatform.java" \
            "$OUT/src/javax/microedition/lcdui/Display.java"
          python3 scripts/vc7r22r13f_apply_setcurrent_trace.py "$OUT/src/javax/microedition/lcdui/Display.java"
          python3 scripts/vc7r22r13g_apply_input_consumption_trace.py \
            "$OUT/src/org/recompile/mobile/MobilePlatform.java" \
            "$OUT/src/javax/microedition/lcdui/Display.java"
          python3 scripts/vc7r22r13h_apply_service_repaints_trace.py "$OUT/src/javax/microedition/lcdui/Canvas.java"
          python3 scripts/vc7r22r13i_apply_network_dependency_trace.py \
            "$OUT/src/javax/microedition/io/Connector.java" \
            "$OUT/src/javax/microedition/io/HttpConnectionImpl.java"

      - name: Apply R1.3J RMS dependency trace
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          R="$OUT/src/javax/microedition/rms/RecordStore.java"
          python3 scripts/vc7r22r13j_apply_rms_trace.py "$R"
          for t in CTOR_BEGIN CTOR_DONE OPEN_A ADD_BEGIN ADD_DONE GET_BEGIN GET_DONE SAVE_BEGIN SAVE_DONE LOAD_BEGIN; do
            grep -Fq "$t" "$R"
          done

      - name: Clean rebuild and bytecode gates
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          rm -rf "$OUT/build/classes"
          (cd "$OUT" && ant)
          JAR="$OUT/build/freej2me_plus-lr.jar"
          python3 - "$JAR" <<'PY'
          import zipfile,sys,hashlib,struct
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              cls={n:z.read(n) for n in z.namelist() if n.endswith('.class')}
          principals=['org/recompile/freej2me/Libretro.class','org/recompile/mobile/MobilePlatform.class','javax/microedition/lcdui/Display.class','javax/microedition/lcdui/Canvas.class','javax/microedition/io/Connector.class','javax/microedition/io/HttpConnectionImpl.class','javax/microedition/rms/RecordStore.class','org/recompile/freej2me/RG35XXGoldenFrameTransport.class','org/recompile/mobile/PlatformImage.class']
          for n in principals:
              b=cls[n]
              if b[:4]!=b'\xca\xfe\xba\xbe' or struct.unpack('>H',b[6:8])[0]!=50:
                  raise SystemExit('FAIL Java6 class gate '+n)
          def fam(prefix): return b'\n'.join(v for n,v in cls.items() if n==prefix+'.class' or n.startswith(prefix+'$'))
          rms=fam('javax/microedition/rms/RecordStore')
          ft=cls['org/recompile/freej2me/RG35XXGoldenFrameTransport.class']
          pi=cls['org/recompile/mobile/PlatformImage.class']
          for tok in [b'RG35XX-R13J-RMS',b'CTOR_BEGIN',b'CTOR_DONE',b'OPEN_A',b'ADD_BEGIN',b'ADD_DONE',b'GET_BEGIN',b'GET_DONE',b'SAVE_BEGIN',b'SAVE_DONE',b'LOAD_BEGIN']:
              if tok not in rms: raise SystemExit('FAIL missing RMS trace '+repr(tok))
          if b'RG35XX-R13I-NET' not in fam('javax/microedition/io/Connector'): raise SystemExit('FAIL R13I trace lost')
          if b'RG35XX-R13H-LOOP' not in fam('javax/microedition/lcdui/Canvas'): raise SystemExit('FAIL R13H trace lost')
          if b'MP_GAME_KEYPRESS_DONE' not in fam('org/recompile/mobile/MobilePlatform'): raise SystemExit('FAIL R13G trace lost')
          if b'RG35XX-R13C-FRAME' not in ft: raise SystemExit('FAIL frame trace lost')
          if b'rg35xxVC7R20ApplyPngTransparency' not in pi: raise SystemExit('FAIL transparency bytecode missing')
          for tok in (b'argbSnapshot',b'sendFrameLocked',b'RG35XX-JAVA-DIAG:'):
              if tok in ft: raise SystemExit('FAIL stale transport '+repr(tok))
          print('RECORDSTORE_CLASS_SHA256='+hashlib.sha256(cls['javax/microedition/rms/RecordStore.class']).hexdigest())
          print('R13J_BYTECODE_GATE=PASS')
          PY

      - name: Package runtime only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vc7r18"
          P="$RUNNER_TEMP/vc7r22r13j-out"
          mkdir -p "$P"
          cp "$OUT/build/freej2me_plus-lr.jar" "$P/freej2me-lr-vc7r22r13j.jar"
          J=$(sha256sum "$P/freej2me-lr-vc7r22r13j.jar" | awk '{print $1}')
          cat > "$P/STATUS.txt" <<EOF
          STATUS=BUILD-PASS-DEVICE-TRACE-PENDING
          CHECKPOINT=VC7R22-R1.3J-RMS-DEPENDENCY-TRACE
          CORE_AUDIO_VIDEO=STABLE_R1_UNCHANGED
          RUNTIME_BASE=R1.3I_PLUS_RMS_DEPENDENCY_TRACE
          RUNTIME_SHA256=$J
          R13I_RESULT=NO_NETWORK_API_OBSERVED_DURING_FAILURE_WINDOW
          TRACE_SCOPE=RMS_OPEN_LOAD_SAVE_GET_ADD
          FRAME_TRACE=R1.3C_PRESERVED
          INPUT_EVENT_TRACE=R1.3E_R1.3G_PRESERVED
          SERVICE_TRACE=R1.3H_PRESERVED
          NETWORK_TRACE=R1.3I_PRESERVED
          TRANSPARENCY_POLICY=UNCHANGED_FROM_R1.2A
          DEVICE_TRACE=PENDING
          EOF
          (cd "$P" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xx-vc7r22r13j-rms-dependency-trace-runtime
          path: ${{ runner.temp }}/vc7r22r13j-out
          retention-days: 90
