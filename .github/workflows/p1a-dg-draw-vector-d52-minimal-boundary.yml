name: P1A DG Draw Vector D5.2 Minimal Stroke Boundary

on:
  push:
    branches:
      - p1a-dg-draw-vector-diagnostic
    paths:
      - 'tests/p1a/RG35XXDGDrawVectorD52MinimalStrokeBoundaryDiagnostic.java'
      - '.github/workflows/p1a-dg-draw-vector-d52-minimal-boundary.yml'
  workflow_dispatch:

jobs:
  p1a-dg-draw-vector-d52:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify D4 D5 D5.1 ancestry and diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2c2b1f2b0ca99d42ef9965a24f1eb7678eca428a HEAD
          git merge-base --is-ancestor 198dd533e2007b22bc294243b0f84856474d1083 HEAD
          git merge-base --is-ancestor 81c34ebc67b3c0ae5b6cb695145c1bf1ce090654 HEAD
          echo P1A_DG_D52_D4_HOST_PARENT_ANCESTRY=PASS
          echo P1A_DG_D52_D5_OWNER_ANCESTRY=PASS
          echo P1A_DG_D52_D51_STROKESPAN_ANCESTRY=PASS
          echo P1A_DG_D52_RUNTIME_CHANGE=NO

      - name: Compile Java6 minimal-boundary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p1a-dg-d52
          javac -XDignore.symbol.file -encoding UTF-8 -source 1.6 -target 1.6 \
            -d build/p1a-dg-d52 \
            tests/p1a/RG35XXDGDrawVectorD52MinimalStrokeBoundaryDiagnostic.java
          echo P1A_DG_D52_JAVA6_GATE=PASS

      - name: Run exact minimal-boundary differential
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -cp build/p1a-dg-d52 \
            org.recompile.rg35xx.p1a.RG35XXDGDrawVectorD52MinimalStrokeBoundaryDiagnostic \
            | tee build/p1a-dg-d52/D52-MINIMAL-BOUNDARY.txt
          LOG=build/p1a-dg-d52/D52-MINIMAL-BOUNDARY.txt
          grep -q '^P1A_DG_D52_FIXED_CASE_COUNT=20$' "$LOG"
          grep -q '^P1A_DG_D52_FUZZ_CASE_COUNT=160$' "$LOG"
          grep -q '^P1A_DG_D52_COMPARISON_COUNT=180$' "$LOG"
          grep -q '^P1A_DG_D52_RANDOM_SEED=35d5001$' "$LOG"
          grep -q '^P1A_DG_D52_BOUNDARY_FAILURE_COUNT=0$' "$LOG"
          grep -q '^P1A_DG_D52_TOTAL_SPAN_RECT_COUNT=10429$' "$LOG"
          grep -q '^P1A_DG_D52_TOTAL_SPAN_PIXEL_COUNT=19493$' "$LOG"
          grep -q '^P1A_DG_D52_RENDERING_ENGINE=sun.java2d.pisces.PiscesRenderingEngine$' "$LOG"
          grep -q '^P1A_DG_D52_NORMALIZATION=ON_NO_AA_QUARTER_PIXEL$' "$LOG"
          grep -q '^P1A_DG_D52_STROKE_WIDTH=1.0$' "$LOG"
          grep -q '^P1A_DG_D52_STROKE_CAP=2$' "$LOG"
          grep -q '^P1A_DG_D52_STROKE_JOIN=0$' "$LOG"
          grep -q '^P1A_DG_D52_STROKE_MITER=10.0$' "$LOG"
          grep -q '^P1A_DG_D52_STROKE_DASH=NONE$' "$LOG"
          grep -q '^P1A_DG_D52_SSI_ADJUST=false$' "$LOG"
          grep -q '^P1A_DG_D52_SSI_RULE=NON_ZERO$' "$LOG"
          grep -q '^P1A_DG_D52_MINIMUM_BOUNDARY=NORMALIZE_QUARTER_PIXEL+LINE_ONLY_STROKER+FLOAT_SSI_NONZERO_SCAN$' "$LOG"
          grep -q '^P1A_DG_D52_RUNTIME_CHANGE=NO$' "$LOG"
          grep -q '^P1A_DG_D52_DIAGNOSTIC_GATE=PASS$' "$LOG"
          echo P1A_DG_D52_STRICT_GATE=PASS

      - name: Upload D5.2 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-DRAW-VECTOR-D52-${{ github.sha }}
          path: build/p1a-dg-d52/
          if-no-files-found: error
