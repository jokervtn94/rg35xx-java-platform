name: P1A DG Vector D1 AWT Trace

on:
  workflow_dispatch:
  push:
    branches:
      - p1a-dg-vector-diagnostic
    paths:
      - '.github/workflows/p1a-dg-vector-d1-awt-trace.yml'
      - 'tests/p1a/RG35XXDGVectorD1AWTTrace.java'

permissions:
  contents: read

jobs:
  dg-vector-d1-awt-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned host family JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile diagnostic-only probe
        run: |
          set -euo pipefail
          rm -rf out/p1a-dg-vector-d1
          mkdir -p out/p1a-dg-vector-d1/classes
          javac -encoding UTF-8 -source 1.6 -target 1.6 \
            -d out/p1a-dg-vector-d1/classes \
            tests/p1a/RG35XXDGVectorD1AWTTrace.java

      - name: Run all DirectGraphics vector Java2D traces
        run: |
          set -euo pipefail
          for op in drawTriangle fillTriangle drawPolygon fillPolygon; do
            java -Djava.awt.headless=true -Dsun.java2d.trace=log \
              -cp out/p1a-dg-vector-d1/classes \
              org.recompile.rg35xx.p1a.RG35XXDGVectorD1AWTTrace "$op" \
              2>&1 | tee "out/p1a-dg-vector-d1/${op}.txt"
            grep -q "^DGVD1_CASE=${op}$" "out/p1a-dg-vector-d1/${op}.txt"
            grep -q '^DGVD1_TRACE_PROBE=PASS$' "out/p1a-dg-vector-d1/${op}.txt"
          done

          test -s out/p1a-dg-vector-d1/drawTriangle.txt
          test -s out/p1a-dg-vector-d1/fillTriangle.txt
          test -s out/p1a-dg-vector-d1/drawPolygon.txt
          test -s out/p1a-dg-vector-d1/fillPolygon.txt

          echo DGVD1_ALL_FOUR_CASES_CAPTURED=PASS
          echo DGVD1_PRIMITIVE_EXPECTATION_HARDCODED=NO
          echo DGVD1_SUPPORT_MASK_EQUALITY_REQUIRED=NO
          echo DGVD1_RUNTIME_CHANGE=NO
          echo DGVD1_TRACE_CAPTURE=PASS

      - name: Upload trace evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P1A-DG-VECTOR-D1-AWT-TRACE-${{ github.sha }}
          path: out/p1a-dg-vector-d1/*.txt
          if-no-files-found: error
