name: Miyoo M1.8 MIDP Input Dispatch

on:
  workflow_dispatch:

jobs:
  reference_integration_gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reference-only notice
        run: |
          echo 'This legacy Libretro integration workflow is retained for historical/reference builds only.'
          echo 'The standalone M1.8 admission gate is miyoo-m1.8-standalone-boundary.yml.'
          echo 'No push-triggered Libretro build is permitted on the standalone M1.8 branch.'
          grep -q 'toLogicalKeyIndex' miyoo-m1/m1_8/M1InputDispatch.java
          grep -q 'final int logicalIndex' miyoo-m1/m1_8/M1InputDispatch.java
          grep -q 'Mobile.getMobileKey(logicalIndex)' miyoo-m1/m1_8/M1InputDispatch.java
          grep -q 'REPEAT_DELAY_MS = 400' miyoo-m1/m1_8/M1InputDispatch.java
          grep -q 'REPEAT_PERIOD_MS = 100' miyoo-m1/m1_8/M1InputDispatch.java
          echo 'REFERENCE_BUILD_ONLY=YES'
          echo 'DEVICE_PASS=NO'
