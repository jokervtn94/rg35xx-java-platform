name: P2A Image Decode Contract Diagnostic

on:
  push:
    branches:
      - audit/p2-image-font-frontend-contract
    paths:
      - '.github/workflows/p2a-image-decode-diagnostic.yml'
      - 'tests/p2/RG35XXP2APngFormatDiagnostic.java'
      - 'tests/p2/RG35XXP2APngSemanticsR2Diagnostic.java'
      - 'tests/p2/RG35XXP2AGrayTransferR3Diagnostic.java'
      - 'docs/P2-IMAGE-FONT-FRONTEND-CONTRACT-AUDIT-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2a-png-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Checkout audit branch and pinned canonical submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Lock audit ancestry and no runtime delta
        shell: bash
        run: |
          set -euo pipefail
          PARENT=7c0ae595fa05dd3c23157c241cc641e8d43411d5
          git merge-base --is-ancestor "$PARENT" HEAD
          [ "$(git merge-base "$PARENT" HEAD)" = "$PARENT" ]
          changed="$(git diff --name-only "$PARENT"..HEAD | LC_ALL=C sort)"
          expected=$'.github/workflows/p2a-image-decode-diagnostic.yml\ndocs/P2-IMAGE-FONT-FRONTEND-CONTRACT-AUDIT-v1.md\ntests/p2/RG35XXP2AGrayTransferR3Diagnostic.java\ntests/p2/RG35XXP2APngFormatDiagnostic.java\ntests/p2/RG35XXP2APngSemanticsR2Diagnostic.java'
          [ "$changed" = "$expected" ] || { echo "P2_AUDIT_SCOPE_FAIL=$changed" >&2; exit 1; }
          ! git diff --name-only "$PARENT"..HEAD | grep -E '^(adapter/|native/|upstream/|scripts/stage-|scripts/build-)'
          echo P2_AUDIT_RUNTIME_DELTA=NONE
          echo P2_AUDIT_PARENT_GATE=PASS

      - name: Materialize exact P1A accepted host lineage
        run: bash ./scripts/build-a4-raw2d-java.sh

      - name: Stage protected PERF-A1 presenter chain once
        run: |
          python3 ./scripts/stage-a6-rg35xx-video-perf-p1.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p2.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-video-perf-p3.py "$GITHUB_WORKSPACE"
          python3 ./scripts/stage-a6-rg35xx-perf-a1-async-native.py "$GITHUB_WORKSPACE"

      - name: Build protected native adapters once
        env:
          TOOLCHAIN: docker.io/miyoocfw/toolchain-shared-uclibc@sha256:6f6761867b4e4dcc27c99bf25fb91b2910264165f27bdd40b1c17e6f98cf751e
        run: |
          docker pull "$TOOLCHAIN"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLCHAIN" \
            bash -lc 'git config --global --add safe.directory /work/upstream/freej2me-miyoomini && ./scripts/build-a3.sh native'

      - name: Apply accepted A5 Core2D overlay once
        run: bash ./scripts/build-a5-core2d-java.sh

      - name: Rebuild exact P1A complete graphics parent
        shell: bash
        run: |
          set -euo pipefail
          JAVA8="$JAVA_HOME" bash ./scripts/build-p1a-complete-graphics-candidate.sh | tee /tmp/p1a-parent.log
          grep -q '^P1A_COMPLETE_GRAPHICS_BUILD=PASS$' /tmp/p1a-parent.log
          grep -q '^A9_PARENT=NO$' out/p1a-complete-graphics-candidate/P1A-COMPLETE-GRAPHICS-IDENTITY.txt
          echo P2A_P1A_PARENT_REBUILD=PASS

      - name: Compile Java 6 PNG diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p2a-png-diagnostic
          "$JAVA_HOME/bin/javac" -encoding UTF-8 -source 1.6 -target 1.6 \
            -bootclasspath "$JAVA_HOME/jre/lib/rt.jar" \
            -classpath out/p1a-complete-graphics-candidate/freej2me-rg35xx.jar \
            -d build/p2a-png-diagnostic \
            tests/p2/RG35XXP2APngFormatDiagnostic.java \
            tests/p2/RG35XXP2APngSemanticsR2Diagnostic.java \
            tests/p2/RG35XXP2AGrayTransferR3Diagnostic.java
          for cls in RG35XXP2APngFormatDiagnostic RG35XXP2APngSemanticsR2Diagnostic RG35XXP2AGrayTransferR3Diagnostic; do
            major=$(od -An -t u1 -j 7 -N 1 "build/p2a-png-diagnostic/org/recompile/rg35xx/p2/${cls}.class" | tr -d ' ')
            [ "$major" = 50 ]
          done
          echo P2A_DIAGNOSTIC_JAVA6=PASS

      - name: Run legal PNG ImageIO versus Raw2D matrix
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true \
            -cp out/p1a-complete-graphics-candidate/freej2me-rg35xx.jar:build/p2a-png-diagnostic \
            org.recompile.rg35xx.p2.RG35XXP2APngFormatDiagnostic | tee P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_PNG_LEGAL_CASE_COUNT=30$' P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_PNG_CANONICAL_PASS_COUNT=30$' P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_PNG_RAW_MATCH_COUNT=12$' P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_PNG_RAW_MISMATCH_COUNT=4$' P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_PNG_RAW_UNSUPPORTED_COUNT=14$' P2A-PNG-DIAGNOSTIC.txt
          grep -q '^P2A_RUNTIME_CHANGE=NO$' P2A-PNG-DIAGNOSTIC.txt
          echo P2A_PNG_R1_EVIDENCE_LOCK=PASS

      - name: Run R2 grayscale and tRNS semantic decomposition
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true \
            -cp out/p1a-complete-graphics-candidate/freej2me-rg35xx.jar:build/p2a-png-diagnostic \
            org.recompile.rg35xx.p2.RG35XXP2APngSemanticsR2Diagnostic | tee P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_CASE_COUNT=14$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_TRNS=GRAY8_TRNS_I0 CANONICAL_ALPHA0=NO RAW_ALPHA0=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_TRNS=GRAY8_TRNS_I1 CANONICAL_ALPHA0=NO RAW_ALPHA0=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_TRNS=RGB8_TRNS_I0 CANONICAL_ALPHA0=NO RAW_ALPHA0=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_TRNS=RGB8_TRNS_I1 CANONICAL_ALPHA0=NO RAW_ALPHA0=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_JDK8_TRNS_GRAY_RGB_EFFECTIVE_ALPHA=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_GRAYSCALE_COLORSPACE=CS_GRAY_TO_SRGB_GETRGB$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_DIAGNOSTIC=PASS_EVIDENCE_ONLY$' P2A-PNG-R2-DIAGNOSTIC.txt
          grep -q '^P2A_R2_RUNTIME_CHANGE=NO$' P2A-PNG-R2-DIAGNOSTIC.txt
          echo P2A_PNG_R2_HOST_DIAGNOSTIC_GATE=PASS

      - name: Run R3 exhaustive JDK8 grayscale transfer proof
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -Djava.awt.headless=true \
            -cp build/p2a-png-diagnostic \
            org.recompile.rg35xx.p2.RG35XXP2AGrayTransferR3Diagnostic | tee P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_GRAY8_SAMPLE_COUNT=256$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_GRAY8_FORMULA_MISMATCH=0$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_GRAY16_SAMPLE_COUNT=65536$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_GRAY16_FORMULA_MISMATCH=0$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_GRAY_TRANSFER_MODEL=LINEAR_GRAY_TO_SRGB_IEC61966_2_1$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_DIAGNOSTIC=PASS_EVIDENCE_ONLY$' P2A-PNG-R3-DIAGNOSTIC.txt
          grep -q '^P2A_R3_RUNTIME_CHANGE=NO$' P2A-PNG-R3-DIAGNOSTIC.txt
          echo P2A_PNG_R3_GRAY_TRANSFER_GATE=PASS

      - name: Upload P2A diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-P2A-PNG-DIAGNOSTIC-${{ github.sha }}
          path: |
            P2A-PNG-DIAGNOSTIC.txt
            P2A-PNG-R2-DIAGNOSTIC.txt
            P2A-PNG-R3-DIAGNOSTIC.txt
          if-no-files-found: error
